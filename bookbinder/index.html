<style>
/* ---------- tokens: Dawn (light) and Native (dark), following the system ---------- */
:root{--ground:#f2f2f7;--card:#fff;--ink:#111;--ink-2:#6e6e73;--rule:#e1e1e6;--surface2:#e8e8ed;
  --accent:#007aff;--good:#1a9e4b;--warn:#c27c0e;--bad:#e0342b;
  --font:-apple-system,system-ui,sans-serif;--mono:ui-monospace,Menlo,monospace;--radius:12px;--pad:14px}
@media (prefers-color-scheme:dark){:root:not([data-look=light]){--ground:#000;--card:#1c1c1e;--ink:#f5f5f7;--ink-2:#8e8e93;--rule:#2c2c2e;--surface2:#2c2c2e;--accent:#0a84ff;--good:#30d158;--warn:#ffd60a;--bad:#ff453a;color-scheme:dark}}
:root[data-look=dark]{--ground:#000;--card:#1c1c1e;--ink:#f5f5f7;--ink-2:#8e8e93;--rule:#2c2c2e;--surface2:#2c2c2e;--accent:#0a84ff;--good:#30d158;--warn:#ffd60a;--bad:#ff453a;color-scheme:dark}
/* the Motion block speaks Vault's token names */
:root{--bg:var(--ground);--fg:var(--ink);--surface:var(--card);--muted:var(--ink-2);--line:var(--rule);--red:var(--bad);--green:var(--good);--amber:var(--warn)}

/* ---------- Motion — the contract (app-builder) ---------- */
:root{--spring:cubic-bezier(.2,.9,.25,1.2);--ease:cubic-bezier(.2,.7,.2,1)}
/* press */
button,.btn,.chip,.pchip,.tcpill,.tcgear,.acch,.grp,.drow,.trow,.prow,.pipbtn,.subx,.cvr,[data-go],tr[data-tx],tr[data-pl],tr[data-b],tr[data-dedit],tr[data-vk]{transition:transform .15s var(--spring)}
button:active,.btn:active,.chip:active,.pchip:active,.tcpill:active,.tcgear:active,.acch:active,.pipbtn:active,.subx:active,.cvr:active,[data-go]:active{transform:scale(.96)}
.trow:active,.prow:active,.grp:active,.drow:active,tr[data-tx]:active,tr[data-pl]:active,tr[data-b]:active,tr[data-dedit]:active,tr[data-vk]:active{transform:scale(.985)}
.chev,.accc{display:inline-block;transition:transform .15s var(--spring)}:active>.chev,:active .chev,.acch:active .accc{transform:translateX(4px)}
/* toast · sheet */
.toast{animation:toastin .42s var(--spring) both,toastout .3s ease-in 2.2s forwards;box-shadow:0 8px 24px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3)}
@keyframes toastin{from{transform:translateY(40px) scale(.96);opacity:0}to{transform:none;opacity:1}}@keyframes toastout{to{transform:translateY(-6px);opacity:0}}
.sheet{animation:sheetup .35s var(--spring) both}@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.sheet.from-stat{transform-origin:92% 100%;animation:sheetfromstat .42s var(--spring) both}@keyframes sheetfromstat{from{transform:scale(.25);opacity:0}to{transform:none;opacity:1}}
/* arrival */
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.boot .tcrows .trow,.boot .btab tbody tr{animation:rowin .4s var(--ease) both}
.boot .trow:nth-child(2),.boot tbody tr:nth-child(2){animation-delay:55ms}.boot .trow:nth-child(3),.boot tbody tr:nth-child(3){animation-delay:110ms}.boot .trow:nth-child(4),.boot tbody tr:nth-child(4){animation-delay:165ms}.boot .trow:nth-child(5),.boot tbody tr:nth-child(5){animation-delay:220ms}.boot .trow:nth-child(6),.boot tbody tr:nth-child(6){animation-delay:275ms}.boot .trow:nth-child(7),.boot tbody tr:nth-child(7){animation-delay:330ms}.boot .trow:nth-child(8),.boot tbody tr:nth-child(8){animation-delay:385ms}.boot .trow:nth-child(n+9),.boot tbody tr:nth-child(n+9){animation-delay:440ms}

.canim2{opacity:0;transform:scale(.85)}.canim2.go{animation:ringin .6s var(--spring) forwards}@keyframes ringin{to{opacity:1;transform:none}}
.lfoot .pl{opacity:0}.lfoot.go .pl{animation:pillin .35s var(--ease) forwards}@keyframes pillin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lfoot.go .pl:nth-of-type(1){animation-delay:1.1s}.lfoot.go .pl:nth-of-type(2){animation-delay:1.22s}.lfoot.go .pl:nth-of-type(3){animation-delay:1.34s}.lfoot.go .pl:nth-of-type(4){animation-delay:1.46s}.lfoot.go .pl:nth-of-type(5){animation-delay:1.58s}.lfoot.go .pl:nth-of-type(6){animation-delay:1.7s}

.canim .cur{transform-box:fill-box;transform-origin:50% 100%}.canim.go .cur{animation:barpulse .5s ease 1.1s 1}@keyframes barpulse{0%,100%{transform:none;opacity:1}50%{transform:scaleY(1.06);opacity:.7}}
.heat .hc{opacity:0}.heat.go .hc{animation:pillin .4s var(--ease) forwards}.heat.go td:nth-child(3) .hc{animation-delay:.08s}.heat.go td:nth-child(4) .hc{animation-delay:.16s}.heat.go td:nth-child(5) .hc{animation-delay:.24s}.heat.go td:nth-child(6) .hc{animation-delay:.32s}.heat.go td:nth-child(7) .hc{animation-delay:.4s}.heat.go td:nth-child(8) .hc{animation-delay:.48s}

.pips i{transition:background .2s}@keyframes pipbump{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}.pips.bump i:nth-child(1){animation:pipbump .3s var(--spring)}.pips.bump i:nth-child(2){animation:pipbump .3s var(--spring) .07s}.pips.bump i:nth-child(3){animation:pipbump .3s var(--spring) .14s}

/* ---------- this app ---------- */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

#toasts{position:fixed;left:0;right:0;bottom:calc(84px + env(safe-area-inset-bottom));display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none}
.toast{max-width:88%;padding:10px 14px;border-radius:12px;background:var(--ink);color:var(--ground);font-size:14px;line-height:1.3}
.bhead{display:flex;gap:14px;margin-bottom:12px}
.cvr{width:96px;height:144px;flex:none;border-radius:4px;overflow:hidden;border:1px solid var(--rule);background:var(--surface2);padding:0;display:flex;align-items:center;justify-content:center;color:var(--ink-2);font:12px var(--mono)}
.cvr img{width:100%;height:100%;object-fit:cover;display:block}
.bt2{font-size:19px;font-weight:600;line-height:1.25;word-break:break-word}
.btnrow{display:flex;gap:8px;margin:10px 0}.btnrow .btn{flex:1;padding:0 8px}
.srow{display:flex;align-items:center;gap:8px;min-height:44px;padding:4px 0;border-bottom:1px solid var(--rule);transition:transform .15s var(--spring)}
.srow:active{transform:scale(.985)}
.srow:last-child{border-bottom:0}
.srow .sl{flex:1;min-width:0;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.srow.l2 .sl{padding-left:16px}
.srow.cut .sl{color:var(--ink-2);text-decoration:line-through}
.chip{font:11px/1 var(--mono);padding:5px 6px;border-radius:6px;background:var(--surface2);color:var(--ink-2);white-space:nowrap}
.srow.cut .chip{color:var(--bad)}
.err{font:12px/1.45 var(--mono);color:var(--bad);white-space:pre-wrap;word-break:break-word}
.warns{font-size:13px;color:var(--warn);margin:6px 0;line-height:1.4}
.fgrid{display:grid;grid-template-columns:1fr 76px;gap:8px}
.fgrid input{width:100%}
.lbl{font:11px var(--mono);color:var(--ink-2);margin:8px 0 2px}
/* off switch — keep last */
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.lfoot .anim,.canim{clip-path:none}.canim2,.lfoot .pl,.heat .hc{opacity:1;transform:none}.lfoot .brk{transform:none}}

<script>
'use strict';
/* =====================================================================
   SLOT 1 — APP
   ===================================================================== */
const BUILD='build 1';                       // bump every push; shown in Settings
const APP={key:'bookbinder',name:'Bookbinder',answer:'Old EPUBs in. Clean books out.'};
const PARSER='p1';                           // bump when extraction changes: saved chapter maps then re-plan

/* =====================================================================
   SLOT 2 — CONF
   ===================================================================== */
const CONF={
  workers:3,                 // books in flight at once
  shareBatch:20,             // files per share sheet
  cutWarn:.25,               // flag a book when cuts take more than this share of its words
  cutFail:.5,                // refuse to build past this until the cuts are set by hand
  maxCands:1200,             // candidate lines sent to Claude per book
  models:{'claude-haiku-5-5':'Haiku 5.5','claude-sonnet-5-5':'Sonnet 5.5'},
  price:{'claude-haiku-5-5':[.10,.50],'claude-sonnet-5-5':[2,10]},   // $ per million tokens in/out, Nov 2026
  // keep (true) or cut (false) by kind of page; the book sheet overrides any section
  policy:{cover:false,half_title:false,title_page:true,copyright:true,dedication:true,epigraph:true,toc:false,
    foreword:true,preface:true,introduction:true,prologue:true,part:true,chapter:true,interlude:true,epilogue:true,
    afterword:true,acknowledgments:true,author_note:true,notes:true,glossary:true,appendix:true,bibliography:true,
    index:false,about_author:true,also_by:false,praise:false,excerpt:false,ad:false,newsletter:false,credits:false,
    blank:false,illustration:true,other_front:true,other_back:true},
};
const KINDS=Object.keys(CONF.policy);
const BODY=new Set(['prologue','part','chapter','interlude','epilogue']);
const BACK=new Set(['afterword','acknowledgments','notes','glossary','appendix','bibliography','index','about_author','also_by','excerpt','ad','newsletter','credits','other_back']);
const FRONTISH=new Set(['cover','half_title','title_page','copyright','dedication','epigraph','toc','foreword','preface','introduction','praise','also_by','other_front']);

/* =====================================================================
   ENGINE — log, fail, stage, cfg, storage. Domain-free.
   ===================================================================== */
const LOG=[];
function sj(x){try{return JSON.stringify(x,(k,v)=>typeof v==='bigint'||v instanceof Error?String(v):v)}catch(e){return String(x)}}
function log(stage,data){const line=`${new Date().toISOString().slice(11,23)} ${stage} ${data==null?'':typeof data==='string'?data:sj(data)}`;LOG.push(line);if(LOG.length>500)LOG.shift();try{console.log(line)}catch(e){}return line}
class StageError extends Error{constructor(stage,expected,got,extra){super(`[${stage}] expected ${expected}, got ${got}`);this.stage=stage;this.expected=expected;this.got=got;this.extra=extra}}
function fail(stage,expected,got,extra){const e=new StageError(stage,expected,got,extra);log(stage,'FAIL '+e.message);throw e}
window.addEventListener('error',e=>log('window','uncaught '+(e.message||e)));
window.addEventListener('unhandledrejection',e=>log('window','unhandled rejection '+((e.reason&&e.reason.message)||e.reason)));
function blog(ctx,stage,data){const line=log(`${ctx.id.slice(0,6)} ${stage}`,data);ctx.log.push(line);if(ctx.log.length>400)ctx.log.shift()}
async function stg(ctx,name,fn,summ){
  const t0=performance.now();setStage(ctx,name);
  try{
    const out=await fn();const ms=Math.round(performance.now()-t0);let s;
    try{s=summ?summ(out):undefined}catch(e){s='summary failed: '+e.message}
    ctx.stages[name]={ok:true,ms,out:s};blog(ctx,name,`PASS ${ms} ms${s!==undefined?' | '+sj(s):''}`);return out;
  }catch(e){
    const ms=Math.round(performance.now()-t0);
    const err=e instanceof StageError?e:new StageError(name,'a clean run',`${e.name}: ${e.message}`);
    ctx.stages[name]={ok:false,ms,error:err.message,stack:String(e.stack||'').slice(0,1500)};blog(ctx,name,'FAIL '+err.message);throw err;
  }
}
const $=id=>document.getElementById(id);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const tick=()=>new Promise(r=>setTimeout(r,0));
const clip=(s,n)=>{s=String(s??'');return s.length>n?s.slice(0,n-1)+'…':s};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const xt=s=>String(s??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
const xa=s=>xt(s).replace(/"/g,'&quot;');
const mb=n=>(n/1048576).toFixed(n<10485760?1:0)+' MB';

let cfg={};
try{cfg=JSON.parse(localStorage.getItem(APP.key+'-cfg')||'{}')||{}}catch(e){log('cfg','read failed: '+e.message)}
if(!CONF.models[cfg.model])cfg.model='claude-haiku-5-5';
if(cfg.lookups==null)cfg.lookups=true;
function saveCfg(){try{localStorage.setItem(APP.key+'-cfg',JSON.stringify(cfg))}catch(e){log('cfg','write failed: '+e.message)}}

/* IndexedDB: books (records), blobs (src: out: cov:), diag (base: dump:). Every store keys on k. */
const DB={db:null,
  open(){if(this.db)return Promise.resolve(this.db);return new Promise((res,rej)=>{let r;try{r=indexedDB.open('bookbinder',1)}catch(e){rej(e);return}
    r.onupgradeneeded=()=>{const d=r.result;for(const s of ['books','blobs','diag'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:'k'})};
    r.onsuccess=()=>{this.db=r.result;this.db.onversionchange=()=>{this.db.close();this.db=null};res(this.db)};
    r.onerror=()=>rej(r.error||new Error('open failed'));r.onblocked=()=>rej(new Error('database blocked by another tab'))})},
  async run(store,mode,fn){const db=await this.open();return new Promise((res,rej)=>{let out;const t=db.transaction(store,mode);const q=fn(t.objectStore(store));if(q)q.onsuccess=()=>{out=q.result};t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error||new Error('transaction error'));t.onabort=()=>rej(t.error||new Error('transaction aborted (storage full?)'))})},
  get(s,k){return this.run(s,'readonly',o=>o.get(k))},
  put(s,v){return this.run(s,'readwrite',o=>o.put(v))},
  del(s,k){return this.run(s,'readwrite',o=>o.delete(k))},
  all(s){return this.run(s,'readonly',o=>o.getAll())},
  keys(s){return this.run(s,'readonly',o=>o.getAllKeys())},
  clear(s){return this.run(s,'readwrite',o=>o.clear())},
};
async function blobPut(k,blob){try{await DB.put('blobs',{k,blob})}catch(e){fail('store',`room to save ${k.split(':')[0]} in the browser`,(e&&e.message)||String(e))}}
async function blobGet(k){const o=await DB.get('blobs',k);return o?o.blob:null}
async function saveRec(r){try{await DB.put('books',r)}catch(e){log('store','FAIL book record '+r.k+': '+((e&&e.message)||e))}}

/* =====================================================================
   ZIP — read and write, no library. An EPUB is a plain zip.
   ===================================================================== */
const ENC=new TextEncoder();
const CRC_T=(()=>{const t=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
function crc32(u8){let c=0xFFFFFFFF;for(let i=0;i<u8.length;i++)c=CRC_T[(c^u8[i])&255]^(c>>>8);return (c^0xFFFFFFFF)>>>0}
let RAW_OK=null;
function rawSupported(){if(RAW_OK===null){try{new DecompressionStream('deflate-raw');new CompressionStream('deflate-raw');RAW_OK=true}catch(e){RAW_OK=false;log('zip','deflate-raw unavailable: using gzip framing')}}return RAW_OK}
async function pipeBytes(u8,ts){return new Uint8Array(await new Response(new Blob([u8]).stream().pipeThrough(ts)).arrayBuffer())}
async function inflate(u8,crc,usize){
  if(rawSupported())return pipeBytes(u8,new DecompressionStream('deflate-raw'));
  const g=new Uint8Array(10+u8.length+8);g.set([0x1f,0x8b,8,0,0,0,0,0,0,0xff]);g.set(u8,10);const v=new DataView(g.buffer);v.setUint32(10+u8.length,crc,true);v.setUint32(14+u8.length,usize>>>0,true);
  return pipeBytes(g,new DecompressionStream('gzip'));
}
async function deflate(u8){
  if(rawSupported())return pipeBytes(u8,new CompressionStream('deflate-raw'));
  const g=await pipeBytes(u8,new CompressionStream('gzip'));return g[3]===0?g.subarray(10,g.length-8):null;
}
async function zipOpen(buf){
  const u8=new Uint8Array(buf),dv=new DataView(buf);let e=-1;
  for(let i=u8.length-22,lo=Math.max(0,u8.length-22-65557);i>=lo;i--)if(u8[i]===0x50&&dv.getUint32(i,true)===0x06054b50){e=i;break}
  if(e<0)fail('unzip','a zip end record','none: not a zip, or the file is cut short');
  let count=dv.getUint16(e+10,true),off=dv.getUint32(e+16,true);
  if((count===0xFFFF||off===0xFFFFFFFF)&&e>=20&&dv.getUint32(e-20,true)===0x07064b50){const z=Number(dv.getBigUint64(e-12,true));if(dv.getUint32(z,true)===0x06064b50){count=Number(dv.getBigUint64(z+32,true));off=Number(dv.getBigUint64(z+48,true))}}
  const ents=new Map(),lower=new Map(),td=new TextDecoder('utf-8');let p=off;
  for(let n=0;n<count;n++){
    if(p+46>u8.length||dv.getUint32(p,true)!==0x02014b50)fail('unzip',`central directory entry ${n+1} of ${count}`,`bad signature at byte ${p}`);
    const flags=dv.getUint16(p+8,true),method=dv.getUint16(p+10,true),crc=dv.getUint32(p+16,true);
    let cs=dv.getUint32(p+20,true),us=dv.getUint32(p+24,true);const nl=dv.getUint16(p+28,true),xl=dv.getUint16(p+30,true),cl=dv.getUint16(p+32,true);let lho=dv.getUint32(p+42,true);
    const name=td.decode(u8.subarray(p+46,p+46+nl));
    if(cs===0xFFFFFFFF||us===0xFFFFFFFF||lho===0xFFFFFFFF){let x=p+46+nl;const xe=x+xl;while(x+4<=xe){const id=dv.getUint16(x,true),sz=dv.getUint16(x+2,true);if(id===1){let q=x+4;if(us===0xFFFFFFFF){us=Number(dv.getBigUint64(q,true));q+=8}if(cs===0xFFFFFFFF){cs=Number(dv.getBigUint64(q,true));q+=8}if(lho===0xFFFFFFFF){lho=Number(dv.getBigUint64(q,true));q+=8}}x+=4+sz}}
    if(!name.endsWith('/')){const en={name,flags,method,crc,cs,us,lho};ents.set(name,en);lower.set(name.toLowerCase(),en)}
    p+=46+nl+xl+cl;
  }
  if(!ents.size)fail('unzip','files in the zip','an empty archive');
  return{
    names:[...ents.keys()],
    find(n){if(n==null)return null;return ents.get(n)||lower.get(String(n).toLowerCase())||null},
    async bytes(n){const en=typeof n==='string'?this.find(n):n;if(!en)return null;
      if(en.flags&1)fail('unzip',`${en.name} without zip encryption`,'an encrypted entry');
      if(dv.getUint32(en.lho,true)!==0x04034b50)fail('unzip',`a local header for ${en.name}`,`bad signature at byte ${en.lho}`);
      const s=en.lho+30+dv.getUint16(en.lho+26,true)+dv.getUint16(en.lho+28,true);const c=u8.subarray(s,s+en.cs);
      if(en.method===0)return c.slice();
      if(en.method===8){try{return await inflate(c,en.crc,en.us)}catch(err){fail('unzip',`${en.name} to inflate`,err.message)}}
      fail('unzip',`stored or deflated ${en.name}`,`compression method ${en.method}`)},
    async text(n){const b=await this.bytes(n);return b?decodeText(b):null},
  };
}
function dosStamp(d=new Date()){return{time:(d.getHours()<<11)|(d.getMinutes()<<5)|(d.getSeconds()>>1),date:((d.getFullYear()-1980)<<9)|((d.getMonth()+1)<<5)|d.getDate()}}
function localHeader(nm,method,crc,cs,us,time,date,utf){const h=new Uint8Array(30+nm.length),v=new DataView(h.buffer);v.setUint32(0,0x04034b50,true);v.setUint16(4,20,true);v.setUint16(6,utf?0x0800:0,true);v.setUint16(8,method,true);v.setUint16(10,time,true);v.setUint16(12,date,true);v.setUint32(14,crc,true);v.setUint32(18,cs,true);v.setUint32(22,us,true);v.setUint16(26,nm.length,true);v.setUint16(28,0,true);h.set(nm,30);return h}
function centralHeader(nm,method,crc,cs,us,time,date,off,utf){const h=new Uint8Array(46+nm.length),v=new DataView(h.buffer);v.setUint32(0,0x02014b50,true);v.setUint16(4,20,true);v.setUint16(6,20,true);v.setUint16(8,utf?0x0800:0,true);v.setUint16(10,method,true);v.setUint16(12,time,true);v.setUint16(14,date,true);v.setUint32(16,crc,true);v.setUint32(20,cs,true);v.setUint32(24,us,true);v.setUint16(28,nm.length,true);v.setUint32(42,off,true);h.set(nm,46);return h}
function endRecord(n,size,off){const h=new Uint8Array(22),v=new DataView(h.buffer);v.setUint32(0,0x06054b50,true);v.setUint16(8,n,true);v.setUint16(10,n,true);v.setUint32(12,size,true);v.setUint32(16,off,true);return h}
async function zipWrite(files){
  const parts=[],central=[];let off=0;const {time,date}=dosStamp();
  for(const f of files){
    const nm=ENC.encode(f.name),u8=f.data,crc=crc32(u8);let data=u8,method=0;
    if(!f.store&&u8.length>64){try{const c=await deflate(u8);if(c&&c.length<u8.length){data=c;method=8}}catch(e){log('zip',`deflate failed, storing ${f.name}: ${e.message}`)}}
    const utf=/[^\x00-\x7f]/.test(f.name);const lh=localHeader(nm,method,crc,data.length,u8.length,time,date,utf);
    parts.push(lh,data);central.push(centralHeader(nm,method,crc,data.length,u8.length,time,date,off,utf));off+=lh.length+data.length;
  }
  const size=central.reduce((s,c)=>s+c.length,0);
  return new Blob([...parts,...central,endRecord(files.length,size,off)],{type:'application/epub+zip'});
}
async function zipBlobs(files){        // a zip of finished EPUBs, stored, built without holding them all in memory
  const parts=[],central=[];let off=0;const {time,date}=dosStamp();
  for(const f of files){
    const u8=new Uint8Array(await f.arrayBuffer());const crc=crc32(u8);const nm=ENC.encode(f.name);const utf=/[^\x00-\x7f]/.test(f.name);
    const lh=localHeader(nm,0,crc,u8.length,u8.length,time,date,utf);parts.push(lh,f);central.push(centralHeader(nm,0,crc,u8.length,u8.length,time,date,off,utf));off+=lh.length+u8.length;await tick();
  }
  return new Blob([...parts,...central,endRecord(files.length,central.reduce((s,c)=>s+c.length,0),off)],{type:'application/zip'});
}

/* =====================================================================
   TEXT — decoding, mojibake, whitespace
   ===================================================================== */
function decodeText(u8){
  if(u8[0]===0xEF&&u8[1]===0xBB&&u8[2]===0xBF)return new TextDecoder('utf-8').decode(u8.subarray(3));
  if(u8[0]===0xFF&&u8[1]===0xFE)return new TextDecoder('utf-16le').decode(u8.subarray(2));
  if(u8[0]===0xFE&&u8[1]===0xFF)return new TextDecoder('utf-16be').decode(u8.subarray(2));
  let head='';for(let i=0;i<Math.min(1024,u8.length);i++)head+=String.fromCharCode(u8[i]);
  let label=(head.match(/<\?xml[^>]*encoding\s*=\s*["']([\w.:-]+)["']/i)||head.match(/<meta[^>]+charset\s*=\s*["']?([\w.:-]+)/i)||[])[1];
  label=label?label.toLowerCase():'utf-8';
  let dec;try{dec=new TextDecoder(label)}catch(e){dec=new TextDecoder('utf-8');label='utf-8'}
  let s=dec.decode(u8);
  if(label==='utf-8'||label==='utf8'){const bad=(s.match(/�/g)||[]).length;if(bad>8&&bad>s.length/2000){try{s=new TextDecoder('windows-1252').decode(u8)}catch(e){}}}
  return s;
}
const CP_HI='€\u0081‚ƒ„…†‡ˆ‰Š‹Œ\u008DŽ\u008F\u0090‘’“”•–—˜™š›œ\u009DžŸ';
const CP_BYTE=new Map();for(let i=0;i<32;i++)CP_BYTE.set(CP_HI[i],0x80+i);
const CONT='[\\u0080-\\u00BF\\u20AC\\u201A\\u0192\\u201E\\u2026\\u2020\\u2021\\u02C6\\u2030\\u0160\\u2039\\u0152\\u017D\\u2018\\u2019\\u201C\\u201D\\u2022\\u2013\\u2014\\u02DC\\u2122\\u0161\\u203A\\u0153\\u017E\\u0178]';
const MOJI_RX=new RegExp(`(?:[\\u00C2-\\u00DF]${CONT}|[\\u00E0-\\u00EF]${CONT}{2}|[\\u00F0-\\u00F4]${CONT}{3})+`,'g');
const UTF8_FATAL=new TextDecoder('utf-8',{fatal:true});
function unMoji(s){return s.replace(MOJI_RX,m=>{const b=new Uint8Array(m.length);for(let i=0;i<m.length;i++){const c=m.charCodeAt(i);const v=c<0x100?c:CP_BYTE.get(m[i]);if(v==null)return m;b[i]=v}try{return UTF8_FATAL.decode(b)}catch(e){return m}})}
function fixText(s){
  s=String(s);if(/[Â-ô]/.test(s))s=unMoji(s);
  return s.replace(/[­​﻿￾￿\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F-\u009F]/g,'').replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g,'').normalize('NFC');
}
const WS=/[\s  -   　]+/g;
function normWs(nodes){
  let sp=true;
  const go=arr=>{for(let i=0;i<arr.length;i++){const x=arr[i];
    if(typeof x==='string'){let s=fixText(x).replace(WS,m=>m===' '?' ':' ');if(sp)s=s.replace(/^[  ]+/,'');if(s)sp=/[  ]$/.test(s);arr[i]=s}
    else if(x.t==='br'){trimTail(arr,i);sp=true}
    else if(x.t==='img')sp=false;
    else if(x.c)go(x.c)}};
  go(nodes);trimTail(nodes,nodes.length);return prune(nodes);
}
function trimTail(arr,i){for(let j=i-1;j>=0;j--){const x=arr[j];if(typeof x==='string'){arr[j]=x.replace(/[  ]+$/,'');if(arr[j])return;continue}if(x.t==='br'||x.t==='img')return;if(x.c&&x.c.length){trimTail(x.c,x.c.length);return}}}
function prune(arr){const out=[];for(const x of arr){if(typeof x==='string'){if(x)out.push(x);continue}if(x.c){x.c=prune(x.c);if(!x.c.length&&!(x.a&&x.a.id)&&x.t!=='td'&&x.t!=='th'&&x.t!=='li')continue}out.push(x)}
  while(out.length&&out[0].t==='br')out.shift();while(out.length&&out[out.length-1].t==='br')out.pop();return out}
const SEPS=new Set(['li','td','th','tr','dt','dd','caption']);
function plain(arr){let s='';for(const x of arr){if(typeof x==='string')s+=x;else if(x.t==='br')s+='\n';else if(x.c){s+=plain(x.c);if(SEPS.has(x.t))s+=' '}}return s}
function countWords(t){const m=t.match(/\S+/g);const n=m?m.length:0;const cjk=(t.match(/[぀-ヿ㐀-鿿가-힯]/g)||[]).length;return cjk>n?Math.ceil(cjk/2):n}

const PLAN_SYS=`You map the structure of an ebook so a script can rebuild it with clean chapters. The script never changes the book's words: you only decide where sections begin, what each one is, and what the table of contents says.

- Start a section only at a real division: cover, title page, copyright, dedication, epigraph, contents, foreword, preface, introduction, prologue, part divider, chapter, interlude, epilogue, afterword, acknowledgments, notes, appendix, about the author, ads, "also by" lists, praise pages, excerpts of other books, newsletter sign-ups, scanner or converter credits, blank pages.
- Don't start sections at styled lines inside a chapter: letters, signs, scene breaks, emphasized sentences, subheads inside a non-fiction chapter.
- A file that continues a sentence from the file before it is not a new section; the book was split mechanically.
- The first section starts at candidate 0.
- start: the candidate number (12 for c12).
- heading: the candidate numbers of the lines that ARE the section's printed heading, in order. "CHAPTER ONE" followed by "The Boy Who Lived" is [40, 41]. Empty when the section has no printed heading (a copyright page, a cover image, a bare dedication).
- label: the contents entry, built only from the heading's own words, keeping their wording and capitalization. Join two heading lines with ": ". Drop page numbers, ornaments and stray punctuation. null when heading is empty.
- level: 2 for chapters, prologues, interludes and epilogues that sit inside a part; 1 for everything else.

  const body={model,max_tokens:maxTokens,system,messages:[{role:'user',content:user}],output_config:{format:{type:'json_schema',schema}}};

const META_SYS=`You write catalog metadata for an ebook file. Sources: the file's own metadata (often wrong or junk), its title page and copyright page, its opening lines, and catalog search results from Google Books and Open Library, which may be different books.

  const kept=plan.secs.filter(s=>s.keep).map((s,i)=>({...s,file:`s${String(i+1).padStart(3,'0')}.xhtml`}));
  if(!kept.length)fail('build','sections to write','none kept');
  const where=new Int32Array(B.length).fill(-1);kept.forEach((s,si)=>{for(let j=s.start;j<=s.end;j++)where[j]=si});
  const imgs=new Map();
  const R={links:0,dead:0,noimg:0,
    idFile(sid){const bi=book.idBlock.get(sid);if(bi==null)return null;const si=where[bi];return si<0?null:kept[si].file},
    fileFile(fi){const bi=firstLiveOf(book,fi);if(bi==null)return null;const si=where[bi];return si<0?null:kept[si].file},
    img(p){let x=imgs.get(p);if(!x){const ext=((p.match(/\.([a-z0-9]+)$/i)||[])[1]||'').toLowerCase();const type=IMG_TYPES[ext];if(!type)return null;x={name:`i${String(imgs.size+1).padStart(3,'0')}.${ext==='jpeg'?'jpg':ext}`,type};imgs.set(p,x)}return x.name}};
  const files=[{name:'mimetype',data:ENC.encode('application/epub+zip'),store:true},{name:'META-INF/container.xml',data:ENC.encode(CONTAINER)}];
  const manifest=[{id:'nav',href:'nav.xhtml',type:'application/xhtml+xml',props:'nav'},{id:'ncx',href:'toc.ncx',type:'application/x-dtbncx+xml'},{id:'css',href:'style.css',type:'text/css'}];
  const spine=[];
  if(cover){files.push({name:'OEBPS/images/cover.jpg',data:cover.bytes,store:true},{name:'OEBPS/cover.xhtml',data:ENC.encode(coverXhtml(cover.w,cover.h,lang))});
    manifest.push({id:'cover-image',href:'images/cover.jpg',type:'image/jpeg',props:'cover-image'},{id:'cover',href:'cover.xhtml',type:'application/xhtml+xml',props:'svg'});spine.push('cover')}
  for(const s of kept){const id=s.file.replace('.xhtml','');files.push({name:'OEBPS/text/'+s.file,data:ENC.encode(sectionXhtml(book,s,lang,R))});manifest.push({id,href:'text/'+s.file,type:'application/xhtml+xml'});spine.push(id);if(kept.length>40&&spine.length%20===0)await tick()}
  for(const [p,x] of imgs){const bytes=await book.zip.bytes(p);if(!bytes)fail('build',`image ${p} in the source`,'missing');files.push({name:'OEBPS/images/'+x.name,data:bytes,store:x.type!=='image/svg+xml'});manifest.push({id:'img'+x.name.replace(/\.[^.]+$/,'').slice(1),href:'images/'+x.name,type:x.type})}
  const tree=tocTree(kept.map(s=>({label:s.label,href:'text/'+s.file,level:s.level})));
  const body=kept.find(s=>BODY.has(s.kind))||kept.find(s=>!FRONTISH.has(s.kind))||kept[0];
  const marks=[];if(cover)marks.push({type:'cover',href:'cover.xhtml',label:'Cover'});marks.push({type:'toc',href:'nav.xhtml#toc',label:'Contents'},{type:'bodymatter',href:'text/'+body.file,label:'Begin Reading'});
  const guide=[];if(cover)guide.push({type:'cover',title:'Cover',href:'cover.xhtml'});guide.push({type:'toc',title:'Contents',href:'nav.xhtml'},{type:'text',title:'Begin Reading',href:'text/'+body.file});
  files.push({name:'OEBPS/style.css',data:ENC.encode(BOOK_CSS)},{name:'OEBPS/nav.xhtml',data:ENC.encode(navXhtml(tree,lang,marks))},{name:'OEBPS/toc.ncx',data:ENC.encode(ncxXml(tree,uuid,m.title,lang))},{name:'OEBPS/content.opf',data:ENC.encode(opfXml(m,uuid,manifest,spine,guide,!!cover))});
  if(R.dead)ctx.warn.push(`${R.dead} link${R.dead>1?'s':''} pointed at cut pages and were unlinked`);
  if(R.noimg)ctx.warn.push(`${R.noimg} image${R.noimg>1?'s':''} in a format Books can’t show were dropped`);
  return files;
}
async function verifyEpub(blob){
  const buf=await blob.arrayBuffer();const u8=new Uint8Array(buf),dv=new DataView(buf);
  if(dv.getUint32(0,true)!==0x04034b50||new TextDecoder().decode(u8.subarray(30,38))!=='mimetype')fail('verify','mimetype as the first entry','something else');
  if(dv.getUint16(8,true)!==0||dv.getUint16(28,true)!==0)fail('verify','mimetype stored, no extra field','compressed or padded');
  const zip=await zipOpen(buf);
  if(await zip.text('mimetype')!=='application/epub+zip')fail('verify','mimetype = application/epub+zip','another value');
  const P=new DOMParser();const bad=d=>d.getElementsByTagName('parsererror').length>0;const why=d=>clip(txt(d.getElementsByTagName('parsererror')[0]||{textContent:''}),160);
  const opf=P.parseFromString(await zip.text('OEBPS/content.opf'),'application/xml');if(bad(opf))fail('verify','content.opf to parse',why(opf));
  const items=els(opf,'item');const ids=new Set(items.map(i=>i.getAttribute('id')));const xhtml=[];
  for(const it of items){const p='OEBPS/'+it.getAttribute('href');if(!zip.find(p))fail('verify',`${p} in the zip`,'missing');if(it.getAttribute('media-type')==='application/xhtml+xml')xhtml.push(p)}
  for(const ir of els(opf,'itemref'))if(!ids.has(ir.getAttribute('idref')))fail('verify',`spine item ${ir.getAttribute('idref')} in the manifest`,'missing');
  const ncx=P.parseFromString(await zip.text('OEBPS/toc.ncx'),'application/xml');if(bad(ncx))fail('verify','toc.ncx to parse',why(ncx));
  const docs=new Map(),idsBy=new Map();
  for(const p of xhtml){const d=P.parseFromString(await zip.text(p),'application/xhtml+xml');if(bad(d))fail('verify',`${p} to parse as XHTML`,why(d));docs.set(p,d);const s=new Set();for(const el of d.getElementsByTagName('*')){const id=el.getAttribute('id');if(id){if(s.has(id))fail('verify',`unique ids in ${p}`,`"${id}" twice`);s.add(id)}}idsBy.set(p,s)}
  let links=0;
  for(const [p,d] of docs){const dir=dirOf(p);for(const el of d.getElementsByTagName('*')){const t=lname(el);const ref=t==='a'||t==='link'?el.getAttribute('href'):t==='img'?el.getAttribute('src'):t==='image'?attrAny(el,'href'):null;if(!ref||/^(?:https?:|mailto:)/i.test(ref))continue;
    const [rp,frag]=splitHash(ref);const target=rp?resolvePath(dir,rp):p;if(!zip.find(target))fail('verify',`${ref} from ${p.split('/').pop()}`,'a missing file');if(frag&&idsBy.has(target)&&!idsBy.get(target).has(frag))fail('verify',`#${frag} in ${target.split('/').pop()}`,'no such id');links++}}
  return{files:zip.names.length,xhtml:xhtml.length,links};
}
function outName(m){let n=`${m.authors[0]?m.authors[0].name:'Unknown'} - ${m.title}`.replace(/[\\/:*?"<>|\u0000-\u001F]/g,' ').replace(/\s+/g,' ').trim();if(n.length>120)n=n.slice(0,120).trim();return n+'.epub'}

   ===================================================================== */
const BOOKS=new Map();
let FLAGS=[];
const RUN={on:false,active:new Set(),lock:null};
const SHEET={book:null,file:null,dump:null,over:{}};
const SAVE={files:[],url:null};
function setStage(ctx,name){const r=BOOKS.get(ctx.id);if(r&&r.status==='working'){r.stage=name;paintLater()}}
async function saveBaselines(ctx){for(const [stage,raw] of Object.entries(ctx.raw)){const k=`base:${ctx.id}:${stage}`;try{const prev=((await DB.get('diag',k))||{}).items||[];prev.push({at:new Date().toISOString(),build:BUILD,...raw});await DB.put('diag',{k,items:prev.slice(-3)})}catch(e){log('diag','FAIL baseline '+k+': '+e.message)}}}
async function saveDump(ctx,r,err){
  const at=new Date().toISOString();const k=`dump:${ctx.id}:${at}`;let base=null;
  try{const b=await DB.get('diag',`base:${ctx.id}:${err.stage}`);base=b&&b.items?b.items[b.items.length-1]:null}catch(e){}
  await DB.put('diag',{k,app:APP.key,build:BUILD,at,book:{id:ctx.id,name:ctx.name,size:r.size},stage:err.stage,expected:err.expected,got:err.got,stages:ctx.stages,raw:ctx.raw,baseline:base,bookLog:ctx.log,log:LOG.slice(-200)});
  try{const ks=(await DB.keys('diag')).map(String).filter(x=>x.startsWith('dump:')).sort((a,b)=>a.split(':').slice(2).join(':')<b.split(':').slice(2).join(':')?-1:1);for(const x of ks.slice(0,Math.max(0,ks.length-30)))await DB.del('diag',x)}catch(e){}
  return at.slice(11,19);
}
async function latestDump(id){const ks=(await DB.keys('diag')).map(String).filter(x=>x.startsWith('dump:'+id+':')).sort();return ks.length?DB.get('diag',ks[ks.length-1]):null}
async function processBook(id){
  const r=BOOKS.get(id);if(!r)return;
  const mode=r.mode||'full';r.mode=null;r.coverDirty=false;
  const ctx={id,name:r.name,log:[],stages:{},raw:{},warn:[]};
  r.status='working';r.stage='read';r.err=null;paintLater();
  blog(ctx,'start',`${r.name} · ${mode}`);
  try{
    const src=await blobGet('src:'+id);if(!src)fail('read','the source EPUB in storage','nothing: remove the book and add the file again');
    const buf=await stg(ctx,'read',()=>src.arrayBuffer(),b=>({bytes:b.byteLength}));
    const book=await stg(ctx,'parse',()=>parseEpub(buf,ctx,r),b=>({files:b.files.length,blocks:b.blocks.length,words:b.words,toc:b.tocRaw.length,cssClasses:b.cssClasses,cover:b.coverPath||null}));
    await stg(ctx,'scrub',()=>scrub(book,ctx),s=>s);
    const cands=await stg(ctx,'candidates',()=>candidates(book),c=>({n:c.length,strong:c.filter(x=>x.strong).length}));
    const reuse=mode==='rebuild'&&r.plan&&r.plan.parser===PARSER&&r.plan.blocks===book.blocks.length&&r.plan.raw;
    let raw;
    if(reuse){raw=r.plan.raw;blog(ctx,'plan','reused the saved chapter map')}
    else if(cfg.key&&mode!=='rules')raw=await stg(ctx,'plan',()=>planClaude(book,cands,ctx),p=>({by:'claude',sections:p.sections.length,title:p.title,author:p.author}));
    else raw=await stg(ctx,'plan',()=>planRules(book,cands),p=>({by:'rules',sections:p.sections.length}));
    r.plan={parser:PARSER,blocks:book.blocks.length,raw,by:raw.by};
    const plan=await stg(ctx,'sections',()=>resolvePlan(book,raw,r.over||{}),p=>({sections:p.secs.length,kept:p.kept,cut:p.cut,cutPct:p.cutPct}));
    if(plan.cutPct>CONF.cutWarn)ctx.warn.push(`${Math.round(plan.cutPct*100)}% of the words were cut`);
    const meta=reuse&&r.meta0?r.meta0:await stg(ctx,'meta',()=>metadata(book,plan,raw,ctx),m=>({by:m.by,title:m.title,authors:m.authors.map(a=>a.name),year:m.year,series:m.series}));
    r.meta0=meta;
    const fin=validateMeta({...meta,...(r.edits||{})},book.meta,meta.title,(meta.authors[0]||{}).name||'');fin.by=meta.by;
    const cover=await stg(ctx,'cover',()=>coverFor(book,id,ctx),c=>c?{src:c.src,w:c.w,h:c.h,bytes:c.bytes.length}:null);
    const files=await stg(ctx,'build',()=>buildEpub(book,plan,fin,cover,r.uuid,ctx),f=>({files:f.length,bytes:f.reduce((s,x)=>s+x.data.length,0)}));
    const out=await stg(ctx,'zip',()=>zipWrite(files),b=>({bytes:b.size}));
    const v=await stg(ctx,'verify',()=>verifyEpub(out),x=>x);
    await stg(ctx,'store',async()=>{await blobPut('out:'+id,out);return out.size},n=>({bytes:n}));
    const kept=plan.secs.filter(s=>s.keep);
    Object.assign(r,{status:'done',stage:'',meta:fin,
      secs:plan.secs.map(s=>({b:s.start,kind:s.kind,level:s.level,label:s.label,auto:s.auto,keep:s.keep,words:s.words})),
      stats:{chapters:kept.filter(s=>BODY.has(s.kind)&&s.kind!=='part').length||kept.length,cut:plan.cut,cutPct:plan.cutPct,words:book.words,bytes:out.size,links:v.links},
      outName:outName(fin),coverSrc:cover?cover.src:null,warn:ctx.warn,done:Date.now()});
    if(cover)r.thumb=cover.thumb;
    blog(ctx,'done',`${r.outName} · ${mb(out.size)}`);
    await saveBaselines(ctx);
  }catch(e){
    const err=e instanceof StageError?e:new StageError('process','a clean run',`${e.name}: ${e.message}`);
    if(err.extra&&err.extra.secs)r.secs=err.extra.secs.map(s=>({b:s.start,kind:s.kind,level:s.level,label:s.label,auto:s.auto,keep:s.keep,words:s.words}));
    let dk='';try{dk=await saveDump(ctx,r,err)}catch(x){log('dump','FAIL '+x.message)}
    r.status='failed';r.stage=err.stage;r.err=err.message+(dk?` · dump ${dk}`:'');r.warn=ctx.warn;
    redEdge();
  }finally{
    if(r.coverDirty&&r.status==='done'){r.mode='rebuild';r.status='queued'}
    r.log=ctx.log.slice(-200);await saveRec(r);paintLater();refreshSheet(id);
  }
}

/* run loop: three books in flight, screen kept awake while it works */
async function wakeOn(){try{if(navigator.wakeLock&&!RUN.lock){RUN.lock=await navigator.wakeLock.request('screen');RUN.lock.addEventListener('release',()=>{RUN.lock=null})}}catch(e){log('wake','unavailable: '+e.message)}}
function wakeOff(){try{if(RUN.lock)RUN.lock.release()}catch(e){}RUN.lock=null}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&RUN.active.size)wakeOn()});
function startRun(){if(!RUN.on){RUN.on=true;RUN.n=0;wakeOn();log('run','start')}pump();render()}
function pauseRun(){RUN.on=false;log('run','pause');if(RUN.active.size)toast('Pausing after the books in flight');render()}
function pump(){
  while(RUN.on&&RUN.active.size<CONF.workers){
    const next=[...BOOKS.values()].filter(r=>r.status==='queued'&&!RUN.active.has(r.k)).sort((a,b)=>a.added-b.added)[0];if(!next)break;
    RUN.active.add(next.k);
    processBook(next.k).catch(e=>log('run','FAIL '+e.message)).finally(()=>{RUN.active.delete(next.k);RUN.n=(RUN.n||0)+1;pump()});
  }
  if(!RUN.active.size){if(RUN.on){RUN.on=false;const c=counts();log('run',`finished · ${RUN.n||0} processed · ${c.done} clean · ${c.failed} failed`);if(RUN.n)toast(c.failed?`Finished · ${c.failed} failed`:'Finished · all clean')}wakeOff()}
  paintLater();
}

/* adding books and covers */
async function shaHex(buf){const h=await crypto.subtle.digest('SHA-256',buf);return [...new Uint8Array(h)].map(x=>x.toString(16).padStart(2,'0')).join('')}
function uuidOf(hex){const h=hex.slice(0,32).split('');h[12]='5';h[16]=(8+(parseInt(h[16],16)&3)).toString(16);const s=h.join('');return `${s.slice(0,8)}-${s.slice(8,12)}-${s.slice(12,16)}-${s.slice(16,20)}-${s.slice(20,32)}`}
async function addEpubs(files){
  let add=0,dup=0;const bad=[];toast(`Adding ${files.length}…`);
  try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().then(p=>log('storage','persist '+p)).catch(()=>{})}catch(e){}
  for(const f of files){
    try{
      if(!/\.epub$/i.test(f.name)&&f.type!=='application/epub+zip'){bad.push(f.name);continue}
      const buf=await f.arrayBuffer();if(buf.byteLength<100){bad.push(f.name);continue}
      const hex=await shaHex(buf);const id=hex.slice(0,16);
      if(BOOKS.has(id)){dup++;continue}
      await blobPut('src:'+id,new Blob([buf],{type:'application/epub+zip'}));
      const r={k:id,uuid:uuidOf(hex),name:f.name,size:f.size,added:Date.now(),status:'queued',stage:'',warn:[],log:[]};
      BOOKS.set(id,r);await saveRec(r);add++;paintLater();
    }catch(e){bad.push(`${f.name} (${e.message})`);log('add','FAIL '+f.name+': '+((e&&e.message)||e))}
  }
  log('add',`${add} added · ${dup} already here · ${bad.length} skipped`);
  if(bad.length)FLAGS.push({level:'warn',text:`${bad.length} file${bad.length>1?'s':''} skipped: ${clip(bad.join(', '),160)}`});
  toast([`${add} added`,dup?`${dup} already here`:'',bad.length?`${bad.length} skipped`:''].filter(Boolean).join(' · '));
  render();if(add)startRun();
}
const STOP=new Set(['the','a','an','of','and','to','in','on','for','by','with','at','from','book','ebook','epub','cover','front','jpg','jpeg','png','heic','img','image']);
function toks(s){const all=normKey(s).split(' ').filter(w=>w&&!/^\d{1,2}$/.test(w));const k=all.filter(w=>!STOP.has(w));return new Set(k.length?k:all)}
function matchCover(name,recs){
  const f=toks(name.replace(/\.[a-z0-9]{2,5}$/i,''));if(!f.size)return null;
  let best=null,bs=0,tie=false;
  for(const r of recs){const cs=[r.meta&&r.meta.title,r.plan&&r.plan.raw&&r.plan.raw.title,r.name.replace(/\.epub$/i,'')].filter(Boolean);
    for(const c of cs){const t=toks(c);if(!t.size)continue;let inter=0;for(const w of t)if(f.has(w))inter++;if(!inter)continue;const cov=inter/t.size;if(cov<.8)continue;const sc=cov*.7+inter/f.size*.3;
      if(sc>bs+1e-9){best=r.k;bs=sc;tie=false}else if(Math.abs(sc-bs)<=1e-9&&best!==r.k)tie=true}}
  return tie?null:best;
}
async function addCovers(files,targetId){
  const recs=[...BOOKS.values()];const miss=[];let n=0;
  for(const f of files){
    const id=targetId||matchCover(f.name,recs);if(!id){miss.push(f.name);continue}
    const r=BOOKS.get(id);if(!r)continue;
    try{const c=await normCover(f);await blobPut('cov:'+id,c.blob);r.thumb=c.thumb;r.coverName=f.name;
      if(r.status==='working')r.coverDirty=true;else if(r.status==='done'||(r.status==='failed'&&r.plan)){r.mode='rebuild';r.status='queued'}
      await saveRec(r);n++;log('cover',`${f.name} → ${r.meta?r.meta.title:r.name}`)}
    catch(e){miss.push(`${f.name} (${e.message})`);log('cover','FAIL '+f.name+': '+e.message)}
  }
  if(miss.length)FLAGS.push({level:'warn',text:`${miss.length} cover${miss.length>1?'s':''} matched no book: ${clip(miss.join(', '),160)}`});
  toast(n?`${n} cover${n>1?'s':''} set`:'No covers matched');
  render();if(targetId)refreshSheet(targetId);
  if(n&&[...BOOKS.values()].some(r=>r.status==='queued'))startRun();
}
async function requeue(id,mode){const r=BOOKS.get(id);if(!r)return;if(RUN.active.has(id)){toast('Still building · try again when it finishes');return}
  if(mode!=='rebuild')r.over={};          // a fresh chapter map starts from fresh cuts
  r.mode=mode;r.status='queued';r.err=null;await saveRec(r);closeSheet();startRun()}
async function removeBook(id){for(const p of ['src:','out:','cov:'])try{await DB.del('blobs',p+id)}catch(e){}try{await DB.del('books',id)}catch(e){}BOOKS.delete(id)}

function watchCharts(v,mode){if(mode==='all'){const go=()=>v.querySelectorAll('.canim,.canim2,.canim3,.heat,.lfoot').forEach(el=>{el.style.setProperty('--rd','0s');el.classList.add('go');});go();requestAnimationFrame(go);return;}const check=()=>{let k=0;const R=v.getBoundingClientRect();v.querySelectorAll('.canim,.canim2,.canim3,.heat,.lfoot').forEach(el=>{const r=el.getBoundingClientRect();if(!r.height)return;const vis=Math.min(r.bottom,R.bottom)-Math.max(r.top,R.top);const need=Math.min(Math.max(r.height*0.3,80),r.height,R.height*0.5);const inFromBottom=R.bottom-r.top,inFromTop=r.bottom-R.top;if(inFromBottom>=need&&inFromTop>=need){if(!el.classList.contains('go')){el.style.setProperty('--rd',k.toFixed(1)+'s');k+=el.classList.contains('canim3')?1.2:0.6;el.classList.add('go');}}else if(vis<=-24&&el.classList.contains('go')){el.classList.remove('go');el.style.removeProperty('--rd');}});};if(!v.dataset.cw){v.dataset.cw='1';let t=null;v.addEventListener('scroll',()=>{if(t)return;t=requestAnimationFrame(()=>{t=null;check();});},{passive:true});}check();requestAnimationFrame(check);setTimeout(check,350);}

  remove:el=>arm(el,'Remove?',async()=>{const id=SHEET.book;if(RUN.active.has(id)){toast('Still building · try again when it finishes');return}await removeBook(id);closeSheet();render();toast('Removed')}),
  'copy-dump':()=>copyText(SHEET.dump||'no dump stored for this book','Dump copied'),
  'copy-log':()=>copyText(LOG.join('\n'),'Log copied'),
  'dump-all':()=>downloadBlob(`${APP.key}-dump.json`,new Blob([dumpJSON()],{type:'application/json'})),
  reload:()=>reloadApp(),
  'test-key':()=>testKey(),
  'forget-key':()=>{delete cfg.key;saveCfg();render();toast('Key removed')},
  'clear-all':el=>{if(RUN.active.size){toast('Pause and let the books in flight finish first');return}arm(el,'Remove all?',async()=>{for(const s of ['books','blobs','diag'])try{await DB.clear(s)}catch(e){log('store','FAIL clear '+s+': '+e.message)}BOOKS.clear();FLAGS=[];render();toast('Everything removed')})},
};
document.addEventListener('click',e=>{
  const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
  const a=e.target.closest('[data-act]');if(a){if(a.disabled)return;const f=ACT[a.dataset.act];if(!f)return;
    try{const p=f(a,e);if(p&&p.catch)p.catch(err=>{log('act',`FAIL ${a.dataset.act}: ${err.message}`);toast(err.message);redEdge()})}catch(err){log('act',`FAIL ${a.dataset.act}: ${err.message}`);toast(err.message);redEdge()}return}
  const r=e.target.closest('[data-book]');if(r)openBook(r.dataset.book);
});
document.addEventListener('change',e=>{const t=e.target;const k=t.dataset&&t.dataset.set;if(!k)return;
  if(k==='key'){const v=t.value.trim();t.value='';if(!v)return;cfg.key=v;saveCfg();log('cfg','key set');toast(/^sk-ant-/.test(v)?'Key saved':'Saved · that doesn’t look like an Anthropic key');render();return}
  if(k==='model'){cfg.model=t.value;saveCfg();log('cfg','model '+cfg.model);render();return}
  if(k==='lookups'){cfg.lookups=t.checked;saveCfg();return}
  if(k==='look'){cfg.look=t.value;saveCfg();applyLook();render()}
});
document.addEventListener('focusout',e=>{if(e.target&&/^(?:INPUT|SELECT)$/.test(e.target.tagName))setTimeout(()=>window.scrollTo(0,0),60)});
$('fpEpub').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)addEpubs(fs)});
$('fpCover').addEventListener('change',e=>{const fs=[...e.target.files];e.target.value='';if(fs.length)addCovers(fs,null)});
$('fpOne').addEventListener('change',e=>{const fs=[...e.target.files];const id=e.target.dataset.id;e.target.value='';if(fs.length&&id)addCovers(fs.slice(0,1),id)});
function applyLook(){
  const r=document.documentElement;const l=cfg.look==='light'||cfg.look==='dark'?cfg.look:null;
  if(applyLook.done&&r.getAttribute('data-look')!==l&&!reduced){r.classList.add('looking');setTimeout(()=>r.classList.remove('looking'),500)}
  if(l)r.setAttribute('data-look',l);else r.removeAttribute('data-look');applyLook.done=true;
  const mt=document.querySelector('meta[name=theme-color]');if(mt)mt.content=getComputedStyle(r).getPropertyValue('--ground').trim()||'#000000';
}
try{matchMedia('(prefers-color-scheme: dark)').addEventListener('change',applyLook)}catch(e){}
function envViewport(){try{const nav=$('nav').getBoundingClientRect();log('env viewport',{standalone:!!(navigator.standalone||matchMedia('(display-mode: standalone)').matches),vh:innerHeight,app:$('app').offsetHeight,navBottom:Math.round(nav.bottom),inner:`${innerWidth}x${innerHeight}`,screen:`${screen.width}x${screen.height}`,ua:navigator.userAgent,deflateRaw:rawSupported(),shareFiles:!!navigator.canShare,wakeLock:!!navigator.wakeLock})}catch(e){log('env viewport','FAIL '+e.message)}}

/* ---- boot ---- */
async function boot(){
  log('boot',`${APP.name} ${BUILD}`);applyLook();
  try{await DB.open();const recs=await DB.all('books');for(const r of recs){if(r.status==='working')r.status='queued';BOOKS.set(r.k,r)}log('boot',`${recs.length} books in storage`)}
  catch(e){FLAGS.push({level:'bad',text:'Storage unavailable: '+((e&&e.message)||e)+'. Private Browsing blocks it.'});log('boot','FAIL storage: '+((e&&e.message)||e));redEdge()}
  render();requestAnimationFrame(envViewport);
}
boot();
</script>
</body>
</html>
