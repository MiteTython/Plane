<style>
/* Layout: one-screen phone app. Green (quiet detail + lines), Flow (the runway ledger four ways), Buckets (tiles with the tag queue), Debts (countdown), Plan (spend planner). */
:root{
  --bg:#0b0f17; --surface:#131a26; --surface2:#1b2432; --fg:#f2f5fa; --muted:#8e9bb3; --line:rgba(142,155,179,.16);
  --checking:#f5b942; --bills:#4f9dff; --savings:#2ee6a6; --red:#ff5c7a; --amber:#ffb34a; --green:#2ee6a6; --violet:#9b7bff;
  --g-free:linear-gradient(90deg,#2ee6a6,#7ff5cf); --g-amber:linear-gradient(90deg,#ffb34a,#ffd28a); --g-red:linear-gradient(90deg,#ff5c7a,#ff8da3);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Manrope",system-ui,-apple-system,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.4,.4,1);
  --r:22px; --r2:18px; --r3:14px; --border:0 solid transparent; --tileglass:none;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]):not([data-skin]),:root:not([data-theme="dark"])[data-skin="night"]{ --bg:#f3f5fa; --surface:#ffffff; --surface2:#eaeef6; --fg:#0f1627; --muted:#5f6c84; --line:rgba(15,22,39,.12); --checking:#d2920f; --bills:#2b72e8; --savings:#13a877; --red:#e23b5c; --amber:#d98a1e; --green:#13a877; --violet:#6f52e6; --g-free:linear-gradient(90deg,#13a877,#3ad19f); --g-amber:linear-gradient(90deg,#d98a1e,#f0b35a); --g-red:linear-gradient(90deg,#e23b5c,#f07a92); --shadow:0 10px 30px rgba(15,22,39,.08); color-scheme:light } }
:root[data-theme="light"]{ --bg:#f3f5fa; --surface:#ffffff; --surface2:#eaeef6; --fg:#0f1627; --muted:#5f6c84; --line:rgba(15,22,39,.12); --checking:#d2920f; --bills:#2b72e8; --savings:#13a877; --red:#e23b5c; --amber:#d98a1e; --green:#13a877; --violet:#6f52e6; --g-free:linear-gradient(90deg,#13a877,#3ad19f); --g-amber:linear-gradient(90deg,#d98a1e,#f0b35a); --g-red:linear-gradient(90deg,#e23b5c,#f07a92); --shadow:0 10px 30px rgba(15,22,39,.08); color-scheme:light }

html,body{height:100%}html{background:var(--surface)}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-weight:500}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;transition:transform .12s var(--spring)}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bills);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0;width:100%}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}
.c-checking{color:var(--checking)}.c-bills{color:var(--bills)}.c-savings{color:var(--savings)}.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-green{color:var(--green)}.c-violet{color:var(--violet)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grad{background:var(--g-free);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad.amber{background:var(--g-amber);-webkit-background-clip:text;background-clip:text}.grad.red{background:var(--g-red);-webkit-background-clip:text;background-clip:text}

#app{position:fixed;inset:0;height:auto;display:flex;flex-direction:column;max-width:520px;margin:0 auto}
header{display:flex;align-items:center;justify-content:space-between;gap:8px;min-width:0;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-family:var(--display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.02em;display:flex;align-items:center;gap:10px}
.wm{font-size:26px;letter-spacing:-.04em;background:linear-gradient(100deg,var(--checking) 0%,var(--bills) 35%,var(--savings) 70%,var(--checking) 100%);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent;animation:shimmer 7s linear infinite;filter:drop-shadow(0 0 14px rgba(192,76,181,.25))}
@keyframes shimmer{0%{background-position:0% 50%}100%{background-position:300% 50%}}
.stpill{display:inline-flex;align-items:center;gap:6px;font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;padding:4px 9px;border-radius:999px;background:var(--surface2);color:var(--green);border:1px solid transparent;animation:pillin .6s var(--spring) both;transform-origin:left center}
.stpill i{width:6px;height:6px;border-radius:50%;background:currentColor;box-shadow:0 0 0 0 currentColor;animation:ping 2.4s ease-out infinite}
.stpill.amber{color:var(--amber)}.stpill.red{color:var(--red);animation:pillin .6s var(--spring) both,shake 3s ease-in-out infinite 1s}
@keyframes ping{0%{box-shadow:0 0 0 0 currentColor;opacity:1}70%{box-shadow:0 0 0 7px transparent;opacity:1}100%{box-shadow:0 0 0 0 transparent}}
@keyframes pillin{from{transform:scale(.6);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,92%,100%{transform:none}94%{transform:translateX(-2px)}96%{transform:translateX(2px)}98%{transform:translateX(-1px)}}
.echip{animation:pop .45s var(--spring) both}.echip:nth-child(1){animation-delay:.05s}.echip:nth-child(2){animation-delay:.1s}.echip:nth-child(3){animation-delay:.15s}.echip:nth-child(4){animation-delay:.2s}.echip:nth-child(5){animation-delay:.25s}.echip:nth-child(6){animation-delay:.3s}.echip:nth-child(7){animation-delay:.35s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:none;opacity:1}}
.kpi{animation:rise .5s var(--ease) both}.kpi:nth-child(2){animation-delay:.08s}.kpi:nth-child(3){animation-delay:.16s}@keyframes rise{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
.btn:active,.tagbtn:active,.mrow:active,.irow.go:active,.tile:active{transform:scale(.97)}.btn,.tagbtn,.mrow,.irow,.tile{transition:transform .15s var(--spring),background .2s}
.lane,.scrubout,.linechart{-webkit-user-select:none;user-select:none}
.card{animation:cardin .5s var(--ease) both}@keyframes cardin{from{transform:translateY(8px);opacity:0}to{transform:none;opacity:1}}
.irow{animation:rowin .4s var(--ease) both}@keyframes rowin{from{transform:translateX(-8px);opacity:0}to{transform:none;opacity:1}}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--muted);white-space:nowrap;font-weight:700}
.pill.sample{color:var(--amber);border-color:currentColor}
.streak{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--amber);background:rgba(255,179,74,.12);border-radius:999px;padding:4px 9px}
.streak svg{width:12px;height:14px;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.12) rotate(-4deg)}}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 24px;display:flex;flex-direction:column;gap:14px}
.view[hidden]{display:none}
h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em;text-wrap:balance}
.card{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border:var(--border)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--display);font-size:42px;font-weight:800;line-height:1;letter-spacing:-.03em}
.btn{border-radius:var(--r3);padding:11px 14px;font-weight:700;background:var(--surface2);text-align:center;display:inline-block;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--bills);color:#fff}.btn.good{background:var(--green);color:#06251c}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border-radius:999px;padding:7px 13px;color:var(--muted);background:var(--surface2);font-weight:700;transition:transform .15s var(--spring),background .15s,color .15s}
.chip[aria-pressed="true"],.chip.on{background:var(--bills);color:#fff;transform:scale(1.05)}
.chip.good.on{background:var(--green);color:#06251c}
.alts{display:flex;background:var(--surface);border-radius:var(--r3);border:var(--border);padding:4px;gap:4px;align-self:stretch;overflow-x:auto;box-shadow:var(--shadow);flex:none}
.alts button{flex:1 0 auto;padding:14px 14px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;min-height:48px}

.dot{width:14px;height:14px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(46,230,166,.5),0 0 18px rgba(46,230,166,.6);animation:breathe 3.2s ease-in-out infinite;flex:none}
.dot.amber{background:var(--amber);box-shadow:0 0 18px rgba(255,179,74,.6);animation-name:breatheA}.dot.red{background:var(--red);box-shadow:0 0 18px rgba(255,92,122,.6);animation-name:breatheR;animation-duration:1.4s}
.dot.huge{width:44px;height:44px}
@keyframes breathe{50%{box-shadow:0 0 0 12px rgba(46,230,166,0),0 0 18px rgba(46,230,166,.6)}}
@keyframes breatheA{50%{box-shadow:0 0 0 12px rgba(255,179,74,0),0 0 18px rgba(255,179,74,.6)}}

.fadein{animation:fadein .5s var(--ease) both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{to{transform:scale(1);opacity:1}}
@keyframes txin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}

/* green */

.qline{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:14px}

.seg .float{background:repeating-linear-gradient(135deg,var(--muted) 0 4px,transparent 4px 8px);opacity:.6}.seg .spoken{background:var(--muted);opacity:.35}
.path{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}

.pd .d{font-family:var(--mono);font-size:12px;font-weight:700}.pd .p{font-family:var(--mono);font-size:9px;color:var(--muted)}
.pd.g{background:rgba(46,230,166,.16)}.pd.a{background:rgba(255,179,74,.18)}.pd.r{background:rgba(255,92,122,.2)}.pd.today{outline:2px solid var(--fg)}.pd.pay{background:var(--green);color:#06251c}.pd.pay .p{color:#06251c}

.flag{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r2);background:var(--surface2);animation:txin .4s var(--ease) both}

.flag.red i{background:var(--red);box-shadow:0 0 10px var(--red)}.flag.amber i{background:var(--amber);box-shadow:0 0 10px var(--amber)}.flag.blue i{background:var(--bills);box-shadow:0 0 10px var(--bills)}
.flag .ft{font-weight:800;font-size:14px;line-height:1.3}.flag .fw{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.flag .btn{white-space:nowrap}
.echips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 10px}.echip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--surface2);border:1px solid transparent;color:var(--fg);font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:36px}.echip b{font-family:var(--mono);font-weight:700}.echip.stash{background:rgba(61,255,176,.1);border-color:rgba(61,255,176,.4)}.echip.locked{opacity:.55}.echip.locked b{text-decoration:line-through}
.rrow2{display:grid;grid-template-columns:10px minmax(0,1fr) auto;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}.rrow2:last-child{border-bottom:0}.rrow2 .ldot{width:8px;height:8px;border-radius:50%;display:block}.rrow2 .n{font-weight:700;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.rrow2 .m{font-size:11px;color:var(--muted);font-family:var(--mono)}
.inbox{display:flex;flex-direction:column;gap:6px;margin-top:4px}.irow{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r2);background:var(--surface2);animation:txin .35s var(--ease) both}.irow.go{cursor:pointer}.irow .ii{font-size:18px;text-align:center}.irow .t{font-weight:700;font-size:14px;line-height:1.3}.irow .s{font-size:12px;color:var(--muted);margin-top:2px}.irow .ia{font-family:var(--mono);font-size:11px;font-weight:700;color:var(--bills);white-space:nowrap}.irow.red{border-left:3px solid var(--red)}.irow.amber{border-left:3px solid var(--amber)}.irow.blue{border-left:3px solid var(--bills)}
.score3.two{grid-template-columns:repeat(2,1fr)}.verdict{margin:0;font-size:17px;line-height:1.55;font-weight:500}.verdict .vn{font-family:var(--mono);font-weight:700;white-space:nowrap}.score3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:var(--surface2);border-radius:var(--r2);padding:10px 8px;text-align:center}.kpi .kv{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}.kpi .km{font-size:11px;color:var(--muted)}

.disc input{width:92px;padding:5px 8px;font-family:var(--mono);text-align:right}
input[type=range]{accent-color:var(--bills);padding:0;background:transparent;border:0}
.clockrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.gain{background:var(--surface2);border-radius:var(--r2);padding:10px 12px;text-align:right;opacity:.35;transition:opacity .3s,transform .3s}.gain.on{opacity:1;transform:scale(1.03);box-shadow:0 0 0 1px rgba(61,255,176,.4),0 0 24px rgba(61,255,176,.25)}

/* plan */
.opt{background:var(--surface2);border-radius:var(--r2);padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--line);animation:fadein .4s var(--ease) both;cursor:pointer}
.opt.best{border-left-color:var(--green);background:rgba(46,230,166,.08)}.opt.bad{border-left-color:var(--red);opacity:.8}.opt.on{outline:2px solid var(--bills)}
.opt .t{font-weight:800;display:flex;justify-content:space-between;gap:8px}.opt .c{font-size:12px;color:var(--muted)}
.opt .k{font-family:var(--mono);font-size:11px;font-weight:700}
.plan{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.plan:last-child{border-bottom:0}
.plan .bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}.plan .bar i{display:block;height:100%;background:var(--g-free);width:0;transition:width .8s var(--ease)}

nav{display:flex;align-items:stretch;background:var(--surface);box-shadow:0 -1px 0 var(--line),0 -10px 30px rgba(0,0,0,.18);padding-bottom:max(0px,calc(env(safe-area-inset-bottom,0px) - 14px));border-top:1px solid var(--line);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav button{flex:1;padding-block:6px 0;font-size:10px;letter-spacing:.04em;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:2px;position:relative;font-weight:700;min-height:48px;transition:color .2s,transform .2s}nav button svg{transition:transform .25s var(--spring)}nav button[aria-selected="true"] svg{transform:translateY(-2px) scale(1.08);color:var(--bills)}nav button:active svg{transform:scale(.9)}
nav button[aria-selected="true"]{color:var(--fg)}nav button[aria-selected="true"] svg{background:var(--surface2);border-radius:10px;padding:4px;box-sizing:content-box;color:var(--bills)}nav button{color:color-mix(in srgb,var(--fg) 62%,transparent)}
.navstat{flex:0 0 auto;min-width:84px;margin:6px 0 6px 4px;padding:6px 10px;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:1px;font-family:var(--mono);color:var(--fg);animation:none}.navstat b{font-size:14px;font-weight:800;color:var(--green)}.navstat b.amber{color:var(--amber)}.navstat b.red{color:var(--red)}.navstat span{font-size:10px;color:var(--muted);letter-spacing:.04em;line-height:1.25;text-align:right}
nav button i{display:block;width:22px;height:4px;border-radius:2px;background:transparent;transition:background .2s}
nav button[aria-selected="true"] i{background:var(--bills)}
nav .badge{position:absolute;top:2px;right:18%;background:var(--bills);color:#fff;font-family:var(--mono);font-size:9px;border-radius:999px;padding:1px 5px}


/* debts + plan variants */
.kl{display:flex;flex-direction:column;gap:6px}
.kli{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface2);border-radius:var(--r2);animation:txin .4s var(--ease) both}
.kli .nm{font-weight:800}.kli .m{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:700}
.kli.next{outline:1px solid var(--fg)}#v-debts{--red:var(--muted);--amber:var(--muted);--bills:var(--muted);--checking:var(--muted);--violet:var(--muted);--g-red:var(--muted);--g-amber:var(--muted)}#v-debts .grad{background:none;color:var(--fg);-webkit-text-fill-color:currentColor}#v-debts .card{animation:none}.kli.dead .nm{text-decoration:line-through;color:var(--muted)}
.kli .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.kli.dead .chk{background:var(--green);border-color:var(--green);color:#06251c}
.ladder{position:relative;padding-left:40px;display:flex;flex-direction:column;gap:14px}
.ladder::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:4px;background:var(--line);border-radius:2px}
.rung{position:relative;background:var(--surface2);border-radius:var(--r2);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;animation:fadein .4s var(--ease) both}
.rung::before{content:"";position:absolute;left:-32px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--surface2);border:3px solid var(--line);transform:translateY(-50%)}
.rung.you::before{background:var(--green);border-color:var(--green);box-shadow:0 0 14px var(--green)}
.rung.dead{opacity:.55}.rung.dead::before{background:var(--line)}
.rung.top{background:var(--g-free);color:#06251c}
.clock{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.04em;text-align:center}
.clock small{font-size:11px;color:var(--muted);display:block;letter-spacing:.14em}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rg{display:flex;flex-direction:column;align-items:center;gap:4px}
.rg .r{width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--checking) var(--p,0%),var(--line) 0);position:relative;display:grid;place-items:center}
.rg .r::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.rg .r span{position:relative;font-family:var(--mono);font-size:11px;font-weight:700}
.rg .n{font-size:11px;font-weight:700}
.leak{position:relative;height:150px;background:var(--surface2);border-radius:var(--r2);overflow:hidden}
.leak .src{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--red)}
.leak .drop{position:absolute;top:30px;width:6px;height:10px;border-radius:50% 50% 60% 60%;background:var(--red);animation:dropf 1.4s linear infinite}
@keyframes dropf{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(120px);opacity:0}}
.leak .pool{position:absolute;left:0;right:0;bottom:0;height:18px;background:var(--red);opacity:.5}
.tug{position:relative;height:60px;margin:10px 0}
.tug .rope{position:absolute;left:0;right:0;top:50%;border-top:3px dashed var(--line)}
.tug .mark{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--fg);transform:translate(-50%,-50%);transition:left .8s var(--spring);box-shadow:0 0 14px var(--fg)}
.tug .side{position:absolute;top:0;font-family:var(--mono);font-size:10px;font-weight:700}
.grave{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}
.stone{background:var(--surface2);border-radius:40px 40px 6px 6px;padding:18px 8px 10px;text-align:center;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);animation:pop .4s var(--spring) both;transform:scale(.8);opacity:0}
.stone.alive{background:transparent;border-style:dashed}
.stone .n{font-size:11px;font-weight:800}.stone .m{font-family:var(--mono);font-size:9px;color:var(--muted);font-weight:700}
.wf{display:flex;gap:6px;align-items:flex-end;height:160px}
.wf .wc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wf .wb{width:100%;border-radius:6px 6px 0 0;background:var(--checking);transition:height .9s var(--ease);position:relative}
.wf .pour{position:absolute;right:-6px;top:-8px;width:6px;height:0;background:var(--green);border-radius:3px;animation:pour 2s ease-in-out infinite}
@keyframes pour{0%,20%{height:0}60%,100%{height:40px}}
.wf .n{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--muted);text-align:center}
.cal24{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.cal24 .c{aspect-ratio:1;border-radius:4px;background:var(--surface2);font-family:var(--mono);font-size:8px;display:grid;place-items:center;color:var(--muted);position:relative}
.cal24 .c.kill{background:var(--green);color:#06251c;font-weight:700}
.cal24 .c.now{outline:2px solid var(--fg)}
.wiz{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.wiz .q{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.wiz .steps{display:flex;gap:4px}.wiz .steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.wiz .steps i.on{background:var(--bills)}
.splitbar{display:flex;height:34px;border-radius:999px;overflow:hidden;background:var(--surface2)}
.splitbar i{display:block;height:100%;transition:width .4s var(--ease);min-width:0}
.srcrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.srcrow .pm{width:34px;height:34px;border-radius:10px;background:var(--surface2);font-weight:800;font-size:16px}
.runwayp{position:relative;height:90px;margin:14px 0 6px}
.runwayp .tr{position:absolute;left:0;right:0;top:40px;height:14px;border-radius:999px;background:var(--surface2);overflow:hidden}
.runwayp .tr i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width 1.2s var(--ease)}
.runwayp .tick{position:absolute;top:30px;width:2px;height:34px;background:var(--line)}
.runwayp .tick span{position:absolute;top:36px;left:-14px;font-family:var(--mono);font-size:8px;color:var(--muted);width:30px;text-align:center}
.runwayp .flag{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:9px;font-weight:700;white-space:nowrap}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:85%;padding:10px 12px;border-radius:16px;font-size:14px;animation:fadein .4s var(--ease) both}
.bub.app{background:var(--surface2);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--bills);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.swipecard{background:var(--surface2);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:var(--shadow);animation:pop .4s var(--spring) both;transform:scale(.9);opacity:0}
.swipecard .t{font-family:var(--display);font-size:22px;font-weight:800}
.jar{width:140px;height:170px;margin:0 auto;border:3px solid var(--line);border-top:0;border-radius:0 0 40px 40px;position:relative;overflow:hidden;background:var(--surface2)}
.jar .lay{position:absolute;left:0;right:0;height:0;transition:height 1s var(--ease)}
.jar .lab{position:absolute;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9px;font-weight:700;color:#06251c}
.ptable{display:grid;grid-template-columns:minmax(0,1.2fr) auto auto;gap:4px 10px;font-size:12px}
.ptable .h{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}
.ptable span{padding:6px 0;border-bottom:1px solid var(--line)}
.tree{display:flex;flex-direction:column;gap:10px}
.node{background:var(--surface2);border-radius:var(--r2);padding:12px;display:flex;flex-direction:column;gap:8px;animation:fadein .4s var(--ease) both}
.node .qq{font-weight:800}
.node.leaf{background:rgba(46,230,166,.12);outline:2px solid var(--green)}
/* neon colorways + cyberpunk effects */
:root[data-skin="neon"][data-neon="acid"]{--bills:#c7ff3d;--savings:#3dff8a;--checking:#ffe93d;--violet:#8dff5a;--red:#ff4d6d;--g-free:linear-gradient(90deg,#3dff8a,#c7ff3d);--shadow:0 12px 40px rgba(199,255,61,.18)}
:root[data-skin="neon"][data-neon="blood"]{--bills:#ff6a3d;--savings:#ffb13d;--checking:#ffd23f;--violet:#ff3d6a;--red:#ff2d55;--green:#ffb13d;--g-free:linear-gradient(90deg,#ffb13d,#ff6a3d);--shadow:0 12px 40px rgba(255,61,106,.22);--bg:#120508;--surface:#1e0a10;--surface2:#2a0f18}
:root[data-skin="neon"][data-neon="ice"]{--bills:#7fe9ff;--savings:#b8f5ff;--checking:#e0f7ff;--violet:#8aa6ff;--red:#ff5c9a;--green:#b8f5ff;--g-free:linear-gradient(90deg,#7fe9ff,#ffffff);--shadow:0 12px 40px rgba(127,233,255,.2);--bg:#050a14;--surface:#0b1424;--surface2:#122036}
:root[data-skin="neon"][data-neon="cyan"]{--bills:#3bd6ff;--violet:#c04dff;--g-free:linear-gradient(90deg,#3dffb0,#3bd6ff)}
:root[data-skin="neon"][data-neon="magenta"]{--bills:#ff4fd8;--savings:#3dffb0;--checking:#ffd23f;--violet:#ff2d95;--g-free:linear-gradient(90deg,#3dffb0,#ff4fd8);--shadow:0 12px 40px rgba(255,79,216,.25)}
:root[data-fx~="grid"] main{background-image:linear-gradient(rgba(192,77,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(192,77,255,.08) 1px,transparent 1px);background-size:28px 28px;background-position:center bottom}
:root[data-fx~="glitch"] header .wm{position:relative;animation:glitch 4s steps(1) infinite}
:root[data-fx~="glitch"] header .wm::before,:root[data-fx~="glitch"] header .wm::after{content:attr(data-t);position:absolute;left:0;top:0;opacity:.7;pointer-events:none}
:root[data-fx~="glitch"] header .wm::before{color:var(--bills);transform:translate(-2px,0);clip-path:inset(0 0 55% 0);animation:gl1 3s steps(1) infinite}
:root[data-fx~="glitch"] header .wm::after{color:var(--violet);transform:translate(2px,0);clip-path:inset(55% 0 0 0);animation:gl2 2.7s steps(1) infinite}
@keyframes glitch{0%,94%,100%{transform:none}95%{transform:translate(1px,-1px)}97%{transform:translate(-1px,1px)}}
@keyframes gl1{0%,90%,100%{opacity:0}92%,96%{opacity:.7}}
@keyframes gl2{0%,88%,100%{opacity:0}90%,94%{opacity:.7}}
:root[data-fx~="brackets"] .card{position:relative}
:root[data-fx~="brackets"] .card::before,:root[data-fx~="brackets"] .card::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--bills);pointer-events:none;opacity:.8}
:root[data-fx~="brackets"] .card::before{left:6px;top:6px;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
:root[data-fx~="brackets"] .card::after{right:6px;bottom:6px;border-left:0;border-top:0;border-radius:0 0 4px 0}
:root[data-fx~="pulse"] .card{box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.04);animation:cardpulse 6s ease-in-out infinite}
@keyframes cardpulse{50%{box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.12),0 0 30px rgba(192,77,255,.12)}}
:root[data-fx~="chroma"] .big,:root[data-fx~="chroma"] .amt{text-shadow:-2px 0 rgba(61,214,255,.6),2px 0 rgba(255,79,216,.6),0 0 18px rgba(61,255,176,.35)}
.fxrow{display:flex;flex-wrap:wrap;gap:6px}

:root[data-look="aurora"] body::after{content:"";position:fixed;inset:-40%;background:conic-gradient(from 180deg at 50% 50%,#c04dff,#3bd6ff,#3dffb0,#ff4fd8,#c04dff);filter:blur(70px);opacity:.42;z-index:-1;animation:lookspin 24s linear infinite;pointer-events:none}

.skins{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.skin{border-radius:14px;padding:12px;display:flex;flex-direction:column;gap:6px;text-align:left;border:2px solid transparent}

<body>
<div id="app">

</div>
<script>
(function(){
'use strict';
// ============================================================
// Am I Green — the app. Reads the vault through the GitHub API.
// Data in: data/ledger.json (courier). Decisions out: config/*.json, data/tags.json, data/state.json.
// ============================================================
const BUILD='build 56';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>(n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const fmt2=n=>(n<0?'−':'')+'$'+Math.abs(n).toFixed(2);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ds=x=>MON[x.getMonth()]+' '+x.getDate();
const dsh=x=>(x.getMonth()+1)+'/'+x.getDate();
const dow=x=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][x.getDay()];
const days=(a,b)=>Math.round((b-a)/86400000);
const addDays=(x,n)=>{const y=new Date(x);y.setDate(y.getDate()+n);return y;};
const same=(a,b)=>a.toDateString()===b.toDateString();
const midnight=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
const parseISO=s=>{if(!s)return null;const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d);};
const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
const lastDay=(y,m)=>new Date(y,m+1,0).getDate();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const qs=new URLSearchParams(location.search);
let TODAY=qs.get('today')?parseISO(qs.get('today')):midnight(new Date());

// ---------- diagnostics: every stage logs; the log is readable in Settings ----------
const LOG=[];function log(stage,msg,extra){const line={at:new Date().toISOString().slice(11,19),stage,msg,extra};LOG.push(line);if(LOG.length>200)LOG.shift();console.log(`[${line.at}] ${stage}: ${msg}`,extra||'');}
function fail(stage,expected,got,evidence){const e=new Error(`${stage}: expected ${expected}, got ${got}`);e.evidence=evidence;log(stage,`FAIL expected ${expected}, got ${got}`,evidence);return e;}

// ---------- alt views & toast ----------
let alt={flow:0,buckets:0,deck:1};
try{const s=localStorage.getItem('aig-alt6');if(s)alt=Object.assign(alt,JSON.parse(s));}catch(e){}
function saveAlt(){try{localStorage.setItem('aig-alt6',JSON.stringify(alt));}catch(e){}}
const ALTS={flow:['Ledger','Cards'],buckets:['Tiles','Bars'],deck:['Swipe','List']};
function altBar(page){return `<div class="alts" role="group" aria-label="Layout">${ALTS[page].map((n,i)=>`<button aria-pressed="${alt[page]===i}" data-alt="${page}:${i}">${n}</button>`).join('')}</div>`;}
function wireAlts(root,rerender){root.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>{const [p,i]=b.dataset.alt.split(':');alt[p]=+i;saveAlt();rerender();});}
function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2700);}
function sheet(html,onReady){const host=$('#sheets');host.innerHTML=`<div class="scrim" data-close></div><div class="sheet"><div class="grab" data-close><i></i></div>${html}</div>`;host.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);if(onReady)onReady(host.querySelector('.sheet'));}
function closeSheet(){$('#sheets').innerHTML='';}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ============================================================
// GITHUB VAULT
// ============================================================
let cfg={owner:'',repo:'vault',branch:'main',token:'',workflow:'courier.yml'};
try{const s=localStorage.getItem('aig-cfg');if(s)cfg=Object.assign(cfg,JSON.parse(s));}catch(e){}
function saveCfg(){try{localStorage.setItem('aig-cfg',JSON.stringify(cfg));}catch(e){}}
const SHAS={};
const gh={
  hdr(){return {'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};},
  url(path){return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}?ref=${cfg.branch}`;},
  async read(path,optional){const t0=performance.now();const r=await fetch(this.url(path),{headers:{...this.hdr(),'Accept':'application/vnd.github.raw+json'},cache:'no-store'});if(r.status===404&&optional){log('read',`${path} absent (ok)`);delete SHAS[path];return null;}if(!r.ok){const body=await r.text();throw fail('read',`200 for ${path}`,`HTTP ${r.status}`,{path,body:body.slice(0,400)});}const text=await r.text();delete SHAS[path];log('read',`${path}`,{bytes:text.length,ms:Math.round(performance.now()-t0)});try{return JSON.parse(text);}catch(e){throw fail('read',`valid JSON in ${path}`,e.message,{head:text.slice(0,200)});}},
  async write(path,obj,msg){const content=btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,1))));if(!SHAS[path]){const sh=await this.sha(path);if(sh)SHAS[path]=sh;}const put=async()=>fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`,{method:'PUT',headers:this.hdr(),body:JSON.stringify(Object.assign({message:msg,content,branch:cfg.branch},SHAS[path]?{sha:SHAS[path]}:{}))});let r=await put();if(r.status===409||r.status===422){log('write',`${path} conflict, refetching sha`);const sh=await this.sha(path);if(sh)SHAS[path]=sh;else delete SHAS[path];r=await put();}if(!r.ok){const body=await r.text();throw fail('write',`2xx for ${path}`,`HTTP ${r.status}`,{path,body:body.slice(0,400)});}const j=await r.json();SHAS[path]=j.content.sha;log('write',`${path}`,{sha:j.content.sha.slice(0,7)});},
  async dispatch(){const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/actions/workflows/${cfg.workflow}/dispatches`,{method:'POST',headers:this.hdr(),body:JSON.stringify({ref:cfg.branch,inputs:{refresh:'true'}})});if(r.status!==204){const body=await r.text();throw fail('dispatch','204',`HTTP ${r.status}`,{body:body.slice(0,400)});}log('dispatch','courier asked to run');},
  async sha(path){const r=await fetch(this.url(path),{headers:{...this.hdr(),'Accept':'application/vnd.github.object+json'},cache:'no-store'});if(!r.ok)return null;const j=await r.json();return j.sha;}
};
const pending={};let persistTimer=null;
function persist(path,obj,msg){pending[path]={obj,msg};clearTimeout(persistTimer);persistTimer=setTimeout(flush,900);}
async function flush(){const jobs=Object.entries(pending);for(const [p] of jobs)delete pending[p];for(const [path,{obj,msg}] of jobs){try{await gh.write(path,obj,msg);}catch(e){if(!pending[path])pending[path]={obj,msg};toast(`<b>Save failed</b> · ${esc(path)} · will retry`);}}}
window.addEventListener('pagehide',()=>{if(Object.keys(pending).length)flush();});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&Object.keys(pending).length)flush();});

// ============================================================
// STATE
// ============================================================
let CONF=null,RULES=[],TAGS={},ACCTS={},LEDGER=null,STATE={};
let BUCKETS=[],txns=[],BAL={checking:0,bills:0,savings:0},DEBTS=[],NEXTPAY=null,PETTY=null,WIN=null,RELAY=null,CRUSH=0,CHECK_BILLS=0,CUSH_CAP=250,STASH=0;
let tagged=0,combo=0,extraBy=[],focusDebt=0,openBucket=null;
const bk=id=>BUCKETS.find(b=>b.id===id);const bname=id=>(bk(id)||{n:id||'—'}).n;const bemo=id=>(bk(id)||{e:''}).e;const bcol=id=>(bk(id)||{c:'var(--muted)'}).c;
const laneDefault={checking:'petty',bills:'rent',savings:'lake'};

async function loadAll(){
  if(!cfg.token||!cfg.owner){renderSetup('Connect the vault to begin.');return;}
  const quiet=!!LEDGER;if(quiet)$('#syncPill').textContent='reading…';else renderSetup('Reading the vault…');
  try{
    const [conf,rules,tags,accts,ledger,state]=await Promise.all([gh.read('config/buckets.json'),gh.read('config/rules.json',true),gh.read('data/tags.json',true),gh.read('config/accounts.json',true),gh.read('data/ledger.json',true),gh.read('data/state.json',true)]);
    CONF=conf;RULES=rules||[];TAGS=tags||{};ACCTS=accts||{};LEDGER=ledger;STATE=state||{};
    if(!CONF||!Array.isArray(CONF.buckets))throw fail('load','buckets.json with a buckets[] array',typeof CONF,{keys:CONF?Object.keys(CONF):null});
    if(!LEDGER){renderSetup('No ledger yet. Run the courier once (Actions → courier → Run workflow), then pull to refresh.',true);return;}
    const unmapped=(LEDGER.accounts||[]).filter(a=>!(a.account_id in ACCTS));
    if(unmapped.length){renderSetup(`${unmapped.length} account${unmapped.length===1?'':'s'} need a lane.`,true);openAccounts();return;}
    rebuild();if($('#sheets').children.length||!$('#deck').hidden||!$('#acct').hidden)views[currentTab()]();else show(currentTab());
    $('#syncPill').textContent='synced '+syncLabel();
  }catch(e){if(quiet){$('#syncPill').textContent='synced '+syncLabel();toast('Could not reach the vault · showing what I had');}else renderSetup('Could not read the vault: '+esc(e.message),true);}
}
function syncLabel(){if(!LEDGER||!LEDGER.generated_at)return '—';const t=new Date(LEDGER.generated_at);const h=t.getHours()%12||12,m=String(t.getMinutes()).padStart(2,'0');return same(t,new Date())?`${h}:${m}${t.getHours()<12?'a':'p'}`:`${ds(t)} ${h}:${m}${t.getHours()<12?'a':'p'}`;}

// ---------- rebuild: ledger + config → the model every screen reads ----------
function nextPayAfter(x){const dsx=CONF.income.days.slice().sort((a,b)=>a-b);for(let k=0;k<3;k++){const y=x.getFullYear(),m=x.getMonth()+k;for(const dd of dsx){const c=new Date(y,m,Math.min(dd,lastDay(y,m)));if(c>x)return c;}}return addDays(x,15);}
function isPaydayDate(x){return CONF.income.days.includes(x.getDate());}
function rebuild(){
  const t0=performance.now();
  BUCKETS=CONF.buckets.slice();
  for(const [id,n,e,c,lane] of [['petty','Petty','🛒','#f5b942','checking'],['stash','Stash','🧦','#2ee6a6','checking'],['float','Relay','🔁','#8e9bb3','checking'],['lake','War chest','🛡️','#3dffb0','savings'],['transfer','Transfer','↔️','#6d6d80','*'],['ghost','Dispute','👻','#ff3d8a','*']])if(!bk(id))BUCKETS.push({id,n,e,c,lane,target:0,lines:[]});
  RELAY=CONF.relay||{amt:0};CRUSH=RELAY.amt||0;CHECK_BILLS=CONF.income.split.bills;CUSH_CAP=CONF.cushionCap||250;
  NEXTPAY=nextPayAfter(TODAY);
  const y=TODAY.getFullYear(),m=TODAY.getMonth(),dd=TODAY.getDate();
  PETTY={allot:CONF.petty,start:dd<=15?new Date(y,m,1):new Date(y,m,16),end:dd<=15?new Date(y,m,15):new Date(y,m,lastDay(y,m))};
  TAG_FROM=parseISO(CONF.tagSince)||new Date(y,m,1);MONTH_FROM=new Date(y,m,1);WIN={from:new Date(y,m-6,1),to:addDays(NEXTPAY,7)>addDays(TODAY,21)?addDays(NEXTPAY,7):addDays(TODAY,21)};
  // lanes & balances
  const laneOf=id=>ACCTS[id];
  const acctLane={};(LEDGER.accounts||[]).forEach(a=>{acctLane[a.account_id]=laneOf(a.account_id);});
  const cur={checking:0,bills:0,savings:0};(LEDGER.accounts||[]).forEach(a=>{const l=acctLane[a.account_id];if(cur[l]!==undefined)cur[l]+=(a.current==null?(a.available||0):a.current);});
  // transactions
  const lines=[];BUCKETS.forEach(b=>(b.lines||[]).forEach(l=>lines.push({...l,b:b.id,lane:l.lane||b.lane})));
  const lineByKey=Object.fromEntries(lines.map(l=>[l.key,l]));
  const pendAdj={checking:0,bills:0,savings:0};
  txns=[];
  (LEDGER.transactions||[]).forEach(p=>{const lane=acctLane[p.account_id];if(!['checking','bills','savings'].includes(lane))return;const date=parseISO(p.date);if(!date)return;const a=-(p.amount||0);const vkey=String(p.merchant_name||p.name||'').toLowerCase().replace(/\d{2}\/\d{2}/g,'').replace(/[^a-z]/g,'').slice(0,14);const tg0=TAGS[p.id]||{};const base={id:p.id,date,n:(tg0.name&&tg0.name.trim())||p.merchant_name||p.name||'?',n0:p.merchant_name||p.name||'?',meta:Array.isArray(tg0.meta)?tg0.meta:[],raw:p.name,a,lane,st:'posted',pend:!!p.pending,pfc:p.pfc_primary,vkey};
    if(p.pending)pendAdj[lane]+=a;
    const tg=TAGS[p.id];
    if(tg&&tg.split){tg.split.forEach((s,k)=>txns.push({...base,id:p.id+'#'+k,n:base.n+' · '+s.n,a:s.a,b:s.b,t:s.t||s.n.toLowerCase(),split:true,exp:lineByKey[s.t]?lineByKey[s.t].amount:undefined}));return;}
    let b=tg?tg.b:null,t=tg?tg.t:null;if(b==='petty'&&(t==='transportation'||t==='rides'))t='transit';
    if(!b){const r=matchRule(base);if(r){if(r.b==='*income*'){b=laneDefault[lane];t='income';}else{b=r.b;t=r.t;}}}
    if(!b&&a>0&&CONF.income.match.some(k=>(p.name||'').toLowerCase().includes(k))){b=laneDefault[lane];t='income';}
    const line=t?lineByKey[t]:null;const exp=line?Math.abs(line.amount):undefined;
    txns.push({...base,b,t,exp,ghost:b==='ghost'});});
  BAL={checking:cur.checking+pendAdj.checking,bills:cur.bills+pendAdj.bills,savings:cur.savings+pendAdj.savings};
  // planned: lines → due dates in (TODAY, WIN.to]
  const postedKeys=txns.filter(t=>t.t&&t.st==='posted');
  const covered=(key,due)=>postedKeys.some(t=>t.t===key&&Math.abs(days(t.date,due))<=8);
  let pid=0;
  LINES=lines;
  lines.forEach(l=>{const until=l.until?parseISO(l.until):null;const dues=lineDues(l,WIN.to);
    dues.forEach(x=>{if(until&&x>until)return;if(!l.amount)return;if(covered(l.key,x))return;txns.push({id:'p'+(pid++),date:x,n:l.n,a:-l.amount,lane:l.lane,st:'planned',b:l.b,t:l.key,exp:Math.abs(l.amount),est:!!l.estimate});});});
  // planned: paychecks
  for(let x=addDays(TODAY,1);x<=WIN.to;x=addDays(x,1)){if(isPaydayDate(x)&&!txns.some(t=>t.t==='income'&&t.st==='posted'&&Math.abs(days(t.date,x))<=2&&t.date>TODAY)){Object.entries(CONF.income.split).forEach(([lane,amt])=>txns.push({id:'p'+(pid++),date:x,n:'Paycheck',a:amt,lane,st:'planned',b:laneDefault[lane],t:'income'}));}}
  // planned: the rest of this half's petty, on the last day of the half
  {const ps=pettyState();Object.entries(ps.left).forEach(([k,left])=>{if(left>0&&PETTY.end>TODAY)txns.push({id:'p'+(pid++),date:PETTY.end,n:'Petty · '+k+' (rest of half)',a:-left,lane:'checking',st:'planned',b:'petty',t:k});});}
  txns.sort((a,b)=>a.date-b.date||String(a.id).localeCompare(String(b.id)));
  computeFills();

function wireScrub(root){root.querySelectorAll('.lane svg.linechart').forEach(svg=>{const lane=svg.closest('.lane').dataset.lane;const S=SCRUB[lane];if(!S)return;const out=root.querySelector(`.scrubout[data-scrub="${lane}"]`);const n=S.pts.length;let ln=svg.querySelector('.sl'),dot=svg.querySelector('.sd');const W=320,H=S.H||120,T=S.T||18,Bm=S.B||14;const X=k=>k/(n-1)*W;const Y=val=>H-Bm-((val-S.mn)/(S.mx-S.mn||1))*(H-T-Bm);const move=e=>{const r=svg.getBoundingClientRect();const k=Math.max(0,Math.min(n-1,Math.round((e.clientX-r.left)/r.width*(n-1))));ln.setAttribute('x1',X(k));ln.setAttribute('x2',X(k));dot.setAttribute('cx',X(k));dot.setAttribute('cy',Y(S.pts[k]));ln.style.opacity=1;dot.style.opacity=1;const d=S.dates[k];const items=txns.filter(t=>t.lane===lane&&same(t.date,d)).slice(0,2).map(t=>esc(t.n)+' '+fmt(t.a)).join(' · ');out.innerHTML=`<span class="muted">${dow(d)} ${ds(d)}${d>TODAY?' · planned':''}${items?' · '+items:''}</span><b>${fmt(S.pts[k])}</b>`;};let moved=false,x0=0;svg.addEventListener('pointerdown',e=>{e.stopPropagation();svg.setPointerCapture(e.pointerId);svg.dataset.drag='1';moved=false;x0=e.clientX;move(e);});svg.addEventListener('pointermove',e=>{if(svg.dataset.drag){if(Math.abs(e.clientX-x0)>6)moved=true;move(e);}});const end=e=>{const was=svg.dataset.drag;delete svg.dataset.drag;if(was&&!moved&&e&&e.target&&e.target.classList&&e.target.classList.contains('mv'))openDay(new Date(e.target.dataset.day));};svg.addEventListener('pointerup',end);svg.addEventListener('pointercancel',end);svg.addEventListener('click',e=>e.stopPropagation());});}

function upcomingHTML(x,map){const end=NEXTPAY>x?NEXTPAY:addDays(x,14);const from=x>TODAY?x:TODAY;const list=txns.filter(t=>t.st==='planned'&&t.date>x&&t.date<=end&&!(t.b==='petty'&&t.t!=='income')).sort((a,b)=>a.date-b.date);const lanes=['checking','bills'];

let deckQueue=[],cur=null,deckReturn='buckets',pickedSub=null,qscope='untagged';
function queueFor(){if(qscope==='untagged')return untagged();const all=txns.filter(t=>t.st==='posted'&&!t.split);return (qscope==='month'?all.filter(t=>t.date>=MONTH_FROM):all).sort((a,b)=>b.date-a.date);}
function openDeck(ret){deckReturn=ret||'buckets';deckQueue=queueFor();combo=0;$('#deck').hidden=false;renderCard();}
function closeDeck(){$('#deck').hidden=true;show(deckReturn);}
function pettyTags(){return CONF.pettyTags||Object.keys(CONF.petty);}
function halfOf(d){const y=d.getFullYear(),m=d.getMonth(),dd=d.getDate();return dd<=15?{start:new Date(y,m,1),end:new Date(y,m,15),key:`${y}-${m+1}a`}:{start:new Date(y,m,16),end:new Date(y,m,lastDay(y,m)),key:`${y}-${m+1}b`};}
function prevHalf(){return halfOf(addDays(PETTY.start,-1));}
function ridesCap(){const T=CONF.transit;if(!T)return CONF.ridesCap||0;const line=(CONF.petty||{}).transit||0;const bus=(T.busDaysPerHalf||0)*(T.busRT||0);return Math.max(0,Math.floor((line-bus)/(T.avgRide||14)));}
function rollsCap(){const F=CONF.film;if(!F)return 0;const line=(CONF.petty||{}).film||0;return Math.max(0,Math.floor((line-(F.tripsPerHalf||1)*(F.trip||0))/(F.roll||20)));}
function ridesIn(h){const list=txns.filter(t=>t.st==='posted'&&t.b==='petty'&&(t.t==='transit'||t.t==='rides')&&/lyft|uber/.test(t.vkey||'')&&t.a<0&&t.date>=h.start&&t.date<=h.end);return {n:list.length,amt:list.reduce((s,t)=>s-t.a,0),cap:ridesCap()};}
function pettyIn(h){const spent={};pettyTags().forEach(k=>spent[k]=0);txns.filter(t=>t.st==='posted'&&t.b==='petty'&&t.a<0&&t.date>=h.start&&t.date<=h.end).forEach(t=>{const k=spent[t.t]!==undefined?t.t:'other';spent[k]+=-t.a;});const allot=Object.values(CONF.petty).reduce((a,b)=>a+b,0),tot=Object.values(spent).reduce((a,b)=>a+b,0);return {spent,allot,tot,under:allot-tot};}

function monthsUntil(isoDate){const u=parseISO(isoDate);if(!u)return Infinity;return Math.max(0,(u.getFullYear()-TODAY.getFullYear())*12+(u.getMonth()-TODAY.getMonth())+(u.getDate()>=TODAY.getDate()?0:-0));}
function debtCalc(){return DEBTS.map((dd,i)=>{const fixed=!!(dd.settle&&dd.until);const planned=txns.filter(t=>t.st==='planned'&&t.b===dd.id&&t.a<0&&LINES.some(l=>l.key===t.t&&l.once)).reduce((s,t)=>s-t.a,0);const bal=Math.max(0,dd.bal-planned);const a=fixed?{m:monthsUntil(dd.until),int:0}:amort(bal,dd.apr,dd.pay+(extraBy[i]||0)),a0=fixed?{m:monthsUntil(dd.until),int:0}:amort(bal,dd.apr,dd.pay);dd={...dd,bal,payoff:planned};if(fixed)extraBy[i]=0;return {...dd,a,a0,pct:dd.orig?(1-dd.bal/dd.orig)*100:0,diff:dd.stmt-dd.bal,i};});}
function renderDebts(quiet){quiet=true;
  const v=$('#v-debts');if(!LEDGER){v.innerHTML='';return;}const calc=debtCalc();const total=DEBTS.reduce((s,dd)=>s+dd.bal,0);const bad=calc.filter(x=>Math.abs(x.diff)>1);const priced=calc.filter(c=>isFinite(c.a.m));const freeM=priced.length?Math.max(...priced.map(c=>c.a.m)):Infinity;const extraTot=extraBy.reduce((s,x)=>s+x,0);
  const discRows=i=>{const dd=calc[i];return `<div class="disc ${Math.abs(dd.diff)>1?'bad':'ok'}"><span>${Math.abs(dd.diff)>1?'<b>Statement disagrees</b> by '+fmt(dd.diff)+'. A payment not credited?':'Statement agrees ✓'}</span><label class="row" style="gap:6px;font-size:11px;color:var(--muted)">stmt <input type="number" inputmode="decimal" value="${dd.stmt}" data-d="${i}" class="stmt" aria-label="Statement balance"></label></div>${Math.abs(dd.diff)>1?`<div class="row"><button class="btn small" data-call="${i}">Log a call</button><button class="btn small ghost" data-fix="${i}">It's right, update mine</button></div>`:''}`;};
  let html=`<div class="card row"><div><div class="eyebrow">you owe</div><div class="big" style="color:var(--fg)">${fmt(total)}</div></div><div style="text-align:right"><div class="eyebrow">debt-free</div><div class="mono c-green" style="font-size:18px;font-weight:700">${monthStr(freeM)}</div><div class="muted mono" style="font-size:10px">${extraTot?'with +'+fmt(extraTot)+'/mo extra':'as planned'}</div></div></div>`;
  html+=`<div class="card"><div class="row"><h2>Kill list</h2><span class="muted" style="font-size:12px">tap one for its clock</span></div><div class="kl" style="margin-top:10px">${calc.map((dd,i)=>`<div class="kli ${i===focusDebt?'next':''} ${dd.bal<=0?'dead':''}" data-debt="${i}" role="button" tabindex="0" style="animation-delay:${i*70}ms;cursor:pointer"><span class="chk">${dd.bal<=0?'✓':i+1}</span><div><div class="nm">${esc(dd.n)}${dd.settle?' <span class="muted" style="font-weight:500">· settlement</span>':''}${dd.live?' <span class="tag c-green">live</span>':''}</div><div class="m">${fmt(dd.bal)} · ${dd.apr?Math.round(dd.apr*1000)/10+'%':'0%'} · ${dd.pay?fmt(dd.pay):(dd.unpriced?'unpriced':dd.forbearance?'$0 forbearance':'$0')}${extraBy[i]?'<b class="c-green">+'+extraBy[i]+'</b>':''}${dd.pay?'/mo':''}</div></div><div class="m ${extraBy[i]?'c-green':''}" style="text-align:right">${dd.settle&&dd.until?'ends<br>'+monthStr(dd.a.m):isFinite(dd.a.m)?'dead<br>'+monthStr(dd.a.m):'—'}</div></div>`).join('')}</div></div>`;
  if(bad.length)html+=`<div class="card stack"><h2>Statement disagrees</h2>${bad.map(x=>`<div style="font-weight:700">${esc(x.n)}</div>`+discRows(x.i)).join('')}</div>`;
  {const f=calc[focusDebt];if(f){const ex=extraBy[focusDebt]||0;const saved=isFinite(f.a0.m)&&isFinite(f.a.m)?f.a0.m-f.a.m:0;const intSaved=f.a0.int-f.a.int;const perDay=f.apr?f.bal*f.apr/365:0;html+=`<div class="card stack dfocus" id="dfocus"><div class="row"><div><div class="eyebrow">payoff clock</div><h2>${esc(f.n)}</h2></div><div style="text-align:right"><div class="muted mono" style="font-size:10px">as planned</div><div class="mono" style="font-size:16px;font-weight:700;${ex?'text-decoration:line-through;color:var(--muted)':''}">${monthStr(f.a0.m)}</div></div></div>${f.settle&&f.until?`<div class="clockrow"><div><div class="eyebrow">ends</div><div class="big">${f.a.m}</div><div class="muted">months · ${monthStr(f.a.m)} · ${fmt(f.pay)} a month, fixed</div></div></div><div class="muted" style="font-size:13px">Settlement terms. The schedule is the schedule; paying extra doesn't shorten it. When it ends, ${fmt(f.pay)} a month comes free for the next debt on the list.</div>`:f.pay>0?`<div class="clockrow"><div><div class="eyebrow">${ex?'with +'+fmt(ex)+'/mo':'dies in'}</div><div class="big ${ex?'grad':''}" data-count="${f.a.m}" data-plain="1">${f.a.m}</div><div class="muted">months · ${monthStr(f.a.m)}</div></div><div class="gain ${ex?'on':''}"><div class="eyebrow c-green">you get back</div><div class="mono c-green" style="font-size:22px;font-weight:700">${saved} mo</div><div class="mono c-green" style="font-size:13px;font-weight:700">${fmt(intSaved)} interest</div></div></div><div class="row"><span style="font-weight:700">Extra toward principal</span><span class="mono c-amber" style="font-weight:700">+${fmt(ex)}/mo</span></div><input type="range" id="extra" min="0" max="400" step="25" value="${ex}" aria-label="Extra per month toward ${esc(f.n)}"><div class="row muted" style="font-size:12px"><span>${fmt(f.pay)} minimum${f.apr?' · '+fmt(f.bal*f.apr/12)+' of it is interest':' · 0%, all principal'}</span><span>${perDay?'$'+perDay.toFixed(2)+' a day in interest':''}</span></div>${ex?`<div class="muted" style="font-size:12px">New payment ${fmt(f.pay+ex)}. ${f.a.m} payments instead of ${f.a0.m}. ${intSaved>0?'The '+fmt(intSaved)+' is money the lender never gets.':'No interest here, so every extra dollar is pure months off.'}</div>`:`<div class="muted" style="font-size:12px">Slide it. The clock moves while you drag.</div>`}`:`<div class="muted" style="font-size:13px">${f.unpriced?'Payment is unpriced. Nothing enters the map until a call prices it (standing rule 10).':f.forbearance?'In forbearance. $0 a month by design; the clock starts when payments do.':'No payment on this one yet.'}</div>`}${f.note?`<div class="muted" style="font-size:12px">${esc(f.note)}</div>`:''}</div>`;}}
  v.innerHTML=html;v.querySelectorAll('[data-count]').forEach(el=>{if(quiet)el.textContent=(el.dataset.plain?String(Math.round(+el.dataset.count)):fmt(+el.dataset.count));else countTo(el,+el.dataset.count,800);});
  const ex=$('#extra');if(ex)ex.oninput=e=>{extraBy[focusDebt]=+e.target.value;const keep=v.scrollTop;renderDebts(true);v.scrollTop=keep;};
  v.querySelectorAll('[data-debt]').forEach(el=>{const go=()=>{focusDebt=+el.dataset.debt;const keep=v.scrollTop;renderDebts(true);v.scrollTop=keep;const fc=$('#dfocus');if(fc)fc.scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest'});};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
  v.querySelectorAll('.stmt').forEach(i=>i.onchange=()=>{const dd=CONF.debts.find(d=>d.id===DEBTS[+i.dataset.d].id);dd.stmt=+i.value;persist('config/buckets.json',CONF,`stmt: ${dd.n}`);rebuild();renderDebts();});
  v.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{const dd=CONF.debts.find(d=>d.id===DEBTS[+b.dataset.fix].id);dd.bal=DEBTS[+b.dataset.fix].stmt;persist('config/buckets.json',CONF,`bal: ${dd.n}`);toast('Updated to the statement');rebuild();renderDebts();});
  v.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>{const dd=DEBTS[+b.dataset.call];sheet(`<h3>Call log · ${esc(dd.n)}</h3><div class="suggest" style="border-left-color:var(--red)"><b>Rep name and reference ID in the first 30 seconds.</b></div><div class="field"><label for="c1">Rep</label><input id="c1" placeholder="name"></div><div class="field"><label for="c2">Ref ID</label><input id="c2" placeholder="id"></div><div class="field"><label for="c3">Said</label><input id="c3" placeholder="what they said"></div><div class="row"><button class="btn primary" id="csave" style="flex:1">Save to the passbook</button></div>`,sh=>{sh.querySelector('#csave').onclick=()=>{STATE.calls=STATE.calls||[];STATE.calls.push({at:iso(TODAY),debt:dd.id,rep:sh.querySelector('#c1').value,ref:sh.querySelector('#c2').value,said:sh.querySelector('#c3').value});persist('data/state.json',STATE,`call: ${dd.n}`);closeSheet();toast('Logged');};});});
}

async function refreshNow(){if(refreshing)return;if(!cfg.token){openSettings();return;}refreshing=true;const pill=$('#syncPill');pill.textContent='asking…';try{const before=await gh.sha('data/ledger.json');await gh.dispatch();pill.textContent='refreshing…';toast('Courier running · <b>about a minute</b>');const t0=Date.now();while(Date.now()-t0<240000){await new Promise(r=>setTimeout(r,10000));const now=await gh.sha('data/ledger.json');if(now&&now!==before){await loadAll();toast('<b>Fresh.</b> Ledger updated.');refreshing=false;return;}pill.textContent='refreshing… '+Math.round((Date.now()-t0)/1000)+'s';}pill.textContent='synced '+syncLabel();toast('Courier took too long. Check Actions in the vault.');}catch(e){pill.textContent='synced '+syncLabel();toast('Refresh failed · '+esc(e.message));}refreshing=false;}
// pull-to-refresh on main
{let y0=null,armed=false;const main=$('main');const scroller=()=>$$('.view').find(x=>!x.hidden);const pill=()=>$('#syncPill');main.addEventListener('touchstart',e=>{const sc=scroller();const overlay=!$('#deck').hidden||!$('#acct').hidden||$('#sheets').children.length;y0=(!overlay&&sc&&sc.scrollTop<=0&&e.touches[0].clientY<220)?e.touches[0].clientY:null;armed=false;},{passive:true});main.addEventListener('touchmove',e=>{if(y0===null)return;const dy=e.touches[0].clientY-y0;if(dy>40&&!armed)pill().textContent='pull to refresh…';if(dy>160&&!armed){armed=true;pill().textContent='release to refresh';}},{passive:true});const done=()=>{if(y0===null)return;y0=null;if(armed){armed=false;refreshNow();}else if(!refreshing)pill().textContent='synced '+syncLabel();};main.addEventListener('touchend',done,{passive:true});main.addEventListener('touchcancel',done,{passive:true});}

// ============================================================
// TABS · LOOKS · BOOT
// ============================================================
const views={green:renderGreen,flow:renderFlow,buckets:renderBuckets,debts:renderDebts};
function currentTab(){const cur=$$('nav [role=tab]').find(t=>t.getAttribute('aria-selected')==='true');return cur?cur.dataset.v:'green';}
function show(name){$('#deck').hidden=true;$('#acct').hidden=true;closeSheet();Object.keys(views).forEach(k=>{$('#v-'+k).hidden=k!==name;});$$('nav [role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===name)));views[name]();const v=$('#v-'+name);if(v&&name!=='flow')v.scrollTop=0;}
$$('nav [role=tab]').forEach(b=>b.onclick=()=>show(b.dataset.v));
const SKINS=[
 {id:'none',n:'None',s:'the base. purple black, hot accents, glow.',bg:'#0a0616',sw:['#ffd23f','#ff4fd8','#3dffb0'],fg:'#f4ecff'},
 {id:'aurora',n:'Aurora',s:'one slow color wash behind glass cards.',bg:'linear-gradient(135deg,#c04dff,#3bd6ff,#3dffb0)',sw:['#ffd23f','#ff4fd8','#3dffb0'],fg:'#fff'},
 {id:'dusk',n:'Dusk',s:'navy to violet, soft shadows, no tricks.',bg:'linear-gradient(170deg,#0e1338,#160c2e)',sw:['#ffd23f','#ff4fd8','#3dffb0'],fg:'#eef0ff'},
 {id:'highlight',n:'Highlight',s:'all grey. one acid green for money you can touch.',bg:'#0e0e12',sw:['#e6e6ec','#9a9aa6','#c8ff2e'],fg:'#e6e6ec'},
 {id:'dawn',n:'Dawn',s:'the daylight version. same accents on white.',bg:'#faf7ff',sw:['#b8860b','#c4229e','#0a9d63'],fg:'#1b1030'}
];
let skin='dusk';try{skin=localStorage.getItem('aig-skin')||'dusk';}catch(e){}if(!SKINS.some(k=>k.id===skin))skin='dusk';
let neon='magenta',fx=['brackets','chroma'];try{neon=localStorage.getItem('aig-neon')||'magenta';const f=localStorage.getItem('aig-fx');if(f)fx=JSON.parse(f).filter(x=>x!=='scan');}catch(e){}
const NEONS=[['magenta','Magenta · cyan'],['cyan','Cyan · violet'],['acid','Acid'],['blood','Blood'],['ice','Ice']];const FXS=[['grid','grid floor'],['glitch','glitch title'],['brackets','HUD brackets'],['pulse','card pulse'],['chroma','chroma numbers']];
let iconPick='line';try{iconPick=localStorage.getItem('aig-icon')||'line';}catch(e){}
function applyIcon(){const l=$('#touchIcon');if(l)l.href=`icons/vault-${iconPick}.png`;try{localStorage.setItem('aig-icon',iconPick);}catch(e){}}
function applySkin(){applyIcon();const r=document.documentElement;setTimeout(()=>{try{const c=getComputedStyle(r).getPropertyValue('--surface').trim();const m=document.querySelector('meta[name=theme-color]');if(m&&c)m.content=c;}catch(e){}},0);r.setAttribute('data-skin','neon');if(skin==='none')r.removeAttribute('data-look');else r.setAttribute('data-look',skin);if(skin==='none'){r.setAttribute('data-neon',neon);r.setAttribute('data-fx',fx.join(' '));}else{r.removeAttribute('data-neon');r.removeAttribute('data-fx');}try{localStorage.setItem('aig-skin',skin);localStorage.setItem('aig-neon',neon);localStorage.setItem('aig-fx',JSON.stringify(fx));}catch(e){}}
function openSkins(){sheet(`<h3>Look</h3><div class="skins">${SKINS.map(k=>`<button class="skin ${skin===k.id?'on':''}" data-skin="${k.id}" style="background:${k.bg};color:${k.fg}"><div class="sw">${k.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</div><b>${k.n}</b><span>${k.s}</span></button>`).join('')}</div><div id="neonbox" ${skin==='none'?'':'hidden'}><div class="eyebrow" style="margin:6px 0">colorway</div><div class="fxrow">${NEONS.map(([id,n])=>`<button class="chip ${neon===id?'on':''}" data-neon="${id}">${n}</button>`).join('')}</div><div class="eyebrow" style="margin:10px 0 6px">effects</div><div class="fxrow">${FXS.map(([id,n])=>`<button class="chip ${fx.includes(id)?'on':''}" data-fx="${id}">${n}</button>`).join('')}</div></div><div class="eyebrow" style="margin:12px 0 6px">home-screen icon</div><div class="icons">${[{id:'line',n:'Line'},...SKINS].map(k=>`<button class="ic ${iconPick===k.id?'on':''}" data-icon="${k.id}" aria-label="${k.n} icon"><img src="icons/vault-${k.id}.png" alt=""><span>${k.n}</span></button>`).join('')}</div><div class="muted" style="font-size:11px">iPhone copies the icon when you add to the Home Screen. Pick one, then Share → Add to Home Screen again; delete the old one.</div><div class="row" style="gap:8px"><button class="btn ghost" id="lkBack" style="flex:1">← Settings</button><button class="btn ghost" data-close style="flex:1">Close</button></div>`,sh=>{sh.querySelector('#lkBack').onclick=openSettings;const rerender=()=>{if(LEDGER)views[currentTab()]();};sh.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{skin=b.dataset.skin;applySkin();sh.querySelectorAll('[data-skin]').forEach(x=>x.classList.toggle('on',x.dataset.skin===skin));sh.querySelector('#neonbox').hidden=skin!=='none';rerender();});sh.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{iconPick=b.dataset.icon;applyIcon();sh.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('on',x.dataset.icon===iconPick));});sh.querySelectorAll('[data-neon]').forEach(b=>b.onclick=()=>{neon=b.dataset.neon;applySkin();sh.querySelectorAll('[data-neon]').forEach(x=>x.classList.toggle('on',x.dataset.neon===neon));rerender();});sh.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{const id=b.dataset.fx;fx=fx.includes(id)?fx.filter(x=>x!==id):[...fx,id];applySkin();b.classList.toggle('on',fx.includes(id));});});}
$('#skinBtn').onclick=openSettings;$('#navstat').onclick=()=>{show('green');};$('#syncPill').onclick=refreshNow;applySkin();$('#syncPill').textContent=BUILD;setTimeout(()=>{if(LEDGER)$('#syncPill').textContent='synced '+syncLabel();},4000);
window.addEventListener('error',e=>{log('window',e.message,{at:e.filename+':'+e.lineno});});
loadAll();
// re-read on return to the app if the ledger is older than 20 minutes
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&LEDGER&&cfg.token&&Date.now()-new Date(LEDGER.generated_at).getTime()>20*60000)loadAll();});
})();
</script>
