function braidByCheck(rows){const half=t=>t.date.getDate()<=15?'a':'b';const inMonth=t=>t.date.getMonth()===TODAY.getMonth()&&t.date.getFullYear()===TODAY.getFullYear();const per=rows.map(r=>{const pick=h=>-txns.filter(t=>t.b===r.id&&t.lane==='bills'&&t.a<0&&inMonth(t)&&half(t)===h).reduce((s,t)=>s+t.a,0);return {...r,a:pick('a'),b:pick('b')};}).filter(r=>r.a||r.b);const sumA=per.reduce((s,r)=>s+r.a,0),sumB=per.reduce((s,r)=>s+r.b,0);const cushA=CHECK_BILLS-sumA,cushB=CHECK_BILLS-sumB;const cell=(v,cls='')=>`<span class="mono ${cls}">${v?fmt(v):'<span class="muted">·</span>'}</span>`;const cc=v=>v<0?'c-amber':'c-green';
  return `<div class="card"><div class="row"><h2>${MON[TODAY.getMonth()]}, by check</h2><span class="muted" style="font-size:12px">${CONF.lanes.bills.n} · ${fmt(CHECK_BILLS)} a check</span></div><div class="matrix" style="margin-top:8px"><span class="h">BUCKET</span><span class="h r">A · ${CONF.income.days[0]}</span><span class="h r">B · ${CONF.income.days[1]||''}</span><span class="h r">MONTH</span>${per.map(r=>`<span data-b="${r.id}" class="bk-cell"><i class="ldot" style="background:${bcol(r.id)}"></i>${r.e} ${r.n}</span>${cell(r.a)}${cell(r.b)}${cell(r.a+r.b,'tot')}`).join('')}<span class="cushr"><i class="ldot" style="background:var(--green)"></i>cushion</span>${cell(cushA,cc(cushA))}${cell(cushB,cc(cushB))}${cell(cushA+cushB,'tot '+cc(cushA+cushB))}<span class="foot">check</span><span class="mono foot">${fmt(CHECK_BILLS)}</span><span class="mono foot">${fmt(CHECK_BILLS)}</span><span class="mono foot tot">${fmt(CHECK_BILLS*2)}</span></div><div class="muted" style="font-size:11px;margin-top:8px">Cushion is what each check has left after its pulls. Above ${fmt(CUSH_CAP)} on payday, the extra skims to savings. Amber means that half ran past its check.</div></div>`;}
function itemizedCard(rows){if(!openBucket)return '';const r=rows.find(x=>x.id===openBucket)||bk(openBucket);if(!r)return '';const inMonth=t=>t.date.getMonth()===TODAY.getMonth()&&t.date.getFullYear()===TODAY.getFullYear();const items=txns.filter(t=>t.b===openBucket&&t.a<0&&inMonth(t)).sort((a,b)=>a.date-b.date);const lines=(bk(openBucket).lines||[]);const total=lines.filter(l=>!l.once).reduce((s,l)=>s+Math.abs(l.amount)*(l.everyDays?30/l.everyDays:l.months?l.months.length/12:1),0);
  return `<div class="card stack fadein" id="itemized"><div class="row"><h2>${r.e} ${r.n}, itemized</h2><button class="btn small ghost" id="closeB">close</button></div>${r.note?`<div class="muted" style="font-size:12px;color:${stCol(r.st)}">${r.note}</div>`:''}
    <div class="eyebrow">what's expected · tap a line to change it</div>${lines.length?[...lines].sort((a,b)=>(a.day||0)-(b.day||0)).map(l=>{const i=lines.indexOf(l);const when=l.once?`once · ${ds(parseISO(l.once))}`:l.everyDays?`every ${l.everyDays}d`:l.months?`${l.months.map(m=>MON[m-1]).join('/')} ${l.day}`:`the ${l.day}${l.day===1?'st':l.day===2?'nd':l.day===3?'rd':'th'}`;return `<div class="item" data-ledit="${i}" style="cursor:pointer"><span class="nm">${esc(l.n)} <span class="tag">${when}</span>${l.estimate?'<span class="tag">est</span>':''}</span><span class="pr">${fmt2(Math.abs(l.amount))}</span><div class="sub"><span class="muted" style="font-size:12px">${esc(l.note||'')}</span><button class="btn small ghost" data-ldel="${i}" aria-label="Remove">✕</button></div></div>`;}).join(''):'<div class="muted" style="font-size:13px">No expected lines. This bucket fills and waits.</div>'}<button class="btn small" id="laddLine">+ add a line</button><div class="row" style="border-top:1px solid var(--line);padding-top:8px;font-weight:800"><span>Lines, a month</span><span class="mono">${fmt2(total)}</span></div><div class="row" style="font-weight:800"><span>Target</span><span class="mono ${r.target&&total>r.target?'c-amber':'c-green'}">${fmt(r.target||0)}${r.target&&total>r.target?' · lines run over by '+fmt2(total-r.target):''}</span></div>
    <div class="eyebrow" style="margin-top:6px">this month, actual</div>${items.length?items.map(t=>`<div class="row" style="font-size:14px"><span>${esc(t.n)} <span class="tag">${ds(t.date)}${t.st==='planned'?' · planned':t.pend?' · pending':''}</span>${t.exp&&-t.a>t.exp+1?`<span class="tag c-red">+${fmt(-t.a-t.exp)} over</span>`:''}</span><span class="mono">${fmt2(t.a)}</span></div>`).join(''):'<div class="muted" style="font-size:13px">nothing yet</div>'}</div>`;}
function openLine(bid,i){const b=bk(bid);const l=i>=0?b.lines[i]:{n:'',amount:'',day:1,key:''};sheet(`<h3>${i>=0?'Edit line':'New line'} · ${b.e} ${b.n}</h3><div class="field"><label for="sl1">Name</label><input id="sl1" value="${esc(l.n)}" placeholder="what is it"></div><div class="field"><label for="sl2">Amount (what posts)</label><input id="sl2" type="number" inputmode="decimal" step="0.01" value="${l.amount}" class="mono"></div><div class="field"><label for="sl3">Day it pulls</label><input id="sl3" type="number" min="1" max="31" value="${l.day||1}" class="mono"></div><div class="field"><label for="sl4">Every N days instead (blank for monthly)</label><input id="sl4" type="number" min="0" value="${l.everyDays||''}" class="mono" placeholder="25"></div><div class="field"><label for="sl5">Key (matches a rule's sub-tag)</label><input id="sl5" value="${esc(l.key||'')}" placeholder="e.g. pge"></div><div class="field"><label for="sl6">Note</label><input id="sl6" value="${esc(l.note||'')}"></div><div class="row"><button class="btn primary" id="slsave" style="flex:1">Save</button><button class="btn ghost" data-close>Cancel</button></div>`,sh=>{sh.querySelector('#slsave').onclick=()=>{const n=sh.querySelector('#sl1').value.trim(),amount=+sh.querySelector('#sl2').value,day=Math.min(31,Math.max(1,+sh.querySelector('#sl3').value||1)),every=+sh.querySelector('#sl4').value||0,key=sh.querySelector('#sl5').value.trim()||n.toLowerCase().replace(/[^a-z0-9]+/g,'_'),note=sh.querySelector('#sl6').value;if(!n||!amount){toast('Needs a name and an amount');return;}const nl={...(i>=0?l:{}),n,amount,day,key,note};if(every){nl.everyDays=every;nl.anchor=nl.anchor||iso(TODAY);}else{delete nl.everyDays;delete nl.anchor;}if(i>=0)b.lines[i]=nl;else(b.lines=b.lines||[]).push(nl);persist('config/buckets.json',CONF,`line: ${n}`);closeSheet();toast(`<b>${esc(n)}</b> · ${fmt2(amount)}`);rebuild();renderBuckets();};});}
function openEmoji(b){const list=['🏠','💳','📺','💡','💇','🛒','🧦','🌊','🚗','🐈','🩺','🎬','🎸','✈️','🎁','🧾','☕','🍜','📱','🔧','📅','🎟️'];sheet(`<h3>${b.n} · edit</h3><div class="emojis">${list.map(e=>`<button class="${b.e===e?'on':''}" data-e="${e}">${e}</button>`).join('')}</div><div class="field"><label for="bn">Name</label><input id="bn" value="${esc(b.n)}"></div><div class="field"><label for="bt">Target a month</label><input id="bt" type="number" value="${b.target||0}" class="mono"></div><div class="field"><label for="bp">Per check</label><input id="bp" type="number" step="0.01" value="${b.perCheck||0}" class="mono"></div><div class="row"><button class="btn primary" id="bsave" style="flex:1">Save</button><button class="btn ghost" data-close>Cancel</button></div>`,sh=>{let pick=b.e;sh.querySelectorAll('[data-e]').forEach(x=>x.onclick=()=>{sh.querySelectorAll('[data-e]').forEach(y=>y.classList.remove('on'));x.classList.add('on');pick=x.dataset.e;});sh.querySelector('#bsave').onclick=()=>{b.e=pick;b.n=sh.querySelector('#bn').value||b.n;b.target=+sh.querySelector('#bt').value||0;b.perCheck=+sh.querySelector('#bp').value||0;persist('config/buckets.json',CONF,`bucket: ${b.n}`);closeSheet();toast(`${b.e} <b>${esc(b.n)}</b> saved`);rebuild();renderBuckets();};});}
function renderBuckets(){
  const v=$('#v-buckets');if(!LEDGER){v.innerHTML='';return;}const rows=bucketRows();const u=untagged();let html=altBar('buckets');

    html+=`</div><div class="muted" style="font-size:11px;margin-top:10px">Ring fills to target. Green is on track. Amber is planned to run light. Red is a bill that posted over what it's allotted; the cushion covers it. ✎ to rename, retarget, or pick a face. Tap a tile for its lines.</div></div>`;
  }else{

  }

  v.innerHTML=html;wireAlts(v,renderBuckets);

function monthsUntil(isoDate){const u=parseISO(isoDate);if(!u)return Infinity;return Math.max(0,(u.getFullYear()-TODAY.getFullYear())*12+(u.getMonth()-TODAY.getMonth())+(u.getDate()>=TODAY.getDate()?0:-0));}
function debtCalc(){return DEBTS.map((dd,i)=>{const fixed=!!(dd.settle&&dd.until);const a=fixed?{m:monthsUntil(dd.until),int:0}:amort(dd.bal,dd.apr,dd.pay+(extraBy[i]||0)),a0=fixed?{m:monthsUntil(dd.until),int:0}:amort(dd.bal,dd.apr,dd.pay);if(fixed)extraBy[i]=0;return {...dd,a,a0,pct:dd.orig?(1-dd.bal/dd.orig)*100:0,diff:dd.stmt-dd.bal,i};});}
function renderDebts(){
  const v=$('#v-debts');if(!LEDGER){v.innerHTML='';return;}const calc=debtCalc();const total=DEBTS.reduce((s,dd)=>s+dd.bal,0);const bad=calc.filter(x=>Math.abs(x.diff)>1);const priced=calc.filter(c=>isFinite(c.a.m));const freeM=priced.length?Math.max(...priced.map(c=>c.a.m)):Infinity;const extraTot=extraBy.reduce((s,x)=>s+x,0);
  const discRows=i=>{const dd=calc[i];return `<div class="disc ${Math.abs(dd.diff)>1?'bad':'ok'}"><span>${Math.abs(dd.diff)>1?'<b>Statement disagrees</b> by '+fmt(dd.diff)+'. A payment not credited?':'Statement agrees ✓'}</span><label class="row" style="gap:6px;font-size:11px;color:var(--muted)">stmt <input type="number" inputmode="decimal" value="${dd.stmt}" data-d="${i}" class="stmt" aria-label="Statement balance"></label></div>${Math.abs(dd.diff)>1?`<div class="row"><button class="btn small" data-call="${i}">Log a call</button><button class="btn small ghost" data-fix="${i}">It's right, update mine</button></div>`:''}`;};
  let html=`<div class="card row"><div><div class="eyebrow">you owe</div><div class="big grad red" data-count="${total}">$0</div></div><div style="text-align:right"><div class="eyebrow">debt-free</div><div class="mono c-green" style="font-size:18px;font-weight:700">${monthStr(freeM)}</div><div class="muted mono" style="font-size:10px">${extraTot?'with +'+fmt(extraTot)+'/mo extra':'as planned'}</div></div></div>`;
  html+=`<div class="card"><div class="row"><h2>Kill list</h2><span class="muted" style="font-size:12px">tap one for its clock</span></div><div class="kl" style="margin-top:10px">${calc.map((dd,i)=>`<div class="kli ${i===focusDebt?'next':''} ${dd.bal<=0?'dead':''}" data-debt="${i}" role="button" tabindex="0" style="animation-delay:${i*70}ms;cursor:pointer"><span class="chk">${dd.bal<=0?'✓':i+1}</span><div><div class="nm">${esc(dd.n)}${dd.settle?' <span class="muted" style="font-weight:500">· settlement</span>':''}${dd.live?' <span class="tag c-green">live</span>':''}</div><div class="m">${fmt(dd.bal)} · ${dd.apr?Math.round(dd.apr*1000)/10+'%':'0%'} · ${dd.pay?fmt(dd.pay):(dd.unpriced?'unpriced':dd.forbearance?'$0 forbearance':'$0')}${extraBy[i]?'<b class="c-green">+'+extraBy[i]+'</b>':''}${dd.pay?'/mo':''}</div></div><div class="m ${extraBy[i]?'c-green':''}" style="text-align:right">${dd.settle&&dd.until?'ends<br>'+monthStr(dd.a.m):isFinite(dd.a.m)?'dead<br>'+monthStr(dd.a.m):'—'}</div></div>`).join('')}</div></div>`;
  if(bad.length)html+=`<div class="card stack"><h2>Statement disagrees</h2>${bad.map(x=>`<div style="font-weight:700">${esc(x.n)}</div>`+discRows(x.i)).join('')}</div>`;
  {const f=calc[focusDebt];if(f){const ex=extraBy[focusDebt]||0;const saved=isFinite(f.a0.m)&&isFinite(f.a.m)?f.a0.m-f.a.m:0;const intSaved=f.a0.int-f.a.int;const perDay=f.apr?f.bal*f.apr/365:0;html+=`<div class="card stack dfocus" id="dfocus"><div class="row"><div><div class="eyebrow">payoff clock</div><h2>${esc(f.n)}</h2></div><div style="text-align:right"><div class="muted mono" style="font-size:10px">as planned</div><div class="mono" style="font-size:16px;font-weight:700;${ex?'text-decoration:line-through;color:var(--muted)':''}">${monthStr(f.a0.m)}</div></div></div>${f.settle&&f.until?`<div class="clockrow"><div><div class="eyebrow">ends</div><div class="big">${f.a.m}</div><div class="muted">months · ${monthStr(f.a.m)} · ${fmt(f.pay)} a month, fixed</div></div></div><div class="muted" style="font-size:13px">Settlement terms. The schedule is the schedule; paying extra doesn't shorten it. When it ends, ${fmt(f.pay)} a month comes free for the next debt on the list.</div>`:f.pay>0?`<div class="clockrow"><div><div class="eyebrow">${ex?'with +'+fmt(ex)+'/mo':'dies in'}</div><div class="big ${ex?'grad':''}" data-count="${f.a.m}" data-plain="1">${f.a.m}</div><div class="muted">months · ${monthStr(f.a.m)}</div></div><div class="gain ${ex?'on':''}"><div class="eyebrow c-green">you get back</div><div class="mono c-green" style="font-size:22px;font-weight:700">${saved} mo</div><div class="mono c-green" style="font-size:13px;font-weight:700">${fmt(intSaved)} interest</div></div></div><div class="row"><span style="font-weight:700">Extra toward principal</span><span class="mono c-amber" style="font-weight:700">+${fmt(ex)}/mo</span></div><input type="range" id="extra" min="0" max="400" step="25" value="${ex}" aria-label="Extra per month toward ${esc(f.n)}"><div class="row muted" style="font-size:12px"><span>${fmt(f.pay)} minimum${f.apr?' · '+fmt(f.bal*f.apr/12)+' of it is interest':' · 0%, all principal'}</span><span>${perDay?'$'+perDay.toFixed(2)+' a day in interest':''}</span></div>${ex?`<div class="muted" style="font-size:12px">New payment ${fmt(f.pay+ex)}. ${f.a.m} payments instead of ${f.a0.m}. ${intSaved>0?'The '+fmt(intSaved)+' is money the lender never gets.':'No interest here, so every extra dollar is pure months off.'}</div>`:`<div class="muted" style="font-size:12px">Slide it. The clock moves while you drag.</div>`}`:`<div class="muted" style="font-size:13px">${f.unpriced?'Payment is unpriced. Nothing enters the map until a call prices it (standing rule 10).':f.forbearance?'In forbearance. $0 a month by design; the clock starts when payments do.':'No payment on this one yet.'}</div>`}${f.note?`<div class="muted" style="font-size:12px">${esc(f.note)}</div>`:''}</div>`;}}
  v.innerHTML=html;v.querySelectorAll('[data-count]').forEach(el=>countTo(el,+el.dataset.count,800));
  const ex=$('#extra');if(ex)ex.oninput=e=>{extraBy[focusDebt]=+e.target.value;const keep=v.scrollTop;renderDebts();v.scrollTop=keep;};
  v.querySelectorAll('[data-debt]').forEach(el=>{const go=()=>{focusDebt=+el.dataset.debt;const keep=v.scrollTop;renderDebts();v.scrollTop=keep;const fc=$('#dfocus');if(fc)fc.scrollIntoView({behavior:reduced?'auto':'smooth',block:'nearest'});};el.onclick=go;el.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();go();}};});
  v.querySelectorAll('.stmt').forEach(i=>i.onchange=()=>{const dd=CONF.debts.find(d=>d.id===DEBTS[+i.dataset.d].id);dd.stmt=+i.value;persist('config/buckets.json',CONF,`stmt: ${dd.n}`);rebuild();renderDebts();});
  v.querySelectorAll('[data-fix]').forEach(b=>b.onclick=()=>{const dd=CONF.debts.find(d=>d.id===DEBTS[+b.dataset.fix].id);dd.bal=DEBTS[+b.dataset.fix].stmt;persist('config/buckets.json',CONF,`bal: ${dd.n}`);toast('Updated to the statement');rebuild();renderDebts();});
  v.querySelectorAll('[data-call]').forEach(b=>b.onclick=()=>{const dd=DEBTS[+b.dataset.call];sheet(`<h3>Call log · ${esc(dd.n)}</h3><div class="suggest" style="border-left-color:var(--red)"><b>Rep name and reference ID in the first 30 seconds.</b></div><div class="field"><label for="c1">Rep</label><input id="c1" placeholder="name"></div><div class="field"><label for="c2">Ref ID</label><input id="c2" placeholder="id"></div><div class="field"><label for="c3">Said</label><input id="c3" placeholder="what they said"></div><div class="row"><button class="btn primary" id="csave" style="flex:1">Save to the passbook</button></div>`,sh=>{sh.querySelector('#csave').onclick=()=>{STATE.calls=STATE.calls||[];STATE.calls.push({at:iso(TODAY),debt:dd.id,rep:sh.querySelector('#c1').value,ref:sh.querySelector('#c2').value,said:sh.querySelector('#c3').value});persist('data/state.json',STATE,`call: ${dd.n}`);closeSheet();toast('Logged');};});});
}

function openSettings(){sheet(`<h3>Settings <span class="pill" style="font-size:10px">${BUILD}</span></h3><div class="muted" style="font-size:13px">The vault is a private GitHub repo. The token is a fine-grained PAT scoped to that one repo, Contents read/write and Actions read/write. It lives only in this browser.</div><div class="field"><label for="s1">GitHub user or org</label><input id="s1" value="${esc(cfg.owner)}" autocapitalize="off" autocomplete="off"></div><div class="field"><label for="s2">Vault repo</label><input id="s2" value="${esc(cfg.repo)}" autocapitalize="off" autocomplete="off"></div><div class="field"><label for="s3">Branch</label><input id="s3" value="${esc(cfg.branch)}" autocapitalize="off"></div><div class="field"><label for="s4">Token</label><input id="s4" type="password" value="${esc(cfg.token)}" autocomplete="off" placeholder="github_pat_…"></div><div class="row" style="gap:8px"><button class="btn primary" id="sSave" style="flex:1">Save & connect</button><button class="btn" id="sAccts">Accounts</button></div><div class="row" style="gap:8px"><button class="btn ghost" id="sLook" style="flex:1">Look</button><button class="btn ghost" id="sLog" style="flex:1">Log</button><button class="btn ghost" id="sReload" style="flex:1">Reload app</button><button class="btn ghost" data-close>Close</button></div>${LEDGER?`<div class="muted mono" style="font-size:11px">ledger ${esc(LEDGER.generated_at||'')} · ${(LEDGER.transactions||[]).length} txns · ${(LEDGER.accounts||[]).length} accounts · run +${(LEDGER.run||{}).added||0} ~${(LEDGER.run||{}).modified||0} −${(LEDGER.run||{}).removed||0}</div>`:''}`,sh=>{sh.querySelector('#sSave').onclick=()=>{cfg.owner=sh.querySelector('#s1').value.trim();cfg.repo=sh.querySelector('#s2').value.trim()||'vault';cfg.branch=sh.querySelector('#s3').value.trim()||'main';cfg.token=sh.querySelector('#s4').value.trim();saveCfg();closeSheet();loadAll();};sh.querySelector('#sAccts').onclick=()=>{if(!LEDGER){toast('No ledger yet');return;}openAccounts();};sh.querySelector('#sLook').onclick=openSkins;sh.querySelector('#sReload').onclick=()=>location.reload(true);sh.querySelector('#sLog').onclick=()=>sheet(`<h3>Log</h3><div class="log" style="font-family:var(--mono);font-size:11px;line-height:1.6;max-height:50vh;overflow:auto;background:var(--surface2);border-radius:12px;padding:10px">${LOG.slice().reverse().map(l=>`<div><span class="muted">${l.at}</span> <b>${esc(l.stage)}</b> ${esc(l.msg)}${l.extra?' <span class="muted">'+esc(JSON.stringify(l.extra)).slice(0,160)+'</span>':''}</div>`).join('')||'<div class="muted">quiet</div>'}</div><button class="btn ghost" data-close>Close</button>`);});}
function openAccounts(){const accts=LEDGER.accounts||[];const opts=id=>{const cur=ACCTS[id]||'';const o=[['','— pick —'],['checking',CONF.lanes.checking.n+' · checking lane'],['bills',CONF.lanes.bills.n+' · bills lane'],['savings',CONF.lanes.savings.n+' · savings lane'],...CONF.debts.map(d=>['debt:'+d.id,'debt · '+d.n]),['ignore','ignore']];return o.map(([v,n])=>`<option value="${v}" ${v===cur?'selected':''}>${esc(n)}</option>`).join('');};sheet(`<h3>Accounts → lanes</h3><div class="muted" style="font-size:13px">Every account Plaid sees gets a lane, a debt, or ignore. Saved to the vault.</div><div class="stack">${accts.map(a=>`<div class="field"><label>${esc(a.name||a.official_name||'account')} ····${esc(a.mask||'')} <span class="muted">· ${esc(a.subtype||a.type||'')} · ${fmt(a.current||0)}</span></label><select data-acct="${esc(a.account_id)}">${opts(a.account_id)}</select></div>`).join('')}</div><div class="row"><button class="btn primary" id="aSave" style="flex:1">Save</button><button class="btn ghost" data-close>Cancel</button></div>`,sh=>{sh.querySelector('#aSave').onclick=async()=>{sh.querySelectorAll('[data-acct]').forEach(s=>{if(s.value)ACCTS[s.dataset.acct]=s.value;});closeSheet();try{await gh.write('config/accounts.json',ACCTS,'accounts: lanes');toast('Accounts saved');}catch(e){toast('Save failed · '+esc(e.message));}loadAll();};});}
let refreshing=false;
async function refreshNow(){if(refreshing)return;if(!cfg.token){openSettings();return;}refreshing=true;const pill=$('#syncPill');pill.textContent='asking…';try{const before=await gh.sha('data/ledger.json');await gh.dispatch();pill.textContent='refreshing…';toast('Courier running · <b>about a minute</b>');const t0=Date.now();while(Date.now()-t0<240000){await new Promise(r=>setTimeout(r,10000));const now=await gh.sha('data/ledger.json');if(now&&now!==before){await loadAll();toast('<b>Fresh.</b> Ledger updated.');refreshing=false;return;}pill.textContent='refreshing… '+Math.round((Date.now()-t0)/1000)+'s';}pill.textContent='synced '+syncLabel();toast('Courier took too long. Check Actions in the vault.');}catch(e){pill.textContent='synced '+syncLabel();toast('Refresh failed · '+esc(e.message));}refreshing=false;}
// pull-to-refresh on main
{let y0=null;const main=$('main');const scroller=()=>$$('.view').find(x=>!x.hidden);main.addEventListener('touchstart',e=>{const sc=scroller();y0=(sc&&sc.scrollTop<=0&&e.touches[0].clientY<220)?e.touches[0].clientY:null;},{passive:true});main.addEventListener('touchmove',e=>{if(y0!==null&&e.touches[0].clientY-y0>110){y0=null;refreshNow();}},{passive:true});}

// ============================================================
// TABS · LOOKS · BOOT
// ============================================================
const views={green:renderGreen,flow:renderFlow,buckets:renderBuckets,debts:renderDebts};
function currentTab(){const cur=$$('nav [role=tab]').find(t=>t.getAttribute('aria-selected')==='true');return cur?cur.dataset.v:'green';}
function show(name){$('#deck').hidden=true;$('#acct').hidden=true;closeSheet();Object.keys(views).forEach(k=>{$('#v-'+k).hidden=k!==name;});$$('nav [role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===name)));views[name]();const v=$('#v-'+name);if(v&&name!=='flow')v.scrollTop=0;}
$$('nav [role=tab]').forEach(b=>b.onclick=()=>show(b.dataset.v));
const SKINS=[
 {id:'none',n:'None',s:'the base. purple black, hot accents, glow.',bg:'#0a0616',sw:['#ffd23f','#ff4fd8','#3dffb0'],fg:'#f4ecff'},
 {id:'aurora',n:'Aurora',s:'one slow color wash behind glass cards.',bg:'linear-gradient(135deg,#c04dff,#3bd6ff,#3dffb0)',sw:['#ffd23f','#ff4fd8','#3dffb0'],fg:'#fff'},
 {id:'dusk',n:'Dusk',s:'navy to violet, soft shadows, no tricks.',bg:'linear-gradient(170deg,#0e1338,#160c2e)',sw:['#ffd23f','#ff4fd8','#3dffb0'],fg:'#eef0ff'},
 {id:'highlight',n:'Highlight',s:'all grey. one acid green for money you can touch.',bg:'#0e0e12',sw:['#e6e6ec','#9a9aa6','#c8ff2e'],fg:'#e6e6ec'},
 {id:'dawn',n:'Dawn',s:'the daylight version. same accents on white.',bg:'#faf7ff',sw:['#b8860b','#c4229e','#0a9d63'],fg:'#1b1030'}
];
let skin='none';try{skin=localStorage.getItem('aig-skin')||'none';}catch(e){}if(!SKINS.some(k=>k.id===skin))skin='none';
let neon='magenta',fx=['brackets','chroma'];try{neon=localStorage.getItem('aig-neon')||'magenta';const f=localStorage.getItem('aig-fx');if(f)fx=JSON.parse(f).filter(x=>x!=='scan');}catch(e){}
const NEONS=[['magenta','Magenta · cyan'],['cyan','Cyan · violet'],['acid','Acid'],['blood','Blood'],['ice','Ice']];const FXS=[['grid','grid floor'],['glitch','glitch title'],['brackets','HUD brackets'],['pulse','card pulse'],['chroma','chroma numbers']];
function applySkin(){const r=document.documentElement;r.setAttribute('data-skin','neon');if(skin==='none')r.removeAttribute('data-look');else r.setAttribute('data-look',skin);if(skin==='none'){r.setAttribute('data-neon',neon);r.setAttribute('data-fx',fx.join(' '));}else{r.removeAttribute('data-neon');r.removeAttribute('data-fx');}const h=$('#title');if(h)h.setAttribute('data-t',h.textContent);try{localStorage.setItem('aig-skin',skin);localStorage.setItem('aig-neon',neon);localStorage.setItem('aig-fx',JSON.stringify(fx));}catch(e){}}
function openSkins(){sheet(`<h3>Look</h3><div class="skins">${SKINS.map(k=>`<button class="skin ${skin===k.id?'on':''}" data-skin="${k.id}" style="background:${k.bg};color:${k.fg}"><div class="sw">${k.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</div><b>${k.n}</b><span>${k.s}</span></button>`).join('')}</div><div id="neonbox" ${skin==='none'?'':'hidden'}><div class="eyebrow" style="margin:6px 0">colorway</div><div class="fxrow">${NEONS.map(([id,n])=>`<button class="chip ${neon===id?'on':''}" data-neon="${id}">${n}</button>`).join('')}</div><div class="eyebrow" style="margin:10px 0 6px">effects</div><div class="fxrow">${FXS.map(([id,n])=>`<button class="chip ${fx.includes(id)?'on':''}" data-fx="${id}">${n}</button>`).join('')}</div></div><button class="btn ghost" data-close>Close</button>`,sh=>{const rerender=()=>{if(LEDGER)show(currentTab());};sh.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{skin=b.dataset.skin;applySkin();sh.querySelectorAll('[data-skin]').forEach(x=>x.classList.toggle('on',x.dataset.skin===skin));sh.querySelector('#neonbox').hidden=skin!=='none';rerender();});sh.querySelectorAll('[data-neon]').forEach(b=>b.onclick=()=>{neon=b.dataset.neon;applySkin();sh.querySelectorAll('[data-neon]').forEach(x=>x.classList.toggle('on',x.dataset.neon===neon));rerender();});sh.querySelectorAll('[data-fx]').forEach(b=>b.onclick=()=>{const id=b.dataset.fx;fx=fx.includes(id)?fx.filter(x=>x!==id):[...fx,id];applySkin();b.classList.toggle('on',fx.includes(id));});});}
$('#skinBtn').onclick=openSettings;$('#lookBtn').onclick=openSkins;$('#syncPill').onclick=refreshNow;applySkin();$('#syncPill').textContent=BUILD;setTimeout(()=>{if(LEDGER)$('#syncPill').textContent='synced '+syncLabel();},4000);
window.addEventListener('error',e=>{log('window',e.message,{at:e.filename+':'+e.lineno});});
loadAll();
// re-read on return to the app if the ledger is older than 20 minutes
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&LEDGER&&cfg.token&&Date.now()-new Date(LEDGER.generated_at).getTime()>20*60000)loadAll();});
})();
</script>
</body>
</html>
