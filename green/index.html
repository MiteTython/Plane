<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0616">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 100 100%27%3E%3Ccircle cx=%2750%27 cy=%2750%27 r=%2740%27 fill=%27%233dffb0%27/%3E%3C/svg%3E">
<title>Am I Green</title>
<meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Green">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;700&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=IBM+Plex+Mono:wght@500;700&family=Press+Start+2P&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: one-screen phone app. Green (quiet detail + lines), Flow (the runway ledger four ways), Buckets (tiles with the tag queue), Debts (countdown), Plan (spend planner). */
:root{
  --bg:#0b0f17; --surface:#131a26; --surface2:#1b2432; --fg:#f2f5fa; --muted:#8e9bb3; --line:rgba(142,155,179,.16);
  --checking:#f5b942; --bills:#4f9dff; --savings:#2ee6a6; --red:#ff5c7a; --amber:#ffb34a; --green:#2ee6a6; --violet:#9b7bff;
  --g-free:linear-gradient(90deg,#2ee6a6,#7ff5cf); --g-amber:linear-gradient(90deg,#ffb34a,#ffd28a); --g-red:linear-gradient(90deg,#ff5c7a,#ff8da3);
  --shadow:0 10px 30px rgba(0,0,0,.35);
  --display:"Manrope",system-ui,-apple-system,sans-serif; --body:"Manrope",system-ui,-apple-system,sans-serif; --mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.2,.8,.2,1); --spring:cubic-bezier(.3,1.4,.4,1);
  --r:22px; --r2:18px; --r3:14px; --border:0 solid transparent; --tileglass:none;
  color-scheme:dark;
}
@media (prefers-color-scheme: light){ :root:not([data-theme="dark"]):not([data-skin]),:root:not([data-theme="dark"])[data-skin="night"]{ --bg:#f3f5fa; --surface:#ffffff; --surface2:#eaeef6; --fg:#0f1627; --muted:#5f6c84; --line:rgba(15,22,39,.12); --checking:#d2920f; --bills:#2b72e8; --savings:#13a877; --red:#e23b5c; --amber:#d98a1e; --green:#13a877; --violet:#6f52e6; --g-free:linear-gradient(90deg,#13a877,#3ad19f); --g-amber:linear-gradient(90deg,#d98a1e,#f0b35a); --g-red:linear-gradient(90deg,#e23b5c,#f07a92); --shadow:0 10px 30px rgba(15,22,39,.08); color-scheme:light } }
:root[data-theme="light"]{ --bg:#f3f5fa; --surface:#ffffff; --surface2:#eaeef6; --fg:#0f1627; --muted:#5f6c84; --line:rgba(15,22,39,.12); --checking:#d2920f; --bills:#2b72e8; --savings:#13a877; --red:#e23b5c; --amber:#d98a1e; --green:#13a877; --violet:#6f52e6; --g-free:linear-gradient(90deg,#13a877,#3ad19f); --g-amber:linear-gradient(90deg,#d98a1e,#f0b35a); --g-red:linear-gradient(90deg,#e23b5c,#f07a92); --shadow:0 10px 30px rgba(15,22,39,.08); color-scheme:light }

html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.4;overflow:hidden;font-variant-numeric:tabular-nums;-webkit-font-smoothing:antialiased;font-weight:500}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
*{box-sizing:border-box}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;transition:transform .12s var(--spring)}
button:active{transform:scale(.96)}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--bills);outline-offset:2px}
input,select{font:inherit;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:9px 11px;min-width:0;width:100%}
.mono{font-family:var(--mono)}.muted{color:var(--muted)}
.c-checking{color:var(--checking)}.c-bills{color:var(--bills)}.c-savings{color:var(--savings)}.c-red{color:var(--red)}.c-amber{color:var(--amber)}.c-green{color:var(--green)}.c-violet{color:var(--violet)}
.eyebrow{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.grad{background:var(--g-free);-webkit-background-clip:text;background-clip:text;color:transparent}
.grad.amber{background:var(--g-amber);-webkit-background-clip:text;background-clip:text}.grad.red{background:var(--g-red);-webkit-background-clip:text;background-clip:text}

#app{height:100%;display:flex;flex-direction:column;max-width:520px;margin:0 auto;position:relative}
header{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-block:calc(env(safe-area-inset-top,0px) + 14px) 8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header h1{font-family:var(--display);font-weight:800;font-size:24px;margin:0;letter-spacing:-.02em}
.pill{font-family:var(--mono);font-size:10px;letter-spacing:.08em;text-transform:uppercase;border:1px solid var(--line);border-radius:999px;padding:5px 10px;color:var(--muted);white-space:nowrap;font-weight:700}
.pill.sample{color:var(--amber);border-color:currentColor}
.streak{display:inline-flex;align-items:center;gap:4px;font-family:var(--mono);font-size:12px;font-weight:700;color:var(--amber);background:rgba(255,179,74,.12);border-radius:999px;padding:4px 9px}
.streak svg{width:12px;height:14px;animation:flick 1.6s ease-in-out infinite}
@keyframes flick{50%{transform:scale(1.12) rotate(-4deg)}}
main{flex:1;min-height:0;position:relative}
.view{position:absolute;inset:0;overflow:auto;-webkit-overflow-scrolling:touch;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:4px 24px;display:flex;flex-direction:column;gap:14px}
.view[hidden]{display:none}
h2{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em;text-wrap:balance}
.card{background:var(--surface);border-radius:var(--r);padding:16px 18px;box-shadow:var(--shadow);border:var(--border)}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.stack{display:flex;flex-direction:column;gap:8px}
.big{font-family:var(--display);font-size:42px;font-weight:800;line-height:1;letter-spacing:-.03em}
.btn{border-radius:var(--r3);padding:11px 14px;font-weight:700;background:var(--surface2);text-align:center;display:inline-block;text-decoration:none;color:var(--fg)}
.btn.primary{background:var(--bills);color:#fff}.btn.good{background:var(--green);color:#06251c}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.small{padding:6px 10px;font-size:13px;border-radius:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:13px;border-radius:999px;padding:7px 13px;color:var(--muted);background:var(--surface2);font-weight:700;transition:transform .15s var(--spring),background .15s,color .15s}
.chip[aria-pressed="true"],.chip.on{background:var(--bills);color:#fff;transform:scale(1.05)}
.chip.good.on{background:var(--green);color:#06251c}
.alts{display:flex;background:var(--surface);border-radius:var(--r3);border:var(--border);padding:4px;gap:4px;align-self:stretch;overflow-x:auto;box-shadow:var(--shadow);flex:none}
.alts button{flex:1 0 auto;padding:14px 14px;border-radius:9px;font-size:14px;color:var(--muted);font-weight:700;white-space:nowrap;min-height:48px}
.alts button[aria-pressed="true"]{background:var(--surface2);color:var(--fg)}
.dot{width:14px;height:14px;border-radius:50%;background:var(--green);box-shadow:0 0 0 0 rgba(46,230,166,.5),0 0 18px rgba(46,230,166,.6);animation:breathe 3.2s ease-in-out infinite;flex:none}
.dot.amber{background:var(--amber);box-shadow:0 0 18px rgba(255,179,74,.6);animation-name:breatheA}.dot.red{background:var(--red);box-shadow:0 0 18px rgba(255,92,122,.6);animation-name:breatheR;animation-duration:1.4s}
.dot.huge{width:44px;height:44px}
@keyframes breathe{50%{box-shadow:0 0 0 12px rgba(46,230,166,0),0 0 18px rgba(46,230,166,.6)}}
@keyframes breatheA{50%{box-shadow:0 0 0 12px rgba(255,179,74,0),0 0 18px rgba(255,179,74,.6)}}
@keyframes breatheR{50%{box-shadow:0 0 0 12px rgba(255,92,122,0),0 0 18px rgba(255,92,122,.6)}}
.fadein{animation:fadein .5s var(--ease) both}
@keyframes fadein{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes pop{to{transform:scale(1);opacity:1}}
@keyframes txin{from{opacity:0;transform:translateX(-14px)}to{opacity:1;transform:none}}
@keyframes draw{to{stroke-dashoffset:0}}

/* green */
.quiet{display:flex;flex-direction:column;gap:12px}
.quiet h2{font-size:28px}
.qline{display:grid;grid-template-columns:auto 1fr auto;gap:8px 10px;align-items:center;font-size:14px}
.qline .k{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.qline .v{font-family:var(--mono);font-weight:700;text-align:right}
.lane{display:flex;flex-direction:column;gap:9px;cursor:pointer;transition:transform .2s var(--spring)}
.lane:active{transform:scale(.985)}
.lane .amt{font-family:var(--display);font-size:34px;font-weight:800;line-height:1;letter-spacing:-.03em}
.linechart{width:100%;height:130px;display:block}
.seg{height:16px;border-radius:999px;background:var(--surface2);overflow:hidden;display:flex}
.seg i{display:block;height:100%;width:0;transition:width .9s var(--ease)}
.seg .free{background:var(--g-free)}.seg .free.thin{background:var(--g-amber)}.seg .free.dry{background:var(--g-red)}
.seg .float{background:repeating-linear-gradient(135deg,var(--muted) 0 4px,transparent 4px 8px);opacity:.6}.seg .spoken{background:var(--muted);opacity:.35}
.path{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.pd{aspect-ratio:1;border-radius:12px;background:var(--surface2);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;cursor:pointer;transform:scale(.6);opacity:0;animation:pop .35s var(--spring) forwards}
.pd .d{font-family:var(--mono);font-size:12px;font-weight:700}.pd .p{font-family:var(--mono);font-size:9px;color:var(--muted)}
.pd.g{background:rgba(46,230,166,.16)}.pd.a{background:rgba(255,179,74,.18)}.pd.r{background:rgba(255,92,122,.2)}.pd.today{outline:2px solid var(--fg)}.pd.pay{background:var(--green);color:#06251c}.pd.pay .p{color:#06251c}

.flag{display:grid;grid-template-columns:12px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;border-radius:var(--r2);background:var(--surface2);animation:txin .4s var(--ease) both}
.flag i{display:block;width:10px;height:10px;border-radius:50%}
.flag.red i{background:var(--red);box-shadow:0 0 10px var(--red)}.flag.amber i{background:var(--amber);box-shadow:0 0 10px var(--amber)}.flag.blue i{background:var(--bills);box-shadow:0 0 10px var(--bills)}
.flag .ft{font-weight:800;font-size:14px;line-height:1.3}.flag .fw{font-size:12px;color:var(--muted);line-height:1.4;margin-top:2px}
.flag .btn{white-space:nowrap}
.echips{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 10px}.echip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:var(--surface2);border:1px solid transparent;color:var(--fg);font:inherit;font-size:13px;font-weight:700;cursor:pointer;min-height:36px}.echip b{font-family:var(--mono);font-weight:700}.echip.stash{background:rgba(61,255,176,.1);border-color:rgba(61,255,176,.4)}.echip.locked{opacity:.55}.echip.locked b{text-decoration:line-through}
.verdict{margin:0;font-size:17px;line-height:1.55;font-weight:500}.verdict .vn{font-family:var(--mono);font-weight:700;white-space:nowrap}.score3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.kpi{background:var(--surface2);border-radius:var(--r2);padding:10px 8px;text-align:center}.kpi .kv{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0 2px}.kpi .km{font-size:11px;color:var(--muted)}
.legend-toggle{font-size:12px;color:var(--muted);text-align:left;font-weight:700;text-decoration:underline;text-underline-offset:3px}
.legend-box{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);background:var(--surface2);border-radius:var(--r2);padding:10px 12px}
.legend-box i{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:7px;vertical-align:middle}.legend-box b{color:var(--fg)}
.legend-box[hidden]{display:none}
.jars{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end}
.jarw{display:flex;flex-direction:column;align-items:center;gap:4px}
.jarg{width:100%;height:96px;border:1px solid var(--line);border-top:0;border-radius:0 0 14px 14px;background:var(--surface2);position:relative;overflow:hidden}
.jarg.lock{display:grid;place-items:center;border-style:dashed}
.jarf{position:absolute;left:0;right:0;bottom:0;height:0;transition:height 1s var(--ease);border-radius:0 0 13px 13px}
.jarg .crush{position:absolute;left:0;right:0;border-top:2px dashed var(--red);z-index:1}.jarg .crush span{position:absolute;left:3px;top:-12px;font-family:var(--mono);font-size:7px;color:var(--red);font-weight:700;white-space:nowrap}
.jarw .n{font-family:var(--mono);font-size:9px;letter-spacing:.08em;text-transform:uppercase;font-weight:700;color:var(--muted)}.jarw .v{font-family:var(--mono);font-size:11px;font-weight:700}
.depth{position:relative;height:150px;background:linear-gradient(180deg,rgba(46,230,166,.18),var(--surface2) 70%);border-radius:var(--r2);overflow:hidden;border:1px solid var(--line)}
.depth .dscale{position:absolute;left:10px;top:0;bottom:0;width:10px;background:repeating-linear-gradient(0deg,transparent 0 9px,var(--line) 9px 10px)}
.depth .dmark{position:absolute;left:30px;top:var(--d);transform:translateY(-50%);font-family:var(--mono);font-size:12px;font-weight:700;transition:top 1.2s var(--ease)}.depth .dmark::before{content:"◀ ";color:var(--green)}
.depth .crushline{position:absolute;left:0;right:0;border-top:2px dashed var(--red)}.depth .crushline span{position:absolute;right:8px;top:2px;font-family:var(--mono);font-size:9px;color:var(--red);font-weight:700}
.depth .dfloor{position:absolute;left:30px;right:10px;bottom:8px;font-size:11px;color:var(--muted)}
.formula{display:flex;flex-wrap:wrap;gap:6px 8px;align-items:baseline;font-family:var(--mono);font-size:13px;font-weight:700;padding:8px 10px;background:var(--surface2);border-radius:var(--r2)}
.formula small{display:block;font-size:9px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;font-weight:700}
.dc .mb{display:flex;height:10px}
.dc .mb i.drop{background:repeating-linear-gradient(135deg,var(--c) 0 4px,transparent 4px 7px);opacity:.95;border-left:2px solid var(--bg)}
.dc .mb i.rise{background:var(--green)}
.dc .ml b{font-family:var(--mono)}
.arrow{display:flex;flex-direction:column;gap:2px;align-items:flex-start}
.arrow .l{font-family:var(--mono);font-size:9px;font-weight:700}
.chipd{font-family:var(--mono);font-size:10px;font-weight:700;border-radius:999px;padding:2px 7px;background:var(--surface2);color:var(--muted)}
.chipd.dn{background:rgba(255,92,122,.15);color:var(--red)}.chipd.up{background:rgba(46,230,166,.15);color:var(--green)}
.wfall{display:flex;gap:3px;height:56px;align-items:flex-end}
.wcol{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;gap:2px;min-width:0}
.wcol i{display:block;width:100%;border-radius:3px;min-height:2px}
.wcol span{font-family:var(--mono);font-size:7px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.nums{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.nbig{font-family:var(--display);font-size:20px;font-weight:800;letter-spacing:-.02em}
.dc.compact{padding:10px 12px;cursor:pointer}.dc.compact .dh{text-transform:none;letter-spacing:0;font-size:12px;color:var(--fg)}.dc.compact .dh span:last-child{color:var(--muted)}
.dc.hero{outline:2px solid var(--bills);box-shadow:0 0 30px rgba(79,157,255,.25)}
.rings3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rings3 .rg .r{width:64px;height:64px}
.rings3 .rg .r span{font-size:10px}
.rc{display:flex;flex-direction:column;gap:0}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.rrow.head{padding-top:0}.rrow.head .big2{font-size:22px;font-weight:700}
.rrow .rl{font-weight:800;font-size:14px}
.rrow .rs{display:flex;flex-wrap:wrap;gap:4px 10px;font-size:12px;color:var(--muted);margin-top:2px}
.rrow .rs i{display:inline-block;width:8px;height:8px;border-radius:2px;margin-right:5px;vertical-align:middle}
.rrow .rv{font-size:16px;font-weight:700;white-space:nowrap}
.rrow.total{border-bottom:0;padding-top:14px}.rrow.total .rv{font-family:var(--display);font-size:34px;font-weight:800;letter-spacing:-.03em}
.rnotes{display:flex;flex-direction:column;gap:4px;font-size:12px;margin-top:10px;line-height:1.4}
.rnotes span:first-child{font-weight:700}
/* deck */
#deck{position:absolute;inset:0;z-index:6;background:var(--bg);display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 16px;gap:10px;overflow:auto}
#deck[hidden]{display:none}
#acct{position:absolute;inset:0;z-index:6;background:var(--bg);display:flex;flex-direction:column;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:8px 24px;gap:12px;overflow:auto}
#acct[hidden]{display:none}
.deckhead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.deckarea{flex:1;min-height:380px;position:relative;display:flex;align-items:center;justify-content:center}
.hintL,.hintR{position:absolute;top:50%;transform:translateY(-50%);font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;opacity:.5;font-weight:700}
.hintL{left:0;color:var(--checking)}.hintR{right:0;color:var(--savings)}
.tcard{width:min(100%,340px);background:var(--surface);border-radius:var(--r);border:var(--border);padding:22px 20px;display:flex;flex-direction:column;gap:10px;touch-action:pan-y;user-select:none;box-shadow:0 24px 60px rgba(0,0,0,.4);position:absolute;will-change:transform}
.tcard.back{transform:scale(.94) translateY(16px);opacity:.6;pointer-events:none}.tcard.back2{transform:scale(.88) translateY(30px);opacity:.3;pointer-events:none}
.tcard .vendor{font-family:var(--display);font-size:26px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.tcard .tamt{font-family:var(--mono);font-size:30px;font-weight:700}
.tcard .meta{font-family:var(--mono);font-size:11px;color:var(--muted);letter-spacing:.06em;font-weight:700}
.suggest{background:var(--surface2);border-radius:14px;padding:10px 12px;font-size:13px;display:flex;flex-direction:column;gap:6px;border-left:3px solid var(--bills)}
.suggest.rule{border-left-color:var(--green)}
.stamp{position:absolute;top:18px;font-family:var(--mono);font-size:14px;letter-spacing:.16em;border:3px solid;border-radius:8px;padding:4px 10px;transform:rotate(-14deg);opacity:0;transition:opacity .15s;font-weight:700}
.stamp.l{left:16px;color:var(--checking);border-color:var(--checking)}.stamp.r{right:16px;color:var(--savings);border-color:var(--savings);transform:rotate(14deg)}
.tcard.fly-l{transition:transform .45s var(--ease),opacity .45s;transform:translateX(-140%) rotate(-20deg)!important;opacity:0}
.tcard.fly-r{transition:transform .45s var(--ease),opacity .45s;transform:translateX(140%) rotate(20deg)!important;opacity:0}
.deckfoot{display:flex;gap:8px}
.done{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:20px}
.confetti{position:absolute;inset:0;pointer-events:none;overflow:hidden;z-index:3}
.confetti i{position:absolute;top:-10px;width:7px;height:11px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg);opacity:0}}
.lrow{background:var(--surface);border-radius:var(--r2);border:var(--border);padding:12px;display:flex;flex-direction:column;gap:8px;animation:fadein .4s var(--ease) both;box-shadow:var(--shadow)}
.lrow.out{transition:transform .35s var(--ease),opacity .35s;transform:translateX(30px);opacity:0}

/* sheet + toasts */
.scrim{position:absolute;inset:0;z-index:7;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-radius:var(--r) var(--r) 0 0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:14px 18px;display:flex;flex-direction:column;gap:10px;animation:sheetup .35s var(--spring) both;max-height:90%;overflow:auto;box-shadow:0 -10px 40px rgba(0,0,0,.4)}
@keyframes sheetup{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.sheet h3{font-family:var(--display);font-weight:800;font-size:20px;margin:0;letter-spacing:-.02em}
.field{display:grid;grid-template-columns:86px minmax(0,1fr);gap:8px;align-items:center;font-size:14px}
.field label{color:var(--muted)}
.splitrow{display:grid;grid-template-columns:minmax(0,1.2fr) 80px minmax(0,1fr);gap:6px;align-items:center}
.sum{display:flex;justify-content:space-between;font-family:var(--mono);font-size:13px;font-weight:700}
.sum.bad{color:var(--red)}.sum.ok{color:var(--green)}
#toasts{position:absolute;left:12px;right:12px;bottom:70px;z-index:11;display:flex;flex-direction:column;gap:6px;pointer-events:none;align-items:center}
.toast{background:var(--fg);color:var(--bg);border-radius:999px;padding:8px 14px;font-size:13px;font-weight:700;animation:toastin .35s var(--spring) both,toastout .3s ease-in 2.2s forwards;box-shadow:var(--shadow);display:flex;gap:8px;align-items:center}
.toast b{color:var(--green)}
@keyframes toastin{from{transform:translateY(12px) scale(.9);opacity:0}to{transform:none;opacity:1}}
@keyframes toastout{to{transform:translateY(-6px);opacity:0}}

/* flow: ledgers */
.ledger{font-family:var(--mono);font-size:11px;display:grid;grid-template-columns:40px minmax(0,1fr) 60px 64px;gap:3px 8px;align-items:center}
.ledger.one{grid-template-columns:36px minmax(0,1fr) 54px 54px 54px 54px;font-size:10px}
.ledger .h{color:var(--muted);font-size:9px;letter-spacing:.1em;font-weight:700;padding-bottom:2px;border-bottom:1px solid var(--line)}
.ledger .r{display:contents}
.ledger .r span{padding:4px 0;border-bottom:1px solid var(--line)}
.ledger .r.pay span{font-weight:700;color:var(--green)}
.ledger .r.planned span{color:var(--muted);font-style:italic}
.ledger .r.low span{color:var(--amber);font-weight:700}
.ledger .r.today span{border-bottom:2px dashed var(--fg);color:var(--fg);font-weight:700;background:var(--surface2)}
.ledger .r.untagged span:nth-child(2){color:var(--bills)}
.ledger .a{text-align:right}
.ledger .r.anim span{animation:txin .4s var(--ease) both}
.ledger .r .hot{background:var(--surface2);border-radius:4px;font-weight:700}
.ltable{width:100%;border-collapse:collapse;table-layout:fixed;font-family:var(--mono);font-size:11px;margin-top:8px}.ltable th{font-size:9px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700;text-align:left;padding:0 0 6px;border-bottom:1px solid var(--line)}.ltable td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top;overflow-wrap:anywhere}.ltable tr[data-tx]:not([data-tx=""]){cursor:pointer}.dc .it[data-tx]:not([data-tx=""]){cursor:pointer}.ltable th:nth-child(1),.ltable td:nth-child(1){width:40px;color:var(--muted)}.ltable th:nth-child(3),.ltable td:nth-child(3){width:58px}.ltable th:nth-child(n+4),.ltable td:nth-child(n+4){width:56px}.ltable .n{text-align:right;white-space:nowrap;padding-left:4px}.ltable .it{font-family:var(--body);font-size:13px;font-weight:600;padding-right:6px;line-height:1.3}.ltable .it .ldot{margin-right:5px}.ltable .dim{color:var(--muted);opacity:.6}.ltable .hot{font-weight:700}.ltable tr.pay td{color:var(--green);font-weight:700}.ltable tr.planned td{color:var(--muted);font-style:italic}.ltable tr.planned .hot{color:inherit}.ltable tr.low td{color:var(--amber)}.ltable tr.today td{border-bottom:2px dashed var(--fg);color:var(--fg);font-weight:700;background:var(--surface2)}.ltable tr.untagged .it{color:var(--bills)}
.ldot{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:middle}
/* flow: day cards */
.dc{background:var(--surface);border-radius:var(--r2);border:var(--border);padding:12px 14px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:8px;animation:fadein .4s var(--ease) both}
.dc.planned{background:transparent;box-shadow:none;border:1px dashed var(--line)}
.dc.past{opacity:.72}
.dc .dh{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:700}
.dc .mini{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.dc .mb{height:8px;border-radius:999px;background:var(--surface2);overflow:hidden}
.dc .mb i{display:block;height:100%;width:0;transition:width .7s var(--ease)}
.dc .ml{font-family:var(--mono);font-size:9px;font-weight:700;display:flex;justify-content:space-between}
.dc .it{display:flex;justify-content:space-between;align-items:center;font-size:13px;gap:8px}
.dc .it .a{font-family:var(--mono);font-weight:700}
.dc.today{outline:2px dashed var(--fg)}
.tag{display:inline-block;font-size:10px;border-radius:999px;padding:1px 7px;background:var(--surface2);color:var(--muted);margin-left:6px;vertical-align:middle;font-weight:700}
/* flow: transit */
.transit{position:relative;height:440px;background:var(--surface2);border-radius:18px;overflow:hidden}
.tline{position:absolute;top:16px;bottom:16px;width:6px;border-radius:3px}
.station{position:absolute;width:14px;height:14px;border-radius:50%;background:var(--surface);border:3px solid var(--fg);transform:translate(-50%,-50%);animation:pop .4s var(--spring) both}
.station.ghost{border-color:var(--red)}.station.past{opacity:.55}.station.money{background:var(--green);border-color:var(--green)}
.slabel{position:absolute;font-family:var(--mono);font-size:9px;color:var(--muted);white-space:nowrap;transform:translateY(-50%);font-weight:700}
.paybar{position:absolute;left:0;right:0;border-top:2px solid var(--green);font-family:var(--mono);font-size:9px;color:var(--green);padding:2px 8px;font-weight:700}
.train{position:absolute;width:18px;height:11px;border-radius:3px;background:var(--fg);transform:translate(-50%,-50%);z-index:2}
.train::before,.train::after{content:"";position:absolute;top:3px;width:4px;height:5px;background:var(--amber);border-radius:1px;left:3px}
.train::after{left:11px}
.tnav{display:flex;justify-content:space-between;align-items:center;font-family:var(--mono);font-size:11px;font-weight:700}

/* buckets */
.tiles{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.tile{background:var(--surface2);border-radius:var(--r2);border:var(--border);padding:12px;display:flex;flex-direction:column;gap:6px;cursor:pointer;animation:pop .4s var(--spring) both;position:relative;transform:scale(.8);opacity:0}
.tile .tr{width:56px;height:56px;border-radius:50%;background:conic-gradient(var(--st,var(--green)) var(--p,0%),var(--line) 0);display:grid;place-items:center;position:relative;transition:background .8s}
.tile .tr::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface2)}
.tile .tr span{position:relative;font-size:22px;line-height:1}
.tile .n{font-weight:800;font-size:13px}.tile .v{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:700}
.tile .s{font-family:var(--mono);font-size:9px;font-weight:700}
.tile.queue{background:linear-gradient(135deg,var(--bills),var(--violet));color:#fff}
.tile.queue .tr{background:rgba(255,255,255,.25)}.tile.queue .tr::after{background:rgba(0,0,0,.2)}.tile.queue .v{color:rgba(255,255,255,.8)}
.tile .edit{position:absolute;top:8px;right:10px;font-size:11px;color:var(--muted)}
.tile.cushion{background:transparent;border:1px dashed var(--line)}
.bk{display:flex;flex-direction:column;gap:6px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}
.bk:last-child{border-bottom:0}
.bk .bar{height:14px;border-radius:999px;background:var(--surface2);overflow:hidden;display:flex}
.bk .bar i{display:block;height:100%;width:0;transition:width .8s var(--ease)}
.bk .meta{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:700}
.bcbar{display:flex;height:34px;border-radius:10px;overflow:hidden;background:var(--surface2);position:relative}.bcbar i{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;font-weight:700;color:#0a0616;min-width:0;overflow:hidden;white-space:nowrap;cursor:pointer;transition:filter .2s}.bcbar i:hover{filter:brightness(1.15)}.bcbar i.cush{background:rgba(61,255,176,.25);color:var(--green);cursor:default}.bcbar .capv{position:absolute;top:-4px;bottom:-4px;border-left:2px dashed var(--fg);pointer-events:none}.matrix{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:0 12px;font-size:13px;align-items:center}.matrix>span{padding:7px 0;border-bottom:1px solid var(--line);white-space:nowrap}.matrix .h{font-family:var(--mono);font-size:9px;color:var(--muted);letter-spacing:.1em;font-weight:700;padding:0 0 6px}.matrix .r,.matrix .mono{text-align:right}.matrix .mono{font-weight:600}.matrix .tot{font-weight:800}.matrix .bk-cell{cursor:pointer;font-weight:700}.matrix .cushr{font-weight:700;color:var(--green)}.matrix .foot{border:0;font-weight:800;padding-top:8px}
.leg{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:11px;color:var(--muted)}.leg b{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:middle}
.braid{display:flex;flex-direction:column;align-items:center}
.pay{width:70%;background:var(--fg);color:var(--bg);text-align:center;border-radius:12px 12px 0 0;padding:8px;font-family:var(--mono);font-size:12px;font-weight:700}
.fan{width:100%;display:flex;gap:3px;height:130px}
.band{display:flex;flex-direction:column;justify-content:flex-end;align-items:center;border-radius:0 0 10px 10px;cursor:pointer;transform:scaleY(0);transform-origin:top;animation:grow .7s var(--ease) forwards;min-width:0;overflow:hidden;padding-bottom:6px;gap:2px}
@keyframes grow{to{transform:none}}
.band .n{font-size:10px;font-weight:800;color:#06251c;writing-mode:vertical-rl;transform:rotate(180deg)}
.band .v{font-family:var(--mono);font-size:9px;color:#06251c;font-weight:700}
.band .e{font-size:14px}
.res{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;align-items:end}
.rv{display:flex;flex-direction:column;align-items:center;gap:5px;cursor:pointer}
.rv .g{width:100%;height:150px;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;background:var(--surface2);position:relative;overflow:visible}
.rv .w{position:absolute;left:0;right:0;bottom:0;height:0;transition:height .9s var(--ease);border-radius:0 0 11px 11px}
.rv .w.pl{opacity:.35}
.rv .w.over{height:14px;top:-14px;bottom:auto;border-radius:6px 6px 0 0;animation:spill .8s var(--spring) both}
@keyframes spill{from{transform:scaleY(0);transform-origin:bottom}to{transform:none}}
.rv .nm{font-size:11px;font-weight:700}.rv .v{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:700}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.item .nm{font-size:14px;font-weight:600}.item .pr{font-family:var(--mono);font-size:14px;text-align:right;font-weight:700}
.item .sub{grid-column:1/-1;display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}
.segc{display:inline-flex;background:var(--surface2);border-radius:10px;padding:2px;gap:2px}
.segc button{font-size:12px;padding:6px 9px;border-radius:8px;color:var(--muted);font-weight:700}
.segc button[aria-pressed="true"]{background:var(--bg);color:var(--fg)}.segc button.kill[aria-pressed="true"]{color:var(--red)}
.delta{font-family:var(--mono);font-size:12px;font-weight:700}
.whatif{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.whatif .card{padding:10px 12px;box-shadow:none;background:var(--surface2)}
.whatif .v{font-family:var(--display);font-size:22px;font-weight:800;line-height:1.1}
.rule{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:13px}
.rule .cond{color:var(--muted);font-family:var(--mono);font-size:11px}.rule .to{font-family:var(--mono);font-size:12px;text-align:right;font-weight:700}
.testout{font-family:var(--mono);font-size:12px;color:var(--green);font-weight:700}
.emojis{display:flex;flex-wrap:wrap;gap:6px}
.emojis button{font-size:22px;width:44px;height:44px;border-radius:12px;background:var(--surface2)}
.emojis button.on{background:var(--bills)}

/* debts */
.cd{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.cdc{background:var(--surface2);border-radius:var(--r2);border:var(--border);padding:14px;display:flex;flex-direction:column;gap:6px;animation:pop .4s var(--spring) both;position:relative;overflow:hidden;transform:scale(.8);opacity:0}
.cdc .big{font-size:40px}
.cdc .ringc{position:absolute;right:10px;top:10px;width:46px;height:46px;border-radius:50%;background:conic-gradient(var(--checking) var(--p,0%),var(--line) 0)}
.cdc .ringc::after{content:"";position:absolute;inset:6px;border-radius:50%;background:var(--surface2)}
.cdc .n{font-weight:800;font-size:14px}.cdc .m{font-family:var(--mono);font-size:10px;color:var(--muted);font-weight:700}.cdc .flag{font-size:11px;font-weight:700;color:var(--red)}
.disc{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;background:var(--surface2);border-radius:12px;padding:8px 10px}
.disc.bad{border-left:3px solid var(--red)}.disc.ok{border-left:3px solid var(--green)}
.disc input{width:92px;padding:5px 8px;font-family:var(--mono);text-align:right}
input[type=range]{accent-color:var(--bills);padding:0;background:transparent;border:0}
.clockrow{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end}.gain{background:var(--surface2);border-radius:var(--r2);padding:10px 12px;text-align:right;opacity:.35;transition:opacity .3s,transform .3s}.gain.on{opacity:1;transform:scale(1.03);box-shadow:0 0 0 1px rgba(61,255,176,.4),0 0 24px rgba(61,255,176,.25)}

/* plan */
.opt{background:var(--surface2);border-radius:var(--r2);padding:12px 14px;display:flex;flex-direction:column;gap:4px;border-left:3px solid var(--line);animation:fadein .4s var(--ease) both;cursor:pointer}
.opt.best{border-left-color:var(--green);background:rgba(46,230,166,.08)}.opt.bad{border-left-color:var(--red);opacity:.8}.opt.on{outline:2px solid var(--bills)}
.opt .t{font-weight:800;display:flex;justify-content:space-between;gap:8px}.opt .c{font-size:12px;color:var(--muted)}
.opt .k{font-family:var(--mono);font-size:11px;font-weight:700}
.plan{display:flex;flex-direction:column;gap:6px;padding:12px 0;border-bottom:1px solid var(--line)}
.plan:last-child{border-bottom:0}
.plan .bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}.plan .bar i{display:block;height:100%;background:var(--g-free);width:0;transition:width .8s var(--ease)}

nav{display:flex;background:var(--bg);padding-bottom:max(10px,env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav button{flex:1;padding-block:10px 10px;font-size:12px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:4px;position:relative;font-weight:700}
nav button[aria-selected="true"]{color:var(--fg)}
nav button i{display:block;width:22px;height:4px;border-radius:2px;background:transparent;transition:background .2s}
nav button[aria-selected="true"] i{background:var(--bills)}
nav .badge{position:absolute;top:6px;right:14%;background:var(--bills);color:#fff;font-family:var(--mono);font-size:9px;border-radius:999px;padding:1px 5px}


/* debts + plan variants */
.kl{display:flex;flex-direction:column;gap:6px}
.kli{display:grid;grid-template-columns:28px minmax(0,1fr) auto;gap:10px;align-items:center;padding:10px 12px;background:var(--surface2);border-radius:var(--r2);animation:txin .4s var(--ease) both}
.kli .nm{font-weight:800}.kli .m{font-family:var(--mono);font-size:11px;color:var(--muted);font-weight:700}
.kli.next{outline:2px solid var(--green)}.kli.dead .nm{text-decoration:line-through;color:var(--muted)}
.kli .chk{width:22px;height:22px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:12px}
.kli.dead .chk{background:var(--green);border-color:var(--green);color:#06251c}
.ladder{position:relative;padding-left:40px;display:flex;flex-direction:column;gap:14px}
.ladder::before{content:"";position:absolute;left:14px;top:0;bottom:0;width:4px;background:var(--line);border-radius:2px}
.rung{position:relative;background:var(--surface2);border-radius:var(--r2);padding:10px 12px;display:flex;justify-content:space-between;align-items:center;animation:fadein .4s var(--ease) both}
.rung::before{content:"";position:absolute;left:-32px;top:50%;width:16px;height:16px;border-radius:50%;background:var(--surface2);border:3px solid var(--line);transform:translateY(-50%)}
.rung.you::before{background:var(--green);border-color:var(--green);box-shadow:0 0 14px var(--green)}
.rung.dead{opacity:.55}.rung.dead::before{background:var(--line)}
.rung.top{background:var(--g-free);color:#06251c}
.clock{font-family:var(--mono);font-size:30px;font-weight:700;letter-spacing:.04em;text-align:center}
.clock small{font-size:11px;color:var(--muted);display:block;letter-spacing:.14em}
.rings{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.rg{display:flex;flex-direction:column;align-items:center;gap:4px}
.rg .r{width:60px;height:60px;border-radius:50%;background:conic-gradient(var(--checking) var(--p,0%),var(--line) 0);position:relative;display:grid;place-items:center}
.rg .r::after{content:"";position:absolute;inset:7px;border-radius:50%;background:var(--surface)}
.rg .r span{position:relative;font-family:var(--mono);font-size:11px;font-weight:700}
.rg .n{font-size:11px;font-weight:700}
.leak{position:relative;height:150px;background:var(--surface2);border-radius:var(--r2);overflow:hidden}
.leak .src{position:absolute;left:50%;top:10px;transform:translateX(-50%);font-family:var(--mono);font-size:11px;font-weight:700;color:var(--red)}
.leak .drop{position:absolute;top:30px;width:6px;height:10px;border-radius:50% 50% 60% 60%;background:var(--red);animation:dropf 1.4s linear infinite}
@keyframes dropf{0%{transform:translateY(0);opacity:0}10%{opacity:1}100%{transform:translateY(120px);opacity:0}}
.leak .pool{position:absolute;left:0;right:0;bottom:0;height:18px;background:var(--red);opacity:.5}
.tug{position:relative;height:60px;margin:10px 0}
.tug .rope{position:absolute;left:0;right:0;top:50%;border-top:3px dashed var(--line)}
.tug .mark{position:absolute;top:50%;width:18px;height:18px;border-radius:50%;background:var(--fg);transform:translate(-50%,-50%);transition:left .8s var(--spring);box-shadow:0 0 14px var(--fg)}
.tug .side{position:absolute;top:0;font-family:var(--mono);font-size:10px;font-weight:700}
.grave{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;align-items:end}
.stone{background:var(--surface2);border-radius:40px 40px 6px 6px;padding:18px 8px 10px;text-align:center;display:flex;flex-direction:column;gap:3px;border:1px solid var(--line);animation:pop .4s var(--spring) both;transform:scale(.8);opacity:0}
.stone.alive{background:transparent;border-style:dashed}
.stone .n{font-size:11px;font-weight:800}.stone .m{font-family:var(--mono);font-size:9px;color:var(--muted);font-weight:700}
.wf{display:flex;gap:6px;align-items:flex-end;height:160px}
.wf .wc{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.wf .wb{width:100%;border-radius:6px 6px 0 0;background:var(--checking);transition:height .9s var(--ease);position:relative}
.wf .pour{position:absolute;right:-6px;top:-8px;width:6px;height:0;background:var(--green);border-radius:3px;animation:pour 2s ease-in-out infinite}
@keyframes pour{0%,20%{height:0}60%,100%{height:40px}}
.wf .n{font-family:var(--mono);font-size:9px;font-weight:700;color:var(--muted);text-align:center}
.cal24{display:grid;grid-template-columns:repeat(12,1fr);gap:3px}
.cal24 .c{aspect-ratio:1;border-radius:4px;background:var(--surface2);font-family:var(--mono);font-size:8px;display:grid;place-items:center;color:var(--muted);position:relative}
.cal24 .c.kill{background:var(--green);color:#06251c;font-weight:700}
.cal24 .c.now{outline:2px solid var(--fg)}
.wiz{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.wiz .q{font-family:var(--display);font-size:26px;font-weight:800;letter-spacing:-.02em}
.wiz .steps{display:flex;gap:4px}.wiz .steps i{flex:1;height:4px;border-radius:2px;background:var(--line)}.wiz .steps i.on{background:var(--bills)}
.splitbar{display:flex;height:34px;border-radius:999px;overflow:hidden;background:var(--surface2)}
.splitbar i{display:block;height:100%;transition:width .4s var(--ease);min-width:0}
.srcrow{display:grid;grid-template-columns:minmax(0,1fr) auto auto auto;gap:8px;align-items:center;font-size:13px;padding:8px 0;border-bottom:1px solid var(--line)}
.srcrow .pm{width:34px;height:34px;border-radius:10px;background:var(--surface2);font-weight:800;font-size:16px}
.runwayp{position:relative;height:90px;margin:14px 0 6px}
.runwayp .tr{position:absolute;left:0;right:0;top:40px;height:14px;border-radius:999px;background:var(--surface2);overflow:hidden}
.runwayp .tr i{position:absolute;left:0;top:0;bottom:0;width:0;transition:width 1.2s var(--ease)}
.runwayp .tick{position:absolute;top:30px;width:2px;height:34px;background:var(--line)}
.runwayp .tick span{position:absolute;top:36px;left:-14px;font-family:var(--mono);font-size:8px;color:var(--muted);width:30px;text-align:center}
.runwayp .flag{position:absolute;top:0;transform:translateX(-50%);font-family:var(--mono);font-size:9px;font-weight:700;white-space:nowrap}
.chat{display:flex;flex-direction:column;gap:8px}
.bub{max-width:85%;padding:10px 12px;border-radius:16px;font-size:14px;animation:fadein .4s var(--ease) both}
.bub.app{background:var(--surface2);align-self:flex-start;border-bottom-left-radius:4px}
.bub.me{background:var(--bills);color:#fff;align-self:flex-end;border-bottom-right-radius:4px}
.swipecard{background:var(--surface2);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:8px;position:relative;box-shadow:var(--shadow);animation:pop .4s var(--spring) both;transform:scale(.9);opacity:0}
.swipecard .t{font-family:var(--display);font-size:22px;font-weight:800}
.jar{width:140px;height:170px;margin:0 auto;border:3px solid var(--line);border-top:0;border-radius:0 0 40px 40px;position:relative;overflow:hidden;background:var(--surface2)}
.jar .lay{position:absolute;left:0;right:0;height:0;transition:height 1s var(--ease)}
.jar .lab{position:absolute;left:0;right:0;text-align:center;font-family:var(--mono);font-size:9px;font-weight:700;color:#06251c}
.ptable{display:grid;grid-template-columns:minmax(0,1.2fr) auto auto;gap:4px 10px;font-size:12px}
.ptable .h{font-family:var(--mono);font-size:9px;letter-spacing:.1em;color:var(--muted);font-weight:700;border-bottom:1px solid var(--line);padding-bottom:4px}
.ptable span{padding:6px 0;border-bottom:1px solid var(--line)}
.tree{display:flex;flex-direction:column;gap:10px}
.node{background:var(--surface2);border-radius:var(--r2);padding:12px;display:flex;flex-direction:column;gap:8px;animation:fadein .4s var(--ease) both}
.node .qq{font-weight:800}
.node.leaf{background:rgba(46,230,166,.12);outline:2px solid var(--green)}
/* neon colorways + cyberpunk effects */
:root[data-skin="neon"][data-neon="acid"]{--bills:#c7ff3d;--savings:#3dff8a;--checking:#ffe93d;--violet:#8dff5a;--red:#ff4d6d;--g-free:linear-gradient(90deg,#3dff8a,#c7ff3d);--shadow:0 12px 40px rgba(199,255,61,.18)}

:root[data-skin="neon"][data-neon="magenta"]{--bills:#ff4fd8;--savings:#3dffb0;--checking:#ffd23f;--violet:#ff2d95;--g-free:linear-gradient(90deg,#3dffb0,#ff4fd8);--shadow:0 12px 40px rgba(255,79,216,.25)}
:root[data-fx~="grid"] main{background-image:linear-gradient(rgba(192,77,255,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(192,77,255,.08) 1px,transparent 1px);background-size:28px 28px;background-position:center bottom}
:root[data-fx~="glitch"] header h1{position:relative;animation:glitch 4s steps(1) infinite}
:root[data-fx~="glitch"] header h1::before,:root[data-fx~="glitch"] header h1::after{content:attr(data-t);position:absolute;left:0;top:0;opacity:.7;pointer-events:none}
:root[data-fx~="glitch"] header h1::before{color:var(--bills);transform:translate(-2px,0);clip-path:inset(0 0 55% 0);animation:gl1 3s steps(1) infinite}
:root[data-fx~="glitch"] header h1::after{color:var(--violet);transform:translate(2px,0);clip-path:inset(55% 0 0 0);animation:gl2 2.7s steps(1) infinite}
@keyframes glitch{0%,94%,100%{transform:none}95%{transform:translate(1px,-1px)}97%{transform:translate(-1px,1px)}}
@keyframes gl1{0%,90%,100%{opacity:0}92%,96%{opacity:.7}}
@keyframes gl2{0%,88%,100%{opacity:0}90%,94%{opacity:.7}}
:root[data-fx~="brackets"] .card{position:relative}
:root[data-fx~="brackets"] .card::before,:root[data-fx~="brackets"] .card::after{content:"";position:absolute;width:14px;height:14px;border:2px solid var(--bills);pointer-events:none;opacity:.8}
:root[data-fx~="brackets"] .card::before{left:6px;top:6px;border-right:0;border-bottom:0;border-radius:4px 0 0 0}
:root[data-fx~="brackets"] .card::after{right:6px;bottom:6px;border-left:0;border-top:0;border-radius:0 0 4px 0}
:root[data-fx~="pulse"] .card{box-shadow:var(--shadow),inset 0 0 0 1px rgba(255,255,255,.04);animation:cardpulse 6s ease-in-out infinite}

:root[data-fx~="chroma"] .big,:root[data-fx~="chroma"] .amt{text-shadow:-2px 0 rgba(61,214,255,.6),2px 0 rgba(255,79,216,.6),0 0 18px rgba(61,255,176,.35)}
.fxrow{display:flex;flex-wrap:wrap;gap:6px}

<body>
<div id="app">
  <header>
    <div class="row" style="gap:10px"><div class="dot" id="dot"></div><h1 id="title">Am I green?</h1></div>
    <div class="row" style="gap:6px"><span class="streak"><svg viewBox="0 0 12 14" aria-hidden="true"><path d="M6 0c1 3 4 4 4 8a4 4 0 0 1-8 0c0-2 1-3 2-4 0 2 1 3 2 3 1-2-1-4 0-7z" fill="currentColor"/></svg><span id="streakN">0</span></span><button class="pill" id="lookBtn" style="color:var(--fg)">look</button><button class="pill" id="skinBtn" style="color:var(--fg)">⚙</button><button class="pill sample" id="syncPill">connect</button></div>
  </header>
  <main>
    <div class="view" id="v-green"></div>
    <div class="view" id="v-flow" hidden></div>
    <div class="view" id="v-buckets" hidden></div>
    <div class="view" id="v-debts" hidden></div>
    <div id="deck" hidden></div>
    <div id="acct" hidden></div>
    <div id="sheets"></div>
    <div id="toasts"></div>
  </main>
  <nav role="tablist">
    <button role="tab" aria-selected="true" data-v="green"><i></i>Home</button>
    <button role="tab" aria-selected="false" data-v="flow"><i></i>Activity</button>
    <button role="tab" aria-selected="false" data-v="buckets"><i></i>Buckets<span class="badge" id="badgeTag" hidden>0</span></button>
    <button role="tab" aria-selected="false" data-v="debts"><i></i>Debts</button>
  </nav>
</div>
<script>
(function(){
'use strict';
// ============================================================
// Am I Green — the app. Reads the vault through the GitHub API.
// Data in: data/ledger.json (courier). Decisions out: config/*.json, data/tags.json, data/state.json.
// ============================================================
const BUILD='build 21';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>(n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const fmt2=n=>(n<0?'−':'')+'$'+Math.abs(n).toFixed(2);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ds=x=>MON[x.getMonth()]+' '+x.getDate();
const dsh=x=>(x.getMonth()+1)+'/'+x.getDate();
const dow=x=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][x.getDay()];
const days=(a,b)=>Math.round((b-a)/86400000);
const addDays=(x,n)=>{const y=new Date(x);y.setDate(y.getDate()+n);return y;};
const same=(a,b)=>a.toDateString()===b.toDateString();
const midnight=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
const parseISO=s=>{if(!s)return null;const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d);};
const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
const lastDay=(y,m)=>new Date(y,m+1,0).getDate();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const qs=new URLSearchParams(location.search);

// ---------- diagnostics: every stage logs; the log is readable in Settings ----------

function nextPayAfter(x){const dsx=CONF.income.days.slice().sort((a,b)=>a-b);for(let k=0;k<3;k++){const y=x.getFullYear(),m=x.getMonth()+k;for(const dd of dsx){const c=new Date(y,m,Math.min(dd,lastDay(y,m)));if(c>x)return c;}}return addDays(x,15);}

    if(!b&&a>0&&CONF.income.match.some(k=>(p.name||'').toLowerCase().includes(k))){b=laneDefault[lane];t='income';}

function untagged(all){return txns.filter(t=>t.st==='posted'&&!t.b&&(all||!WIN||t.date>=WIN.from));}

function verdictText(ctx){const {st,S,flags,u,ghosts,redB,ambB,daysToPay,streak,isPayday,freeBoth}=ctx;const n=x=>`<b class="vn ${x<0?'c-red':x<60?'c-amber':'c-green'}">${fmt(x)}</b>`;const nb=x=>`<b class="vn">${fmt(x)}</b>`;const p=[];

  return p.join(' ');}

function openDay(x){const list=txns.filter(t=>same(t.date,x));const map=balancesByDay(addDays(TODAY,-40),addDays(TODAY,40));const b=map.get(x.toDateString())||BAL;sheet(`<h3>${dow(x)} ${ds(x)} · ${x<=TODAY?'posted':'planned'}</h3><div class="stack">${list.length?list.map(t=>`<div class="row" style="font-size:14px"><span><i style="display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--${t.lane});margin-right:8px"></i>${esc(t.n)}${t.b?`<span class="tag">${bemo(t.b)} ${bname(t.b)}</span>`:'<span class="tag c-bills">tag it</span>'}</span><span class="mono ${t.a>0?'c-green':''}">${fmt2(t.a)}</span></div>`).join(''):'<div class="muted">Nothing moves.</div>'}<div class="row" style="border-top:1px solid var(--line);padding-top:8px;font-family:var(--mono);font-size:12px;font-weight:700"><span class="c-checking">chk ${fmt(b.checking)}</span><span class="c-bills">bills ${fmt(b.bills)}</span><span class="c-savings">save ${fmt(b.savings)}</span></div></div><button class="btn ghost" data-close>Close</button>`);}

let deckQueue=[],cur=null,deckReturn='buckets',pickedSub=null,qscope='untagged';
function queueFor(){if(qscope==='untagged')return untagged();const all=txns.filter(t=>t.st==='posted'&&!t.split);return (qscope==='month'?all.filter(t=>t.date>=WIN.from):all).sort((a,b)=>b.date-a.date);}
function openDeck(ret){deckReturn=ret||'buckets';deckQueue=queueFor();combo=0;$('#deck').hidden=false;renderCard();}
function closeDeck(){$('#deck').hidden=true;show(deckReturn);}
function pettyTags(){return CONF.pettyTags||Object.keys(CONF.petty);}
function bucketChips(lane){return BUCKETS.filter(b=>b.lane==='bills').map(b=>`<button class="chip" data-tag="${b.id}|${b.id}">${b.e} ${b.n}</button>`).join('');}
function allChips(t){return `<div class="chips"><span class="muted" style="font-size:11px;align-self:center">petty</span>${pettyTags().map(k=>`<button class="chip" data-tag="petty|${k}">${k}</button>`).join('')}</div><div class="chips"><button class="chip good" data-tag="stash|stash">🧦 Stash</button><button class="chip" data-tag="transfer|transfer">↔️ Transfer</button><button class="chip" data-tag="lake|lake">🛡️ War chest</button></div><div class="chips"><span class="muted" style="font-size:11px;align-self:center">bills</span>${bucketChips()}</div><div class="chips"><button class="chip" data-tag="ghost|dispute">👻 Dispute</button><button class="chip" data-split>Split</button><button class="chip" data-rule>Make a rule</button></div>`;}
function lineChips(b){const lines=(bk(b).lines||[]);if(!lines.length)return '';return `<div class="suggest rule"><b>Which ${bname(b)} line?</b><span class="muted">So the planned pull and this one match up.</span><div class="chips">${lines.map(l=>`<button class="chip" data-tag="${b}|${esc(l.key)}">${esc(l.n)} <span class="muted">${fmt(Math.abs(l.amount))}</span></button>`).join('')}<button class="chip" data-tag="${b}|${b}">just ${bname(b)}</button></div></div>`;}
function suggestFor(t){const r=matchRule(t);
  if(r&&r.split)return `<div class="suggest rule"><b>Remembered split: ${esc(r.n)}</b><span class="muted">${r.split.map(s=>esc(s.n.split(' ·')[0])+' '+fmt(-s.a)).join(' + ')}</span><div class="chips"><button class="chip good on" data-splitgo>Yes, split it</button><button class="chip" data-split>Edit</button></div></div>`;
  if(r)return `<div class="suggest rule"><b>Rule: ${esc(r.n)}</b><span class="muted">${esc(r.vendor)} · $${r.amin}–${r.amax} · days ${r.dmin}–${r.dmax} → ${bemo(r.b)} ${bname(r.b)}</span><div class="chips"><button class="chip good on" data-tag="${r.b}|${r.t}">Yes, ${bname(r.b)}</button><button class="chip" data-split>Split it</button></div></div>`;
  if(alt.deck===0)return `<div class="suggest"><b>Tap the card to tag it.</b><span class="muted">${t.lane==='checking'?'Or swipe: left is petty · other, right is stash.':'One sheet, pick where it goes.'}</span></div>`;return `<div class="suggest"><b>Where does this go?</b>${allChips(t)}</div>`;}
function wireTagButtons(root,t,afterFly){let sub=null;const wire=()=>{root.querySelectorAll('[data-tag]').forEach(b=>b.onclick=e=>{e.stopPropagation();const [bb,tg]=b.dataset.tag.split('|');if(bb==='petty'){sub=tg;}if(bb===tg&&bk(bb)&&(bk(bb).lines||[]).length&&!b.closest('.suggest.rule')){const box=root.querySelector('.suggest');if(box){box.outerHTML=lineChips(bb);wire();return;}}afterFly(()=>commitTag(t,bb,tg));});root.querySelectorAll('[data-split]').forEach(b=>b.onclick=()=>openSplit(t));root.querySelectorAll('[data-splitgo]').forEach(b=>b.onclick=()=>{const r=matchRule(t);applySplit(t,r.split);});root.querySelectorAll('[data-rule]').forEach(b=>b.onclick=()=>openRuleBuilder(t));};wire();return ()=>sub;}
function renderCard(){const deck=$('#deck');
  if(!deckQueue.length){deck.innerHTML=`<div class="deckhead"><h2>Tag it</h2><span class="pill">done</span></div><div class="deckarea"><div class="confetti" id="conf"></div><div class="done fadein"><div class="big grad">All filed.</div><div class="muted">Streak ${streakNow()}. Every bucket knows what it's holding.</div><button class="btn good" id="deckDone">Back</button></div></div>`;$('#deckDone').onclick=closeDeck;confetti();return;}
  if(alt.deck===1){renderDeckList();return;}
  cur=deckQueue[0];pickedSub=null;const isChk=cur.lane==='checking';const back=deckQueue[1]?`<div class="tcard back"><div class="vendor">${esc(deckQueue[1].n)}</div><div class="tamt">${fmt2(deckQueue[1].a)}</div></div>`:'';const back2=deckQueue[2]?`<div class="tcard back2"><div class="vendor">${esc(deckQueue[2].n)}</div></div>`:'';
  deck.innerHTML=`<div class="deckhead"><h2>Tag it</h2><div class="row" style="gap:6px">${altBar('deck')}<span class="pill">${deckQueue.length} left</span></div></div><div class="deckarea">${isChk?'<span class="hintL">← petty</span><span class="hintR">stash →</span>':''}${back2}${back}<div class="tcard" id="card"><span class="stamp l" id="stL">PETTY</span><span class="stamp r" id="stR">STASH</span><div class="meta">${dow(cur.date).toUpperCase()} ${ds(cur.date).toUpperCase()} · ${CONF.lanes[cur.lane].n.toUpperCase()}${cur.pend?' · PENDING':''}${cur.ghost?' · <span class="c-red">GHOST</span>':''}</div><div class="vendor">${esc(cur.n)}</div><div class="muted mono" style="font-size:10px">${esc(cur.raw||'')}</div><div class="tamt">${fmt2(cur.a)}</div>${suggestFor(cur)}</div></div><div class="deckfoot"><button class="btn ghost" id="skip">Skip</button><button class="btn" id="later" style="flex:1">Later</button></div>`;
  wireAlts(deck,renderCard);$('#skip').onclick=()=>{deckQueue.push(deckQueue.shift());renderCard();};$('#later').onclick=closeDeck;
  const getSub=wireTagButtons($('#card'),cur,then=>fly('r',then));$('#card').querySelector('.vendor').onclick=()=>openTagSheet(cur,()=>{deckQueue=queueFor();renderCard();});if(isChk){$('#card').querySelectorAll('[data-tag^="petty|"]').forEach(b=>b.onclick=e=>{e.stopPropagation();$('#card').querySelectorAll('[data-tag^="petty|"]').forEach(x=>x.classList.remove('on'));b.classList.add('on');pickedSub=b.dataset.tag.split('|')[1];});swipe($('#card'),dir=>{fly(dir,()=>commitTag(cur,dir==='l'?'petty':'stash',dir==='l'?(pickedSub||'other'):'stash'));},()=>openTagSheet(cur,()=>{deckQueue=queueFor();renderCard();}));}else{swipe($('#card'),()=>{},()=>openTagSheet(cur,()=>{deckQueue=queueFor();renderCard();}));}}
function renderDeckList(){const deck=$('#deck');const seg=`<div class="qseg"><button aria-pressed="${qscope==='untagged'}" data-q="untagged">Untagged · ${untagged().length}</button><button aria-pressed="${qscope==='month'}" data-q="month">This month</button><button aria-pressed="${qscope==='all'}" data-q="all">Everything · ${txns.filter(t=>t.st==='posted'&&!t.split).length}</button></div>`;
  deck.innerHTML=`<div class="deckhead"><h2>Tag it</h2><div class="row" style="gap:6px">${altBar('deck')}</div></div>${seg}<div class="muted" style="font-size:12px;margin:6px 0 2px">Tap a row. One sheet, pick where it goes. Tap again to change it.</div><div class="stack" id="lrows" style="gap:6px">${deckQueue.length?deckQueue.map((t,i)=>`<div class="qrow" data-id="${esc(t.id)}" style="animation-delay:${Math.min(i,20)*25}ms"><div><div class="n">${esc(t.n)}</div><div class="m">${dow(t.date)} ${ds(t.date)} · ${CONF.lanes[t.lane].n}${t.pend?' · pending':''}</div></div><div><div class="a ${t.a>0?'c-green':''}">${fmt2(t.a)}</div><div class="tl ${t.b?'':'none'}">${t.b?tagLabel(t):'untagged'}</div></div></div>`).join(''):'<div class="card muted">Nothing here.</div>'}</div><div class="deckfoot"><button class="btn" id="later" style="flex:1">Done</button></div>`;
  wireAlts(deck,renderCard);$('#later').onclick=closeDeck;deck.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{qscope=b.dataset.q;deckQueue=queueFor();renderCard();});
  deck.querySelectorAll('.qrow').forEach(row=>{row.onclick=()=>{const t=txns.find(x=>String(x.id)===row.dataset.id);if(t)openTagSheet(t,()=>{deckQueue=queueFor();renderCard();});};});}
function swipe(card,onSwipe,onTap){let x0=null,dx=0,moved=false;card.addEventListener('pointerdown',e=>{if(e.target.closest('button'))return;x0=e.clientX;dx=0;moved=false;card.setPointerCapture(e.pointerId);card.style.transition='none';});card.addEventListener('pointermove',e=>{if(x0===null)return;dx=e.clientX-x0;if(Math.abs(dx)>6)moved=true;card.style.transform=`translateX(${dx}px) rotate(${dx/18}deg)`;$('#stL').style.opacity=Math.min(1,-dx/70);$('#stR').style.opacity=Math.min(1,dx/70);});const end=()=>{if(x0===null)return;const d0=dx;x0=null;dx=0;if(Math.abs(d0)>80){onSwipe(d0<0?'l':'r');}else{card.style.transition='transform .35s var(--spring)';card.style.transform='';$('#stL').style.opacity=0;$('#stR').style.opacity=0;if(!moved&&onTap)onTap();}};card.addEventListener('pointerup',end);card.addEventListener('pointercancel',end);}
function fly(dir,then){const c=$('#card');if(!c||reduced){then();return;}c.classList.add(dir==='l'?'fly-l':'fly-r');setTimeout(then,380);}
function commitTag(t,b,tag){TAGS[t.id]={b,t:tag};persist('data/tags.json',TAGS,`tag: ${t.n} → ${b}`);tagged++;combo++;rebuild();deckQueue=queueFor();toast(combo>=3?`Combo <b>×${combo}</b> · ${bemo(b)} ${bname(b)}`:`Tagged · <b>${bemo(b)} ${bname(b)}</b>`);renderCard();offerSiblings(t,b,tag);}
function offerSiblings(t,b,tag){if(!t.vkey||t.vkey.length<3)return;const sib=untagged(true).filter(x=>x.vkey===t.vkey&&x.lane===t.lane&&String(x.id)!==String(t.id));if(!sib.length)return;const tot=sib.reduce((s,x)=>s+x.a,0);const inQ=sib.filter(x=>x.date>=WIN.from).length;sheet(`<h3>${sib.length} more from ${esc(t.n)}</h3><div class="muted" style="font-size:13px">Same vendor, still untagged${inQ<sib.length?` (${inQ} this month, ${sib.length-inQ} older)`:''}. ${fmt(tot)} total. Tag them all <b>${bemo(b)} ${bname(b)}${tag&&tag!==b?' · '+esc(tag):''}</b>?</div><div class="stack" style="max-height:30vh;overflow:auto;font-size:13px">${sib.slice(0,8).map(x=>`<div class="row"><span>${ds(x.date)} <span class="muted">${esc(x.n)}</span></span><span class="mono">${fmt2(x.a)}</span></div>`).join('')}${sib.length>8?`<div class="muted">… and ${sib.length-8} more</div>`:''}</div><div class="row" style="gap:8px"><button class="btn primary" id="sibYes" style="flex:1">Yes, all ${sib.length}</button><button class="btn ghost" id="sibNo" style="flex:1">Just this one</button></div>`,sh=>{sh.querySelector('#sibNo').onclick=closeSheet;sh.querySelector('#sibYes').onclick=()=>{sib.forEach(x=>TAGS[x.id]={b,t:tag});persist('data/tags.json',TAGS,`tag ×${sib.length}: ${t.n} → ${b}`);tagged+=sib.length;closeSheet();rebuild();deckQueue=queueFor();toast(`Tagged <b>${sib.length}</b> more · ${bemo(b)} ${bname(b)}`);renderCard();};});}
function confetti(){const c=$('#conf');if(!c||reduced)return;const cols=['var(--checking)','var(--bills)','var(--savings)','var(--violet)'];for(let i=0;i<70;i++){const s=document.createElement('i');s.style.left=Math.random()*100+'%';s.style.background=cols[i%4];s.style.animationDelay=(Math.random()*.6)+'s';s.style.animationDuration=(1.2+Math.random())+'s';c.appendChild(s);}}
function applySplit(t,rows){const parts=rows.filter(r=>r.a!==0).map(r=>({n:r.n,a:r.a,b:r.b,t:r.t||r.n.toLowerCase()}));TAGS[t.id]={split:parts};persist('data/tags.json',TAGS,`split: ${t.n}`);tagged++;combo++;rebuild();deckQueue=queueFor();toast(`Split <b>${parts.length} ways</b>`);renderCard();}

function openSplit(t){const total=-t.a;const half=Math.round(total/2*100)/100;const rowHTML=(n,a,b)=>`<div class="splitrow"><input value="${esc(n)}" placeholder="who / what" aria-label="Name"><input type="number" inputmode="decimal" step="0.01" value="${a}" aria-label="Amount" class="mono samt"><select aria-label="Bucket">${bucketOptions(b)}</select></div>`;sheet(`<h3>Split ${fmt(t.a)} · ${esc(t.n)}</h3><div class="muted" style="font-size:13px">Two people, two buckets. Amounts have to add up.</div><div class="stack" id="splitrows">${rowHTML('',half,'care')}${rowHTML('',(total-half).toFixed(2),'care')}</div><button class="btn small ghost" id="addrow">+ another</button><div class="sum" id="splitsum"></div><label class="row" style="font-size:12px;gap:8px;justify-content:flex-start"><input type="checkbox" id="remember" style="width:auto" checked> Remember: ${esc(t.n.split(' ')[0])} ${fmt(total)} around the ${t.date.getDate()}th splits like this</label><div class="row"><button class="btn primary" id="splitOk" style="flex:1">Tag them</button><button class="btn ghost" data-close>Cancel</button></div>`,sh=>{const upd=()=>{const s=[...sh.querySelectorAll('.samt')].reduce((a,i)=>a+(+i.value||0),0);const el=sh.querySelector('#splitsum');const ok=Math.abs(s-total)<0.005;el.className='sum '+(ok?'ok':'bad');el.innerHTML=`<span>sum</span><span>${fmt2(s)} of ${fmt2(total)}${ok?' ✓':' · off by '+fmt2(total-s)}</span>`;sh.querySelector('#splitOk').disabled=!ok;sh.querySelector('#splitOk').style.opacity=ok?1:.5;};sh.addEventListener('input',upd);upd();sh.querySelector('#addrow').onclick=()=>{sh.querySelector('#splitrows').insertAdjacentHTML('beforeend',rowHTML('',0,'care'));upd();};sh.querySelector('#splitOk').onclick=()=>{const rows=[...sh.querySelectorAll('.splitrow')].map(r=>({n:r.children[0].value||bname(r.children[2].value),a:-(+r.children[1].value||0),b:r.children[2].value}));if(sh.querySelector('#remember').checked){RULES.push({id:Date.now(),n:'Split · '+rows.map(r=>r.n.split(' ·')[0]).join(' + '),vendor:(t.raw||t.n).split(' ')[0],amin:total-10,amax:total+10,dmin:Math.max(1,t.date.getDate()-3),dmax:Math.min(31,t.date.getDate()+3),lane:t.lane,b:rows[0].b,t:'split',split:rows});persist('config/rules.json',RULES,'rule: split');}closeSheet();applySplit(t,rows);};});}
const TAGCOLS={grocery:'🛒',fun:'🎟️',transportation:'🚌',other:'📦'};
function tagLabel(t){if(!t.b)return '';if(t.b==='petty')return (TAGCOLS[t.t]||'🛒')+' '+(t.t||'petty');if(t.t&&t.t!==t.b){const b=bk(t.b);const l=b&&(b.lines||[]).find(x=>x.key===t.t);return bemo(t.b)+' '+(l?l.n:t.t);}return bemo(t.b)+' '+bname(t.b);}

function commitTagQuiet(t,b,tag){TAGS[t.id]={b,t:tag};persist('data/tags.json',TAGS,`tag: ${t.n} → ${b}`);tagged++;rebuild();toast(`<b>${tagLabel({...t,b,t:tag})}</b>`);}
function openRuleBuilder(t){const amt=t?-t.a:95,day=t?t.date.getDate():10,vendor=t?(t.raw||t.n).split(' ').slice(0,2).join(' '):'';const defB=t&&t.lane==='checking'?'petty':(BUCKETS.find(b=>b.lane==='bills')||{}).id;sheet(`<h3>${t?'Make a rule from this':'New rule'}</h3><div class="muted" style="font-size:13px">Vendor is one clue (use | for alternatives). Amount range and day of month are the ones the bank can't do.</div><div class="field"><label for="rn">Name</label><input id="rn" value="${esc(vendor)}"></div><div class="field"><label for="rv">Vendor has</label><input id="rv" value="${esc(vendor)}"></div><div class="field"><label>Amount</label><div class="row" style="gap:6px"><input id="ra" type="number" inputmode="decimal" value="${Math.max(0,Math.floor(amt*.9))}" aria-label="Min amount" class="mono"><span class="muted">to</span><input id="rb" type="number" inputmode="decimal" value="${Math.ceil(amt*1.1)}" aria-label="Max amount" class="mono"></div></div><div class="field"><label>Day of month</label><div class="row" style="gap:6px"><input id="rc" type="number" value="${Math.max(1,day-3)}" aria-label="From day" class="mono"><span class="muted">to</span><input id="rd" type="number" value="${Math.min(31,day+3)}" aria-label="To day" class="mono"></div></div><div class="field"><label for="rl">Lane</label><select id="rl">${['bills','checking','savings'].map(l=>`<option value="${l}" ${(t?t.lane:'bills')===l?'selected':''}>${CONF.lanes[l].n}</option>`).join('')}</select></div><div class="field"><label for="rt">Goes to</label><select id="rt">${BUCKETS.filter(b=>b.id!=='lake').map(b=>`<option value="${b.id}" ${b.id===defB?'selected':''}>${b.e} ${b.n}</option>`).join('')}</select></div><div class="field"><label for="rk">Sub-tag / line key</label><input id="rk" value="${esc(t&&t.lane==='checking'?'other':'')}" placeholder="e.g. pge, grocery, frank"></div><div class="testout" id="rtest"></div><div class="row"><button class="btn primary" id="rsave" style="flex:1">Save rule</button><button class="btn ghost" data-close>Cancel</button></div>`,sh=>{const read=()=>({n:sh.querySelector('#rn').value,vendor:sh.querySelector('#rv').value,amin:+sh.querySelector('#ra').value,amax:+sh.querySelector('#rb').value,dmin:+sh.querySelector('#rc').value,dmax:+sh.querySelector('#rd').value,lane:sh.querySelector('#rl').value,b:sh.querySelector('#rt').value,t:sh.querySelector('#rk').value||sh.querySelector('#rt').value});const test=()=>{const r=read();const hits=txns.filter(x=>x.st==='posted'&&x.lane===r.lane&&r.vendor&&vendorHit(r,(x.raw||'')+' '+x.n)&&-x.a>=r.amin&&-x.a<=r.amax&&x.date.getDate()>=r.dmin&&x.date.getDate()<=r.dmax);sh.querySelector('#rtest').textContent=`Would match ${hits.length} posted: ${hits.slice(0,3).map(h=>ds(h.date)+' '+fmt(h.a)).join(' · ')}${hits.length>3?' …':''}`;};sh.addEventListener('input',test);test();sh.querySelector('#rsave').onclick=()=>{const r=read();if(!r.vendor){toast('Needs a vendor');return;}r.id=Date.now();RULES.push(r);persist('config/rules.json',RULES,`rule: ${r.n}`);closeSheet();toast(`Rule saved · <b>${esc(r.n)}</b>`);if(t){fly('r',()=>commitTag(t,r.b,r.t));}else{rebuild();renderBuckets();}};});}

function ledgerRows(lane){const rows=txns.filter(t=>t.lane===lane&&t.date>=WIN.from&&t.date<=WIN.to);const posted=rows.filter(t=>t.st==='posted');const start=BAL[lane]-posted.reduce((s,t)=>s+t.a,0);let bal=start;let low={v:Infinity,i:-1};const out=rows.map((t,i)=>{bal+=t.a;if(t.st==='planned'&&bal<low.v)low={v:bal,i};return {t,bal};});return {start,rows:out,low:low.i};}
function openAcct(lane){const a=$('#acct');a.hidden=false;const s=spokenFor(lane);const L=ledgerRows(lane);const nm=CONF.lanes[lane].n;
  let top='';if(lane==='savings')top=`<div class="row"><div><div class="eyebrow">war chest</div><div class="amt grad">${fmt(BAL.savings)}</div></div><div class="mono muted" style="font-size:12px">${CONF.efTarget?Math.round(BAL.savings/CONF.efTarget*100)+'% of '+fmt(CONF.efTarget)+' · ':''}not spendable by design</div></div>`;
  else top=`<div class="stack"><div class="row"><div><div class="eyebrow">unclaimed until ${ds(NEXTPAY)}</div><div class="amt grad ${s.free<0?'red':s.free<60?'amber':''}" data-count="${s.free}">$0</div></div><div style="text-align:right"><div class="eyebrow">balance</div><div class="mono" style="font-size:18px;font-weight:700">${fmt(BAL[lane])}</div></div></div><div class="eyebrow">passing through</div>${lane==='checking'&&RELAY.amt?`<div class="row" style="font-size:13px"><span>Relay money</span><span class="mono">${s.float?fmt(-s.float):'not landed · $0'}</span></div>`:'<div class="muted" style="font-size:13px">nothing passing through</div>'}<div class="eyebrow">claimed · has a job before payday</div>${lane==='checking'?`<div class="row" style="font-size:13px"><span>Petty left · ${Object.entries(s.ps.left).map(([k,v])=>k+' '+fmt(v)).join(' · ')}</span><span class="mono">${fmt(-s.petty)}</span></div>`:''}${s.pulls.map(t=>`<div class="row" style="font-size:13px"><span>${esc(t.n)} <span class="tag">${ds(t.date)}</span></span><span class="mono">${fmt(t.a)}</span></div>`).join('')}</div>`;
  let out='';let todayDone=false;L.rows.forEach(({t,bal},i)=>{if(!todayDone&&t.date>TODAY){out+=`<tr class="today"><td>${dsh(TODAY)}</td><td class="it">TODAY · plan below</td><td class="n"></td><td class="n">${fmt(BAL[lane])}</td></tr>`;todayDone=true;}const cls=[t.st,t.t==='income'?'pay':'',L.low===i?'low':'',!t.b&&t.st==='posted'?'untagged':''].join(' ');out+=`<tr class="${cls}"><td>${dsh(t.date)}</td><td class="it"><i class="ldot" style="background:${bcol(t.b)}"></i>${esc(t.n)}${t.split?' (split)':''}${t.pend?' <span class="tag">pending</span>':''}${!t.b&&t.st==='posted'?' <span class="tag c-bills">tag</span>':''}${L.low===i?' <span class="tag c-amber">low</span>':''}</td><td class="n">${t.a>0?'+':''}${fmt(t.a)}</td><td class="n hot">${fmt(bal)}</td></tr>`;});
  a.innerHTML=`<div class="deckhead"><button class="btn small ghost" id="acctBack">← Home</button><h2 class="c-${lane}">${nm}</h2><span class="pill">ledger</span></div><div class="card">${top}</div><div class="card"><div class="row"><h2 style="font-family:var(--mono);font-size:12px;letter-spacing:.08em">${nm.toUpperCase()} · ${ds(WIN.from).toUpperCase()} → ${ds(WIN.to).toUpperCase()}</h2><span class="mono muted" style="font-size:11px;font-weight:700">close ${fmt(L.rows.length?L.rows[L.rows.length-1].bal:BAL[lane])}</span></div><table class="ltable one4"><thead><tr><th>Date</th><th>Item</th><th class="n">Amt</th><th class="n">Balance</th></tr></thead><tbody><tr><td>${dsh(WIN.from)}</td><td class="it">Start</td><td class="n"></td><td class="n">${fmt(L.start)}</td></tr>${out}</tbody></table></div>`;
  a.querySelectorAll('[data-count]').forEach(el=>countTo(el,+el.dataset.count,800));$('#acctBack').onclick=()=>{a.hidden=true;};const td=a.querySelector('tr.today');if(td)requestAnimationFrame(()=>{a.scrollTop=Math.max(0,td.offsetTop-a.clientHeight*0.5);});}

function dayList(){const map=balancesByDay(addDays(WIN.from,-1),WIN.to);const byDay=new Map();txns.filter(t=>t.date>=WIN.from&&t.date<=WIN.to).forEach(t=>{const k=t.date.toDateString();if(!byDay.has(k))byDay.set(k,[]);byDay.get(k).push(t);});if(!byDay.has(TODAY.toDateString()))byDay.set(TODAY.toDateString(),[]);const out=[];[...byDay.entries()].sort((a,b)=>new Date(a[0])-new Date(b[0])).forEach(([key,list])=>{const x=new Date(key);const end=map.get(key)||BAL;const prev=map.get(addDays(x,-1).toDateString())||end;out.push({x,list,end,prev,planned:x>TODAY,today:same(x,TODAY)});});return out;}
function itemRow(t){return `<div class="it" data-tx="${t.st==='posted'?esc(t.id):''}"><span><i class="ldot" style="background:${bcol(t.b)}"></i>${t.b?bemo(t.b)+' ':''}${esc(t.n)}${t.pend?'<span class="tag">pending</span>':''}${!t.b&&t.st==='posted'?'<span class="tag c-bills">tag it</span>':''}${t.ghost&&!t.b?'<span class="tag c-red">ghost</span>':''}${t.est?'<span class="tag">est</span>':''}</span><span class="a ${t.a>0?'c-green':''}">${t.a>0?'+':''}${fmt2(t.a)}</span></div>`;}
const openDays=new Set();
function heroHTML(dd,delay){const {x,list,end,prev,planned,today}=dd;const lanes=['checking','bills','savings'];const head=today?`<div class="dh"><span>${dow(x)} ${ds(x)} · TODAY</span><span>${planned?'planned':'posted'}</span></div>`:`<div class="dh"><span>${dow(x)} ${ds(x)}</span><button class="btn small ghost" data-collapse="${x.toDateString()}" style="padding:4px 10px">${planned?'planned':'posted'} · close</button></div>`;return `<div class="dc ${planned?'planned':'past'} ${today?'today':''} hero" data-day="${x.toDateString()}" style="animation-delay:${delay}ms">${head}<div class="nums">${lanes.map(l=>{const dl=end[l]-prev[l];return `<div><div class="eyebrow" style="color:var(--${l})">${CONF.lanes[l].n}</div><div class="nbig">${fmt(end[l])}</div><div class="chipd ${dl<0?'dn':dl>0?'up':''}">${dl?(dl>0?'+':'')+fmt(dl):'—'}</div></div>`;}).join('')}</div>${list.length?list.map(itemRow).join(''):'<div class="muted" style="font-size:13px">Nothing moves.</div>'}</div>`;}
function compactHTML(dd,delay){const {x,list,end,prev,planned}=dd;const lanes=['checking','bills','savings'];return `<div class="dc ${planned?'planned':'past'} compact" data-day="${x.toDateString()}" style="animation-delay:${delay}ms"><div class="dh"><span>${dow(x).slice(0,3)} ${ds(x)}</span><span>${list.map(t=>`<i class="ldot" style="background:${bcol(t.b)}"></i>`).join('')} ${lanes.map(l=>{const dl=end[l]-prev[l];return dl?`<b style="color:var(--${l})">${dl>0?'+':''}${fmt(dl)}</b>`:'';}).filter(Boolean).join(' ')}</span></div></div>`;}
function wireDays(v,days_){const byKey=k=>days_.find(dd=>dd.x.toDateString()===k);const swap=(el,html)=>{const tmp=document.createElement('div');tmp.innerHTML=html;const n=tmp.firstElementChild;el.replaceWith(n);wire(n);return n;};const wire=n=>{if(n.classList.contains('compact')){n.onclick=()=>{openDays.add(n.dataset.day);swap(n,heroHTML(byKey(n.dataset.day),0));};}else{const b=n.querySelector('[data-collapse]');if(b)b.onclick=e=>{e.stopPropagation();openDays.delete(n.dataset.day);swap(n,compactHTML(byKey(n.dataset.day),0));};}};v.querySelectorAll('.dc.compact,.dc.hero').forEach(wire);}
function renderFlow(){
  const v=$('#v-flow');if(!LEDGER){v.innerHTML='';return;}let html=altBar('flow');
  if(alt.flow===0){
    const rows=txns.filter(t=>t.date>=WIN.from&&t.date<=WIN.to);const start={};['checking','bills','savings'].forEach(l=>{start[l]=BAL[l]-rows.filter(t=>t.lane===l&&t.st==='posted').reduce((s,t)=>s+t.a,0);});const run={...start};let out='';let todayDone=false;const lows={};['checking','bills','savings'].forEach(l=>lows[l]={v:Infinity,i:-1});
    const comp=rows.map((t,i)=>{run[t.lane]+=t.a;if(t.st==='planned'&&run[t.lane]<lows[t.lane].v)lows[t.lane]={v:run[t.lane],i};return {t,b:{...run}};});

    html+=`<div class="card"><div class="row"><h2 style="font-family:var(--mono);font-size:13px;letter-spacing:.08em">LEDGER · ${ds(WIN.from).toUpperCase()} → ${ds(WIN.to).toUpperCase()}</h2></div><table class="ltable"><thead><tr><th>Date</th><th>Item</th><th class="n">Amt</th><th class="n c-checking">${CONF.lanes.checking.n.slice(0,5)}</th><th class="n c-bills">${CONF.lanes.bills.n.slice(0,5)}</th><th class="n c-savings">${CONF.lanes.savings.n.slice(0,5)}</th></tr></thead><tbody><tr><td>${dsh(WIN.from)}</td><td class="it">Start</td><td class="n"></td><td class="n">${fmt(start.checking)}</td><td class="n">${fmt(start.bills)}</td><td class="n">${fmt(start.savings)}</td></tr>${out}</tbody></table><div class="muted" style="font-size:11px;margin-top:8px">Each row shows the balance in its own lane in color; the other two are dimmed. Italic rows haven't happened yet.</div></div>`;
  }else{
    const days_=dayList();html+=`<div class="muted" style="font-size:12px">Today is open. Tap any other day to open it.</div>`;let k=0;days_.forEach(dd=>{html+=(dd.today||openDays.has(dd.x.toDateString()))?heroHTML(dd,k*35):compactHTML(dd,k*25);k++;});
  }
  v.innerHTML=html;wireAlts(v,renderFlow);
  if(alt.flow!==0)wireDays(v,dayList());
  if(!v.dataset.wired){v.dataset.wired='1';v.addEventListener('click',e=>{const el=e.target.closest('[data-tx]');if(!el||!el.dataset.tx||e.target.closest('[data-collapse]'))return;const t=txns.find(x=>String(x.id)===el.dataset.tx);if(t){e.stopPropagation();openTagSheet(t,()=>renderFlow());}});}
  {const td=v.querySelector('tr.today, .dc.today');if(td)requestAnimationFrame(()=>{const top=td.offsetTop||0;if(top)v.scrollTop=Math.max(0,top-v.clientHeight*0.55);});}
}
