<script>
(function(){
'use strict';
// ============================================================
// Am I Green — the app. Reads the vault through the GitHub API.
// Data in: data/ledger.json (courier). Decisions out: config/*.json, data/tags.json, data/state.json.
// ============================================================
const BUILD='build 180';
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)];
const fmt=n=>(n<0?'−':'')+'$'+Math.abs(Math.round(n)).toLocaleString();
const fmt2=n=>(n<0?'−':'')+'$'+Math.abs(n).toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const ds=x=>MON[x.getMonth()]+' '+x.getDate();
const dsh=x=>(x.getMonth()+1)+'/'+x.getDate();
const dow=x=>['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][x.getDay()];
const days=(a,b)=>Math.round((b-a)/86400000);
const addDays=(x,n)=>{const y=new Date(x);y.setDate(y.getDate()+n);return y;};
const same=(a,b)=>a.toDateString()===b.toDateString();const overBy=t=>!!t.exp&&-t.a-t.exp>Math.max(1,t.exp*0.01);
const midnight=x=>new Date(x.getFullYear(),x.getMonth(),x.getDate());
const parseISO=s=>{if(!s)return null;const [y,m,d]=s.slice(0,10).split('-').map(Number);return new Date(y,m-1,d);};
const iso=x=>`${x.getFullYear()}-${String(x.getMonth()+1).padStart(2,'0')}-${String(x.getDate()).padStart(2,'0')}`;
const lastDay=(y,m)=>new Date(y,m+1,0).getDate();
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;document.body.classList.add('boot');setTimeout(()=>document.body.classList.remove('boot'),4000);setInterval(()=>{if(OFFLINE)return;document.querySelectorAll('[data-synced]').forEach(el=>{if(el.dataset.synced)el.textContent=ago(new Date(el.dataset.synced));});},30000);
const qs=new URLSearchParams(location.search);
let TODAY=qs.get('today')?parseISO(qs.get('today')):midnight(new Date());

// ---------- diagnostics: every stage logs; the log is readable in Settings ----------
const LOG=[];function log(stage,msg,extra){const line={at:new Date().toISOString().slice(11,19),stage,msg,extra};LOG.push(line);if(LOG.length>200)LOG.shift();console.log(`[${line.at}] ${stage}: ${msg}`,extra||'');}
function fail(stage,expected,got,evidence){const e=new Error(`${stage}: expected ${expected}, got ${got}`);e.evidence=evidence;log(stage,`FAIL expected ${expected}, got ${got}`,evidence);try{localStorage.setItem('aig-lastfail',JSON.stringify({at:new Date().toISOString(),build:BUILD,stage,expected,got,evidence}));}catch(x){}return e;}
function lastFail(){try{return JSON.parse(localStorage.getItem('aig-lastfail')||'null');}catch(e){return null;}}
function lastFailHTML(){const f=lastFail();if(!f)return '';return `<div class="card" style="border-left:3px solid var(--red)"><div class="row"><b>Last failure · ${esc(f.stage)}</b><span class="muted mono" style="font-size:10px">${esc(f.build)} · ${esc(f.at.slice(0,16).replace('T',' '))}</span></div><div class="muted" style="font-size:12px;margin-top:4px">expected <b>${esc(String(f.expected))}</b> · got <b>${esc(String(f.got))}</b></div><div class="row" style="margin-top:8px"><button class="btn small" id="lfCopy">Copy evidence</button><button class="btn small ghost" id="lfClear">Clear</button></div></div>`;}
function wireLastFail(root){const c=root.querySelector('#lfCopy');if(c)c.onclick=()=>{navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(lastFail(),null,1));toast('Copied');};const x=root.querySelector('#lfClear');if(x)x.onclick=()=>{try{localStorage.removeItem('aig-lastfail');}catch(e){}toast('Cleared');};}

// ---------- alt views & toast ----------
let alt={flow:0,buckets:0,deck:1};
try{const s=localStorage.getItem('aig-alt6');if(s)alt=Object.assign(alt,JSON.parse(s));}catch(e){}
function saveAlt(){try{localStorage.setItem('aig-alt6',JSON.stringify(alt));}catch(e){}}
const ALTS={flow:['Ledger','Cards'],buckets:['Tiles','Bars'],deck:['Swipe','List']};
function wireAlts(root,rerender){root.querySelectorAll('[data-alt]').forEach(b=>b.onclick=()=>{const [p,i]=b.dataset.alt.split(':');alt[p]=+i;saveAlt();rerender();});}
function redEdge(){if(reduced)return;const d=document.createElement('div');d.className='rededge';document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
function toast(html){const t=document.createElement('div');t.className='toast';t.innerHTML=html;$('#toasts').appendChild(t);setTimeout(()=>t.remove(),2700);}
let SHEET_FROM=null;function sheet(html,onReady){const host=$('#sheets');const from=SHEET_FROM;SHEET_FROM=null;host.innerHTML=`<div class="scrim" data-close></div><div class="sheet ${from?'from-'+from:''}"><div class="grab" data-close><i></i></div>${html}</div>`;host.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);if(onReady)onReady(host.querySelector('.sheet'));}
function closeSheet(){const host=$('#sheets');const sh=host.querySelector('.sheet'),sc=host.querySelector('.scrim');if(!sh||reduced||sh.classList.contains('closing')){host.innerHTML='';return;}sh.classList.add('closing');if(sc)sc.classList.add('closing');const el=sh;setTimeout(()=>{if(el.parentNode===host)host.innerHTML='';},300);}
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

// ============================================================
// GITHUB VAULT
// ============================================================
let cfg={owner:'',repo:'vault',branch:'main',token:'',workflow:'courier.yml'};
try{const s=localStorage.getItem('aig-cfg');if(s)cfg=Object.assign(cfg,JSON.parse(s));}catch(e){}
function saveCfg(){try{localStorage.setItem('aig-cfg',JSON.stringify(cfg));}catch(e){}}
const SHAS={};
const gh={
  hdr(){return {'Authorization':'Bearer '+cfg.token,'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'};},
  url(path){return `https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}?ref=${cfg.branch}`;},
  async read(path,optional){const t0=performance.now();const r=await fetch(this.url(path),{headers:{...this.hdr(),'Accept':'application/vnd.github.raw+json'},cache:'no-store'});if(r.status===404&&optional){log('read',`${path} absent (ok)`);delete SHAS[path];return null;}if(!r.ok){const body=await r.text();throw fail('read',`200 for ${path}`,`HTTP ${r.status}`,{path,body:body.slice(0,400)});}const text=await r.text();delete SHAS[path];log('read',`${path}`,{bytes:text.length,ms:Math.round(performance.now()-t0)});try{return JSON.parse(text);}catch(e){throw fail('read',`valid JSON in ${path}`,e.message,{head:text.slice(0,200)});}},
  async writeRaw(path,content,msg){if(!SHAS[path]){const sh=await this.sha(path);if(sh)SHAS[path]=sh;}const put=async()=>fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`,{method:'PUT',headers:this.hdr(),body:JSON.stringify(Object.assign({message:msg,content,branch:cfg.branch},SHAS[path]?{sha:SHAS[path]}:{}))});let r=await put();if(r.status===409||r.status===422){const sh=await this.sha(path);if(sh)SHAS[path]=sh;else delete SHAS[path];r=await put();}if(!r.ok){const body=await r.text();throw fail('write',`2xx for ${path}`,`HTTP ${r.status}`,{path,body:body.slice(0,400)});}const j=await r.json();SHAS[path]=j.content.sha;log('write',`${path} (raw)`,{sha:j.content.sha.slice(0,7),bytes:content.length});},
  async readBlob(path){const r=await fetch(this.url(path),{headers:{...this.hdr(),'Accept':'application/vnd.github.raw+json'},cache:'no-store'});if(!r.ok)throw fail('read',`200 for ${path}`,`HTTP ${r.status}`,{path});return await r.blob();},
  async write(path,obj,msg){const content=btoa(unescape(encodeURIComponent(JSON.stringify(obj,null,1))));if(!SHAS[path]){const sh=await this.sha(path);if(sh)SHAS[path]=sh;}const put=async()=>fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/contents/${path}`,{method:'PUT',headers:this.hdr(),body:JSON.stringify(Object.assign({message:msg,content,branch:cfg.branch},SHAS[path]?{sha:SHAS[path]}:{}))});let r=await put();if(r.status===409||r.status===422){log('write',`${path} conflict, refetching sha`);const sh=await this.sha(path);if(sh)SHAS[path]=sh;else delete SHAS[path];r=await put();}if(!r.ok){const body=await r.text();throw fail('write',`2xx for ${path}`,`HTTP ${r.status}`,{path,body:body.slice(0,400)});}const j=await r.json();SHAS[path]=j.content.sha;log('write',`${path}`,{sha:j.content.sha.slice(0,7)});},
  async dispatch(){const r=await fetch(`https://api.github.com/repos/${cfg.owner}/${cfg.repo}/actions/workflows/${cfg.workflow}/dispatches`,{method:'POST',headers:this.hdr(),body:JSON.stringify({ref:cfg.branch,inputs:{refresh:'true'}})});if(r.status!==204){const body=await r.text();throw fail('dispatch','204',`HTTP ${r.status}`,{body:body.slice(0,400)});}log('dispatch','courier asked to run');},
  async sha(path){const r=await fetch(this.url(path),{headers:{...this.hdr(),'Accept':'application/vnd.github.object+json'},cache:'no-store'});if(!r.ok)return null;const j=await r.json();return j.sha;}
};
const pending={};let persistTimer=null;
function persist(path,obj,msg){pending[path]={obj,msg};clearTimeout(persistTimer);persistTimer=setTimeout(flush,900);}
async function flush(){const jobs=Object.entries(pending);for(const [p] of jobs)delete pending[p];for(const [path,{obj,msg}] of jobs){try{await gh.write(path,obj,msg);}catch(e){if(!pending[path])pending[path]={obj,msg};redEdge();toast(`<b>Save failed</b> · ${esc(path)} · will retry`);}}}
window.addEventListener('pagehide',()=>{if(Object.keys(pending).length)flush();});document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden'&&Object.keys(pending).length)flush();});

1 9.9-1"/>',calendar:'<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>',cash:'<rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><path d="M6 12h.01M18 12h.01"/>',trendup:'<path d="M23 6l-9.5 9.5-5-5L1 18"/><path d="M17 6h6v6"/>',trenddown:'<path d="M23 18l-9.5-9.5-5 5L1 6"/><path d="M17 18h6v-6"/>',scissors:'<circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4L8.1 15.9M14.5 14.5L20 20M8.1 8.1L12 12"/>',tag:'<path d="M20.6 13.4l-7.2 7.2a2 2 0 0 1-2.8 0L2 12V2h10l8.6 8.6a2 2 0 0 1 0 2.8z"/><path d="M7 7h.01"/>',gear:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',chart:'<path d="M18 20V10M12 20V4M6 20v-6"/>',palette:'<circle cx="12" cy="12" r="10"/><circle cx="8" cy="10" r="1.2"/><circle cx="12" cy="7" r="1.2"/><circle cx="16" cy="10" r="1.2"/><path d="M12 22c-2 0-2-3 0-3h2a3 3 0 0 0 0-6"/>',refresh:'<path d="M23 4v6h-6M1 20v-6h6"/><path d="M3.5 9a9 9 0 0 1 14.9-3.4L23 10M1 14l4.6 4.4A9 9 0 0 0 20.5 15"/>',upload:'<path d="M12 19V5M5 12l7-7 7 7"/>',bank:'<path d="M3 10h18L12 4z"/><path d="M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18"/>',receipt:'<path d="M5 2h14v20l-3-2-2 2-2-2-2 2-2-2-3 2z"/><path d="M9 8h6M9 12h6"/>',house:'<path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/>',card:'<rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20"/>',bolt:'<path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/>',heart:'<path d="M20.8 4.6a5.5 5.5 0 0 0-7.8 0L12 5.7l-1-1. async function refreshNow(){if(refreshing)return;if(!cfg.token){openSettings();return;}refreshing=true;syncLight(true);const pill=$('#syncPill');pill.textContent='asking…';try{const before=await gh.sha('data/ledger.json');await gh.dispatch();pill.textContent='refreshing…';toast('Courier running · <b>about a minute</b>');const t0=Date.now();while(Date.now()-t0<240000){await new Promise(r=>setTimeout(r,10000));const now=await gh.sha('data/ledger.json');if(now&&now!==before){await loadAll();toast('<b>Fresh.</b> Ledger updated.');refreshing=false;syncLight(false);return;}pill.textContent='refreshing… '+Math.round((Date.now()-t0)/1000)+'s';}pill.textContent=syncText();toast('Courier took too long. Check Actions in the vault.');}catch(e){pill.textContent=syncText();toast('Refresh failed · '+esc(e.message));}refreshing=false;syncLight(false);}

{let y0=null,armed=false;const main=$('main');const scroller=()=>$$('.view').find(x=>!x.hidden);const pill=()=>$('#syncPill');main.addEventListener('touchstart',e=>{const sc=scroller();const overlay=!$('#deck').hidden||!$('#acct').hidden||$('#sheets').children.length;y0=(!overlay&&sc&&sc.scrollTop<=0&&e.touches[0].clientY<220)?e.touches[0].clientY:null;armed=false;},{passive:true});main.addEventListener('touchmove',e=>{if(y0===null)return;const dy=e.touches[0].clientY-y0;if(dy>40&&!armed)pill().textContent='pull to refresh…';if(dy>160&&!armed){armed=true;pill().textContent='release to refresh';}},{passive:true});const done=()=>{if(y0===null)return;y0=null;if(armed){armed=false;refreshNow();}else if(!refreshing)pill().textContent=syncText();};main.addEventListener('touchend',done,{passive:true});main.addEventListener('touchcancel',done,{passive:true});}

// ============================================================
// TABS · LOOKS · BOOT
// ============================================================
const views={green:renderGreen,flow:renderFlow,buckets:renderBuckets,debts:renderDebts,spend:renderSpend,board:renderBoard};
function currentTab(){const cur=$$('nav [role=tab]').find(t=>t.getAttribute('aria-selected')==='true');return cur?cur.dataset.v:'green';}
let JUST_SHOWN=null,CUR_VIEW=null,PUSH_T=null;function show(name){$('#deck').hidden=true;$('#acct').hidden=true;{const vp=$('#vend');if(vp)vp.hidden=true;}closeSheet();JUST_SHOWN=name;const prev=CUR_VIEW;CUR_VIEW=name;const order=$$('nav [role=tab]').map(b=>b.dataset.v);const anim=prev&&prev!==name&&!reduced&&views[prev];if(PUSH_T){clearTimeout(PUSH_T);PUSH_T=null;$$('.view').forEach(x=>x.classList.remove('push-in-r','push-in-l','push-out-l','push-out-r','push-top'));}
  Object.keys(views).forEach(k=>{$('#v-'+k).hidden=!(k===name||(anim&&k===prev));});
  $$('nav [role=tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.v===name)));views[name]();const v=$('#v-'+name);if(v&&name!=='flow')v.scrollTop=0;
  if(anim){const dir=order.indexOf(name)>order.indexOf(prev)?1:-1;const ov=$('#v-'+prev);ov.classList.add(dir>0?'push-out-l':'push-out-r');v.classList.add('push-top',dir>0?'push-in-r':'push-in-l');PUSH_T=setTimeout(()=>{ov.hidden=true;ov.classList.remove('push-out-l','push-out-r');v.classList.remove('push-top','push-in-r','push-in-l');PUSH_T=null;},300);}}
$$('nav [role=tab]').forEach(b=>b.onclick=()=>show(b.dataset.v));
const SKINS=[
 {id:'system',n:'System',s:'follows the phone. light by day, dark by night.',bg:'linear-gradient(90deg,#faf7ff 50%,#000 50%)',sw:['#117aca','#650360','#30d158'],fg:'#888'},
 {id:'dawn',n:'Light',s:'white cards, the same accents.',bg:'#faf7ff',sw:['#117aca','#650360','#00949a'],fg:'#1b1030'},
 {id:'native',n:'Dark',s:'OLED black. looks like Settings.',bg:'#000',sw:['#1c1c1e','#30d158','#0a84ff'],fg:'#fff'}
];
let skin='system';try{skin=localStorage.getItem('aig-skin')||'system';}catch(e){}if(!SKINS.some(k=>k.id===skin))skin='system';
const sysDark=()=>window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches;const lookOf=()=>skin==='system'?(sysDark()?'native':'dawn'):skin;try{window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change',()=>{if(skin==='system')applySkin();});}catch(e){}
let iconPick='v09';try{iconPick=localStorage.getItem('aig-icon')||'v09';if(['line','dawn','dusk','none','highlight','aurora'].includes(iconPick))iconPick='v09';}catch(e){}
function applyIcon(){const l=$('#touchIcon');if(l)l.href=`icons/vault-${iconPick}.png`;try{localStorage.setItem('aig-icon',iconPick);}catch(e){}}
function applySkin(){applyIcon();const r=document.documentElement;setTimeout(()=>{try{const c=getComputedStyle(r).getPropertyValue('--bg').trim();const m=document.querySelector('meta[name=theme-color]');if(m&&c)m.content=c;}catch(e){}},0);const look=lookOf();if(r.getAttribute('data-look')&&r.getAttribute('data-look')!==look&&!reduced){r.classList.add('looking');setTimeout(()=>r.classList.remove('looking'),500);}r.setAttribute('data-look',look);r.setAttribute('data-theme',look==='native'?'dark':'light');try{localStorage.setItem('aig-skin',skin);}catch(e){}}
function openSkins(){sheet(`<h3>Look</h3><div class="skins">${SKINS.map(k=>`<button class="skin ${skin===k.id?'on':''}" data-skin="${k.id}" style="background:${k.bg};color:${k.fg}"><div class="sw">${k.sw.map(c=>`<i style="background:${c}"></i>`).join('')}</div><b>${k.n}</b><span>${k.s}</span></button>`).join('')}</div><div class="eyebrow" style="margin:12px 0 6px">home-screen icon</div><div class="icons">${[{id:'v09',n:'Dark'},{id:'v09light',n:'Light'}].map(k=>`<button class="ic ${iconPick===k.id?'on':''}" data-icon="${k.id}" aria-label="${k.n} icon"><img src="icons/vault-${k.id}.png" alt=""><span>${k.n}</span></button>`).join('')}</div><div class="muted" style="font-size:11px">iPhone copies the icon when you add to the Home Screen. Pick one, then Share → Add to Home Screen again; delete the old one.</div><div class="row" style="gap:8px"><button class="btn ghost" id="lkBack" style="flex:1">← Settings</button><button class="btn ghost" data-close style="flex:1">Close</button></div>`,sh=>{sh.querySelector('#lkBack').onclick=openSettings;const rerender=()=>{if(LEDGER)views[currentTab()]();};sh.querySelectorAll('[data-skin]').forEach(b=>b.onclick=()=>{skin=b.dataset.skin;applySkin();sh.querySelectorAll('[data-skin]').forEach(x=>x.classList.toggle('on',x.dataset.skin===skin));sh.querySelector('#neonbox').hidden=skin!=='none';rerender();});sh.querySelectorAll('[data-icon]').forEach(b=>b.onclick=()=>{iconPick=b.dataset.icon;applyIcon();sh.querySelectorAll('[data-icon]').forEach(x=>x.classList.toggle('on',x.dataset.icon===iconPick));});});}
{const z=document.createElement('button');z.id='topzone';z.setAttribute('aria-label','Scroll to top');document.body.appendChild(z);z.onclick=()=>{const acct=$('#acct'),deck=$('#deck');const sc=!acct.hidden?acct:!deck.hidden?deck:$$('.view').find(x=>!x.hidden);if(sc)sc.scrollTo({top:0,behavior:reduced?'auto':'smooth'});};}$('#skinBtn').onclick=openSettings;$('#navstat').onclick=()=>{if($('#sheets').children.length){closeSheet();return;}if(LEDGER){SHEET_FROM='stat';openRunway();}else show('green');};$('#syncPill').onclick=refreshNow;applySkin();$('#syncPill').textContent=BUILD;setTimeout(()=>{if(LEDGER)$('#syncPill').textContent=syncText();},4000);
window.addEventListener('error',e=>{log('window',e.message,{at:e.filename+':'+e.lineno});});
loadAll();
// re-read on return to the app if the ledger is older than 20 minutes
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&LEDGER&&cfg.token&&Date.now()-new Date(LEDGER.generated_at).getTime()>20*60000)loadAll();});
})();
