<style>
/* ---------- looks: Native (dark) + Dawn (light), following the system ---------- */
:root, :root[data-look=native] {
  --bg:#000; --surface:#1c1c1e; --surface2:#2c2c2e; --fg:#f2f2f7; --muted:#8e8e93; --line:rgba(84,84,88,.55);
  --panel:rgba(28,28,30,.86); --field:rgba(118,118,128,.24);
  --blue:#0a84ff; --green:#30d158; --amber:#ffd60a; --red:#ff453a;
  --route:#0a84ff; --casing:#0a3d7a;
  --font:-apple-system,system-ui,sans-serif; --mono:ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  color-scheme:dark;
}
:root[data-look=dawn] {
  --bg:#f2f2f7; --surface:#fff; --surface2:#f2f2f7; --fg:#000; --muted:#6c6c70; --line:rgba(60,60,67,.18);
  --panel:rgba(249,249,251,.9); --field:rgba(118,118,128,.12);
  --blue:#007aff; --green:#34c759; --amber:#ff9f0a; --red:#ff3b30;
  --route:#007aff; --casing:#ffffff;
  color-scheme:light;
}

/* ---------- shell (references/ios-pwa.md) ---------- */
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:16px/1.35 var(--font);-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
#map{position:absolute;inset:0;background:var(--surface2);z-index:1;-webkit-touch-callout:none}
.maplibregl-ctrl-top-right{top:calc(var(--sat) + 66px)}
.maplibregl-ctrl-attrib{font:11px var(--font)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.glass{background:var(--panel);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 2px 14px rgba(0,0,0,.22)}

/* map markers */
.mk-here{width:16px;height:16px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 7px rgba(10,132,255,.2),0 1px 4px rgba(0,0,0,.35)}
.mk-dest{width:26px;height:26px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center}
.mk-dest::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.mk-left{width:22px;height:22px;border-radius:7px;background:var(--green);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 1px 5px rgba(0,0,0,.35)}

/* ---------- the search bar: pinned to the top of what's visible; nothing moves when you type ---------- */
#top{position:absolute;left:10px;right:10px;top:calc(var(--sat) + 8px);z-index:10;display:flex;flex-direction:column;gap:8px;transform:translateY(var(--vvt,0px))}
.sbar{display:flex;align-items:center;height:50px;padding:0 4px;border-radius:14px;color:var(--muted)}
.sbar .mag{width:40px;height:50px;display:grid;place-items:center;flex:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:color .15s}
.sbar .mag.armed{color:var(--blue)}

.sbar input::placeholder{color:var(--muted);opacity:1}

#drop{border-radius:14px;padding:0 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-height:calc(var(--vvh,100dvh) - var(--sat) - 84px)}
#drop[hidden]{display:none}
.link{color:var(--blue);font-weight:600}

/* ---------- settings sheet: no button for it — press and hold the magnifying glass ---------- */

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line)}

.dim{color:var(--muted)}

/* toasts */
#toasts{position:fixed;left:0;right:0;top:calc(var(--sat) + 70px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none}
.toast{background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;max-width:86vw}

:root{--spring:cubic-bezier(.2,.9,.25,1.2);--ease:cubic-bezier(.2,.7,.2,1)}

button:active,.btn:active,.chip:active,.pchip:active,.tcpill:active,.tcgear:active,.acch:active,.pipbtn:active,.subx:active,.cvr:active,[data-go]:active{transform:scale(.96)}
.trow:active,.prow:active,.grp:active,.drow:active,tr[data-tx]:active,tr[data-pl]:active,tr[data-b]:active,tr[data-dedit]:active,tr[data-vk]:active{transform:scale(.985)}

.toast{animation:toastin .42s var(--spring) both,toastout .3s ease-in 2.2s forwards;box-shadow:0 8px 24px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3)}

.sheet.from-stat{transform-origin:92% 100%;animation:sheetfromstat .42s var(--spring) both}@keyframes sheetfromstat{from{transform:scale(.25);opacity:0}to{transform:none;opacity:1}}
/* arrival */
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.boot .tcrows .trow,.boot .btab tbody tr{animation:rowin .4s var(--ease) both}
.boot .trow:nth-child(2),.boot tbody tr:nth-child(2){animation-delay:55ms}.boot .trow:nth-child(3),.boot tbody tr:nth-child(3){animation-delay:110ms}.boot .trow:nth-child(4),.boot tbody tr:nth-child(4){animation-delay:165ms}.boot .trow:nth-child(5),.boot tbody tr:nth-child(5){animation-delay:220ms}.boot .trow:nth-child(6),.boot tbody tr:nth-child(6){animation-delay:275ms}.boot .trow:nth-child(7),.boot tbody tr:nth-child(7){animation-delay:330ms}.boot .trow:nth-child(8),.boot tbody tr:nth-child(8){animation-delay:385ms}.boot .trow:nth-child(n+9),.boot tbody tr:nth-child(n+9){animation-delay:440ms}

.lfoot.go .pl:nth-of-type(1){animation-delay:1.1s}.lfoot.go .pl:nth-of-type(2){animation-delay:1.22s}.lfoot.go .pl:nth-of-type(3){animation-delay:1.34s}.lfoot.go .pl:nth-of-type(4){animation-delay:1.46s}.lfoot.go .pl:nth-of-type(5){animation-delay:1.58s}.lfoot.go .pl:nth-of-type(6){animation-delay:1.7s}

.lfoot .tpulse{opacity:0;transform-box:fill-box;transform-origin:center}.lfoot.go .tpulse{animation:tpulse .9s ease-out 1.3s 1}@keyframes tpulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}

.slwrap{position:relative;padding-top:22px}.sltip{position:absolute;top:0;transform:translateX(-50%) translateY(6px);background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;opacity:0;transition:opacity .15s,transform .15s var(--spring);pointer-events:none;white-space:nowrap}.slwrap.dragging .sltip{opacity:1;transform:translateX(-50%) translateY(0)}

.korow{position:relative;transition:transform .18s var(--ease);background:var(--surface)}.korow .grip{width:16px;color:var(--muted);font-size:11px;letter-spacing:-3px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}.korow.lift{transition:none;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.45);background:var(--surface2);border-radius:6px}

<script id="router" type="text/plain">
'use strict';
/* arrow router — a Web Worker that holds LA County's roads and finds routes with no
   unprotected lefts. Mirrors arrow/build/build.py: write_graph() for the file, Router for
   the costs. The build routes on the same file in Python before it's published. */
const MAGIC = 0x31575241, FORMAT = 1;
const SECTIONS = [['lat', Int32Array], ['lon', Int32Array], ['nflag', Uint8Array], ['eu', Uint32Array], ['ev', Uint32Array],
  ['elen', Uint16Array], ['espd', Uint8Array], ['eflag', Uint8Array], ['egrade', Int8Array], ['gstart', Uint32Array],
  ['geom', Int16Array], ['mcar', Uint16Array], ['marr', Uint16Array], ['mwl', Uint16Array]];
const RAD = Math.PI / 180;
const MY = 0.110574, MX = 0.11132;   // metres per 1e-6° of latitude, and of longitude at the equator
const CELL = 4000;                    // snap grid cell, 1e-6° (about 440 × 370 m in LA)
const SNAP_MAX = 1000;                // metres from a point to the road it snaps to
const CURB = 45;                      // seconds: arriving, or pulling away, with the place across the street
const POP_CAP = 4000000;              // states per search before giving up
let P = null;                         // the loaded graph; swapped only after a new one is fully built
let HK = new Float64Array(1 << 17), HV = new Int32Array(1 << 17), HN = 0, HTOP = 0;

class RErr extends Error {
  constructor(code, expected, got, extra){ super(`expected ${expected}, got ${got}`); this.code = code; this.expected = expected; this.got = got; this.extra = extra || null; }
}

self.onmessage = ev => {
  const m = ev.data || {}, t0 = performance.now();
  try {
    if (m.type === 'load'){
      const g = build(m.buf, m.turn, m.vmax);
      P = g;
      self.postMessage({id: m.id, ok: true, nodes: g.N, edges: g.E, geom: g.G, snapEdges: g.snapEdges, ms: Math.round(performance.now() - t0)});
      return;
    }
    if (m.type === 'route'){
      if (!P) throw new RErr('nograph', 'the LA roads loaded in the router', 'nothing loaded');
      const route = routeReq(m.o, m.d, m.profile);
      route.ms = Math.round(performance.now() - t0);
      self.postMessage({id: m.id, ok: true, route});
      return;
    }
    throw new RErr('crash', 'a load or route message', String(m.type));
  } catch (e){
    self.postMessage({id: m.id, ok: false, error: {code: e.code || 'crash', expected: e.expected || 'a clean run',

/* ---- the file -------------------------------------------------------------------- */
function build(buf, turn, vmax){
  if (!(buf instanceof ArrayBuffer) || buf.byteLength < 192) throw new RErr('data.parse', 'a graph file of 192+ bytes', buf && buf.byteLength);
  const dv = new DataView(buf);
  const magic = dv.getUint32(0, true), fmt = dv.getUint32(4, true);
  if (magic !== MAGIC) throw new RErr('data.parse', 'magic ARW1 (0x31575241)', '0x' + magic.toString(16));
  if (fmt !== FORMAT) throw new RErr('data.parse', `format ${FORMAT}`, fmt);
  const N = dv.getUint32(8, true), E = dv.getUint32(12, true), G = dv.getUint32(16, true);
  const g = {N, E, G, S6: dv.getInt32(20, true), W6: dv.getInt32(24, true), N6: dv.getInt32(28, true), E6: dv.getInt32(32, true)};
  const ns = dv.getUint32(36, true);
  if (ns !== SECTIONS.length) throw new RErr('data.parse', `${SECTIONS.length} sections`, ns);
  if (!(N > 1 && E > 0 && g.W6 < g.E6 && g.S6 < g.N6)) throw new RErr('data.parse', 'nodes, edges and a bbox', `${N}/${E}/${g.W6},${g.S6},${g.E6},${g.N6}`);
  const want = {lat: N, lon: N, nflag: N, eu: E, ev: E, elen: E, espd: E, eflag: E, egrade: 3 * E, gstart: E + 1, geom: 2 * G, mcar: 2 * E, marr: 2 * E, mwl: 2 * E};
  SECTIONS.forEach(([name, T], i) => {
    const off = dv.getUint32(64 + i * 8, true), len = dv.getUint32(68 + i * 8, true), sz = T.BYTES_PER_ELEMENT;
    if (off % sz || len % sz || off + len > buf.byteLength) throw new RErr('data.parse', `section ${name} aligned and inside the file`, `offset ${off}, ${len} bytes, file ${buf.byteLength}`);
    const a = new T(buf, off, len / sz);
    if (a.length !== want[name]) throw new RErr('data.parse', `${want[name]} items in ${name}`, a.length);
    g[name] = a;
  });
  if (g.gstart[0] !== 0 || g.gstart[E] !== G) throw new RErr('data.parse', `geometry index 0…${G}`, `${g.gstart[0]}…${g.gstart[E]}`);
  for (let e = 0; e < E; e++){
    if (g.eu[e] >= N || g.ev[e] >= N) throw new RErr('data.parse', `node ids below ${N}`, `edge ${e}: ${g.eu[e]} → ${g.ev[e]}`);
    if (g.gstart[e + 1] < g.gstart[e]) throw new RErr('data.parse', 'a rising geometry index', `edge ${e}`);
  }
  g.TURN = turn && typeof turn.signal === 'number' ? turn : {signal: 8, right: 4, left: 8, uturn: 25};
  g.VMAX = vmax > 0 ? vmax : 30.6;
  prep(g);
  return g;
}

function hill(up, avg){ return up >= 15 ? 50 : avg >= 10 ? 20 : avg >= 7 ? 1 / 0.3 : avg >= 5 ? 1.25 : 1; }

function brg(la1, lo1, la2, lo2){            // degrees clockwise from north, as build.py bearing()
  const k = Math.cos((la1 + la2) * 0.5e-6 * RAD);
  const b = Math.atan2((lo2 - lo1) * MX * k, (la2 - la1) * MY) / RAD;
  return b < 0 ? b + 360 : b;
}

function prep(g){
  const {N, E, eu: EU, ev: EV, lat: LAT, lon: LON, gstart: GS, geom: GM, eflag: EF, elen: EL, espd: SP, egrade: GR} = g;
  // directed edges leaving each node, ascending edge id: the order the turn masks count in
  const AST = new Uint32Array(N + 1);
  for (let e = 0; e < E; e++){ AST[EU[e] + 1]++; AST[EV[e] + 1]++; }
  for (let n = 0; n < N; n++) AST[n + 1] += AST[n];
  const ADJ = new Uint32Array(2 * E), cur = AST.slice(0, N);
  for (let e = 0; e < E; e++){ ADJ[cur[EU[e]]++] = 2 * e; ADJ[cur[EV[e]]++] = 2 * e + 1; }
  // seconds per directed edge, hill-weighted copy, headings off the first/last geometry segment, snap cells
  const WT = new Float32Array(2 * E), WF = new Float32Array(2 * E), DEP = new Float32Array(2 * E), ARR = new Float32Array(2 * E);
  const COLS = Math.ceil((g.E6 - g.W6) / CELL), ROWS = Math.ceil((g.N6 - g.S6) / CELL);
  const row = la => Math.min(ROWS - 1, Math.max(0, Math.floor((la - g.S6) / CELL)));
  const col = lo => Math.min(COLS - 1, Math.max(0, Math.floor((lo - g.W6) / CELL)));
  const RC = new Int32Array(4 * E), CST = new Uint32Array(ROWS * COLS + 1);
  let snapEdges = 0;
  for (let e = 0; e < E; e++){
    const t = Math.max(1, EL[e]) / (Math.max(5, SP[e]) / 3.6);
    WT[2 * e] = WT[2 * e + 1] = t;
    WF[2 * e] = t * hill(GR[3 * e + 1], GR[3 * e]);
    WF[2 * e + 1] = t * hill(GR[3 * e + 2], -GR[3 * e]);
    const u = EU[e], v = EV[e], j0 = GS[e], j1 = GS[e + 1];
    let la = LAT[u], lo = LON[u], fa = LAT[v], fo = LON[v];
    let a0 = Math.min(LAT[u], LAT[v]), a1 = Math.max(LAT[u], LAT[v]), o0 = Math.min(LON[u], LON[v]), o1 = Math.max(LON[u], LON[v]);
    for (let j = j0; j < j1; j++){
      la += GM[2 * j] * 10; lo += GM[2 * j + 1] * 10;
      if (j === j0){ fa = la; fo = lo; }
      if (la < a0) a0 = la; else if (la > a1) a1 = la;
      if (lo < o0) o0 = lo; else if (lo > o1) o1 = lo;
    }
    // (fa, fo) = first point after u, (la, lo) = last point before v
    DEP[2 * e] = brg(LAT[u], LON[u], fa, fo);
    ARR[2 * e] = brg(la, lo, LAT[v], LON[v]);
    DEP[2 * e + 1] = brg(LAT[v], LON[v], la, lo);
    ARR[2 * e + 1] = brg(fa, fo, LAT[u], LON[u]);
    const f = EF[e];
    if ((f & 8) || !(f & 3)){ RC[4 * e] = 1; RC[4 * e + 1] = 0; continue; }     // freeway, ramp, bridge, tunnel: no snapping
    const r0 = row(a0), r1 = row(a1), c0 = col(o0), c1 = col(o1);
    RC[4 * e] = r0; RC[4 * e + 1] = r1; RC[4 * e + 2] = c0; RC[4 * e + 3] = c1;
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) CST[r * COLS + c + 1]++;
    snapEdges++;
  }
  for (let k = 0; k < ROWS * COLS; k++) CST[k + 1] += CST[k];
  const CELLS = new Uint32Array(CST[ROWS * COLS]), fill = CST.slice(0, ROWS * COLS);
  for (let e = 0; e < E; e++){
    const r0 = RC[4 * e], r1 = RC[4 * e + 1];
    for (let r = r0; r <= r1; r++) for (let c = RC[4 * e + 2]; c <= RC[4 * e + 3]; c++) CELLS[fill[r * COLS + c]++] = e;
  }
  Object.assign(g, {AST, ADJ, WT, WF, DEP, ARR, ROWS, COLS, CST, CELLS, snapEdges,
    ESEEN: new Uint32Array(E), estamp: 0, SEEN: new Uint32Array(2 * E), G: new Float64Array(2 * E), PAR: new Int32Array(2 * E), stamp: 0});
}

/* ---- snapping a point to a road ---------------------------------------------------- */
function project(e, la6, lo6){
  const g = P, u = g.eu[e], v = g.ev[e], j0 = g.gstart[e], j1 = g.gstart[e + 1], GM = g.geom;
  const sx = MX * Math.cos(la6 * 1e-6 * RAD);
  let pa = g.lat[u], po = g.lon[u];
  let ax = (po - lo6) * sx, ay = (pa - la6) * MY;
  let acc = 0, bd = Infinity, bAcc = 0, bCross = 0, bla = pa, blo = po;
  for (let j = j0; j <= j1; j++){
    let qa, qo;
    if (j < j1){ qa = pa + GM[2 * j] * 10; qo = po + GM[2 * j + 1] * 10; } else { qa = g.lat[v]; qo = g.lon[v]; }
    const bx = (qo - lo6) * sx, by = (qa - la6) * MY;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy, L = Math.sqrt(L2);
    let t = L2 > 0 ? -(ax * dx + ay * dy) / L2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const fx = ax + t * dx, fy = ay + t * dy, d = Math.sqrt(fx * fx + fy * fy);
    if (d < bd){ bd = d; bAcc = acc + t * L; bCross = dy * ax - dx * ay; bla = pa + t * (qa - pa); blo = po + t * (qo - po); }
    acc += L; ax = bx; ay = by; pa = qa; po = qo;
  }
  // side +1: the point is left of the road as drawn u → v; 0: on the road itself
  return {e, d: bd, f: acc > 0 ? Math.min(1, Math.max(0, bAcc / acc)) : 0, side: bd < 4 ? 0 : bCross > 0 ? 1 : -1, la6: Math.round(bla), lo6: Math.round(blo)};
}

function snapCands(la6, lo6){
  const g = P, r = Math.floor((la6 - g.S6) / CELL), c = Math.floor((lo6 - g.W6) / CELL);
  const st = ++g.estamp, SEEN = g.ESEEN, CST = g.CST, CELLS = g.CELLS, out = [];
  for (let rr = Math.max(0, r - 2); rr <= Math.min(g.ROWS - 1, r + 2); rr++){
    for (let cc = Math.max(0, c - 2); cc <= Math.min(g.COLS - 1, c + 2); cc++){
      const k = rr * g.COLS + cc;
      for (let i = CST[k]; i < CST[k + 1]; i++){
        const e = CELLS[i];
        if (SEEN[e] === st) continue;
        SEEN[e] = st;
        const p = project(e, la6, lo6);
        if (p.d <= SNAP_MAX) out.push(p);
      }
    }
  }
  out.sort((a, b) => a.d - b.d);
  return out.slice(0, 3);
}

// Right-hand traffic: driving u → v (dir 0) with the place on the left means it's across the street.
function curb(side, dir){ return side === 0 ? 0 : ((dir === 0) === (side > 0) ? CURB : 0); }

/* ---- the search: A* over directed edges, turn masks at every node -------------------- */
function push(k, v){
  if (HN === HK.length){
    const nk = new Float64Array(HN * 2); nk.set(HK); HK = nk;
    const nv = new Int32Array(HN * 2); nv.set(HV); HV = nv;
  }
  let i = HN++;
  while (i > 0){ const p = (i - 1) >> 1; if (HK[p] <= k) break; HK[i] = HK[p]; HV[i] = HV[p]; i = p; }
  HK[i] = k; HV[i] = v;
}
function pop(){
  const top = HV[0]; HTOP = HK[0];
  const n = --HN;
  if (n > 0){
    const k = HK[n], v = HV[n];
    let i = 0;
    for (;;){
      let c = 2 * i + 1;
      if (c >= n) break;
      if (c + 1 < n && HK[c + 1] < HK[c]) c++;
      if (HK[c] >= k) break;
      HK[i] = HK[c]; HV[i] = HV[c]; i = c;
    }
    HK[i] = k; HV[i] = v;
  }
  return top;
}

function search(S, T, profile){
  const g = P, EU = g.eu, EV = g.ev, LAT = g.lat, LON = g.lon, NF = g.nflag, EF = g.eflag;
  const AST = g.AST, ADJ = g.ADJ, DEP = g.DEP, ARR = g.ARR, SEEN = g.SEEN, G = g.G, PAR = g.PAR;
  const M = profile === 'car' ? g.mcar : g.marr, W = profile === 'arrow_flat' ? g.WF : g.WT;
  const TS = g.TURN.signal, TR = g.TURN.right, TL = g.TURN.left, TU = g.TURN.uturn;
  const st = ++g.stamp;
  const tla = T.la6, tlo = T.lo6, kx = MX * Math.cos(tla * 1e-6 * RAD), hs = 0.98 / g.VMAX;
  const h = n => { const dy = (LAT[n] - tla) * MY, dx = (LON[n] - tlo) * kx; return Math.sqrt(dx * dx + dy * dy) * hs; };
  HN = 0;
  let best = Infinity, bPrev = -1, bDE = -1, pops = 0;
  const eS = S.e, fS = EF[eS], owS = (fS & 3) !== 3, eT = T.e, owT = (EF[eT] & 3) !== 3;
  for (let dir = 0; dir < 2; dir++){
    if (!(fS & (dir ? 2 : 1))) continue;
    const de = 2 * eS + dir, cs = owS ? 0 : curb(S.side, dir);
    if (eT === eS && (dir === 0 ? T.f >= S.f : T.f <= S.f)){
      const c = W[de] * Math.abs(T.f - S.f) + cs + (owT ? 0 : curb(T.side, dir));
      if (c < best){ best = c; bPrev = -1; bDE = de; }
    }
    const g0 = W[de] * (dir ? S.f : 1 - S.f) + cs;
    SEEN[de] = st; G[de] = g0; PAR[de] = -1;
    push(g0 + h(dir ? EU[eS] : EV[eS]), de);
  }
  while (HN > 0){
    const de = pop(), key = HTOP;
    if (key >= best) break;
    const e = de >> 1, n = (de & 1) ? EU[e] : EV[e], gc = G[de];
    if (key > gc + h(n) + 1e-6) continue;              // a stale heap entry
    if (++pops > POP_CAP) break;
    const m = M[de];
    if (m === 0) continue;
    const a0 = AST[n], dg = Math.min(16, AST[n + 1] - a0), sig = (NF[n] & 1) ? TS : 0, ain = ARR[de];
    for (let i = 0; i < dg; i++){
      if (((m >> i) & 1) === 0) continue;
      const b = ADJ[a0 + i], eb = b >> 1, db = b & 1;
      if ((EF[eb] & (db ? 2 : 1)) === 0) continue;
      let c = gc + sig;
      if (eb === e) c += TU;
      else { const d = (DEP[b] - ain + 540) % 360 - 180; if (d > 35) c += TR; else if (d < -35) c += TL; }
      if (eb === eT){                                  // the destination sits part-way along this edge
        const ct = c + W[b] * (db ? 1 - T.f : T.f) + (owT ? 0 : curb(T.side, db));
        if (ct < best){ best = ct; bPrev = de; bDE = b; }
      }
      const ng = c + W[b];
      if (SEEN[b] !== st || ng < G[b]){
        SEEN[b] = st; G[b] = ng; PAR[b] = de;
        push(ng + h(db ? EU[eb] : EV[eb]), b);
      }
    }
  }
  if (bDE < 0) return {des: null, pops};
  const des = [bDE];
  for (let x = bPrev, k = 0; x !== -1; x = PAR[x]){
    if (SEEN[x] !== st || ++k > 2 * g.E) throw new RErr('crash', 'a parent chain back to the start', `broken at directed edge ${x}`);
    des.push(x);
  }
  des.reverse();
  return {des, cost: best, pops};
}

/* ---- turning a list of directed edges into a drawable, explainable route -------------- */
function edgePts(e){
  const g = P, u = g.eu[e], v = g.ev[e], j0 = g.gstart[e], j1 = g.gstart[e + 1];
  const la = [g.lat[u]], lo = [g.lon[u]];
  let a = g.lat[u], b = g.lon[u];
  for (let j = j0; j < j1; j++){ a += g.geom[2 * j] * 10; b += g.geom[2 * j + 1] * 10; la.push(a); lo.push(b); }
  la.push(g.lat[v]); lo.push(g.lon[v]);
  return [la, lo];
}

function cut(e, f0, f1){                      // [lon, lat] points from fraction f0 to f1 along u → v
  const [la, lo] = edgePts(e), n = la.length, out = [];
  if (f0 <= 0 && f1 >= 1){ for (let i = 0; i < n; i++) out.push([lo[i] / 1e6, la[i] / 1e6]); return out; }
  const sx = MX * Math.cos(la[0] * 1e-6 * RAD), cum = new Float64Array(n);
  for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + Math.hypot((lo[i] - lo[i - 1]) * sx, (la[i] - la[i - 1]) * MY);
  const L = cum[n - 1], d0 = f0 * L, d1 = f1 * L;
  const at = d => {
    let i = 1;
    while (i < n - 1 && cum[i] < d) i++;
    const s = cum[i] - cum[i - 1], t = s > 0 ? Math.min(1, Math.max(0, (d - cum[i - 1]) / s)) : 0;
    return [(lo[i - 1] + t * (lo[i] - lo[i - 1])) / 1e6, (la[i - 1] + t * (la[i] - la[i - 1])) / 1e6];
  };
  out.push(at(d0));
  for (let i = 1; i < n - 1; i++) if (cum[i] > d0 && cum[i] < d1) out.push([lo[i] / 1e6, la[i] / 1e6]);
  out.push(at(d1));
  return out;
}

function describe(r, S, T){
  const g = P, des = r.des, coords = [], segDE = [], segCls = [], turns = [];
  const TS = g.TURN.signal, TR = g.TURN.right, TL = g.TURN.left, TU = g.TURN.uturn;
  let dist = 0, time = 0, climb = 0;
  for (let i = 0; i < des.length; i++){
    const de = des[i], e = de >> 1, dir = de & 1;
    let f0 = 0, f1 = 1;
    if (i === 0){ if (dir === 0) f0 = S.f; else f1 = S.f; }
    if (i === des.length - 1){ if (dir === 0) f1 = T.f; else f0 = T.f; }
    if (f1 < f0) f1 = f0;
    const pts = cut(e, f0, f1);
    if (dir === 1) pts.reverse();
    if (i > 0){
      const a = des[i - 1], n = dir ? g.ev[e] : g.eu[e];
      const ha = (a & 1) ? g.eu[a >> 1] : g.ev[a >> 1];
      if (ha !== n) throw new RErr('crash', 'consecutive edges meeting at a node', `${a} ends at ${ha}, ${de} starts at ${n}`);
      const d = (g.DEP[de] - g.ARR[a] + 540) % 360 - 180;
      const kind = (a >> 1) === e ? 'uturn' : d > 35 ? 'right' : d < -35 ? 'left' : 'straight';
      time += ((g.nflag[n] & 1) ? TS : 0) + (kind === 'uturn' ? TU : kind === 'right' ? TR : kind === 'left' ? TL : 0);
      if (kind !== 'straight'){
        const a0 = g.AST[n], dg = g.AST[n + 1] - a0;
        let pos = -1;
        for (let k = 0; k < dg; k++) if (g.ADJ[a0 + k] === de){ pos = k; break; }
        turns.push({ci: coords.length - 1, kind, deg: Math.round(d), wl: pos >= 0 && pos < 16 && ((g.mwl[a] >> pos) & 1) === 1,
          sig: (g.nflag[n] & 1) === 1, lat: g.lat[n] / 1e6, lon: g.lon[n] / 1e6});
      }
    }
    for (let k = coords.length ? 1 : 0; k < pts.length; k++){
      coords.push(pts[k]);
      if (coords.length > 1){ segDE.push(de); segCls.push(g.eflag[e] >> 4); }
    }
    const frac = f1 - f0;
    dist += g.elen[e] * frac;
    time += g.WT[de] * frac;
    if (g.elen[e] >= 40){ const up = g.egrade[3 * e + 1 + dir]; if (up > climb) climb = up; }
  }
  return {coords, segDE, segCls, turns, dist: Math.round(dist), time: Math.round(time), cost: Math.round(r.cost * 10) / 10, climb};
}

function routeReq(o, d, profile){
  if (profile !== 'car' && profile !== 'arrow' && profile !== 'arrow_flat') throw new RErr('crash', 'profile car, arrow or arrow_flat', profile);
  const g = P;
  const cands = [['origin', o], ['destination', d]].map(([which, p]) => {
    if (!p || !isFinite(p.lat) || !isFinite(p.lon)) throw new RErr('crash', `a lat/lon for the ${which}`, JSON.stringify(p));
    const la6 = Math.round(p.lat * 1e6), lo6 = Math.round(p.lon * 1e6);
    if (la6 < g.S6 || la6 > g.N6 || lo6 < g.W6 || lo6 > g.E6) throw new RErr('outside', `the ${which} inside LA County`, `${p.lat.toFixed(5)},${p.lon.toFixed(5)}`, {which});
    const c = snapCands(la6, lo6);
    if (!c.length) throw new RErr('nosnap', `a drivable street within ${SNAP_MAX} m of the ${which}`, 'none', {which});
    return c;
  });
  const [so, sd] = cands;
  let pops = 0, tries = 0;
  for (let i = 0; i < Math.min(2, so.length); i++){
    for (let j = 0; j < Math.min(2, sd.length); j++){
      tries++;
      const r = search(so[i], sd[j], profile);
      pops += r.pops;
      if (r.des){
        const out = describe(r, so[i], sd[j]);
        return Object.assign(out, {profile, pops, tries, snapO: Math.round(so[i].d), snapD: Math.round(sd[j].d)});
      }
    }
  }
  throw new RErr('noroute', `a ${profile} route`, `none from ${tries} snap pairs, ${pops} states searched`, {tries, pops});
}

/* =====================================================================

   The roads live in a Web Worker (the router script above). GitHub Actions
   rebuilds them monthly; the app downloads once and checks for a newer one quietly.

const DATA = {state:'idle', since:0, got:0, total:0, meta:null, err:null, loading:null, updating:false, upd:null};
let WK = null, WSEQ = 0;

    if (m.ok){ p.res(m); return; }
    const er = m.error || {};
    const e = new StageError(p.stage, er.expected || 'a clean answer', er.got || 'an error', {code:er.code, extra:er.extra, stack:er.stack});
    e.code = er.code || 'crash'; e.which = er.extra && er.extra.which;

    if (ev.preventDefault) ev.preventDefault();
    log('worker', `FAIL crashed: ${ev.message || 'no message'} (line ${ev.lineno || '?'})`);
    restartWorker(`the router crashed: ${ev.message || 'no message'}`);
  };

      const tx = db.transaction('kv', mode); let out;

      if (r) r.onsuccess = ()=>{ out = r.result; };
      tx.oncomplete = ()=>res(out);
      tx.onerror = ()=>rej(tx.error || new Error('transaction failed'));

    const u = `${base}manifest.json?t=${Date.now()}`;

    const o = await stage('origin', async ()=>{
      if (S.here && Date.now() - S.here.at < 120000) return {...S.here, here:true};
      const fix = await locateOnce(); S.here = fix; return {...fix, here:true};
    }, o=>({lat:+o.lat.toFixed(5), lon:+o.lon.toFixed(5), acc:o.acc}));
    if (my !== PLANSEQ) return;
    const profile = S.flat ? 'arrow_flat' : 'arrow';
    const main = await stage('route.'+profile, ()=>route(o, S.dest, profile), sumRoute);
    const car = await stage('route.car', ()=>route(o, S.dest, 'car'), sumRoute)
      .catch(()=>{ log('route.car', 'no plain route to compare: pins fall back to the turns and both ends'); return null; });
    if (my !== PLANSEQ) return;
    const R = await stage('model', async ()=>buildModel(main, car, o, S.dest, profile),
      R=>({pins:R.pins.length, lefts:R.lefts.length, climb:R.climb, divergedKm:R.divergedKm, carMin:R.carMs == null ? null : +(R.carMs/60000).toFixed(1), urlLen:R.url.length}));
    S.route = R;
    try { localStorage.setItem(APP.key+'-base', JSON.stringify({at:new Date().toISOString(), profile, km:+R.km.toFixed(2), min:+(R.ms/60000).toFixed(1), pins:R.pins.length, lefts:R.lefts.length, climb:R.climb, data:DATA.meta && DATA.meta.version})); } catch(_){}
    const rec = {lat:S.dest.lat, lon:S.dest.lon, name:S.dest.name, sub:S.dest.sub};
    cfg.recents = [rec, ...(cfg.recents||[]).filter(x=>Math.abs(x.lat-rec.lat) > 1e-5 || Math.abs(x.lon-rec.lon) > 1e-5)].slice(0, 6); saveCfg();
  } catch(e){
    if (my !== PLANSEQ) return;
    S.err = explain(e); redEdge();
    log('plan', `FAIL shown as "${S.err.title}" — ${e.message}`);
  } finally {
    if (my === PLANSEQ){ S.busy = false; renderCard(); drawRoute(); setTimeout(fitRoute, 60); }
  }
}
function dropPin(ll){
  log('pin', `dropped ${ll.lat.toFixed(5)},${ll.lng.toFixed(5)}`);
  Q.blur();
  S.dest = {lat:ll.lat, lon:ll.lng, name:'Dropped Pin', sub:`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`};
  plan();
}

/* =====================================================================
   SLOT 4 — SCREENS: the search bar (static, never re-rendered), its drop-down,
   the route card, and the settings sheet nobody needs to see
   ===================================================================== */
const Q = document.getElementById('q'), CLR = document.getElementById('clr'), MAG = document.getElementById('mag');
function wireSearch(){
  MAG.innerHTML = ICON.mag;
  CLR.innerHTML = ICON.xs;
  Q.addEventListener('focus', ()=>{ S.searching = true; renderDrop(); renderCard(); });
  Q.addEventListener('blur', ()=>setTimeout(()=>{
    if (document.activeElement === Q) return;
    S.searching = false; renderDrop(); renderCard(); window.scrollTo(0, 0);
  }, 220));
  Q.addEventListener('input', ()=>{ CLR.hidden = !Q.value; onQuery(Q.value); });
  Q.addEventListener('keydown', e=>{ if (e.key === 'Enter'){ e.preventDefault(); clearTimeout(STIMER); if (Q.value.trim()) runSearch(Q.value); } });
  CLR.onclick = ()=>{ Q.value = ''; CLR.hidden = true; onQuery(''); Q.focus(); };
  // a tap on the map puts the keyboard away
  document.getElementById('map').addEventListener('touchstart', ()=>{ if (document.activeElement === Q) Q.blur(); }, {passive:true});
  // Settings: press and hold the magnifying glass until it turns blue, then let go.
  // A quick tap just opens the search. Handled on release, so no stray click lands on the sheet.
  let t0 = 0, armT = null;
  const arm = ()=>{ t0 = Date.now(); clearTimeout(armT); armT = setTimeout(()=>MAG.classList.add('armed'), CONF.holdMs); };
  const cancel = ()=>{ clearTimeout(armT); MAG.classList.remove('armed'); t0 = 0; };
  const release = e=>{
    if (!t0) return;
    const long = Date.now() - t0 >= CONF.holdMs;
    cancel();
    if (e.cancelable) e.preventDefault();
    if (long){ Q.blur(); openSettings(); } else Q.focus();
  };
  if ('ontouchstart' in window){
    MAG.addEventListener('touchstart', arm, {passive:true});
    MAG.addEventListener('touchend', release, {passive:false});
    MAG.addEventListener('touchcancel', cancel);
  } else {
    MAG.addEventListener('mousedown', arm);
    MAG.addEventListener('mouseup', release);
    MAG.addEventListener('mouseleave', cancel);
  }
  MAG.addEventListener('contextmenu', e=>e.preventDefault());
}
// keep the search bar on the part of the screen the keyboard leaves visible
function fitVV(){
  const vv = window.visualViewport, r = document.documentElement;
  if (!vv) return;
  const fit = ()=>{ r.style.setProperty('--vvt', `${Math.max(0, Math.round(vv.offsetTop))}px`); r.style.setProperty('--vvh', `${Math.round(vv.height)}px`); };
  vv.addEventListener('resize', fit); vv.addEventListener('scroll', fit); fit();
}
function renderDrop(){
  const el = document.getElementById('drop');
  if (!S.searching){ el.hidden = true; el.innerHTML = ''; return; }
  const q = S.query.trim(), rows = []; let eyebrow = '';
  if (q) rows.push(...S.results);
  else if ((cfg.recents||[]).length){ eyebrow = 'Recents'; rows.push(...cfg.recents); }
  const waiting = q && S.doneQ !== q && !S.searchErr;
  const none = q && S.doneQ === q && !S.results.length && !S.searchErr;
  const html = (eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : '')
    + (S.searchErr ? `<div class="msg bad">${esc(S.searchErr)}</div>` : '')
    + rows.map((r, i)=>`<button class="trow" data-i="${i}"><span class="ico">${ICON.pin}</span><span class="t"><b>${esc(r.name)}</b><i>${esc(r.sub||'')}</i></span></button>`).join('')
    + (waiting ? `<div class="msg empty">Searching</div>` : '')
    + (none ? `<div class="msg">Nothing by that name in LA County</div>` : '');
  el.innerHTML = html;
  el.hidden = !html;
  el.querySelectorAll('.trow').forEach(b=>b.onclick = ()=>choose(rows[+b.dataset.i]));
}
function choose(p){
  S.dest = {lat:p.lat, lon:p.lon, name:p.name, sub:p.sub};
  S.query = ''; S.results = []; S.doneQ = ''; S.searchErr = null;
  Q.value = ''; CLR.hidden = true;
  S.searching = false; Q.blur(); renderDrop();
  log('pick', 'destination ' + p.name);
  plan();
}
function fmtDur(ms){ const m = Math.max(1, Math.round(ms/60000)); return m < 60 ? `${m} min` : `${Math.floor(m/60)} hr${m%60 ? ` ${m%60} min` : ''}`; }
function fmtMi(km){ const mi = km/1.609344; return mi < 10 ? `${mi.toFixed(1)} mi` : `${Math.round(mi)} mi`; }
function cardHTML(){
  const R = S.route, d = S.dest;
  const head = `<div class="rhead"><div class="t"><h2>${esc(d.name)}</h2>${d.sub ? `<p>${esc(d.sub)}</p>` : ''}</div><button class="x" data-act="close" aria-label="Close">${ICON.x}</button></div>`;
  const hills = `<div class="opt"><span class="ol">${ICON.hill}<span>Avoid hills</span></span><label class="switch"><input type="checkbox" id="flat" ${S.flat?'checked':''}><span></span></label></div>`;
  if (S.busy) return head + `<div class="busy empty" id="busyw">${DATA.state === 'ready' ? 'Finding a way with no unprotected lefts' : 'Getting the LA roads ready'}</div>` + hills;
  if (S.err) return head + `<div class="err"><b>${esc(S.err.title)}</b><p>${esc(S.err.body)}</p>`
    + (S.err.action === 'retry' ? `<button class="sec wide" data-act="retry">Try again</button>` : '') + `</div>` + hills;
  if (!R) return head + hills;
  const L = R.lefts.length;
  return head + `<div class="big" id="bigmin">${fmtDur(R.ms)}</div>`
    + `<div class="facts">${fmtMi(R.km)} · ${L ? `${L} left${L>1?'s':''} on a green arrow` : 'no lefts across traffic'} · steepest climb ${R.climb}%</div>`
    + hills
    + `<a class="go" id="goApple" href="${esc(R.url)}">${ICON.car}<span>Open in Apple Maps</span></a>`
    + (R.pins.length ? `<div class="note">Apple Maps will show ${R.pins.length} stop${R.pins.length===1?'':'s'} on the way. They keep it on this route.</div>` : '');
}
function renderCard(){
  const el = document.getElementById('card');
  if (!S.dest || S.searching){ el.hidden = true; return; }
  el.innerHTML = cardHTML();
  el.hidden = false;
  wireActs(el);
  const flat = el.querySelector('#flat');
  if (flat) flat.onchange = ()=>{ S.flat = cfg.flat = flat.checked; saveCfg(); log('opt', 'avoid hills '+(S.flat?'on':'off')); plan(); };
  const go = el.querySelector('#goApple');
  if (go) go.onclick = ()=>log('apple', {pins:S.route.pins.length, url:S.route.url});
  if (S.route && !S.route.shown){ S.route.shown = true; countTo(el.querySelector('#bigmin'), Math.round(S.route.ms/60000), m=>fmtDur(m*60000)); }
}
function act(a){
  if (a === 'close'){ PLANSEQ++; S.dest = null; S.route = null; S.err = null; S.busy = false; renderCard(); drawRoute(); return; }
  if (a === 'retry'){ if (S.dest) plan(); else loadData(); return; }
}

function openSettings(){
  const look = cfg.look || 'system', m = DATA.meta, w = (m && m.whitelist) || {};
  const n = v => v == null ? '?' : Number(v).toLocaleString('en-US');
  log('settings', 'opened');
  sheet(`<div class="sh"><h3>Settings</h3></div>
    <div class="group">
      <div class="row"><span class="k">Look</span><div class="seg">${['light','dark','system'].map(l=>`<button data-look="${l}" aria-pressed="${look===l}">${l[0].toUpperCase()+l.slice(1)}</button>`).join('')}</div></div>
      <div class="row"><span class="k">LA roads</span><span class="mono dim" id="sdata">${esc(dataStatus())}</span></div>
      <div class="row"><span class="k">Map data</span><button class="sec" data-s="update">Check for new</button></div>
      <div class="row"><span class="k">Reload app</span><button class="sec" data-s="reload">Reload</button></div>
    </div>
    <div class="group">
      <div class="row"><span class="k">Build</span><span class="mono dim">${BUILD}${m ? ` · data ${esc(m.version)}` : ''}</span></div>
      ${m ? `<div class="row"><span class="k">Road segments</span><span class="mono dim">${n(m.edges)}</span></div>
      <div class="row"><span class="k">Green-arrow approaches</span><span class="mono dim">${n(w.wl_approaches)}</span></div>` : ''}
      <div class="row"><span class="k">Log</span><span class="rowbtns"><button class="sec" data-s="copylog">Copy</button><button class="sec" data-s="dump">Dump</button></span></div>
      <pre class="log">${esc(LOG.slice(-200).join('\n'))}</pre>
    </div>
    <div class="mini">Map © OpenFreeMap, OpenMapTiles, OpenStreetMap contributors. Search: Photon. Routes are worked out on this phone from OpenStreetMap roads, LADOT double-left signs and USGS elevation${m ? `, built ${esc(fmtDay(m.built))}` : ''}.</div>`, s=>{
    s.querySelector('[data-s=update]').onclick = ()=>{ if (DATA.state === 'ready') checkUpdate(true); else { loadData(); toast('Loading LA roads'); } };
    s.querySelectorAll('[data-look]').forEach(b=>b.onclick = ()=>{ cfg.look = b.dataset.look; saveCfg(); applyLook(); s.querySelectorAll('[data-look]').forEach(x=>x.setAttribute('aria-pressed', x === b)); });
    s.querySelector('[data-s=reload]').onclick = reloadApp;
    s.querySelector('[data-s=copylog]').onclick = ()=>navigator.clipboard.writeText(LOG.join('\n')).then(()=>toast('Log copied'), ()=>toast('Couldn’t copy', 'bad'));
    s.querySelector('[data-s=dump]').onclick = ()=>download(`${APP.key}-dump-${Date.now()}.json`, dumpJSON());
  });
}
async function reloadApp(){
  try { if (window.caches) for (const k of await caches.keys()) await caches.delete(k); } catch(e){}
  location.href = location.pathname + '?r=' + Date.now();
}

/* ---- viewport line: logged once, always ---- */
function envViewport(){
  const cs = getComputedStyle(document.documentElement), vv = window.visualViewport;
  ENV = {standalone:!!(navigator.standalone || matchMedia('(display-mode: standalone)').matches), vh:innerHeight,
    app:document.getElementById('app').offsetHeight, barBottom:Math.round(document.querySelector('#top .sbar').getBoundingClientRect().bottom),
    insets:[cs.getPropertyValue('--sat').trim()||'?', cs.getPropertyValue('--sab').trim()||'?'],
    visual:vv ? {h:Math.round(vv.height), top:Math.round(vv.offsetTop)} : null,
    inner:`${innerWidth}x${innerHeight}`, screen:`${screen.width}x${screen.height}`, ua:navigator.userAgent};
  log('env viewport', ENV);
}

/* ---- boot ---- */
log('boot', `${APP.name} ${BUILD} · routes on this phone`);
try { const lf = JSON.parse(localStorage.getItem(APP.key+'-lastfail')||'null'); if (lf) log('lastfail', lf); } catch(_){}
applyLook();
initMap();
startWatch();
startWorker();
wireSearch();
fitVV();
renderDrop();
renderCard();
renderData();
loadData();
requestAnimationFrame(envViewport);
window.addEventListener('focus', ()=>scrollTo(0, 0));
</script>
</body>
