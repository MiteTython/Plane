<style>
/* ---------- looks: Native (dark) + Dawn (light), following the system ---------- */
:root, :root[data-look=native] {
  --bg:#000; --surface:#1c1c1e; --surface2:#2c2c2e; --fg:#f2f2f7; --muted:#8e8e93; --line:rgba(84,84,88,.55);
  --panel:rgba(28,28,30,.84); --field:rgba(118,118,128,.24);
  --blue:#0a84ff; --green:#30d158; --amber:#ffd60a; --red:#ff453a;
  --route:#0a84ff; --casing:#0a3d7a;
  --font:-apple-system,system-ui,sans-serif; --mono:ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  --peek:calc(86px + env(safe-area-inset-bottom));
  color-scheme:dark;
}
:root[data-look=dawn] {
  --bg:#f2f2f7; --surface:#fff; --surface2:#f2f2f7; --fg:#000; --muted:#6c6c70; --line:rgba(60,60,67,.18);
  --panel:rgba(249,249,251,.88); --field:rgba(118,118,128,.12);
  --blue:#007aff; --green:#34c759; --amber:#ff9f0a; --red:#ff3b30;
  --route:#007aff; --casing:#ffffff;
  color-scheme:light;
}

/* ---------- shell (references/ios-pwa.md) ---------- */
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:16px/1.35 var(--font);-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
#map{position:absolute;inset:0;background:var(--surface2);z-index:1;-webkit-touch-callout:none}
.maplibregl-ctrl-top-left{top:var(--sat)}
.maplibregl-ctrl-attrib{font:11px var(--font)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}.dim{color:var(--muted)}

/* map controls, top right, like Apple's */
#ctl{position:absolute;right:10px;top:calc(var(--sat) + 10px);z-index:5;display:flex;flex-direction:column;border-radius:10px;overflow:hidden;background:var(--panel);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);box-shadow:0 2px 12px rgba(0,0,0,.2)}
#ctl button{width:44px;height:44px;display:grid;place-items:center;color:var(--blue)}
#ctl button+button{border-top:1px solid var(--line)}

/* map markers */
.mk-here{width:16px;height:16px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 7px rgba(10,132,255,.2),0 1px 4px rgba(0,0,0,.35)}
.mk-dest{width:26px;height:26px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center}
.mk-dest::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.mk-origin{width:14px;height:14px;border-radius:50%;background:#8e8e93;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
.mk-left{width:22px;height:22px;border-radius:7px;background:var(--green);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 1px 5px rgba(0,0,0,.35)}

/* ---------- the panel: Apple Maps' bottom sheet ---------- */
#panel{position:absolute;left:0;right:0;bottom:0;height:92dvh;z-index:6;display:flex;flex-direction:column;
  background:var(--panel);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);
  border-radius:14px 14px 0 0;box-shadow:0 -1px 0 var(--line),0 -8px 30px rgba(0,0,0,.18);
  transform:translateY(calc(92dvh - var(--peek)));transition:transform .38s var(--spring)}
#panel.half{transform:translateY(calc(92dvh - 54dvh))}
#panel.full{transform:translateY(0)}
#panel.drag{transition:none}
#panel .grab{flex:none;padding:6px 0 6px;display:flex;justify-content:center;touch-action:none}
#panel .grab i{width:36px;height:5px;border-radius:3px;background:var(--muted);opacity:.45}

.search{display:flex;align-items:center;gap:7px;background:var(--field);border-radius:10px;padding:0 10px;height:38px;margin:2px 0 12px;color:var(--muted)}
.search input{flex:1;border:0;background:transparent;font:17px var(--font);color:var(--fg);outline:none;padding:0;height:38px;min-width:0;-webkit-appearance:none;appearance:none}
.search input::-webkit-search-cancel-button{display:none}
.search .clr{width:22px;height:22px;display:grid;place-items:center;color:var(--muted)}
.search .clr[hidden]{display:none}
.pick{font-size:14px;color:var(--muted);margin:-4px 0 8px;display:flex;gap:6px;align-items:center}
.link{color:var(--blue);font-weight:600}

.list{display:flex;flex-direction:column}
.trow{display:flex;align-items:center;gap:12px;min-height:58px;padding:7px 0;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--red);color:#fff}

.rhead{display:flex;align-items:flex-start;gap:10px;margin:0 0 10px}

.facts{color:var(--muted);font-size:15px;margin-top:3px}

.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;background:var(--green);color:#fff;font-weight:700;font-size:17px;border-radius:12px;min-height:50px;margin-top:14px;text-decoration:none;transition:transform .15s var(--spring)}

.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line)}

.seg{display:flex;background:var(--field);border-radius:9px;padding:2px}

.mini{font-size:13px;color:var(--muted);line-height:1.4}
.mini.good{color:var(--green)}.mini.bad{color:var(--red)}
pre.log{font:11px/1.35 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:40vh;overflow:auto;margin:0 0 12px;color:var(--muted);-webkit-user-select:text;user-select:text}

/* toasts */
#toasts{position:fixed;left:0;right:0;top:calc(var(--sat) + 62px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none}

.lfoot .tpulse{opacity:0;transform-box:fill-box;transform-origin:center}.lfoot.go .tpulse{animation:tpulse .9s ease-out 1.3s 1}@keyframes tpulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}

<div id="app">
  <div id="map"></div>
  <div id="ctl">
    <button id="bGear" aria-label="Settings"></button>
    <button id="bLoc" aria-label="Show my location"></button>
  </div>
  <div id="panel" class="peek"><div class="grab"><i></i></div><div id="pc"></div></div>

<script>
'use strict';
/* =====================================================================
   SLOT 1 — APP: identity
   ===================================================================== */
const BUILD = 'build 1';
const APP = {
  key: 'arrow',
  name: 'arrow',
  answer: 'How do I get there turning left only on a green arrow, and around the hills?',
};

/* =====================================================================
   SLOT 2 — CONF
   ===================================================================== */
const CONF = {
  styles: { dawn: 'https://tiles.openfreemap.org/styles/liberty', native: 'https://tiles.openfreemap.org/styles/dark' },
  photon: 'https://photon.komoot.io/api/',
  nominatim: 'https://nominatim.openstreetmap.org/search',
  bbox: [-118.96, 33.70, -117.64, 34.83],      // what the server's graph covers: LA County
  center: [-118.33, 34.06], zoom: 10.3,
  maxPins: 12,           // Apple Maps tops out around 13 stops per route

    return out;

  MAP.on('error', e=>log('map', 'error '+((e.error&&e.error.message)||e.message||'?')));

  const cancel = ()=>{ clearTimeout(t); t = null; };

  MAP.on('touchstart', e=>{ cancel(); if (e.originalEvent.touches.length !== 1) return; p0 = e.point; const ll = e.lngLat; t = setTimeout(()=>{ t = null; drop(ll); }, 550); });

async function photon(q){

let SEQ = 0, STIMER = null;
function onQuery(v){

  S.results = []; renderList();

async function runSearch(q){
  const my = ++SEQ;
  try { const res = await stage('search', ()=>photon(q), r=>({q, n:r.length})); if (my !== SEQ) return; S.results = res; }
  catch(e){
    await sleep(700); if (my !== SEQ) return;       // Nominatim forbids type-ahead: only once the typing stops
    try { const res = await stage('search.fallback', ()=>nominatim(q), r=>({q, n:r.length})); if (my !== SEQ) return; S.results = res; }
    catch(e2){ if (my !== SEQ) return; S.results = []; S.searchErr = 'Search isn’t answering right now.'; redEdge(); }

  p.set('profile', profile); p.set('points_encoded', 'false'); p.set('locale', 'en');
  p.set('instructions', full ? 'true' : 'false');
  p.append('details', 'edge_id');
  if (full){ p.append('details', 'road_class'); p.append('details', 'average_slope'); }
  p.append('curbside', 'right'); p.append('curbside', 'right'); p.set('curbside_strictness', 'soft');
  return `${cfg.server}/route?${p}`;
}
async function gh(o, d, profile, full){
  const name = 'route.'+profile, url = ghURL(o, d, profile, full);
  let r;
  try { r = await fetchT(url, CONF.routeTimeout); }
  catch(e){ const err = new StageError(name, `a response from ${cfg.server}`, e.name==='AbortError' ? `no answer in ${CONF.routeTimeout/1000} s` : `${e.name}: ${e.message}`, {url}); err.status = 0; throw err; }
  const text = await r.text(); let j = null;
  try { j = JSON.parse(text); } catch(_){}
  const ev = {url, status:r.status, contentType:r.headers.get('content-type'), body:text.slice(0, 4000)};
  if (!r.ok){
    const msg = (j && (j.message || (j.hints && j.hints[0] && j.hints[0].message))) || text.slice(0, 200);
    const err = new StageError(name, 'HTTP 200 with a path', `HTTP ${r.status}: ${msg}`, ev); err.status = r.status; err.ghMessage = msg; throw err;
  }
  const p = j && j.paths && j.paths[0];
  if (!p) fail(name, 'paths[0] in the response', j ? Object.keys(j).join(',') : 'not JSON', ev);
  const co = p.points && p.points.coordinates;
  if (!Array.isArray(co) || co.length < 2) fail(name, 'at least 2 coordinates (points_encoded=false)', Array.isArray(co) ? co.length : typeof p.points, ev);
  if (!p.details || !Array.isArray(p.details.edge_id)) fail(name, 'details.edge_id', Object.keys(p.details||{}).join(',') || 'no details', ev);
  if (full && !Array.isArray(p.instructions)) fail(name, 'instructions', typeof p.instructions, ev);
  if (typeof p.time !== 'number' || typeof p.distance !== 'number') fail(name, 'numeric time and distance', `${typeof p.time}/${typeof p.distance}`, ev);
  return p;
}
const sumRoute = p => p ? {km:+(p.distance/1000).toFixed(2), min:+(p.time/60000).toFixed(1), pts:p.points.coordinates.length, edges:p.details.edge_id.length} : null;

function hav(a, b){ const R = 6371008.8, r = Math.PI/180, dLa = (b[1]-a[1])*r, dLo = (b[0]-a[0])*r; const s = Math.sin(dLa/2)**2 + Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.min(1, Math.sqrt(s))); }
function cumDist(co){ const c = [0]; for (let i = 1; i < co.length; i++) c.push(c[i-1] + hav(co[i-1], co[i])); return c; }
function segArray(n, details, fill){ const a = new Array(Math.max(0, n-1)).fill(fill); for (const [f, t, v] of (details||[])) for (let i = f; i < t && i < a.length; i++) a[i] = v; return a; }
function segAt(cum, d){ let lo = 0, hi = cum.length - 2; while (lo < hi){ const m = (lo + hi + 1) >> 1; if (cum[m] <= d) lo = m; else hi = m - 1; } return Math.max(0, lo); }
function pointAt(co, cum, d){ const i = segAt(cum, d), L = (cum[i+1] - cum[i]) || 1, f = Math.min(1, Math.max(0, (d - cum[i]) / L)); return [co[i][0] + f*(co[i+1][0]-co[i][0]), co[i][1] + f*(co[i+1][1]-co[i][1])]; }

/* Pins become Apple Maps stops. Apple re-routes freely between them, so they go where
   arrow's route leaves the plain one (Apple would cut across there), after each turn
   inside those stretches, and at both ends (pull away and arrive on the right side). */
function choosePins(path, cum, edge, cls, carE){
  const co = path.points.coordinates, total = cum[cum.length-1], ins = path.instructions || [];
  const okAt = d => d > 60 && d < total - 60 && !FWY.has(cls[segAt(cum, d)] || '');
  const div = edge.map(e => carE ? !carE.has(e) : false);
  const C = [];
  const add = (d, prio, why) => { if (okAt(d)) C.push({d, prio, why}); };
  for (let i = 0; i < div.length; i++){
    if (!div[i] || (i > 0 && div[i-1])) continue;
    let j = i; while (j < div.length && div[j]) j++;
    add(Math.min(cum[i] + 40, (cum[i] + cum[j]) / 2), 1, 'leaves the plain route');
  }
  ins.forEach((it, k)=>{
    if (k === 0 || it.sign === 0 || it.sign === 4 || it.sign === 5 || !Array.isArray(it.interval)) return;
    const s = Math.min(it.interval[0], cum.length - 1), d0 = cum[s];
    const d1 = k + 1 < ins.length && Array.isArray(ins[k+1].interval) ? cum[Math.min(ins[k+1].interval[0], cum.length-1)] : total;
    const inDiv = div[Math.min(s, div.length - 1)] || (s > 0 && div[s-1]);
    add(Math.min(d0 + 40, (d0 + d1) / 2), inDiv ? 2 : 4, it.text);
  });
  add(total - 80, 3, 'final approach');
  add(80, 3, 'pull away');
  const cap = C.some(c=>c.prio === 1) ? CONF.maxPins : CONF.quietPins;
  C.sort((a, b)=> a.prio - b.prio || (a.prio === 4 ? Math.min(a.d, total-a.d) - Math.min(b.d, total-b.d) : a.d - b.d));
  const pick = [];
  for (const c of C){
    if (pick.length >= (c.prio <= 3 ? CONF.maxPins : cap)) continue;
    if (pick.some(p=>Math.abs(p.d - c.d) < CONF.pinGap)) continue;
    pick.push(c);
  }
  pick.sort((a, b)=>a.d - b.d);
  return pick.map(p=>({d:Math.round(p.d), prio:p.prio, why:p.why, at:pointAt(co, cum, p.d)}));
}
function appleURL(o, d, pins){
  const f = (lat, lon)=>`${lat.toFixed(6)},${lon.toFixed(6)}`;
  const q = [];
  if (o && !o.here) q.push('source=' + f(o.lat, o.lon));
  q.push('destination=' + f(d.lat, d.lon));
  pins.forEach(p=>q.push('waypoint=' + f(p.at[1], p.at[0])));
  q.push('mode=driving');
  return 'https://maps.apple.com/directions?' + q.join('&');
}
function buildModel(main, car, o, d, profile){
  const co = main.points.coordinates, n = co.length, cum = cumDist(co);
  const edge = segArray(n, main.details.edge_id, null);
  const cls = segArray(n, main.details.road_class, '');
  if (edge.some(e=>e == null)) fail('model', 'an edge id on every segment', `${edge.filter(e=>e==null).length} gaps`);
  const carE = car ? new Set(car.details.edge_id.map(x=>x[2])) : null;
  const pins = choosePins(main, cum, edge, cls, carE);
  const lefts = (main.instructions||[]).filter(it=>(it.sign === -2 || it.sign === -3) && Array.isArray(it.interval) && !FWY.has(cls[Math.min(it.interval[0], cls.length-1)]))
    .map(it=>{ const c = co[Math.min(it.interval[0], n-1)]; return [c[0], c[1]]; });
  let climb = 0;
  for (const [f, t, v] of (main.details.average_slope||[])) if (typeof v === 'number' && cum[Math.min(t, n-1)] - cum[f] >= 40 && v > climb) climb = v;
  let div = 0; if (carE) for (let i = 0; i < edge.length; i++) if (!carE.has(edge[i])) div += cum[i+1] - cum[i];
  return {coords:co, pins, lefts, climb:Math.round(climb), km:main.distance/1000, ms:main.time, carMs:car ? car.time : null,
    divergedKm:carE ? +(div/1000).toFixed(2) : null, url:appleURL(o, d, pins), profile, at:Date.now()};
}
function explain(e){
  const m = String(e.ghMessage || e.got || e.message || '');
  if (e.stage === 'plan') return {title:'Add your server', body:'arrow needs the address of your routing server.', action:'settings'};
  if (e.stage === 'origin') return {title:'Location is off', body:`Your phone didn’t give a position (${e.got}).`, action:'from'};
  if (/^route\./.test(e.stage || '')){
    if (e.status === 0) return {title:'Can’t reach the server', body:`${cfg.server||'The server'} isn’t answering. Quick-tunnel URLs change every time the server restarts.`, action:'settings'};
    if (/out of bounds/i.test(m)) return {title:'Outside the map', body:'The routing server covers LA County.', action:null};
    if (/cannot find point/i.test(m)) return {title:'No road there', body:'The server found no drivable road near that spot.', action:null};
    if (/connection between locations not found|not found/i.test(m)) return {title:'No way there without an unprotected left', body:'Every route to this spot needs a left with no arrow. A point on the next street over usually works.', action:null};
    if (e.status) return {title:'Routing failed', body:`The server said: ${m}`, action:null};
    return {title:'The server answered strangely', body:`${e.message}. Settings → Log → Dump has the response.`, action:'settings'};
  }
  return {title:'Something broke', body:`${e.message}. Settings → Log → Dump has the details.`, action:'settings'};
}
let PLANSEQ = 0;
async function plan(){
  if (!S.dest) return;
  const my = ++PLANSEQ;
  S.mode = 'route'; S.route = null; S.err = null; S.busy = true;
  setPanel('half'); renderPanel(); drawRoute();
  try {
    if (!cfg.server) fail('plan', 'a server URL in Settings', 'none');
    const o = await stage('origin', async ()=>{
      if (S.origin) return S.origin;
      if (S.here && Date.now() - S.here.at < 120000) return {...S.here, here:true};
      const fix = await locateOnce(); S.here = fix; return {...fix, here:true};
    }, o=>({here:!!o.here, lat:+o.lat.toFixed(5), lon:+o.lon.toFixed(5)}));
    const profile = S.flat ? 'arrow_flat' : 'arrow';
    const [main, car] = await Promise.all([
      stage('route.'+profile, ()=>gh(o, S.dest, profile, true), sumRoute),
      stage('route.car', ()=>gh(o, S.dest, 'car', false), sumRoute).catch(()=>{ log('route.car', 'no comparison route: pins fall back to the turns near both ends'); return null; }),
    ]);
    if (my !== PLANSEQ) return;
    const R = await stage('model', async ()=>buildModel(main, car, o, S.dest, profile),
      R=>({pins:R.pins.length, lefts:R.lefts.length, climb:R.climb, divergedKm:R.divergedKm, urlLen:R.url.length}));
    S.route = R;
    try { localStorage.setItem(APP.key+'-base', JSON.stringify({at:new Date().toISOString(), profile, km:+R.km.toFixed(2), min:+(R.ms/60000).toFixed(1), pins:R.pins.length, lefts:R.lefts.length, climb:R.climb})); } catch(_){}
    const rec = {lat:S.dest.lat, lon:S.dest.lon, name:S.dest.name, sub:S.dest.sub};
    cfg.recents = [rec, ...(cfg.recents||[]).filter(x=>Math.abs(x.lat-rec.lat) > 1e-5 || Math.abs(x.lon-rec.lon) > 1e-5)].slice(0, 6); saveCfg();
  } catch(e){
    if (my !== PLANSEQ) return;
    S.err = explain(e); redEdge();
    log('plan', `FAIL shown as "${S.err.title}" — ${e.message}`);
  } finally {
    if (my === PLANSEQ){ S.busy = false; renderPanel(); drawRoute(); setTimeout(fitRoute, 420); }
  }
}
function dropPin(ll){
  log('pin', `dropped ${ll.lat.toFixed(5)},${ll.lng.toFixed(5)}`);
  const place = {lat:ll.lat, lon:ll.lng, name:'Dropped Pin', sub:`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`};
  if (S.picking === 'origin'){ S.origin = place; S.picking = 'dest'; S.query = ''; if (S.dest){ plan(); return; } renderPanel(); return; }
  S.dest = place; plan();
}

function setPanel(pos){

function renderPanel(){
  const c = document.getElementById('pc');
  if (S.mode === 'search'){
    c.innerHTML = `<div class="search">${ICON.mag}<input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="${S.picking==='origin'?'Starting point':'Search Maps'}" value="${esc(S.query)}"><button class="clr" aria-label="Clear" ${S.query?'':'hidden'}>${ICON.xs}</button></div>`
      + (S.picking === 'origin' ? `<div class="pick">Starting point for ${esc(S.dest?S.dest.name:'the route')} · <button class="link" data-act="cancelpick">Cancel</button></div>` : '')

function renderList(){

function choose(p){
  const q = document.getElementById('q'); if (q) q.blur();

    S.origin = p.here ? null : {lat:p.lat, lon:p.lon, name:p.name, sub:p.sub};

function fmtDur(ms){ const m = Math.max(1, Math.round(ms/60000)); return m < 60 ? `${m} min` : `${Math.floor(m/60)} hr${m%60 ? ` ${m%60} min` : ''}`; }

function routeHTML(){

  s.addEventListener('pointerdown', e=>{
    if (e.target.closest('input,a,button,label,pre')) return;
    if (e.target.closest('#pc') && PANEL === 'full' && c.scrollTop > 0) return;
    y0 = e.clientY; dy = 0; base = new DOMMatrix(getComputedStyle(s).transform).m42; s.classList.add('drag');
  });
  window.addEventListener('pointermove', e=>{ if (y0 == null) return; dy = e.clientY - y0; s.style.transform = `translateY(${Math.max(0, base + dy)}px)`; }, {passive:true});
  const up = ()=>{
    if (y0 == null) return; y0 = null; s.classList.remove('drag'); s.style.transform = '';
    const order = ['peek', 'half', 'full'], prev = PANEL; let i = order.indexOf(PANEL);
    if (dy < -40) i = Math.min(2, i+1); else if (dy > 40) i = Math.max(0, i-1);
    if (order[i] === prev){ s.classList.add(prev); return; }
    setPanel(order[i]);
    if (order[i] !== 'full'){ const q = document.getElementById('q'); if (q) q.blur(); }
    setTimeout(fitRoute, 420);
  };
  window.addEventListener('pointerup', up); window.addEventListener('pointercancel', up);
})();

/* ---- controls ---- */
document.getElementById('bGear').innerHTML = ICON.gear;
document.getElementById('bLoc').innerHTML = ICON.loc;
document.getElementById('bGear').onclick = openSettings;
document.getElementById('bLoc').onclick = async ()=>{
  startWatch();
  try {
    const fix = S.here && Date.now() - S.here.at < 60000 ? S.here : await stage('locate', locateOnce, f=>({acc:f.acc}));
    S.here = fix; setMarker('here', [fix.lon, fix.lat], 'mk-here');
    if (MAP) MAP.easeTo({center:[fix.lon, fix.lat], zoom:Math.max(MAP.getZoom(), 14), duration:reduced?0:600});
  } catch(e){ toast('Location is off for this app', 'warn'); }
};

/* ---- viewport line: logged once, always ---- */
function envViewport(){
  const cs = getComputedStyle(document.documentElement), p = document.getElementById('panel').getBoundingClientRect();
  ENV = {standalone:!!(navigator.standalone || matchMedia('(display-mode: standalone)').matches), vh:innerHeight,
    app:document.getElementById('app').offsetHeight, panelBottom:Math.round(p.bottom),
    insets:[cs.getPropertyValue('--sat').trim()||'?', cs.getPropertyValue('--sab').trim()||'?'],
    inner:`${innerWidth}x${innerHeight}`, screen:`${screen.width}x${screen.height}`, ua:navigator.userAgent};
  log('env viewport', ENV);
}

/* ---- boot ---- */
log('boot', `${APP.name} ${BUILD} · server ${cfg.server ? 'set' : 'not set'}`);
try { const lf = JSON.parse(localStorage.getItem(APP.key+'-lastfail')||'null'); if (lf) log('lastfail', lf); } catch(_){}
applyLook();
initMap();
startWatch();
renderPanel();
setPanel('peek');
requestAnimationFrame(envViewport);
window.addEventListener('focus', ()=>scrollTo(0, 0));
</script>
