<style>
/* ---------- looks: Native (dark) + Dawn (light), following the system ---------- */
:root, :root[data-look=native] {
  --bg:#000; --surface:#1c1c1e; --surface2:#2c2c2e; --fg:#f2f2f7; --muted:#8e8e93; --line:rgba(84,84,88,.55);
  --panel:rgba(28,28,30,.86); --field:rgba(118,118,128,.24);
  --blue:#0a84ff; --green:#30d158; --amber:#ffd60a; --red:#ff453a;
  --route:#0a84ff; --casing:#021a33; --usual:#98989d;
  --font:-apple-system,system-ui,sans-serif; --mono:ui-monospace,Menlo,monospace;
  --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
  color-scheme:dark;
}
:root[data-look=dawn] {
  --bg:#f2f2f7; --surface:#fff; --surface2:#f2f2f7; --fg:#000; --muted:#6c6c70; --line:rgba(60,60,67,.18);
  --panel:rgba(249,249,251,.9); --field:rgba(118,118,128,.12);
  --blue:#007aff; --green:#34c759; --amber:#ff9f0a; --red:#ff3b30;
  --route:#007aff; --casing:#ffffff; --usual:#8e8e93;
  color-scheme:light;
}

/* ---------- shell (references/ios-pwa.md) ---------- */
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:16px/1.35 var(--font);-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none;-webkit-font-smoothing:antialiased}
input,textarea{-webkit-user-select:text;user-select:text}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
a{-webkit-tap-highlight-color:transparent}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
#map{position:absolute;inset:0;background:var(--surface2);z-index:1;-webkit-touch-callout:none}
.maplibregl-ctrl-top-right{top:calc(var(--sat) + 66px)}
.maplibregl-ctrl-attrib{font:11px var(--font)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.glass{background:var(--panel);-webkit-backdrop-filter:saturate(180%) blur(22px);backdrop-filter:saturate(180%) blur(22px);box-shadow:0 2px 14px rgba(0,0,0,.22)}

/* map markers */
.mk-here{width:16px;height:16px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 0 0 7px rgba(10,132,255,.2),0 1px 4px rgba(0,0,0,.35)}
.mk-dest{width:26px;height:26px;border-radius:50%;background:var(--red);border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.35);display:grid;place-items:center}
.mk-dest::after{content:"";width:7px;height:7px;border-radius:50%;background:#fff}
.mk-left{width:22px;height:22px;border-radius:7px;background:var(--green);border:2px solid #fff;display:grid;place-items:center;box-shadow:0 1px 5px rgba(0,0,0,.35)}
.mk-origin{width:14px;height:14px;border-radius:50%;background:#8e8e93;border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}

/* ---------- the search bar: pinned to the top of what's visible; nothing moves when you type ---------- */
#top{position:absolute;left:10px;right:10px;top:calc(var(--sat) + 8px);z-index:10;display:flex;flex-direction:column;gap:8px;transform:translateY(var(--vvt,0px))}
.sbar{display:flex;align-items:center;height:50px;padding:0 4px;border-radius:14px;color:var(--muted)}
.sbar .mag{width:40px;height:50px;display:grid;place-items:center;flex:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation;transition:color .15s}
.sbar .mag.armed{color:var(--blue)}
.sbar input{flex:1;min-width:0;height:50px;border:0;background:transparent;outline:none;padding:0;font:17px var(--font);color:var(--fg);caret-color:var(--blue);-webkit-appearance:none;appearance:none}
.sbar input::placeholder{color:var(--muted);opacity:1}
.sbar input::-webkit-search-cancel-button{display:none}
.sbar .clr{width:40px;height:50px;display:grid;place-items:center;color:var(--muted);flex:none}
.sbar .clr[hidden]{display:none}
#dstat{display:flex;flex-direction:column;gap:7px;border-radius:12px;padding:10px 12px;font-size:14px;color:var(--muted)}
#dstat:empty{display:none}
#dstat.bad{color:var(--red)}
#dstat .l{display:flex;align-items:center;justify-content:space-between;gap:10px}
#dstat .l span:first-child{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar{height:4px;border-radius:2px;background:var(--field);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--blue);border-radius:2px;transition:width .25s var(--ease)}
#drop{border-radius:14px;padding:0 14px;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;max-height:calc(var(--vvh,100dvh) - var(--sat) - 84px)}
#drop[hidden]{display:none}
.link{color:var(--blue);font-weight:600}
.eyebrow{font:700 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:12px 0 2px}
.trow{display:flex;align-items:center;gap:12px;min-height:58px;padding:7px 0;text-align:left;width:100%;border-bottom:1px solid var(--line)}
.trow:last-child{border-bottom:0}
.trow .ico{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;background:var(--red);color:#fff}
.trow .ico.blue{background:var(--blue)}
.trow .t{display:flex;flex-direction:column;min-width:0;flex:1}
.trow b{font-weight:600;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow i{font-style:normal;color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.msg{font-size:14px;color:var(--muted);padding:14px 0}
.msg.bad{color:var(--red)}

/* ---------- the route card: bottom of the screen, one size, no dragging ---------- */
#card{position:absolute;left:0;right:0;bottom:0;z-index:8;border-radius:16px 16px 0 0;padding:16px 16px calc(14px + var(--sab));box-shadow:0 -1px 0 var(--line),0 -8px 30px rgba(0,0,0,.18);animation:cardup .36s var(--spring) both}
#card[hidden]{display:none}
@keyframes cardup{from{transform:translateY(100%)}to{transform:none}}
.rhead{display:flex;align-items:flex-start;gap:10px;margin:0 0 6px}
.rhead .t{flex:1;min-width:0}
.rhead h2{margin:0;font-size:21px;font-weight:700;letter-spacing:-.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rhead p{margin:2px 0 0;color:var(--muted);font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.x{width:30px;height:30px;border-radius:50%;background:var(--field);display:grid;place-items:center;color:var(--muted);flex:none}
.big{display:flex;align-items:center;gap:10px;font-size:34px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:6px}
.dot{display:inline-block;width:11px;height:11px;border-radius:50%;flex:none}
.dot.b{background:var(--route)}.dot.g{background:var(--usual)}
.usual{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:14px;margin-top:8px}
.facts{color:var(--muted);font-size:15px;margin-top:3px}
.from{display:flex;align-items:center;gap:10px;min-height:44px;width:100%;text-align:left;border-top:1px solid var(--line);margin-top:4px}
.from .k{color:var(--muted);font-size:15px;width:44px;flex:none}
.from .v{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.from svg{color:var(--muted);flex:none}
.opt{display:flex;align-items:center;gap:10px;min-height:48px;margin-top:6px;border-top:1px solid var(--line)}
.opt .ol{flex:1;display:flex;align-items:center;gap:10px;font-size:16px}
.opt .ol svg{color:var(--muted)}
.switch{position:relative;width:51px;height:31px;flex:none;display:inline-block}
.switch input{position:absolute;opacity:0;width:0;height:0}
.switch span{position:absolute;inset:0;border-radius:16px;background:var(--field);transition:background .2s}
.switch span::after{content:"";position:absolute;top:2px;left:2px;width:27px;height:27px;border-radius:50%;background:#fff;box-shadow:0 2px 4px rgba(0,0,0,.25);transition:transform .25s var(--spring)}
.switch input:checked+span{background:var(--green)}
.switch input:checked+span::after{transform:translateX(20px)}
.go{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;box-sizing:border-box;background:var(--green);color:#fff;font-weight:700;font-size:17px;border-radius:12px;min-height:52px;margin-top:6px;text-decoration:none;transition:transform .15s var(--spring)}
.go:active{transform:scale(.97)}
.note{font-size:13px;color:var(--muted);margin-top:8px;line-height:1.4;text-align:center}
.busy{padding:16px 0;color:var(--muted);font-size:15px}
.err{padding:4px 0 8px}
.err b{display:block;font-size:17px;margin-bottom:4px}
.err p{margin:0 0 10px;color:var(--muted);font-size:14px;line-height:1.4}
.err .btns{display:flex;flex-direction:column;gap:8px}
.sec{display:inline-flex;align-items:center;justify-content:center;min-height:36px;padding:0 14px;border-radius:9px;background:var(--field);color:var(--blue);font-weight:600;font-size:15px}
.sec.wide{width:100%;min-height:44px}

/* ---------- settings sheet: no button for it — press and hold the magnifying glass ---------- */
#sheets .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:20;animation:scrimin .25s ease both}
#sheets .sheet{position:fixed;left:0;right:0;bottom:0;max-height:90dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--surface2);border-radius:14px 14px 0 0;z-index:21;padding:0 16px calc(24px + var(--sab));box-sizing:border-box}

#sheets .sheet .grab i{width:36px;height:5px;border-radius:3px;background:var(--muted);opacity:.45}
.sh h3{margin:4px 0 12px;font-size:20px}
.group{background:var(--surface);border-radius:12px;padding:0 14px;margin-bottom:12px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;min-height:46px;border-bottom:1px solid var(--line)}
.row:last-child{border-bottom:0}
.row .k{font-size:16px}
.row.col{flex-direction:column;align-items:stretch;padding:10px 0;gap:8px}
/* the gauntlet and the hell list */
.gsum{font-weight:700;font-size:18px;margin:2px 0 10px}
.gsum.good{color:var(--green)}.gsum.warn{color:var(--amber)}.gsum.bad{color:var(--red)}
.grow{padding:9px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.35}
.grow:last-child{border-bottom:0}
.grow b{font:700 11px var(--mono);margin-right:6px}
.grow b.fail{color:var(--red)}.grow b.warn{color:var(--amber)}
.hell{display:flex;gap:12px;align-items:flex-start;padding:11px 0;border-bottom:1px solid var(--line);font-size:15px;line-height:1.35}
.hell:last-child{border-bottom:0}
.hell input{width:22px;height:22px;flex:none;margin:0;accent-color:var(--green)}
.rowbtns{display:flex;gap:8px}
.seg{display:flex;background:var(--field);border-radius:9px;padding:2px}
.seg button{padding:6px 12px;border-radius:7px;font-size:14px;color:var(--muted);font-weight:600}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--fg);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.mini{font-size:13px;color:var(--muted);line-height:1.4}
.dim{color:var(--muted)}
pre.log{font:11px/1.35 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:40vh;overflow:auto;margin:0 0 12px;color:var(--muted);-webkit-user-select:text;user-select:text}

/* toasts */
#toasts{position:fixed;left:0;right:0;top:calc(var(--sat) + 70px);display:flex;flex-direction:column;align-items:center;gap:6px;z-index:40;pointer-events:none}
.toast{background:var(--surface);color:var(--fg);border-radius:12px;padding:10px 14px;font-size:14px;font-weight:600;max-width:86vw}
.toast.bad{color:var(--red)}.toast.warn{color:var(--amber)}

/* ---------- Motion block (app-builder contract) ---------- */
:root{--spring:cubic-bezier(.2,.9,.25,1.2);--ease:cubic-bezier(.2,.7,.2,1)}
/* press */
button,.btn,.chip,.pchip,.tcpill,.tcgear,.acch,.grp,.drow,.trow,.prow,.pipbtn,.subx,.cvr,[data-go],tr[data-tx],tr[data-pl],tr[data-b],tr[data-dedit],tr[data-vk]{transition:transform .15s var(--spring)}
button:active,.btn:active,.chip:active,.pchip:active,.tcpill:active,.tcgear:active,.acch:active,.pipbtn:active,.subx:active,.cvr:active,[data-go]:active{transform:scale(.96)}
.trow:active,.prow:active,.grp:active,.drow:active,tr[data-tx]:active,tr[data-pl]:active,tr[data-b]:active,tr[data-dedit]:active,tr[data-vk]:active{transform:scale(.985)}
.chev,.accc{display:inline-block;transition:transform .15s var(--spring)}:active>.chev,:active .chev,.acch:active .accc{transform:translateX(4px)}
/* toast · sheet */
.toast{animation:toastin .42s var(--spring) both,toastout .3s ease-in 2.2s forwards;box-shadow:0 8px 24px rgba(0,0,0,.45),0 2px 6px rgba(0,0,0,.3)}
@keyframes toastin{from{transform:translateY(40px) scale(.96);opacity:0}to{transform:none;opacity:1}}@keyframes toastout{to{transform:translateY(-6px);opacity:0}}
.sheet{animation:sheetup .35s var(--spring) both}@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.sheet.from-stat{transform-origin:92% 100%;animation:sheetfromstat .42s var(--spring) both}@keyframes sheetfromstat{from{transform:scale(.25);opacity:0}to{transform:none;opacity:1}}
/* arrival */
@keyframes rowin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.boot .tcrows .trow,.boot .btab tbody tr{animation:rowin .4s var(--ease) both}
.boot .trow:nth-child(2),.boot tbody tr:nth-child(2){animation-delay:55ms}.boot .trow:nth-child(3),.boot tbody tr:nth-child(3){animation-delay:110ms}.boot .trow:nth-child(4),.boot tbody tr:nth-child(4){animation-delay:165ms}.boot .trow:nth-child(5),.boot tbody tr:nth-child(5){animation-delay:220ms}.boot .trow:nth-child(6),.boot tbody tr:nth-child(6){animation-delay:275ms}.boot .trow:nth-child(7),.boot tbody tr:nth-child(7){animation-delay:330ms}.boot .trow:nth-child(8),.boot tbody tr:nth-child(8){animation-delay:385ms}.boot .trow:nth-child(n+9),.boot tbody tr:nth-child(n+9){animation-delay:440ms}
/* charts */
.lfoot .anim,.canim{clip-path:inset(0 100% 0 0)}.lfoot.go .anim{animation:wipe 1.1s var(--ease) .1s forwards}.canim.go{animation:wipe 1s var(--ease) .05s forwards}@keyframes wipe{to{clip-path:inset(0 0 0 0)}}
.canim2{opacity:0;transform:scale(.85)}.canim2.go{animation:ringin .6s var(--spring) forwards}@keyframes ringin{to{opacity:1;transform:none}}
.lfoot .pl{opacity:0}.lfoot.go .pl{animation:pillin .35s var(--ease) forwards}@keyframes pillin{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.lfoot.go .pl:nth-of-type(1){animation-delay:1.1s}.lfoot.go .pl:nth-of-type(2){animation-delay:1.22s}.lfoot.go .pl:nth-of-type(3){animation-delay:1.34s}.lfoot.go .pl:nth-of-type(4){animation-delay:1.46s}.lfoot.go .pl:nth-of-type(5){animation-delay:1.58s}.lfoot.go .pl:nth-of-type(6){animation-delay:1.7s}
.lfoot .brk{transform-box:fill-box;transform-origin:50% 0;transform:scaleY(0)}.lfoot.go .brk{animation:brkgrow .4s var(--spring) 1.25s forwards}@keyframes brkgrow{to{transform:scaleY(1)}}
.lfoot .tpulse{opacity:0;transform-box:fill-box;transform-origin:center}.lfoot.go .tpulse{animation:tpulse .9s ease-out 1.3s 1}@keyframes tpulse{0%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(3.2)}}
.canim .cur{transform-box:fill-box;transform-origin:50% 100%}.canim.go .cur{animation:barpulse .5s ease 1.1s 1}@keyframes barpulse{0%,100%{transform:none;opacity:1}50%{transform:scaleY(1.06);opacity:.7}}
.heat .hc{opacity:0}.heat.go .hc{animation:pillin .4s var(--ease) forwards}.heat.go td:nth-child(3) .hc{animation-delay:.08s}.heat.go td:nth-child(4) .hc{animation-delay:.16s}.heat.go td:nth-child(5) .hc{animation-delay:.24s}.heat.go td:nth-child(6) .hc{animation-delay:.32s}.heat.go td:nth-child(7) .hc{animation-delay:.4s}.heat.go td:nth-child(8) .hc{animation-delay:.48s}
.heat td{transition:opacity .25s}.heat.focus tr:not(.on) td{opacity:.3}.heat .hk{cursor:pointer}
.ring circle{transition:stroke-width .2s var(--spring)}.ring circle.sel{stroke-width:21}
svg .scrub{opacity:0;pointer-events:none;transition:opacity .12s}svg .scrub.on{opacity:1}
/* controls */
.pips i{transition:background .2s}@keyframes pipbump{0%,100%{transform:scale(1)}50%{transform:scale(1.6)}}.pips.bump i:nth-child(1){animation:pipbump .3s var(--spring)}.pips.bump i:nth-child(2){animation:pipbump .3s var(--spring) .07s}.pips.bump i:nth-child(3){animation:pipbump .3s var(--spring) .14s}
tr.fold td{transition:padding .26s var(--ease),line-height .26s var(--ease),font-size .26s var(--ease),opacity .2s;padding-top:0!important;padding-bottom:0!important;line-height:0!important;font-size:0!important;opacity:0}tr.fold td *{font-size:0!important;line-height:0!important}
.hs{-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}.hs.atend{-webkit-mask-image:none;mask-image:none}
.slwrap{position:relative;padding-top:22px}.sltip{position:absolute;top:0;transform:translateX(-50%) translateY(6px);background:var(--fg);color:var(--bg);font-family:var(--mono);font-size:10px;font-weight:800;padding:2px 6px;border-radius:5px;opacity:0;transition:opacity .15s,transform .15s var(--spring);pointer-events:none;white-space:nowrap}.slwrap.dragging .sltip{opacity:1;transform:translateX(-50%) translateY(0)}
input[type=range]::-webkit-slider-thumb{transition:transform .15s var(--spring)}input[type=range]:active::-webkit-slider-thumb{transform:scale(1.3)}
.korow{position:relative;transition:transform .18s var(--ease);background:var(--surface)}.korow .grip{width:16px;color:var(--muted);font-size:11px;letter-spacing:-3px;cursor:grab;touch-action:none;user-select:none;-webkit-user-select:none;flex:none}.korow.lift{transition:none;z-index:3;box-shadow:0 8px 20px rgba(0,0,0,.45);background:var(--surface2);border-radius:6px}
/* meaning */
@keyframes dotbreathe{0%,100%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}}.tcdot{animation:dotbreathe 2.6s ease-out infinite}.tcdot.c-amber{animation-duration:1.8s}.tcdot.c-red{animation-duration:1.2s}.tcdot.muted{animation:none}
@keyframes nsamber{0%,100%{box-shadow:0 0 0 0 rgba(255,214,10,0)}50%{box-shadow:0 0 0 3px rgba(255,214,10,.4)}}@keyframes nsred{0%,100%{box-shadow:0 0 0 0 rgba(255,69,58,0)}50%{box-shadow:0 0 0 3px rgba(255,69,58,.5)}}.navstat.thin{animation:nsamber 2.4s ease-in-out infinite}.navstat.short{animation:nsred 1.3s ease-in-out infinite}
@keyframes pulse2{0%,100%{box-shadow:0 0 0 0 transparent}30%{box-shadow:0 0 0 5px rgba(255,214,10,.3)}60%{box-shadow:0 0 0 0 transparent}80%{box-shadow:0 0 0 5px rgba(255,214,10,.3)}}.tag.pulse2{animation:pulse2 1.8s ease .4s 1}

@keyframes emptybreathe{0%,100%{opacity:.55}50%{opacity:1}}.empty{animation:emptybreathe 3.2s ease-in-out infinite}

<body>
<div id="app">
  <div id="map"></div>
  <div id="top">

      <input id="q" type="search" enterkeyhint="search" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" placeholder="Where to?" aria-label="Where to?">
      <button class="clr" id="clr" aria-label="Clear" hidden></button>
    </div>

  </div>

  <div id="toasts"></div>

<script id="router" type="text/plain">
'use strict';
/* arrow router — a Web Worker that holds LA County's roads and finds routes with no
   unprotected lefts. Mirrors arrow/build/build.py: write_graph() for the file, Router for
   the costs. The build routes on the same file in Python before it's published. */
const MAGIC = 0x31575241, FORMAT = 1;
const SECTIONS = [['lat', Int32Array], ['lon', Int32Array], ['nflag', Uint8Array], ['eu', Uint32Array], ['ev', Uint32Array],
  ['elen', Uint16Array], ['espd', Uint8Array], ['eflag', Uint8Array], ['egrade', Int8Array], ['gstart', Uint32Array],
  ['geom', Int16Array], ['mcar', Uint16Array], ['marr', Uint16Array], ['mwl', Uint16Array]];
const RAD = Math.PI / 180;
const MY = 0.110574, MX = 0.11132;   // metres per 1e-6° of latitude, and of longitude at the equator
const CELL = 4000;                    // snap grid cell, 1e-6° (about 440 × 370 m in LA)
const SNAP_MAX = 1000;                // metres from a point to the road it snaps to
const CURB = 45;                      // seconds: arriving, or pulling away, with the place across the street
const POP_CAP = 4000000;              // states per search before giving up
let P = null;                         // the loaded graph; swapped only after a new one is fully built
let HK = new Float64Array(1 << 17), HV = new Int32Array(1 << 17), HN = 0, HTOP = 0;

class RErr extends Error {
  constructor(code, expected, got, extra){ super(`expected ${expected}, got ${got}`); this.code = code; this.expected = expected; this.got = got; this.extra = extra || null; }
}

self.onmessage = ev => {
  const m = ev.data || {}, t0 = performance.now();
  try {
    if (m.type === 'load'){
      const g = build(m.buf, m.turn, m.vmax);
      P = g;
      self.postMessage({id: m.id, ok: true, nodes: g.N, edges: g.E, geom: g.G, snapEdges: g.snapEdges, ms: Math.round(performance.now() - t0)});
      return;
    }
    if (m.type === 'route'){
      if (!P) throw new RErr('nograph', 'the LA roads loaded in the router', 'nothing loaded');
      const route = routeReq(m.o, m.d, m.profile);
      route.ms = Math.round(performance.now() - t0);
      self.postMessage({id: m.id, ok: true, route});
      return;
    }
    throw new RErr('crash', 'a load or route message', String(m.type));
  } catch (e){
    self.postMessage({id: m.id, ok: false, error: {code: e.code || 'crash', expected: e.expected || 'a clean run',
      got: e.got != null ? String(e.got) : `${e.name}: ${e.message}`, extra: e.extra || null, stack: String(e.stack || '').slice(0, 1500)}});
  }
};

/* ---- the file -------------------------------------------------------------------- */
function build(buf, turn, vmax){
  if (!(buf instanceof ArrayBuffer) || buf.byteLength < 192) throw new RErr('data.parse', 'a graph file of 192+ bytes', buf && buf.byteLength);
  const dv = new DataView(buf);
  const magic = dv.getUint32(0, true), fmt = dv.getUint32(4, true);
  if (magic !== MAGIC) throw new RErr('data.parse', 'magic ARW1 (0x31575241)', '0x' + magic.toString(16));
  if (fmt !== FORMAT) throw new RErr('data.parse', `format ${FORMAT}`, fmt);
  const N = dv.getUint32(8, true), E = dv.getUint32(12, true), G = dv.getUint32(16, true);
  const g = {N, E, G, S6: dv.getInt32(20, true), W6: dv.getInt32(24, true), N6: dv.getInt32(28, true), E6: dv.getInt32(32, true)};
  const ns = dv.getUint32(36, true);
  if (ns !== SECTIONS.length) throw new RErr('data.parse', `${SECTIONS.length} sections`, ns);
  if (!(N > 1 && E > 0 && g.W6 < g.E6 && g.S6 < g.N6)) throw new RErr('data.parse', 'nodes, edges and a bbox', `${N}/${E}/${g.W6},${g.S6},${g.E6},${g.N6}`);
  const want = {lat: N, lon: N, nflag: N, eu: E, ev: E, elen: E, espd: E, eflag: E, egrade: 3 * E, gstart: E + 1, geom: 2 * G, mcar: 2 * E, marr: 2 * E, mwl: 2 * E};
  SECTIONS.forEach(([name, T], i) => {
    const off = dv.getUint32(64 + i * 8, true), len = dv.getUint32(68 + i * 8, true), sz = T.BYTES_PER_ELEMENT;
    if (off % sz || len % sz || off + len > buf.byteLength) throw new RErr('data.parse', `section ${name} aligned and inside the file`, `offset ${off}, ${len} bytes, file ${buf.byteLength}`);
    const a = new T(buf, off, len / sz);
    if (a.length !== want[name]) throw new RErr('data.parse', `${want[name]} items in ${name}`, a.length);
    g[name] = a;
  });
  if (g.gstart[0] !== 0 || g.gstart[E] !== G) throw new RErr('data.parse', `geometry index 0…${G}`, `${g.gstart[0]}…${g.gstart[E]}`);
  for (let e = 0; e < E; e++){
    if (g.eu[e] >= N || g.ev[e] >= N) throw new RErr('data.parse', `node ids below ${N}`, `edge ${e}: ${g.eu[e]} → ${g.ev[e]}`);
    if (g.gstart[e + 1] < g.gstart[e]) throw new RErr('data.parse', 'a rising geometry index', `edge ${e}`);
  }
  g.TURN = turn && typeof turn.signal === 'number' ? turn : {signal: 8, right: 4, left: 8, uturn: 25};
  g.VMAX = vmax > 0 ? vmax : 30.6;
  prep(g);
  return g;
}

function hill(up, avg){ return up >= 15 ? 50 : avg >= 10 ? 20 : avg >= 7 ? 1 / 0.3 : avg >= 5 ? 1.25 : 1; }

function brg(la1, lo1, la2, lo2){            // degrees clockwise from north, as build.py bearing()
  const k = Math.cos((la1 + la2) * 0.5e-6 * RAD);
  const b = Math.atan2((lo2 - lo1) * MX * k, (la2 - la1) * MY) / RAD;
  return b < 0 ? b + 360 : b;
}

function prep(g){
  const {N, E, eu: EU, ev: EV, lat: LAT, lon: LON, gstart: GS, geom: GM, eflag: EF, elen: EL, espd: SP, egrade: GR} = g;
  // directed edges leaving each node, ascending edge id: the order the turn masks count in
  const AST = new Uint32Array(N + 1);
  for (let e = 0; e < E; e++){ AST[EU[e] + 1]++; AST[EV[e] + 1]++; }
  for (let n = 0; n < N; n++) AST[n + 1] += AST[n];
  const ADJ = new Uint32Array(2 * E), cur = AST.slice(0, N);
  for (let e = 0; e < E; e++){ ADJ[cur[EU[e]]++] = 2 * e; ADJ[cur[EV[e]]++] = 2 * e + 1; }
  // seconds per directed edge, hill-weighted copy, headings off the first/last geometry segment, snap cells
  const WT = new Float32Array(2 * E), WF = new Float32Array(2 * E), DEP = new Float32Array(2 * E), ARR = new Float32Array(2 * E);
  const COLS = Math.ceil((g.E6 - g.W6) / CELL), ROWS = Math.ceil((g.N6 - g.S6) / CELL);
  const row = la => Math.min(ROWS - 1, Math.max(0, Math.floor((la - g.S6) / CELL)));
  const col = lo => Math.min(COLS - 1, Math.max(0, Math.floor((lo - g.W6) / CELL)));
  const RC = new Int32Array(4 * E), CST = new Uint32Array(ROWS * COLS + 1);
  let snapEdges = 0;
  for (let e = 0; e < E; e++){
    const t = Math.max(1, EL[e]) / (Math.max(5, SP[e]) / 3.6);
    WT[2 * e] = WT[2 * e + 1] = t;
    WF[2 * e] = t * hill(GR[3 * e + 1], GR[3 * e]);
    WF[2 * e + 1] = t * hill(GR[3 * e + 2], -GR[3 * e]);
    const u = EU[e], v = EV[e], j0 = GS[e], j1 = GS[e + 1];
    let la = LAT[u], lo = LON[u], fa = LAT[v], fo = LON[v];
    let a0 = Math.min(LAT[u], LAT[v]), a1 = Math.max(LAT[u], LAT[v]), o0 = Math.min(LON[u], LON[v]), o1 = Math.max(LON[u], LON[v]);
    for (let j = j0; j < j1; j++){
      la += GM[2 * j] * 10; lo += GM[2 * j + 1] * 10;
      if (j === j0){ fa = la; fo = lo; }
      if (la < a0) a0 = la; else if (la > a1) a1 = la;
      if (lo < o0) o0 = lo; else if (lo > o1) o1 = lo;
    }
    // (fa, fo) = first point after u, (la, lo) = last point before v
    DEP[2 * e] = brg(LAT[u], LON[u], fa, fo);
    ARR[2 * e] = brg(la, lo, LAT[v], LON[v]);
    DEP[2 * e + 1] = brg(LAT[v], LON[v], la, lo);
    ARR[2 * e + 1] = brg(fa, fo, LAT[u], LON[u]);
    const f = EF[e];
    if ((f & 8) || !(f & 3)){ RC[4 * e] = 1; RC[4 * e + 1] = 0; continue; }     // freeway, ramp, bridge, tunnel: no snapping
    const r0 = row(a0), r1 = row(a1), c0 = col(o0), c1 = col(o1);
    RC[4 * e] = r0; RC[4 * e + 1] = r1; RC[4 * e + 2] = c0; RC[4 * e + 3] = c1;
    for (let r = r0; r <= r1; r++) for (let c = c0; c <= c1; c++) CST[r * COLS + c + 1]++;
    snapEdges++;
  }
  for (let k = 0; k < ROWS * COLS; k++) CST[k + 1] += CST[k];
  const CELLS = new Uint32Array(CST[ROWS * COLS]), fill = CST.slice(0, ROWS * COLS);
  for (let e = 0; e < E; e++){
    const r0 = RC[4 * e], r1 = RC[4 * e + 1];
    for (let r = r0; r <= r1; r++) for (let c = RC[4 * e + 2]; c <= RC[4 * e + 3]; c++) CELLS[fill[r * COLS + c]++] = e;
  }
  Object.assign(g, {AST, ADJ, WT, WF, DEP, ARR, ROWS, COLS, CST, CELLS, snapEdges,
    ESEEN: new Uint32Array(E), estamp: 0, SEEN: new Uint32Array(2 * E), G: new Float64Array(2 * E), PAR: new Int32Array(2 * E), stamp: 0});
}

/* ---- snapping a point to a road ---------------------------------------------------- */
function project(e, la6, lo6){
  const g = P, u = g.eu[e], v = g.ev[e], j0 = g.gstart[e], j1 = g.gstart[e + 1], GM = g.geom;
  const sx = MX * Math.cos(la6 * 1e-6 * RAD);
  let pa = g.lat[u], po = g.lon[u];
  let ax = (po - lo6) * sx, ay = (pa - la6) * MY;
  let acc = 0, bd = Infinity, bAcc = 0, bCross = 0, bla = pa, blo = po;
  for (let j = j0; j <= j1; j++){
    let qa, qo;
    if (j < j1){ qa = pa + GM[2 * j] * 10; qo = po + GM[2 * j + 1] * 10; } else { qa = g.lat[v]; qo = g.lon[v]; }
    const bx = (qo - lo6) * sx, by = (qa - la6) * MY;
    const dx = bx - ax, dy = by - ay, L2 = dx * dx + dy * dy, L = Math.sqrt(L2);
    let t = L2 > 0 ? -(ax * dx + ay * dy) / L2 : 0;
    t = t < 0 ? 0 : t > 1 ? 1 : t;
    const fx = ax + t * dx, fy = ay + t * dy, d = Math.sqrt(fx * fx + fy * fy);
    if (d < bd){ bd = d; bAcc = acc + t * L; bCross = dy * ax - dx * ay; bla = pa + t * (qa - pa); blo = po + t * (qo - po); }
    acc += L; ax = bx; ay = by; pa = qa; po = qo;
  }
  // side +1: the point is left of the road as drawn u → v; 0: on the road itself
  return {e, d: bd, f: acc > 0 ? Math.min(1, Math.max(0, bAcc / acc)) : 0, side: bd < 4 ? 0 : bCross > 0 ? 1 : -1, la6: Math.round(bla), lo6: Math.round(blo)};
}

function snapCands(la6, lo6){
  const g = P, r = Math.floor((la6 - g.S6) / CELL), c = Math.floor((lo6 - g.W6) / CELL);
  const st = ++g.estamp, SEEN = g.ESEEN, CST = g.CST, CELLS = g.CELLS, out = [];
  for (let rr = Math.max(0, r - 2); rr <= Math.min(g.ROWS - 1, r + 2); rr++){
    for (let cc = Math.max(0, c - 2); cc <= Math.min(g.COLS - 1, c + 2); cc++){
      const k = rr * g.COLS + cc;
      for (let i = CST[k]; i < CST[k + 1]; i++){
        const e = CELLS[i];
        if (SEEN[e] === st) continue;
        SEEN[e] = st;
        const p = project(e, la6, lo6);
        if (p.d <= SNAP_MAX) out.push(p);
      }
    }
  }
  out.sort((a, b) => a.d - b.d);
  return out.slice(0, 3);
}

// Right-hand traffic: driving u → v (dir 0) with the place on the left means it's across the street.
function curb(side, dir){ return side === 0 ? 0 : ((dir === 0) === (side > 0) ? CURB : 0); }

/* ---- the search: A* over directed edges, turn masks at every node -------------------- */
function push(k, v){
  if (HN === HK.length){
    const nk = new Float64Array(HN * 2); nk.set(HK); HK = nk;
    const nv = new Int32Array(HN * 2); nv.set(HV); HV = nv;
  }
  let i = HN++;
  while (i > 0){ const p = (i - 1) >> 1; if (HK[p] <= k) break; HK[i] = HK[p]; HV[i] = HV[p]; i = p; }
  HK[i] = k; HV[i] = v;
}
function pop(){
  const top = HV[0]; HTOP = HK[0];
  const n = --HN;
  if (n > 0){
    const k = HK[n], v = HV[n];
    let i = 0;
    for (;;){
      let c = 2 * i + 1;
      if (c >= n) break;
      if (c + 1 < n && HK[c + 1] < HK[c]) c++;
      if (HK[c] >= k) break;
      HK[i] = HK[c]; HV[i] = HV[c]; i = c;
    }
    HK[i] = k; HV[i] = v;
  }
  return top;
}

function search(S, T, profile){
  const g = P, EU = g.eu, EV = g.ev, LAT = g.lat, LON = g.lon, NF = g.nflag, EF = g.eflag;
  const AST = g.AST, ADJ = g.ADJ, DEP = g.DEP, ARR = g.ARR, SEEN = g.SEEN, G = g.G, PAR = g.PAR;
  const M = profile === 'car' ? g.mcar : g.marr, W = profile === 'arrow_flat' ? g.WF : g.WT;
  const TS = g.TURN.signal, TR = g.TURN.right, TL = g.TURN.left, TU = g.TURN.uturn;
  const st = ++g.stamp;
  const tla = T.la6, tlo = T.lo6, kx = MX * Math.cos(tla * 1e-6 * RAD), hs = 0.98 / g.VMAX;
  const h = n => { const dy = (LAT[n] - tla) * MY, dx = (LON[n] - tlo) * kx; return Math.sqrt(dx * dx + dy * dy) * hs; };
  HN = 0;
  let best = Infinity, bPrev = -1, bDE = -1, pops = 0;
  const eS = S.e, fS = EF[eS], owS = (fS & 3) !== 3, eT = T.e, owT = (EF[eT] & 3) !== 3;
  for (let dir = 0; dir < 2; dir++){
    if (!(fS & (dir ? 2 : 1))) continue;
    const de = 2 * eS + dir, cs = owS ? 0 : curb(S.side, dir);
    if (eT === eS && (dir === 0 ? T.f >= S.f : T.f <= S.f)){
      const c = W[de] * Math.abs(T.f - S.f) + cs + (owT ? 0 : curb(T.side, dir));
      if (c < best){ best = c; bPrev = -1; bDE = de; }
    }
    const g0 = W[de] * (dir ? S.f : 1 - S.f) + cs;
    SEEN[de] = st; G[de] = g0; PAR[de] = -1;
    push(g0 + h(dir ? EU[eS] : EV[eS]), de);
  }
  while (HN > 0){
    const de = pop(), key = HTOP;
    if (key >= best) break;
    const e = de >> 1, n = (de & 1) ? EU[e] : EV[e], gc = G[de];
    if (key > gc + h(n) + 1e-6) continue;              // a stale heap entry
    if (++pops > POP_CAP) break;
    const m = M[de];
    if (m === 0) continue;
    const a0 = AST[n], dg = Math.min(16, AST[n + 1] - a0), sig = (NF[n] & 1) ? TS : 0, ain = ARR[de];
    for (let i = 0; i < dg; i++){
      if (((m >> i) & 1) === 0) continue;
      const b = ADJ[a0 + i], eb = b >> 1, db = b & 1;
      if ((EF[eb] & (db ? 2 : 1)) === 0) continue;
      let c = gc + sig;
      if (eb === e) c += TU;
      else { const d = (DEP[b] - ain + 540) % 360 - 180; if (d > 35) c += TR; else if (d < -35) c += TL; }
      if (eb === eT){                                  // the destination sits part-way along this edge
        const ct = c + W[b] * (db ? 1 - T.f : T.f) + (owT ? 0 : curb(T.side, db));
        if (ct < best){ best = ct; bPrev = de; bDE = b; }
      }
      const ng = c + W[b];
      if (SEEN[b] !== st || ng < G[b]){
        SEEN[b] = st; G[b] = ng; PAR[b] = de;
        push(ng + h(db ? EU[eb] : EV[eb]), b);
      }
    }
  }
  if (bDE < 0) return {des: null, pops};
  const des = [bDE];
  for (let x = bPrev, k = 0; x !== -1; x = PAR[x]){
    if (SEEN[x] !== st || ++k > 2 * g.E) throw new RErr('crash', 'a parent chain back to the start', `broken at directed edge ${x}`);
    des.push(x);
  }
  des.reverse();
  return {des, cost: best, pops};
}

/* ---- turning a list of directed edges into a drawable, explainable route -------------- */
function edgePts(e){
  const g = P, u = g.eu[e], v = g.ev[e], j0 = g.gstart[e], j1 = g.gstart[e + 1];
  const la = [g.lat[u]], lo = [g.lon[u]];
  let a = g.lat[u], b = g.lon[u];
  for (let j = j0; j < j1; j++){ a += g.geom[2 * j] * 10; b += g.geom[2 * j + 1] * 10; la.push(a); lo.push(b); }
  la.push(g.lat[v]); lo.push(g.lon[v]);
  return [la, lo];
}

function cut(e, f0, f1){                      // [lon, lat] points from fraction f0 to f1 along u → v
  const [la, lo] = edgePts(e), n = la.length, out = [];
  if (f0 <= 0 && f1 >= 1){ for (let i = 0; i < n; i++) out.push([lo[i] / 1e6, la[i] / 1e6]); return out; }
  const sx = MX * Math.cos(la[0] * 1e-6 * RAD), cum = new Float64Array(n);
  for (let i = 1; i < n; i++) cum[i] = cum[i - 1] + Math.hypot((lo[i] - lo[i - 1]) * sx, (la[i] - la[i - 1]) * MY);
  const L = cum[n - 1], d0 = f0 * L, d1 = f1 * L;
  const at = d => {
    let i = 1;
    while (i < n - 1 && cum[i] < d) i++;
    const s = cum[i] - cum[i - 1], t = s > 0 ? Math.min(1, Math.max(0, (d - cum[i - 1]) / s)) : 0;
    return [(lo[i - 1] + t * (lo[i] - lo[i - 1])) / 1e6, (la[i - 1] + t * (la[i] - la[i - 1])) / 1e6];
  };
  out.push(at(d0));
  for (let i = 1; i < n - 1; i++) if (cum[i] > d0 && cum[i] < d1) out.push([lo[i] / 1e6, la[i] / 1e6]);
  out.push(at(d1));
  return out;
}

function describe(r, S, T){
  const g = P, des = r.des, coords = [], segDE = [], segCls = [], turns = [];
  const TS = g.TURN.signal, TR = g.TURN.right, TL = g.TURN.left, TU = g.TURN.uturn;
  let dist = 0, time = 0, climb = 0, unprot = 0;
  for (let i = 0; i < des.length; i++){
    const de = des[i], e = de >> 1, dir = de & 1;
    let f0 = 0, f1 = 1;
    if (i === 0){ if (dir === 0) f0 = S.f; else f1 = S.f; }
    if (i === des.length - 1){ if (dir === 0) f1 = T.f; else f0 = T.f; }
    if (f1 < f0) f1 = f0;
    const pts = cut(e, f0, f1);
    if (dir === 1) pts.reverse();
    if (i > 0){
      const a = des[i - 1], n = dir ? g.ev[e] : g.eu[e];
      const ha = (a & 1) ? g.eu[a >> 1] : g.ev[a >> 1];
      if (ha !== n) throw new RErr('crash', 'consecutive edges meeting at a node', `${a} ends at ${ha}, ${de} starts at ${n}`);
      const d = (g.DEP[de] - g.ARR[a] + 540) % 360 - 180;
      const kind = (a >> 1) === e ? 'uturn' : d > 35 ? 'right' : d < -35 ? 'left' : 'straight';
      time += ((g.nflag[n] & 1) ? TS : 0) + (kind === 'uturn' ? TU : kind === 'right' ? TR : kind === 'left' ? TL : 0);
      const a0 = g.AST[n], dg = g.AST[n + 1] - a0;
      let pos = -1;
      for (let k = 0; k < dg; k++) if (g.ADJ[a0 + k] === de){ pos = k; break; }
      const bit = pos >= 0 && pos < 16 ? 1 << pos : 0;
      const blocked = bit !== 0 && (g.mcar[a] & bit) !== 0 && (g.marr[a] & bit) === 0;   // allowed for cars, not for arrow
      if (blocked) unprot++;
      if (kind !== 'straight') turns.push({ci: coords.length - 1, kind, deg: Math.round(d), wl: bit !== 0 && (g.mwl[a] & bit) !== 0,
        unprot: blocked, sig: (g.nflag[n] & 1) === 1, lat: g.lat[n] / 1e6, lon: g.lon[n] / 1e6});
    }
    for (let k = coords.length ? 1 : 0; k < pts.length; k++){
      coords.push(pts[k]);
      if (coords.length > 1){ segDE.push(de); segCls.push(g.eflag[e] >> 4); }
    }
    const frac = f1 - f0;
    dist += g.elen[e] * frac;
    time += g.WT[de] * frac;
    if (g.elen[e] >= 40){ const up = g.egrade[3 * e + 1 + dir]; if (up > climb) climb = up; }
  }
  return {coords, segDE, segCls, turns, unprot, dist: Math.round(dist), time: Math.round(time), cost: Math.round(r.cost * 10) / 10, climb};
}

function routeReq(o, d, profile){
  if (profile !== 'car' && profile !== 'arrow' && profile !== 'arrow_flat') throw new RErr('crash', 'profile car, arrow or arrow_flat', profile);
  const g = P;
  const cands = [['origin', o], ['destination', d]].map(([which, p]) => {
    if (!p || !isFinite(p.lat) || !isFinite(p.lon)) throw new RErr('crash', `a lat/lon for the ${which}`, JSON.stringify(p));
    const la6 = Math.round(p.lat * 1e6), lo6 = Math.round(p.lon * 1e6);
    if (la6 < g.S6 || la6 > g.N6 || lo6 < g.W6 || lo6 > g.E6) throw new RErr('outside', `the ${which} inside LA County`, `${p.lat.toFixed(5)},${p.lon.toFixed(5)}`, {which});
    const c = snapCands(la6, lo6);
    if (!c.length) throw new RErr('nosnap', `a drivable street within ${SNAP_MAX} m of the ${which}`, 'none', {which});
    return c;
  });
  const [so, sd] = cands;
  let pops = 0, tries = 0;
  for (let i = 0; i < Math.min(2, so.length); i++){
    for (let j = 0; j < Math.min(2, sd.length); j++){
      tries++;
      const r = search(so[i], sd[j], profile);
      pops += r.pops;
      if (r.des){
        const out = describe(r, so[i], sd[j]);
        return Object.assign(out, {profile, pops, tries, snapO: Math.round(so[i].d), snapD: Math.round(sd[j].d)});
      }
    }
  }
  throw new RErr('noroute', `a ${profile} route`, `none from ${tries} snap pairs, ${pops} states searched`, {tries, pops});
}
</script>

<script>

const LOG = [];

class StageError extends Error {
  constructor(stage, expected, got, evidence){ super(`[${stage}] expected ${expected}, got ${got}`); this.stage=stage; this.expected=expected; this.got=got; this.evidence=evidence||null; }

async function stage(name, fn, summarize){

}
let ENV = null;
function dumpJSON(){

    cfg:{look:cfg.look||'system', flat:!!cfg.flat, recents:(cfg.recents||[]).length},
    data:{state:DATA.state, meta:DATA.meta, got:DATA.got, total:DATA.total, updating:DATA.updating,
      err:de ? {stage:de.stage||null, message:de.message, code:de.code||null, evidence:de.evidence||null} : null},

      route:S.route ? {km:S.route.km, ms:S.route.ms, pins:S.route.pins.length, url:S.route.url} : null},

}
function download(name, text){

}
let cfg = {};
try { cfg = JSON.parse(localStorage.getItem(APP.key+'-cfg') || '{}'); } catch(e){ log('cfg', 'read failed: '+e.message); }

function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

/* ---- Motion helpers (app-builder contract) ---- */

function svgPill(x,y,txt,kind,anchor){const w=txt.length*6.2+10,h=14;const x0=anchor==='end'?x-w:anchor==='middle'?x-w/2:x;const fill=kind==='primary'?'var(--fg)':kind==='red'?'var(--red)':kind==='green'?'var(--green)':'var(--surface2)';const tf=kind==='muted'?'var(--fg)':'var(--bg)';return `<g class="pl"><rect x="${x0.toFixed(1)}" y="${(y-h/2).toFixed(1)}" width="${w.toFixed(1)}" height="${h}" rx="4" fill="${fill}"${kind==='muted'?' stroke="var(--line)"':''}/><text x="${(x0+w/2).toFixed(1)}" y="${(y+3.5).toFixed(1)}" text-anchor="middle" fill="${tf}" font-size="10" font-weight="700">${txt}</text></g>`;}
function watchCharts(v,mode){if(mode==='all'){const go=()=>v.querySelectorAll('.canim,.canim2,.canim3,.heat,.lfoot').forEach(el=>{el.style.setProperty('--rd','0s');el.classList.add('go');});go();requestAnimationFrame(go);return;}const check=()=>{let k=0;const R=v.getBoundingClientRect();v.querySelectorAll('.canim,.canim2,.canim3,.heat,.lfoot').forEach(el=>{const r=el.getBoundingClientRect();if(!r.height)return;const vis=Math.min(r.bottom,R.bottom)-Math.max(r.top,R.top);const need=Math.min(Math.max(r.height*0.3,80),r.height,R.height*0.5);const inFromBottom=R.bottom-r.top,inFromTop=r.bottom-R.top;if(inFromBottom>=need&&inFromTop>=need){if(!el.classList.contains('go')){el.style.setProperty('--rd',k.toFixed(1)+'s');k+=el.classList.contains('canim3')?1.2:0.6;el.classList.add('go');}}else if(vis<=-24&&el.classList.contains('go')){el.classList.remove('go');el.style.removeProperty('--rd');}});};if(!v.dataset.cw){v.dataset.cw='1';let t=null;v.addEventListener('scroll',()=>{if(t)return;t=requestAnimationFrame(()=>{t=null;check();});},{passive:true});}check();requestAnimationFrame(check);setTimeout(check,350);}
function wireFootScrub(root){root.querySelectorAll('svg[data-scrub]').forEach(svg=>{let pts;try{pts=JSON.parse(svg.dataset.scrub);}catch(e){return;}if(!pts||pts.length<2)return;const ns='http://www.w3.org/2000/svg';const mk=(t,a)=>{const el=document.createElementNS(ns,t);Object.entries(a).forEach(([k,v])=>el.setAttribute(k,v));return el;};const g=mk('g',{class:'scrub'});const ln=mk('line',{y1:6,y2:svg.viewBox.baseVal.height-16,stroke:'var(--fg)','stroke-width':1,opacity:.5});const dot=mk('circle',{r:4.5,fill:'var(--fg)'});const rect=mk('rect',{height:16,rx:4,fill:'var(--fg)'});const txt=mk('text',{'font-size':10,'font-weight':700,fill:'var(--bg)','text-anchor':'middle'});g.append(ln,dot,rect,txt);svg.appendChild(g);svg.style.touchAction='pan-y';let on=false;const show=e=>{const r=svg.getBoundingClientRect();const x=(e.clientX-r.left)/r.width*340;let best=pts[0];for(const p of pts)if(Math.abs(p.x-x)<Math.abs(best.x-x))best=p;ln.setAttribute('x1',best.x);ln.setAttribute('x2',best.x);dot.setAttribute('cx',best.x);dot.setAttribute('cy',best.y);const w=best.l.length*6.2+10;const px=Math.max(w/2+2,Math.min(340-w/2-2,best.x));rect.setAttribute('x',px-w/2);rect.setAttribute('y',2);rect.setAttribute('width',w);txt.setAttribute('x',px);txt.setAttribute('y',13.5);txt.textContent=best.l;g.classList.add('on');};svg.addEventListener('pointerdown',e=>{on=true;svg.setPointerCapture(e.pointerId);show(e);});svg.addEventListener('pointermove',e=>{if(on)show(e);});const off=()=>{on=false;g.classList.remove('on');};svg.addEventListener('pointerup',off);svg.addEventListener('pointercancel',off);});}
function redEdge(){if(reduced)return;const d=document.createElement('div');d.className='rededge';document.body.appendChild(d);setTimeout(()=>d.remove(),1800);}
let SHEET_FROM=null;function sheet(html,onReady){const host=document.querySelector('#sheets');const from=SHEET_FROM;SHEET_FROM=null;host.innerHTML=`<div class="scrim" data-close></div><div class="sheet ${from?'from-'+from:''}"><div class="grab" data-close><i></i></div>${html}</div>`;host.querySelectorAll('[data-close]').forEach(b=>b.onclick=closeSheet);if(onReady)onReady(host.querySelector('.sheet'));}
function wireStrips(v){v.querySelectorAll('.hs').forEach(el=>{const chk=()=>el.classList.toggle('atend',el.scrollLeft+el.clientWidth>=el.scrollWidth-2);chk();el.addEventListener('scroll',chk,{passive:true});});}
function closeSheet(){const host=document.querySelector('#sheets');const s=host.querySelector('.sheet'),sc=host.querySelector('.scrim');if(!s||reduced){host.innerHTML='';return;}s.style.animation='sheetdown .3s var(--ease) forwards';if(sc)sc.style.animation='scrimout .3s ease forwards';setTimeout(()=>{host.innerHTML='';},300);}
function toast(text, kind){ const el=document.createElement('div'); el.className='toast'+(kind?' '+kind:''); el.textContent=text; document.getElementById('toasts').appendChild(el); setTimeout(()=>el.remove(), 2700); }
function countTo(el, toMin, fmt){ if(!el) return; if(reduced){ el.textContent=fmt(toMin); return; } const t0=performance.now(), D=700; const tick=now=>{ const k=Math.min(1,(now-t0)/D), e=1-Math.pow(1-k,3); el.textContent=fmt(Math.max(1,Math.round(toMin*e))); if(k<1) requestAnimationFrame(tick); }; requestAnimationFrame(tick); }

/* =====================================================================
   icons — stroke SVG, no emoji
   ===================================================================== */
const ICON = {
  mag:'<svg viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"><circle cx="10.5" cy="10.5" r="6.5"/><path d="M15.5 15.5 21 21"/></svg>',
  pin:'<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M12 2a6.5 6.5 0 0 0-6.5 6.5c0 4.9 6.5 13 6.5 13s6.5-8.1 6.5-13A6.5 6.5 0 0 0 12 2zm0 9a2.5 2.5 0 1 1 0-5 2.5 2.5 0 0 1 0 5z"/></svg>',
  x:'<svg viewBox="0 0 24 24" width="13" height="13" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  xs:'<svg viewBox="0 0 24 24" width="19" height="19"><circle cx="12" cy="12" r="10" fill="currentColor" opacity=".7"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7" style="stroke:var(--bg)" stroke-width="2.2" stroke-linecap="round"/></svg>',
  hill:'<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M2 19 9 8l4 6 3-4 6 9z"/></svg>',
  car:'<svg viewBox="0 0 24 24" width="21" height="21" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 17v-4l2-5.5h12l2 5.5v4z"/><path d="M6.5 17v2.5M17.5 17v2.5M4 13h16"/></svg>',
  left:'<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M16 20v-7a4 4 0 0 0-4-4H6"/><path d="m10 5-4 4 4 4"/></svg>',
  loc:'<svg viewBox="0 0 24 24" width="16" height="16" fill="#fff"><path d="M20.6 3.4 3.5 10.7l7.2 2.1 2.1 7.2z"/></svg>',
  chev:'<svg class="chev" viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
};

/* =====================================================================
   state
   ===================================================================== */
const okPlace = p => p && isFinite(p.lat) && isFinite(p.lon) && typeof p.name === 'string' ? {lat:+p.lat, lon:+p.lon, name:p.name, sub:p.sub || ''} : null;
const S = {
  query: '', results: [], doneQ: '', searchErr: null,
  searching: false,      // the search box has the keyboard
  picking: 'dest',       // what a search result fills: dest | origin
  here: null,            // live GPS fix
  origin: okPlace(cfg.origin),   // null = the phone's location; a chosen start is kept on this phone
  dest: null,
  flat: !!cfg.flat,
  route: null, busy: false, busyMsg: '', err: null,
};
if (cfg.server){ delete cfg.server; saveCfg(); log('cfg', 'dropped the build 1 server address: routes are worked out on this phone now'); }

/* =====================================================================
   look
   ===================================================================== */
function lookFor(p){ return p==='light'?'dawn':p==='dark'?'native':(matchMedia('(prefers-color-scheme: dark)').matches?'native':'dawn'); }
function cssv(n){ return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); }
function applyLook(){
  const r = document.documentElement, look = lookFor(cfg.look||'system');
  if (r.dataset.look && r.dataset.look !== look && !reduced){ r.classList.add('looking'); setTimeout(()=>r.classList.remove('looking'), 500); }
  r.dataset.look = look;
  document.querySelector('meta[name=theme-color]').content = cssv('--bg');
  if (MAP && MAP.__look !== look){ MAP.__look = look; STYLE_READY = false; MAP.setStyle(CONF.styles[look]); log('map', 'style → '+look); }
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', ()=>{ if ((cfg.look||'system')==='system') applyLook(); });

/* =====================================================================
   map
   ===================================================================== */
let MAP = null, STYLE_READY = false;
const MK = {here:null, origin:null, dest:null, lefts:[]};
const EMPTY = {type:'FeatureCollection', features:[]};
function initMap(){
  if (!window.maplibregl){ log('map', 'FAIL maplibre-gl did not load (CDN unreachable)'); toast('Map didn’t load. Routing still works.', 'warn'); return; }
  const look = document.documentElement.dataset.look;
  try {
    MAP = new maplibregl.Map({container:'map', style:CONF.styles[look], center:CONF.center, zoom:CONF.zoom,
      attributionControl:false, dragRotate:false, pitchWithRotate:false, touchPitch:false});
  } catch(e){ log('map', 'FAIL '+e.message); MAP = null; toast('Map didn’t start. Routing still works.', 'warn'); return; }

  MAP.touchZoomRotate.disableRotation();
  MAP.addControl(new maplibregl.AttributionControl({compact:true}), 'top-right');
  MAP.once('load', ()=>document.querySelectorAll('.maplibregl-ctrl-attrib').forEach(a=>{ a.classList.remove('maplibregl-compact-show'); a.removeAttribute('open'); }));
  MAP.on('style.load', ()=>{ STYLE_READY = true; ensureLayers(); drawRoute(); log('map', `style ${MAP.__look} loaded`); });
  MAP.on('error', e=>log('map', 'error '+((e.error&&e.error.message)||e.message||'?')));
  // press and hold the map: route there
  let t = null, p0 = null, lastDrop = 0;
  const cancel = ()=>{ clearTimeout(t); t = null; };
  const drop = ll => { if (Date.now()-lastDrop < 900) return; lastDrop = Date.now(); dropPin(ll); };
  MAP.on('touchstart', e=>{ cancel(); if (e.originalEvent.touches.length !== 1) return; p0 = e.point; const ll = e.lngLat; t = setTimeout(()=>{ t = null; drop(ll); }, 550); });
  MAP.on('touchmove', e=>{ if (p0 && Math.hypot(e.point.x-p0.x, e.point.y-p0.y) > 10) cancel(); });
  ['touchend','touchcancel','dragstart','zoomstart'].forEach(ev=>MAP.on(ev, cancel));
  MAP.on('contextmenu', e=>drop(e.lngLat));
}
// Two lines: the usual way in grey underneath, this route in blue on top. Each draws itself in once.
const lineGrad = (color, p) => p >= 1 ? ['interpolate', ['linear'], ['line-progress'], 0, color, 1, color]
  : ['step', ['line-progress'], color, Math.max(0.0001, p), 'rgba(0,0,0,0)'];
function ensureLayers(){
  if (!MAP || !STYLE_READY) return false;
  try {
    const before = ((MAP.getStyle().layers||[]).find(l=>l.type==='symbol')||{}).id;
    const lay = (id, src, color, w)=>{ if (!MAP.getLayer(id)) MAP.addLayer({id, type:'line', source:src, layout:{'line-cap':'round','line-join':'round'},
      paint:{'line-gradient':lineGrad(color, 1), 'line-width':['interpolate',['linear'],['zoom'],9,w[0],13,w[1],17,w[2]]}}, before); };
    if (!MAP.getSource('route-car')) MAP.addSource('route-car', {type:'geojson', data:EMPTY, lineMetrics:true});
    if (!MAP.getSource('route')) MAP.addSource('route', {type:'geojson', data:EMPTY, lineMetrics:true});
    lay('route-car', 'route-car', cssv('--usual'), [3, 6, 11]);
    lay('route-casing', 'route', cssv('--casing'), [6.5, 11, 18]);
    lay('route-line', 'route', cssv('--route'), [4, 7, 12.5]);
    return true;
  } catch(e){ log('map', 'layers '+e.message); return false; }
}
let RAF = 0;
function revealRoutes(animate){
  cancelAnimationFrame(RAF);
  if (!MAP || !STYLE_READY) return;
  const col = {'route-car':cssv('--usual'), 'route-casing':cssv('--casing'), 'route-line':cssv('--route')};
  const set = (id, p)=>{ try { if (MAP.getLayer(id)) MAP.setPaintProperty(id, 'line-gradient', lineGrad(col[id], p)); } catch(e){ log('map', `reveal ${id}: ${e.message}`); } };
  const both = (pg, pb)=>{ set('route-car', pg); set('route-casing', pb); set('route-line', pb); };
  if (!animate || reduced){ both(1, 1); return; }
