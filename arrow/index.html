  const tick = now=>{
    const e = now - t0, pg = Math.min(1, e / G), pb = Math.min(1, Math.max(0, (e - LAG) / B));
    both(ease(pg), ease(pb));
    if (pg < 1 || pb < 1) RAF = requestAnimationFrame(tick);
  };
  both(0, 0);
  RAF = requestAnimationFrame(tick);
}
const lineGeo = co => ({type:'Feature', properties:{}, geometry:{type:'LineString', coordinates:co.map(c=>[c[0], c[1]])}});
function setMarker(key, lngLat, cls){
  if (!MAP) return;
  if (!lngLat){ if (MK[key]){ MK[key].remove(); MK[key] = null; } return; }
  if (!MK[key]){ const el = document.createElement('div'); el.className = cls; MK[key] = new maplibregl.Marker({element:el}).setLngLat(lngLat).addTo(MAP); }
  else MK[key].setLngLat(lngLat);
}
function drawRoute(){
  if (!MAP) return;
  setMarker('here', S.here ? [S.here.lon, S.here.lat] : null, 'mk-here');
  setMarker('origin', S.origin ? [S.origin.lon, S.origin.lat] : null, 'mk-origin');
  setMarker('dest', S.dest ? [S.dest.lon, S.dest.lat] : null, 'mk-dest');
  MK.lefts.forEach(m=>m.remove()); MK.lefts = [];
  const R = S.route;
  if (R) R.lefts.forEach(l=>{ const el = document.createElement('div'); el.className = 'mk-left'; el.innerHTML = ICON.left; MK.lefts.push(new maplibregl.Marker({element:el}).setLngLat(l).addTo(MAP)); });
  if (!ensureLayers()) return;
  const real = R && R.km > 0.005;
  MAP.getSource('route').setData(real ? lineGeo(R.coords) : EMPTY);
  MAP.getSource('route-car').setData(real && R.car && !R.same && R.car.km > 0.005 ? lineGeo(R.car.coords) : EMPTY);
  revealRoutes(!!real && !R.drawn);
  if (R) R.drawn = true;
}
function fitRoute(){
  if (!MAP || !S.route) return;
  const b = new maplibregl.LngLatBounds();
  S.route.coords.forEach(c=>b.extend([c[0], c[1]]));
  if (S.route.car && !S.route.same) S.route.car.coords.forEach(c=>b.extend([c[0], c[1]]));
  const card = document.getElementById('card');
  const top = Math.round(document.querySelector('#top .sbar').getBoundingClientRect().bottom + 20);
  const bottom = Math.round((card.hidden ? 0 : card.offsetHeight) + 24);
  if (top + bottom > innerHeight - 80) return;
  MAP.fitBounds(b, {padding:{top, bottom, left:36, right:36}, duration:reduced?0:800, maxZoom:16});
}

/* =====================================================================
   location + search
   ===================================================================== */
let WATCH = null;
function startWatch(){
  if (!('geolocation' in navigator) || WATCH != null) return;
  WATCH = navigator.geolocation.watchPosition(p=>{
    const first = !S.here;
    S.here = {lat:p.coords.latitude, lon:p.coords.longitude, acc:Math.round(p.coords.accuracy), at:Date.now()};
    if (first){ log('geo', `fix ±${S.here.acc} m`); if (MAP && !S.route) MAP.easeTo({center:[S.here.lon, S.here.lat], zoom:13.5, duration:reduced?0:700}); }
    setMarker('here', [S.here.lon, S.here.lat], 'mk-here');
  }, e=>log('geo', `watch ${e.code} ${e.message}`), {enableHighAccuracy:true, maximumAge:15000, timeout:20000});
}
function stopWatch(){ if (WATCH != null){ navigator.geolocation.clearWatch(WATCH); WATCH = null; } }
document.addEventListener('visibilitychange', ()=>{ document.hidden ? stopWatch() : startWatch(); });
// geo 1 = permission denied, 2 = no position, 3 = timeout. fast = iOS said no without asking
// (an answer from a person on a prompt takes longer than 700 ms), i.e. it's blocked in Settings.
function locateOnce(){
  return new Promise((res, rej)=>{
    if (!('geolocation' in navigator)){ const e = new StageError('origin', 'the geolocation API', 'none in this browser'); e.geo = 2; return rej(e); }
    const t0 = performance.now();
    navigator.geolocation.getCurrentPosition(
      p=>res({lat:p.coords.latitude, lon:p.coords.longitude, acc:Math.round(p.coords.accuracy), at:Date.now(), ms:Math.round(performance.now() - t0)}),
      e=>{
        const err = new StageError('origin', 'a GPS fix', `${['','permission denied','position unavailable','timeout'][e.code]||e.code}: ${e.message}`);
        err.geo = e.code; err.fast = performance.now() - t0 < 700;
        rej(err);
      },
      {enableHighAccuracy:true, maximumAge:30000, timeout:9000});
  });
}
// Ask again, from a tap. Restarts the watch, which iOS stops after a refusal.
async function askLocation(){
  S.err = null; S.busy = true; S.busyMsg = 'Asking for your location'; renderCard();
  try {
    const fix = await stage('locate', locateOnce, f=>({acc:f.acc, ms:f.ms}));
    S.here = fix; stopWatch(); startWatch(); setMarker('here', [fix.lon, fix.lat], 'mk-here');
    S.busy = false; S.busyMsg = '';
    if (S.dest){ plan(); return; }
  } catch(e){
    S.err = explain(e); redEdge();
    log('locate', `FAIL shown as "${S.err.title}"${e.fast ? ' (iOS answered without asking)' : ''}`);
  }
  S.busy = false; S.busyMsg = ''; renderCard();
}
function photonPlace(f){
  const p = f.properties||{}, [lon, lat] = f.geometry.coordinates;
  const street = [p.housenumber, p.street].filter(Boolean).join(' ');
  const name = p.name || street || p.city || 'Place';
  const sub = [p.name && street ? street : '', p.city || p.district || p.county, p.state].filter(Boolean).join(', ');
  return {lat, lon, name, sub};
}
async function photon(q){
  const c = MAP ? MAP.getCenter() : {lng:CONF.center[0], lat:CONF.center[1]};
  const u = `${CONF.photon}?q=${encodeURIComponent(q)}&limit=8&lang=en&lat=${c.lat.toFixed(4)}&lon=${c.lng.toFixed(4)}&bbox=${CONF.bbox.join(',')}`;
  const r = await fetchT(u, 8000);
  if (!r.ok) fail('search', 'HTTP 200 from Photon', r.status, {url:u, status:r.status, body:(await r.text()).slice(0,600)});
  const j = await r.json();
  if (!j || !Array.isArray(j.features)) fail('search', 'GeoJSON features from Photon', JSON.stringify(j).slice(0,160), {url:u});
  return j.features.filter(f=>f.geometry && Array.isArray(f.geometry.coordinates)).map(photonPlace);
}
async function nominatim(q){
  const [w, s, e, n] = CONF.bbox;
  const u = `${CONF.nominatim}?format=jsonv2&limit=6&bounded=1&viewbox=${w},${n},${e},${s}&q=${encodeURIComponent(q)}`;
  const r = await fetchT(u, 8000);
  if (!r.ok) fail('search.fallback', 'HTTP 200 from Nominatim', r.status, {url:u});
  const j = await r.json();
  if (!Array.isArray(j)) fail('search.fallback', 'a JSON list from Nominatim', typeof j, {url:u});
  return j.map(x=>{ const parts = String(x.display_name||'').split(','); return {lat:+x.lat, lon:+x.lon, name:x.name || parts[0], sub:parts.slice(1,3).join(',').trim()}; });
}
let SEQ = 0, STIMER = null;
function onQuery(v){
  S.query = v; S.searchErr = null; S.results = []; S.doneQ = ''; clearTimeout(STIMER);
  renderDrop();
  if (v.trim()) STIMER = setTimeout(()=>runSearch(v), 280);
}
async function runSearch(q){
  const my = ++SEQ;
  try { const res = await stage('search', ()=>photon(q), r=>({q, n:r.length})); if (my !== SEQ) return; S.results = res; }
  catch(e){
    await sleep(700); if (my !== SEQ) return;       // Nominatim forbids type-ahead: only once the typing stops
    try { const res = await stage('search.fallback', ()=>nominatim(q), r=>({q, n:r.length})); if (my !== SEQ) return; S.results = res; }
    catch(e2){ if (my !== SEQ) return; S.results = []; S.searchErr = 'Search isn’t answering right now.'; redEdge(); }
  }
  S.doneQ = q.trim();
  renderDrop();
}

/* =====================================================================
   SLOT 3a — map data: manifest → download → verify → keep on the phone → router
   The roads live in a Web Worker (the router script above). GitHub Actions
   rebuilds them monthly; the app downloads once and checks for a newer one quietly.
   ===================================================================== */
const DATA = {state:'idle', since:0, got:0, total:0, meta:null, err:null, loading:null, updating:false, upd:null};
let WK = null, WSEQ = 0;
const WPEND = new Map();
function startWorker(){
  try {
    const src = document.getElementById('router').textContent;
    WK = new Worker(URL.createObjectURL(new Blob([src], {type:'text/javascript'})));
  } catch(e){ WK = null; log('worker', 'FAIL could not start: ' + e.message); return false; }
  WK.onmessage = ev=>{
    const m = ev.data || {}, p = WPEND.get(m.id);
    if (!p) return;
    WPEND.delete(m.id); clearTimeout(p.timer);
    if (m.ok){ p.res(m); return; }
    const er = m.error || {};
    const e = new StageError(p.stage, er.expected || 'a clean answer', er.got || 'an error', {code:er.code, extra:er.extra, stack:er.stack});
    e.code = er.code || 'crash'; e.which = er.extra && er.extra.which;
    p.rej(e);
  };
  WK.onerror = ev=>{
    if (ev.preventDefault) ev.preventDefault();
    log('worker', `FAIL crashed: ${ev.message || 'no message'} (line ${ev.lineno || '?'})`);
    restartWorker(`the router crashed: ${ev.message || 'no message'}`);
  };
  WK.onmessageerror = ()=>log('worker', 'FAIL a message from the router could not be read');
  return true;
}
function restartWorker(why){
  for (const [, p] of WPEND){ clearTimeout(p.timer); const e = new StageError(p.stage, 'an answer from the router', why); e.code = 'crash'; p.rej(e); }
  WPEND.clear();
  try { if (WK) WK.terminate(); } catch(_){}
  WK = null;
  if (DATA.state === 'ready') DATA.state = 'idle';   // the roads lived in that worker: the next route reloads them from the phone
  startWorker();
  renderData();
}
function workerCall(stageName, msg, transfer, ms){
  return new Promise((res, rej)=>{
    if (!WK && !startWorker()){ const e = new StageError(stageName, 'a Web Worker', 'none could start'); e.code = 'crash'; rej(e); return; }
    const id = ++WSEQ;
    const timer = setTimeout(()=>{
      WPEND.delete(id);
      const e = new StageError(stageName, `an answer within ${ms/1000} s`, 'none'); e.code = 'crash'; rej(e);
      restartWorker(`${stageName} ran past ${ms/1000} s`);
    }, ms);
    WPEND.set(id, {res, rej, timer, stage:stageName});
    try { WK.postMessage({...msg, id}, transfer || []); }
    catch(e){ clearTimeout(timer); WPEND.delete(id); const err = new StageError(stageName, 'the request handed to the router', `${e.name}: ${e.message}`); err.code = 'crash'; rej(err); }
  });
}

/* ---- this phone's copy: IndexedDB 'arrow' / store 'kv' / key 'graph' = {meta, buf} ---- */
function idbOpen(){
  return new Promise((res, rej)=>{
    if (!window.indexedDB){ rej(new Error('no IndexedDB in this browser')); return; }
    const q = indexedDB.open(APP.key, 1);
    q.onupgradeneeded = ()=>{ if (!q.result.objectStoreNames.contains('kv')) q.result.createObjectStore('kv'); };
    q.onsuccess = ()=>res(q.result);
    q.onerror = ()=>rej(q.error || new Error('open failed'));
    q.onblocked = ()=>rej(new Error('blocked by another copy of the app'));
  });
}
async function idbDo(mode, fn){
  const db = await idbOpen();
  try {
    return await new Promise((res, rej)=>{
      const tx = db.transaction('kv', mode); let out;
      const r = fn(tx.objectStore('kv'));
      if (r) r.onsuccess = ()=>{ out = r.result; };
      tx.oncomplete = ()=>res(out);
      tx.onerror = ()=>rej(tx.error || new Error('transaction failed'));
      tx.onabort = ()=>rej(tx.error || new Error('transaction aborted (storage full?)'));
    });
  } finally { db.close(); }
}
const idbGet = key => idbDo('readonly', s=>s.get(key)).then(v=>v || null);
const idbPut = (key, val) => idbDo('readwrite', s=>s.put(val, key));
const idbDel = key => idbDo('readwrite', s=>s.delete(key));

/* ---- GitHub: Pages first, raw.githubusercontent.com when Pages hasn't caught up ---- */
async function fetchManifest(){
  const tries = [['pages', new URL(CONF.data, location.href).href], ['raw', CONF.raw]];
  const errs = []; let all404 = true;
  for (const [src, base] of tries){
    const u = `${base}manifest.json?t=${Date.now()}`;
    let r;
    try { r = await fetchT(u, 12000); }
    catch(e){ all404 = false; errs.push(`${src}: ${e.name === 'AbortError' ? 'no answer in 12 s' : e.message}`); continue; }
    if (!r.ok){ if (r.status !== 404) all404 = false; errs.push(`${src}: HTTP ${r.status}`); continue; }
    let j = null;
    try { j = await r.json(); } catch(e){ all404 = false; errs.push(`${src}: not JSON`); continue; }
    if (!j || j.format !== 1 || typeof j.file !== 'string' || !/^[0-9a-f]{64}$/.test(j.sha256 || '') || !(j.bytes_gz > 0) || !(j.bytes_raw > 0) || !(j.edges > 0) || !(j.nodes > 0))
      fail('data.manifest', 'format 1 with file, sha256, sizes and counts', JSON.stringify(j).slice(0, 240), {url:u});
    j._base = base; j._src = src;
    return j;
  }
  const err = new StageError('data.manifest', 'manifest.json from GitHub Pages or raw.githubusercontent.com', errs.join(' · '), {errs});
  err.code = all404 ? 'nodata' : 'offline';
  throw err;
}
const hex = buf => [...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2, '0')).join('');
async function fetchGraph(m, src, base, onProgress){
  const u = `${base}${m.file}?v=${encodeURIComponent(m.version)}`;
  const ac = new AbortController(); let stall = null, r = null, got = 0;
  const arm = ()=>{ clearTimeout(stall); stall = setTimeout(()=>ac.abort(), 30000); };
  const parts = [];
  arm();
  try {
    r = await fetch(u, {signal:ac.signal});
    if (!r.ok) fail('data.download', `HTTP 200 from ${src}`, `HTTP ${r.status}`, {url:u, status:r.status});
    if (!r.body || !r.body.getReader) fail('data.download', 'a streamed response body', 'none', {url:u});
    const rd = r.body.getReader();
    onProgress(0, m.bytes_gz);
    for (;;){
      const {done, value} = await rd.read();
      if (done) break;
      parts.push(value); got += value.byteLength; arm(); onProgress(got, m.bytes_gz);
    }
  } catch(e){
    if (e instanceof StageError) throw e;
    fail('data.download', `${m.bytes_gz} bytes from ${src}`, `${got} bytes, then ${e.name === 'AbortError' ? 'nothing for 30 s' : `${e.name}: ${e.message}`}`, {url:u});
  } finally { clearTimeout(stall); }
  const head = parts.length ? parts[0] : new Uint8Array(0);
  const ev = {url:u, bytes:got, contentType:r.headers.get('content-type'), contentEncoding:r.headers.get('content-encoding')};
  let raw;
  if (head[0] === 0x1f && head[1] === 0x8b){
    if (got !== m.bytes_gz) fail('data.download', `${m.bytes_gz} bytes (manifest)`, `${got} bytes`, ev);
    try { raw = await new Response(new Blob(parts).stream().pipeThrough(new DecompressionStream('gzip'))).arrayBuffer(); }
    catch(e){ fail('data.unzip', 'gzip data that inflates', `${e.name}: ${e.message}`, ev); }
  } else if (got === m.bytes_raw){
    raw = await new Blob(parts).arrayBuffer();
    log('data.download', 'arrived already inflated (Content-Encoding on the wire)');
  } else fail('data.download', `gzip bytes (1f 8b …) or ${m.bytes_raw} raw bytes`, `${got} bytes starting ${hex(head.slice(0, 4))}`, ev);
  parts.length = 0;
  if (raw.byteLength !== m.bytes_raw) fail('data.unzip', `${m.bytes_raw} bytes after unzip (manifest)`, raw.byteLength, ev);
  const sha = hex(await crypto.subtle.digest('SHA-256', raw));
  if (sha !== m.sha256) fail('data.verify', `sha256 ${m.sha256.slice(0, 16)}… (manifest)`, `${sha.slice(0, 16)}…`, ev);
  return raw;
}
async function downloadGraph(m, onProgress){
  if (typeof DecompressionStream === 'undefined') fail('data.download', 'DecompressionStream (iOS 16.4 or newer)', 'not in this browser');
  if (!window.crypto || !crypto.subtle) fail('data.verify', 'crypto.subtle (the app on https)', 'missing');
  const bases = [[m._src, m._base]];
  if (m._src !== 'raw') bases.push(['raw', CONF.raw]);
  let last = null;
  for (const [src, base] of bases){
    try { return {raw:await fetchGraph(m, src, base, onProgress), src}; }
    catch(e){ last = e; log('data.download', `${src} didn’t work: ${e.message}`); }
  }
  throw last;
}
function metaOf(m, src){
  return {format:m.format, version:m.version, sha256:m.sha256, bytes_gz:m.bytes_gz, bytes_raw:m.bytes_raw, nodes:m.nodes, edges:m.edges,
    osm_timestamp:m.osm_timestamp || null, built:m.built || null, whitelist:m.whitelist || {}, turn_costs_s:m.turn_costs_s || null,
    vmax_mps:m.vmax_mps || null, src, kept:new Date().toISOString()};
}
async function loadIntoWorker(buf, meta){
  const r = await workerCall('data.load', {type:'load', buf, turn:meta.turn_costs_s, vmax:meta.vmax_mps}, [buf], CONF.loadTimeout);
  if (r.edges !== meta.edges || r.nodes !== meta.nodes) fail('data.load', `${meta.edges} edges and ${meta.nodes} nodes (manifest)`, `${r.edges} and ${r.nodes}`);
  return r;
}
function setData(state, got, total){
  if (state !== DATA.state) DATA.since = performance.now();
  DATA.state = state; if (got != null) DATA.got = got; if (total != null) DATA.total = total;
  renderData();
  if (state === 'load' || state === 'manifest' || state === 'store') setTimeout(renderData, 750);   // show the line only if it's slow
}
function progress(set){ let t = 0; return (got, total)=>{ set(got, total); const now = performance.now(); if (now - t > 120 || got >= total){ t = now; renderData(); } }; }
function persistStorage(){
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().then(ok=>log('data', `persistent storage ${ok ? 'granted' : 'not granted: iOS may clear it if the phone runs short of space'}`), ()=>{}); } catch(_){}
}
function loadData(){
  if (DATA.loading) return DATA.loading;
  DATA.loading = (async ()=>{
    DATA.err = null;
    try {
      setData('load');
      const c = await stage('data.cache', async ()=>{ try { return await idbGet('graph'); } catch(e){ log('data.cache', 'this phone’s copy is unreadable: ' + e.message); return null; } },
        c=>c && c.meta && c.buf ? {version:c.meta.version, mb:+(c.buf.byteLength/1048576).toFixed(1)} : 'none');
      if (c && c.meta && c.buf instanceof ArrayBuffer && c.buf.byteLength === c.meta.bytes_raw){
        try {
          await stage('data.load', ()=>loadIntoWorker(c.buf, c.meta), r=>({edges:r.edges, snapEdges:r.snapEdges, ms:r.ms, from:'this phone'}));
          DATA.meta = c.meta; setData('ready');
          setTimeout(()=>checkUpdate(false), 5000);
          return;
        } catch(e){ log('data', 'this phone’s copy didn’t load; getting a fresh one'); idbDel('graph').catch(()=>{}); }
      }
      setData('manifest');
      const m = await stage('data.manifest', fetchManifest, m=>({version:m.version, src:m._src, mb:+(m.bytes_gz/1048576).toFixed(1), edges:m.edges}));
      setData('download', 0, m.bytes_gz);
      const {raw, src} = await stage('data.download', ()=>downloadGraph(m, progress((g, t)=>{ DATA.got = g; DATA.total = t; })), x=>({src:x.src, bytes:x.raw.byteLength}));
      const meta = metaOf(m, src);
      setData('store');
      await stage('data.store', ()=>idbPut('graph', {meta, buf:raw}), ()=>({kept:true}))
        .catch(e=>log('data.store', `not kept on this phone (${e.message}); it downloads again next time`));
      setData('load');
      await stage('data.load', ()=>loadIntoWorker(raw, meta), r=>({edges:r.edges, snapEdges:r.snapEdges, ms:r.ms, from:src}));
      DATA.meta = meta; setData('ready');
      toast('LA roads saved on this phone');
      persistStorage();
    } catch(e){
      DATA.err = e instanceof StageError ? e : new StageError('data', 'the LA roads loaded', `${e.name}: ${e.message}`);
      setData('error'); redEdge();
    } finally { DATA.loading = null; }
  })();
  return DATA.loading;
}
async function checkUpdate(manual){
  if (DATA.state !== 'ready' || DATA.updating){ if (manual && DATA.updating) toast('Already checking'); return; }
  DATA.updating = true; renderData();
  try {
    const m = await stage('data.manifest', fetchManifest, m=>({version:m.version, src:m._src, have:DATA.meta && DATA.meta.version}));
    if (DATA.meta && m.version === DATA.meta.version){ if (manual) toast('LA roads are up to date'); return; }
    log('data', `newer roads ${m.version} (have ${DATA.meta ? DATA.meta.version : 'none'})`);
    DATA.upd = {got:0, total:m.bytes_gz};
    const {raw, src} = await stage('data.download', ()=>downloadGraph(m, progress((g, t)=>{ DATA.upd = {got:g, total:t}; })), x=>({src:x.src, bytes:x.raw.byteLength}));
    const meta = metaOf(m, src);
    await stage('data.store', ()=>idbPut('graph', {meta, buf:raw}), ()=>({kept:true}))
      .catch(e=>log('data.store', `update not kept on this phone (${e.message})`));
    await stage('data.load', ()=>loadIntoWorker(raw, meta), r=>({edges:r.edges, snapEdges:r.snapEdges, ms:r.ms, from:src}));
    DATA.meta = meta;
    toast('LA roads updated');
  } catch(e){
    log('data', `update skipped: ${e.message}`);
    if (manual) toast(e.code === 'offline' || e.code === 'nodata' ? 'Couldn’t reach GitHub' : 'Update didn’t finish', 'warn');
  } finally { DATA.updating = false; DATA.upd = null; renderData(); }
}
async function ensureData(){
  if (DATA.state === 'ready') return;
  await (DATA.loading || loadData());
  if (DATA.state !== 'ready'){
    if (DATA.err) throw DATA.err;
    const e = new StageError('data', 'the LA roads loaded', DATA.state); e.code = 'crash'; throw e;
  }
}
/* ---- the one line under the search bar while the roads load ---- */
const mb = b => (b/1048576).toFixed(b < 10485760 ? 1 : 0);
function dataLine(){
  const st = DATA.state;
  if (st === 'ready' || st === 'idle') return '';
  if (st === 'error'){ const x = explain(DATA.err || {}); return `<div class="l"><span>${esc(x.title)}</span><button class="link" data-act="retry">Try again</button></div>`; }
  if (st === 'download'){
    const p = DATA.total ? Math.min(100, Math.round(DATA.got / DATA.total * 100)) : 0;
    return `<div class="l"><span>Downloading LA roads, first time only</span><span class="mono">${mb(DATA.got)} / ${mb(DATA.total)} MB</span></div><div class="bar"><i style="width:${p}%"></i></div>`;
  }
  if (performance.now() - DATA.since < 700) return '';       // a normal launch loads in well under a second: no flash
  const words = {load:'Loading LA roads', manifest:'Looking for LA roads', store:'Saving LA roads on this phone'};
  return `<div class="l"><span class="empty">${words[st] || 'Loading LA roads'}</span></div>`;
}
function dataStatus(){
  const m = DATA.meta;
  if (DATA.updating && DATA.upd) return `Updating ${DATA.upd.total ? Math.round(DATA.upd.got / DATA.upd.total * 100) : 0}%`;
  if (DATA.state === 'ready' && m) return `${mb(m.bytes_gz)} MB · OSM ${fmtDay(m.osm_timestamp)}`;
  if (DATA.state === 'download') return `Downloading ${DATA.total ? Math.round(DATA.got / DATA.total * 100) : 0}%`;
  if (DATA.state === 'error') return 'Not loaded';
  return 'Loading';
}
function fmtDay(iso){ if (!iso) return '?'; const d = new Date(iso); return isNaN(d) ? String(iso).slice(0, 10) : d.toLocaleDateString('en-US', {month:'short', day:'numeric', year:'numeric'}); }
function wireActs(root){ if (root) root.querySelectorAll('[data-act]').forEach(b=>b.onclick = ()=>act(b.dataset.act)); }
function renderData(){
  const el = document.getElementById('dstat');
  const bar = el.querySelector('.bar i'), num = el.querySelector('.l .mono');
  if (DATA.state === 'download' && bar && num){
    bar.style.width = `${DATA.total ? Math.min(100, Math.round(DATA.got / DATA.total * 100)) : 0}%`;
    num.textContent = `${mb(DATA.got)} / ${mb(DATA.total)} MB`;
  } else {
    el.innerHTML = dataLine();
    el.classList.toggle('bad', DATA.state === 'error');
    wireActs(el);
  }
  const bw = document.getElementById('busyw');
  if (bw && !S.busyMsg) bw.textContent = DATA.state === 'ready' ? 'Finding a way with no unprotected lefts' : 'Getting the LA roads ready';
  const sd = document.getElementById('sdata');
  if (sd) sd.textContent = dataStatus();
}

/* =====================================================================
   SLOT 3b — the pipeline: here → routes (on the phone) → pins → Apple URL
   ===================================================================== */
async function route(o, d, profile){
  const name = 'route.' + profile;
  const m = await workerCall(name, {type:'route', o:{lat:o.lat, lon:o.lon}, d:{lat:d.lat, lon:d.lon}, profile}, null, CONF.routeTimeout);
  const r = m.route;
  if (!r || !Array.isArray(r.coords) || r.coords.length < 2) fail(name, 'at least 2 coordinates', r && Array.isArray(r.coords) ? r.coords.length : typeof r, {route:r});
  if (!Array.isArray(r.segDE) || r.segDE.length !== r.coords.length - 1 || !Array.isArray(r.segCls) || r.segCls.length !== r.coords.length - 1)
    fail(name, `${r.coords.length - 1} segment edges and classes`, `${r.segDE && r.segDE.length} / ${r.segCls && r.segCls.length}`);
  if (!Array.isArray(r.turns) || !(r.time >= 0) || !(r.dist >= 0)) fail(name, 'turns, time and distance', `${typeof r.turns} / ${r.time} / ${r.dist}`);
  if (r.coords.some(c=>!Array.isArray(c) || !isFinite(c[0]) || !isFinite(c[1]))) fail(name, 'finite [lon, lat] pairs', 'a bad coordinate', {first:r.coords.slice(0, 3)});
  return r;
}
const sumRoute = r => ({km:+(r.dist/1000).toFixed(2), min:+(r.time/60).toFixed(1), pts:r.coords.length, turns:r.turns.length,
  arrows:r.turns.filter(t=>t.wl).length, climb:r.climb, snap_m:[r.snapO, r.snapD], tries:r.tries, pops:r.pops, ms:r.ms});

function hav(a, b){ const R = 6371008.8, r = Math.PI/180, dLa = (b[1]-a[1])*r, dLo = (b[0]-a[0])*r; const s = Math.sin(dLa/2)**2 + Math.cos(a[1]*r)*Math.cos(b[1]*r)*Math.sin(dLo/2)**2; return 2*R*Math.asin(Math.min(1, Math.sqrt(s))); }
function cumDist(co){ const c = [0]; for (let i = 1; i < co.length; i++) c.push(c[i-1] + hav(co[i-1], co[i])); return c; }
function segAt(cum, d){ let lo = 0, hi = cum.length - 2; while (lo < hi){ const m = (lo + hi + 1) >> 1; if (cum[m] <= d) lo = m; else hi = m - 1; } return Math.max(0, lo); }
function pointAt(co, cum, d){ const i = segAt(cum, d), L = (cum[i+1] - cum[i]) || 1, f = Math.min(1, Math.max(0, (d - cum[i]) / L)); return [co[i][0] + f*(co[i+1][0]-co[i][0]), co[i][1] + f*(co[i+1][1]-co[i][1])]; }

/* Pins become Apple Maps stops, and stops are a nuisance, so there are as few as possible: only
   where the usual way leaves this route (Apple would follow the usual way there), at the start of
   each detour and after every turn inside one. Where the two routes agree, Apple gets no stop.
   With no usual way to compare against, a few hold Apple near both ends instead. */
function choosePins(R, cum, carSet){
  const co = R.coords, total = cum[cum.length-1];
  const okAt = d => d > 60 && d < total - 60 && !FWY.has(R.segCls[segAt(cum, d)]);
  const C = [];
  const add = (d, prio, why) => { if (okAt(d)) C.push({d, prio, why}); };
  const turnAt = (t, k)=>{ const ci = Math.min(t.ci, cum.length - 1), d0 = cum[ci];
    const d1 = k + 1 < R.turns.length ? cum[Math.min(R.turns[k+1].ci, cum.length - 1)] : total;
    return [ci, Math.min(d0 + 40, (d0 + d1) / 2)]; };
  if (carSet){
    const div = R.segDE.map(de => !carSet.has(de));
    for (let i = 0; i < div.length; i++){
      if (!div[i] || (i > 0 && div[i-1])) continue;
      let j = i; while (j < div.length && div[j]) j++;
      add(Math.min(cum[i] + 40, (cum[i] + cum[j]) / 2), 1, 'leaves the usual way');
    }
    R.turns.forEach((t, k)=>{
      const [ci, d] = turnAt(t, k);
      if (div[Math.min(ci, div.length - 1)] || (ci > 0 && div[ci-1])) add(d, 2, t.kind + (t.wl ? ' on an arrow' : ''));
    });
  } else {
    add(80, 3, 'pull away');
    add(total - 80, 3, 'final approach');
    R.turns.forEach((t, k)=>add(turnAt(t, k)[1], 4, t.kind + (t.wl ? ' on an arrow' : '')));
  }
  C.sort((a, b)=> a.prio - b.prio || (a.prio === 4 ? Math.min(a.d, total-a.d) - Math.min(b.d, total-b.d) : a.d - b.d));
  const cap = carSet ? CONF.maxPins : CONF.quietPins, pick = [];
  for (const c of C){
    if (pick.length >= cap) break;
    if (pick.some(p=>Math.abs(p.d - c.d) < CONF.pinGap)) continue;
    pick.push(c);
  }
  pick.sort((a, b)=>a.d - b.d);
  return pick.map(p=>({d:Math.round(p.d), prio:p.prio, why:p.why, at:pointAt(co, cum, p.d)}));
}
function appleURL(o, d, pins){
  const f = (lat, lon)=>`${lat.toFixed(6)},${lon.toFixed(6)}`;
  const q = [];
  if (o && !o.here) q.push('source=' + f(o.lat, o.lon));
  q.push('destination=' + f(d.lat, d.lon));
  pins.forEach(p=>q.push('waypoint=' + f(p.at[1], p.at[0])));
  q.push('mode=driving');
  return 'https://maps.apple.com/directions?' + q.join('&');
}
function buildModel(main, car, o, d, profile){
  const co = main.coords, n = co.length, cum = cumDist(co);
  if (main.unprot) fail('model', `no unprotected lefts on the ${profile} route`, `${main.unprot}: the router and the turn rules disagree`);
  const carSet = car ? new Set(car.segDE) : null;
  const pins = choosePins(main, cum, carSet);
  if (pins.some(p=>!isFinite(p.at[0]) || !isFinite(p.at[1]))) fail('model', 'finite pin coordinates', JSON.stringify(pins).slice(0, 200));
  const lefts = main.turns.filter(t=>t.kind === 'left' && t.wl).map(t=>[t.lon, t.lat]);
  let div = 0;
  if (carSet) for (let i = 0; i < n - 1; i++) if (!carSet.has(main.segDE[i])) div += cum[i+1] - cum[i];
  return {coords:co, cum, pins, lefts, climb:main.climb, km:main.dist/1000, ms:main.time*1000,
    car:car ? {coords:car.coords, km:car.dist/1000, ms:car.time*1000, unprot:car.unprot || 0} : null,
    same:carSet ? div < 30 : false, divergedKm:carSet ? +(div/1000).toFixed(2) : null,
    url:appleURL(o, d, pins), profile, at:Date.now()};
}
// Every error card: a title, one plain sentence or two, and the buttons that fix it (acts, see ACT_LABEL).
function explain(e){
  const c = e.code || '', w = e.which === 'origin' ? 'start' : 'destination';
  if (e.stage === 'origin'){
    if (e.geo === 1 && e.fast) return {title:'iPhone is blocking location for arrow',
      body:'In Settings → Privacy & Security → Location Services, turn Location Services on, then set Safari Websites to While Using the App. Come back and reload arrow. Or pick a starting point above.', acts:['reload']};
    if (e.geo === 1) return {title:'Location is off', body:'arrow can’t see where you are. Tap Turn on location and choose Allow, or pick a starting point above.', acts:['loc']};
    return {title:'Couldn’t find you', body:`The phone didn’t get a fix (${e.got}). Try again, or pick a starting point above.`, acts:['locretry']};
  }
  if (c === 'nodata') return {title:'The LA roads aren’t published yet', body:'GitHub builds them by itself, about 15 minutes after a change. Try again in a bit.', acts:['retry']};
  if (c === 'offline') return {title:'Can’t download the LA roads', body:'No connection to GitHub right now. They download once, then routes work without a connection.', acts:['retry']};
  if (/^data/.test(e.stage || '')) return {title:'The LA roads didn’t load', body:`${e.message}.`, acts:['retry']};
  if (c === 'outside') return e.which === 'origin'
    ? {title:'You’re outside LA County', body:'LA County is all arrow knows. Pick a starting point there.', acts:['from']}
    : {title:'Outside the map', body:'That’s outside LA County, and LA County is all arrow knows.', acts:[]};
  if (c === 'nosnap') return {title:'No road there', body:`There’s no drivable street near the ${w}.`, acts:e.which === 'origin' ? ['from'] : []};
  if (c === 'noroute') return {title:'No way there without an unprotected left', body:'Every route to this spot needs a left with no arrow. A point on the next street over usually works.', acts:[]};
  if (c === 'nograph' || c === 'crash') return {title:'The router stopped', body:'Try again: it reloads the roads from this phone.', acts:['retry']};
  return {title:'Something broke', body:`${e.message}.`, acts:['retry']};
}
const ACT_LABEL = {retry:'Try again', loc:'Turn on location', locretry:'Try again', from:'Choose a starting point', reload:'Reload arrow'};
let PLANSEQ = 0;
async function plan(){
  if (!S.dest) return;
  const my = ++PLANSEQ;
  S.route = null; S.err = null; S.busy = true;
  renderCard(); drawRoute();
  try {
    await ensureData();
    if (my !== PLANSEQ) return;
    renderData();
    const o = await stage('origin', async ()=>{
      if (S.origin) return S.origin;
      if (S.here && Date.now() - S.here.at < 120000) return {...S.here, here:true};
      const fix = await locateOnce(); S.here = fix; return {...fix, here:true};
    }, o=>({from:o.here ? 'gps' : o.name, lat:+o.lat.toFixed(5), lon:+o.lon.toFixed(5), acc:o.acc}));
    if (my !== PLANSEQ) return;
    const profile = S.flat ? 'arrow_flat' : 'arrow';
    const main = await stage('route.'+profile, ()=>route(o, S.dest, profile), sumRoute);
    const car = await stage('route.car', ()=>route(o, S.dest, 'car'), sumRoute)
      .catch(()=>{ log('route.car', 'no plain route to compare: pins fall back to the turns and both ends'); return null; });
    if (my !== PLANSEQ) return;
    const R = await stage('model', async ()=>buildModel(main, car, o, S.dest, profile),
      R=>({pins:R.pins.length, lefts:R.lefts.length, climb:R.climb, divergedKm:R.divergedKm, usualKm:R.car ? +R.car.km.toFixed(2) : null, usualUnprotected:R.car ? R.car.unprot : null, urlLen:R.url.length}));
    S.route = R;
    try { localStorage.setItem(APP.key+'-base', JSON.stringify({at:new Date().toISOString(), profile, km:+R.km.toFixed(2), min:+(R.ms/60000).toFixed(1), pins:R.pins.length, lefts:R.lefts.length, climb:R.climb, data:DATA.meta && DATA.meta.version})); } catch(_){}
    const rec = {lat:S.dest.lat, lon:S.dest.lon, name:S.dest.name, sub:S.dest.sub};
    cfg.recents = [rec, ...(cfg.recents||[]).filter(x=>Math.abs(x.lat-rec.lat) > 1e-5 || Math.abs(x.lon-rec.lon) > 1e-5)].slice(0, 6); saveCfg();
  } catch(e){
    if (my !== PLANSEQ) return;
    S.err = explain(e); redEdge();
    log('plan', `FAIL shown as "${S.err.title}" — ${e.message}`);
  } finally {
    if (my === PLANSEQ){ S.busy = false; renderCard(); drawRoute(); setTimeout(fitRoute, 60); }
  }
}
function dropPin(ll){
  log('pin', `dropped ${ll.lat.toFixed(5)},${ll.lng.toFixed(5)}`);
  Q.blur();
  S.dest = {lat:ll.lat, lon:ll.lng, name:'Dropped Pin', sub:`${ll.lat.toFixed(5)}, ${ll.lng.toFixed(5)}`};
  plan();
}

const Q = document.getElementById('q'), CLR = document.getElementById('clr'), MAG = document.getElementById('mag');
function wireSearch(){
  MAG.innerHTML = ICON.mag;
  CLR.innerHTML = ICON.xs;
  Q.addEventListener('focus', ()=>{ S.searching = true; renderDrop(); renderCard(); });
  Q.addEventListener('blur', ()=>setTimeout(()=>{
    if (document.activeElement === Q) return;
    S.searching = false; pickDest(); renderDrop(); renderCard(); window.scrollTo(0, 0);
  }, 220));
  Q.addEventListener('input', ()=>{ CLR.hidden = !Q.value; onQuery(Q.value); });
  Q.addEventListener('keydown', e=>{ if (e.key === 'Enter'){ e.preventDefault(); clearTimeout(STIMER); if (Q.value.trim()) runSearch(Q.value); } });
  CLR.onclick = ()=>{ Q.value = ''; CLR.hidden = true; onQuery(''); Q.focus(); };
  // a tap on the map puts the keyboard away
  document.getElementById('map').addEventListener('touchstart', ()=>{ if (document.activeElement === Q) Q.blur(); }, {passive:true});
  // Settings: press and hold the magnifying glass until it turns blue, then let go.
  // A quick tap just opens the search. Handled on release, so no stray click lands on the sheet.
  let t0 = 0, armT = null;
  const arm = ()=>{ t0 = Date.now(); clearTimeout(armT); armT = setTimeout(()=>MAG.classList.add('armed'), CONF.holdMs); };
  const cancel = ()=>{ clearTimeout(armT); MAG.classList.remove('armed'); t0 = 0; };
  const release = e=>{
    if (!t0) return;
    const long = Date.now() - t0 >= CONF.holdMs;
    cancel();
    if (e.cancelable) e.preventDefault();
    if (long){ Q.blur(); openSettings(); } else Q.focus();
  };
  if ('ontouchstart' in window){
    MAG.addEventListener('touchstart', arm, {passive:true});
    MAG.addEventListener('touchend', release, {passive:false});
    MAG.addEventListener('touchcancel', cancel);
  } else {
    MAG.addEventListener('mousedown', arm);
    MAG.addEventListener('mouseup', release);
    MAG.addEventListener('mouseleave', cancel);
  }
  MAG.addEventListener('contextmenu', e=>e.preventDefault());
}
// keep the search bar on the part of the screen the keyboard leaves visible
function fitVV(){

// The search bar fills the destination, or — after a tap on From — the starting point.
function pickOrigin(){

function renderDrop(){
  const el = document.getElementById('drop');
  if (!S.searching){ el.hidden = true; el.innerHTML = ''; return; }
  const q = S.query.trim(), rows = []; let eyebrow = '';
  if (S.picking === 'origin') rows.push({here:true, name:'My Location', sub:S.here ? `GPS, ±${S.here.acc} m` : 'the phone’s GPS'});
  const lead = rows.length;

  else if ((cfg.recents||[]).length){ eyebrow = 'Recents'; rows.push(...cfg.recents); }
  const waiting = q && S.doneQ !== q && !S.searchErr;
  const none = q && S.doneQ === q && !S.results.length && !S.searchErr;
  const row = (r, i)=>`<button class="trow" data-i="${i}"><span class="ico${r.here ? ' blue' : ''}">${r.here ? ICON.loc : ICON.pin}</span><span class="t"><b>${esc(r.name)}</b><i>${esc(r.sub||'')}</i></span></button>`;
  const html = rows.slice(0, lead).map(row).join('')
    + (eyebrow ? `<div class="eyebrow">${eyebrow}</div>` : '')
    + (S.searchErr ? `<div class="msg bad">${esc(S.searchErr)}</div>` : '')
    + rows.slice(lead).map((r, i)=>row(r, i + lead)).join('')
    + (waiting ? `<div class="msg empty">Searching</div>` : '')
    + (none ? `<div class="msg">Nothing by that name in LA County</div>` : '');

const GAUNTLET_EDGES = [   // name, start, destination, the answers that count as right

const HELL = [
  'Delete the arrow icon, add it again from Safari, open it on cellular: the roads download and “LA roads saved on this phone” shows',
  'Swipe the app away halfway through that download, open it again: it finishes',
  'Airplane mode after the download: hold a finger on the map, a route still comes back (search needs signal)',
  'Location: tap Don’t Allow, then Turn on location. Then block it in iPhone Settings: the card shows where to fix it',
  'Routes from a searched place, from Recents, and from a pin dropped by holding the map',
  'Change From to a place, then back to My Location',

  'Low Power Mode on: routes still come back in a few seconds',
  'Hold the magnifying glass: Settings opens; Check for new; Reload',

function fmtWhen(iso){ const d = new Date(iso); return isNaN(d) ? String(iso) : d.toLocaleString('en-US', {month:'short', day:'numeric', hour:'numeric', minute:'2-digit'}); }
function lastGauntlet(){ try { return JSON.parse(localStorage.getItem(APP.key + '-gauntlet') || 'null'); } catch(_){ return null; } }

async function runGauntlet(progress, stopped){
  const rep = {at:new Date().toISOString(), build:BUILD, data:null, checks:[], routes:[], ms:0};
  const t0 = performance.now();
  const check = (name, ok, level, detail)=>rep.checks.push({name, ok:!!ok, level:ok ? 'pass' : level, detail:ok ? '' : String(detail == null ? '' : detail).slice(0, 300)});
  const at = p=>({lat:p[0], lon:p[1]});
  const brief = r=>r.err ? {err:r.err} : {km:+(r.dist/1000).toFixed(2), min:+(r.time/60).toFixed(1), unprot:r.unprot, arrows:r.turns.filter(t=>t.wl).length, climb:r.climb, ms:r.wall, tries:r.tries, pops:r.pops};
  const total = GAUNTLET.length * 3 + GAUNTLET_EDGES.length + 4;
  let step = 0;
  const tick = what=>progress(++step, total, what);
  log('gauntlet', `START ${GAUNTLET.length} drives × 3, ${GAUNTLET_EDGES.length} bad inputs`);

  // the roads themselves
  try { await ensureData(); } catch(e){}
  check('LA roads loaded', DATA.state === 'ready', 'fail', DATA.err ? DATA.err.message : DATA.state);
  if (DATA.state !== 'ready') return finishGauntlet(rep, t0);
  rep.data = DATA.meta.version;
  let kept = null; try { kept = await idbGet('graph'); } catch(e){}
  check('LA roads kept on this phone', kept && kept.buf && kept.buf.byteLength === DATA.meta.bytes_raw, 'warn', kept ? 'the stored copy is the wrong size' : 'no copy in IndexedDB: it downloads again next launch');

  // drives across the county: plain, green-arrow, avoid-hills
  let differs = 0;
  for (const [name, o, d] of GAUNTLET){
    if (stopped()) break;
    const r = {};
    for (const prof of ['car', 'arrow', 'arrow_flat']){
      tick(`${name} · ${prof}`);
      const t = performance.now();
      try { r[prof] = await route(at(o), at(d), prof); r[prof].wall = Math.round(performance.now() - t); }
      catch(e){ r[prof] = {err:e.code || 'crash', msg:e.message, wall:Math.round(performance.now() - t)}; }
    }
    const car = r.car, arrow = r.arrow, flat = r.arrow_flat;
    rep.routes.push({name, car:brief(car), arrow:brief(arrow), flat:brief(flat)});
    check(`${name}: plain route`, !car.err, 'fail', car.msg);
    check(`${name}: green-arrow route`, !arrow.err, arrow.err === 'noroute' ? 'warn' : 'fail', arrow.msg);
    check(`${name}: avoid-hills route`, !flat.err, flat.err === 'noroute' ? 'warn' : 'fail', flat.msg);
    check(`${name}: fast enough`, Math.max(car.wall, arrow.wall, flat.wall) < 4000, 'warn', `slowest took ${Math.max(car.wall, arrow.wall, flat.wall)} ms`);
    if (car.err || arrow.err) continue;
    check(`${name}: no unprotected lefts`, arrow.unprot === 0, 'fail', `${arrow.unprot} on the green-arrow route`);
    if (!flat.err) check(`${name}: no unprotected lefts, avoiding hills`, flat.unprot === 0, 'fail', `${flat.unprot} on the avoid-hills route`);
    if (car.tries === 1 && arrow.tries === 1)
      check(`${name}: never quicker than the plain route`, arrow.cost >= car.cost - 0.5, 'fail', `green-arrow ${arrow.cost} s beats plain ${car.cost} s: the plain search missed something`);
    const s0 = arrow.coords[0], s1 = arrow.coords[arrow.coords.length - 1];
    check(`${name}: starts at the start`, hav(s0, [o[1], o[0]]) <= 1000, 'fail', `${Math.round(hav(s0, [o[1], o[0]]))} m away`);
    check(`${name}: ends at the destination`, hav(s1, [d[1], d[0]]) <= 1000, 'fail', `${Math.round(hav(s1, [d[1], d[0]]))} m away`);
    let jump = 0; for (let i = 1; i < arrow.coords.length; i++) jump = Math.max(jump, hav(arrow.coords[i-1], arrow.coords[i]));
    check(`${name}: no jumps in the line`, jump < 2500, 'warn', `one straight piece is ${Math.round(jump)} m`);
    if (!flat.err) check(`${name}: avoid hills climbs no more`, flat.climb <= arrow.climb + 1, 'warn', `${flat.climb}% avoiding hills vs ${arrow.climb}%`);
    let m = null;
    try { m = buildModel(arrow, car, at(o), at(d), 'arrow'); }
    catch(e){ check(`${name}: Apple Maps hand-off`, false, 'fail', e.message); continue; }
    if (!m.same) differs++;
    const bad = m.pins.find(p=>FWY.has(arrow.segCls[segAt(m.cum, p.d)]));
    check(`${name}: stops stay off freeways and ramps`, !bad, 'fail', bad && `a stop ${bad.d} m along`);
    check(`${name}: stops within the cap`, m.pins.length <= CONF.maxPins, 'fail', `${m.pins.length} stops`);
    let u = null; try { u = new URL(m.url); } catch(e){}
    check(`${name}: Apple Maps link is right`, u && u.hostname === 'maps.apple.com' && u.searchParams.get('destination') && u.searchParams.get('source')
      && u.searchParams.getAll('waypoint').length === m.pins.length && m.url.length < 2000, 'fail', m.url.slice(0, 180));
  }
  check('the green-arrow route differs from the plain one somewhere', differs > 0 || stopped(), 'fail', 'identical on every drive: the turn rules did nothing');

  // bad input gets the right answer, not a crash
  for (const [name, o, d, want] of GAUNTLET_EDGES){
    if (stopped()) break;
    tick(name);
    let got = 'ok', msg = '';
    try { await route(at(o), at(d), 'arrow'); } catch(e){ got = e.code || 'crash'; msg = e.message; }
    check(`${name} → ${want.join(' or ')}`, want.includes(got), 'fail', `got ${got}${msg ? `: ${msg}` : ''}`);
  }

  // eight at once
  if (!stopped()){
    tick('eight routes at once');
    const [, o, d] = GAUNTLET[14];
    const res = await Promise.allSettled(Array.from({length:8}, ()=>route(at(o), at(d), 'arrow')));
    const bad = res.filter(x=>x.status === 'rejected');
    check('eight routes at once', !bad.length, 'fail', bad.map(x=>x.reason && x.reason.message).join(' · '));
  }

  // kill the router, then route
  if (!stopped()){
    tick('router killed mid-session');
    restartWorker('gauntlet: killed on purpose');
    let ok = false, msg = '';
    try { await ensureData(); const [, o, d] = GAUNTLET[0]; await route(at(o), at(d), 'arrow'); ok = true; } catch(e){ msg = e.message; }
    check('router killed mid-session comes back from this phone', ok, 'fail', msg);
  }

  // the screen: three replans fired back to back, then × while it's still working
  if (!stopped()){
    tick('three quick replans, then ×');
    const keep = {origin:S.origin, dest:S.dest, route:S.route, err:S.err, recents:cfg.recents, base:localStorage.getItem(APP.key + '-base')};
    const o = GAUNTLET[2][1], A = GAUNTLET[0][2], B = GAUNTLET[1][2], C = GAUNTLET[3][2];
    S.origin = {lat:o[0], lon:o[1], name:'Gauntlet start', sub:''};
    S.dest = {lat:A[0], lon:A[1], name:'Race A'}; plan();
    S.dest = {lat:B[0], lon:B[1], name:'Race B'}; plan();
    S.dest = {lat:C[0], lon:C[1], name:'Race C'}; await plan();
    const end = S.route && S.route.coords[S.route.coords.length - 1];
    check('three quick replans: only the last one shows', end && hav(end, [C[1], C[0]]) < 1000, 'fail',
      end ? `the route ends ${Math.round(hav(end, [C[1], C[0]]))} m from the last destination` : `no route (${S.err ? S.err.title : 'nothing'})`);
    S.dest = {lat:A[0], lon:A[1], name:'Race A'};
    const p = plan(); act('close'); await p;
    check('× while finding a way: nothing comes back', !S.route && !S.dest, 'fail', S.route ? 'a route reappeared' : 'a destination reappeared');
    S.origin = keep.origin; S.dest = keep.dest; S.route = keep.route; S.err = keep.err; cfg.recents = keep.recents; saveCfg();
    try { if (keep.base) localStorage.setItem(APP.key + '-base', keep.base); } catch(_){}
    if (S.route) S.route.drawn = true;
    renderCard(); drawRoute();
  }
  return finishGauntlet(rep, t0);
}
function finishGauntlet(rep, t0){
  rep.ms = Math.round(performance.now() - t0);
  const bad = rep.checks.filter(c=>!c.ok);
  rep.fail = bad.filter(c=>c.level === 'fail').length; rep.warn = bad.length - rep.fail; rep.pass = rep.checks.length - bad.length;
  log('gauntlet', `DONE ${rep.pass} pass · ${rep.warn} warn · ${rep.fail} fail · ${rep.ms} ms`);
  bad.forEach(c=>log('gauntlet', `${c.level.toUpperCase()} ${c.name} — ${c.detail}`));
  try { localStorage.setItem(APP.key + '-gauntlet', JSON.stringify(rep)); }
  catch(_){ try { localStorage.setItem(APP.key + '-gauntlet', JSON.stringify({...rep, routes:[]})); } catch(__){} }
  return rep;
}
function openGauntlet(){
  let stop = false;
  sheet(`<div class="sh"><h3>The gauntlet</h3></div>
    <div class="mini" style="margin:-6px 0 12px">${GAUNTLET.length} drives across the county, three ways each, ${GAUNTLET_EDGES.length} bad inputs, eight routes at once, a killed router, and races on the screen. Every check is one the app makes for real. Keep the screen on; it takes under a minute.</div>
    <div class="group"><div class="row col"><span id="gstat" class="mono dim">Starting</span><div class="bar"><i id="gbar"></i></div></div></div>
    <div id="gout"><button class="sec wide" data-g="stop">Stop</button></div>`, s=>{
    s.querySelector('[data-g=stop]').onclick = ()=>{ stop = true; };
    runGauntlet((i, n, what)=>{
      const st = document.getElementById('gstat'), bar = document.getElementById('gbar');
      if (st) st.textContent = `${i} of ${n} · ${what}`;
      if (bar) bar.style.width = `${Math.round(i / n * 100)}%`;
    }, ()=>stop).then(rep=>{
      const out = document.getElementById('gout');
      if (!out){ toast(rep.fail ? `Gauntlet: ${rep.fail} failed` : 'Gauntlet passed', rep.fail ? 'bad' : ''); return; }
      const st = document.getElementById('gstat'), bar = document.getElementById('gbar');
      if (st) st.textContent = stop ? 'Stopped early' : 'Done';
      if (bar) bar.style.width = '100%';
      out.innerHTML = gauntletHTML(rep);
      wireGauntlet(out, rep);
      if (rep.fail) redEdge();
    }, e=>{
      log('gauntlet', 'CRASH ' + e.message);
      const out = document.getElementById('gout');
      if (out) out.innerHTML = `<div class="gsum bad">The gauntlet itself crashed: ${esc(e.message)}</div>`;
    });
  });
}
function gauntletHTML(rep){
  const bad = rep.checks.filter(c=>!c.ok).sort((a, b)=>(a.level === 'fail' ? 0 : 1) - (b.level === 'fail' ? 0 : 1));
  const cls = rep.fail ? 'bad' : rep.warn ? 'warn' : 'good';
  return `<div class="gsum ${cls}">${rep.fail ? `${rep.fail} failed` : rep.warn ? 'Passed, with warnings' : 'All clear'}</div>`
    + `<div class="mini" style="margin:-6px 0 10px">${rep.pass} pass · ${rep.warn} warn · ${rep.fail} fail · ${Math.round(rep.ms/1000)} s · ${esc(fmtWhen(rep.at))}</div>`
    + (bad.length ? `<div class="group">${bad.map(c=>`<div class="grow"><b class="${c.level}">${c.level.toUpperCase()}</b>${esc(c.name)}${c.detail ? `<div class="mini">${esc(c.detail)}</div>` : ''}</div>`).join('')}</div>` : '')
    + `<div class="rowbtns"><button class="sec" data-g="copy">Copy report</button><button class="sec" data-g="dump">Dump</button><button class="sec" data-g="hell">Hell list</button></div>`;
}
function wireGauntlet(root, rep){
  const text = ()=>[`arrow ${rep.build} · data ${rep.data} · ${rep.at}`, `${rep.pass} pass · ${rep.warn} warn · ${rep.fail} fail · ${Math.round(rep.ms/1000)} s`,
    ...rep.checks.filter(c=>!c.ok).map(c=>`${c.level.toUpperCase()} ${c.name} — ${c.detail}`)].join('\n');
  root.querySelector('[data-g=copy]').onclick = ()=>navigator.clipboard.writeText(text()).then(()=>toast('Report copied'), ()=>toast('Couldn’t copy', 'bad'));
  root.querySelector('[data-g=dump]').onclick = ()=>download(`${APP.key}-dump-${Date.now()}.json`, dumpJSON());
  root.querySelector('[data-g=hell]').onclick = openHell;
}
function openHell(){
  let done = {};
  try { done = JSON.parse(localStorage.getItem(APP.key + '-hell') || '{}') || {}; } catch(_){}
  const count = ()=>`${HELL.filter((_, i)=>done[i]).length} of ${HELL.length} done. The things a script can’t do to it.`;
  sheet(`<div class="sh"><h3>The hell list</h3></div>
    <div class="mini" id="hcount" style="margin:-6px 0 12px">${count()}</div>
    <div class="group">${HELL.map((h, i)=>`<label class="hell"><input type="checkbox" data-h="${i}" ${done[i] ? 'checked' : ''}><span>${esc(h)}</span></label>`).join('')}</div>
    <div class="rowbtns"><button class="sec" data-hr="1">Start over</button></div>`, s=>{
    s.querySelectorAll('input[data-h]').forEach(b=>b.onchange = ()=>{
      done[b.dataset.h] = b.checked;
      try { localStorage.setItem(APP.key + '-hell', JSON.stringify(done)); } catch(_){}
      const c = document.getElementById('hcount'); if (c) c.textContent = count();
    });
    s.querySelector('[data-hr]').onclick = ()=>{ try { localStorage.removeItem(APP.key + '-hell'); } catch(_){} openHell(); };
  });
}

/* ---- viewport line: logged once, always ---- */
function envViewport(){
  const cs = getComputedStyle(document.documentElement), vv = window.visualViewport;
  ENV = {standalone:!!(navigator.standalone || matchMedia('(display-mode: standalone)').matches), vh:innerHeight,
    app:document.getElementById('app').offsetHeight, barBottom:Math.round(document.querySelector('#top .sbar').getBoundingClientRect().bottom),
    insets:[cs.getPropertyValue('--sat').trim()||'?', cs.getPropertyValue('--sab').trim()||'?'],
    visual:vv ? {h:Math.round(vv.height), top:Math.round(vv.offsetTop)} : null,
    inner:`${innerWidth}x${innerHeight}`, screen:`${screen.width}x${screen.height}`, ua:navigator.userAgent};
  log('env viewport', ENV);
}

log('boot', `${APP.name} ${BUILD} · routes on this phone`);
try { const lf = JSON.parse(localStorage.getItem(APP.key+'-lastfail')||'null'); if (lf) log('lastfail', lf); } catch(_){}
applyLook();
initMap();
startWatch();
startWorker();
wireSearch();
fitVV();
renderDrop();
renderCard();
renderData();
loadData();
requestAnimationFrame(envViewport);
window.addEventListener('focus', ()=>scrollTo(0, 0));
