<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- no apple-mobile-web-app-status-bar-style: see app-builder references/ios-pwa.md -->
<meta name="theme-color" content="#000000">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<title>busboi</title>
<script>
try{var _c=JSON.parse(localStorage.getItem('busboi-cfg')||'{}');var _l=_c.look||'system';var _d=_l==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'native':'dawn'):_l;document.documentElement.dataset.look=_d;}catch(e){}
</script>
<style>
:root, :root[data-look=native] {
  --bg:#000; --surface:#141414; --surface2:#1f1f1f; --fg:#f2f2f2; --muted:#8a8a8a; --line:#2a2a2a;
  --green:#30d158; --amber:#ffd60a; --red:#ff453a; --blue:#0a84ff;
  --font:-apple-system,system-ui,sans-serif; --mono:ui-monospace,Menlo,monospace;
  --spring:cubic-bezier(.2,.9,.25,1.2); --ease:cubic-bezier(.2,.7,.2,1);
  --sheet-peek:214px;
}
:root[data-look=dawn] { --bg:#f4f5f7; --surface:#fff; --surface2:#eef0f3; --fg:#111; --muted:#6b7280; --line:#e5e7eb; --green:#15803d; --amber:#b45309; --red:#dc2626; --blue:#2563eb; }
html,body{margin:0;height:100%;overscroll-behavior:none}
body{background:var(--bg);color:var(--fg);font:16px/1.4 var(--font);-webkit-text-size-adjust:100%;-webkit-user-select:none;user-select:none}
#app{position:fixed;inset:0;height:100dvh;overflow:hidden}
#map{position:absolute;inset:0;background:var(--surface2);z-index:1}
.leaflet-top{top:calc(60px + env(safe-area-inset-top))!important}
.leaflet-container{font-family:var(--font);background:var(--surface2)}
:root:not([data-look=dawn]) .osm .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.85) contrast(.9) saturate(.6)}
.leaflet-control-attribution{font-size:9px!important;background:rgba(0,0,0,.45)!important;color:#aaa!important}:root[data-look=dawn] .leaflet-control-attribution{background:rgba(255,255,255,.6)!important;color:#555!important}.leaflet-control-attribution a{color:inherit!important}
.stoplbl{background:var(--fg);color:var(--bg);font:10px/1 var(--mono);font-weight:700;padding:3px 6px;border-radius:4px;white-space:nowrap;border:0;box-shadow:0 1px 3px rgba(0,0,0,.4)}.stoplbl:before{display:none}
.youdot{width:14px;height:14px;border-radius:50%;background:#0a84ff;border:2.5px solid #fff;box-shadow:0 0 0 6px rgba(10,132,255,.25)}
/* top bar: place chips */
#topbar{position:absolute;left:0;right:0;top:0;padding:calc(8px + env(safe-area-inset-top)) 12px 8px;z-index:5;display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;background:linear-gradient(var(--bg) 20%,transparent)}
#topbar::-webkit-scrollbar{display:none}
.pc{flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:8px 12px;font:600 13px var(--font);min-height:36px;box-shadow:0 2px 8px rgba(0,0,0,.25)}
.pc.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.pc .m{font:700 13px var(--mono)}.pc.on .m{color:var(--bg)}.pc .m{color:var(--muted)}
.pc.at{opacity:.6}
#flags{position:absolute;left:12px;right:12px;top:calc(56px + env(safe-area-inset-top));z-index:5}
.flag{background:var(--surface);border:1px solid var(--amber);border-radius:10px;padding:8px 10px;font-size:13px;display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:6px}.flag.bad{border-color:var(--red)}
.flag button{background:none;border:0;color:var(--muted);font-size:16px;min-width:32px;min-height:32px}
/* sheet */
#sheet{position:absolute;left:0;right:0;bottom:0;height:88dvh;transform:translateY(calc(88dvh - var(--sheet-peek)));background:var(--surface);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0;z-index:6;box-shadow:0 -8px 30px rgba(0,0,0,.35);transition:transform .35s var(--spring);display:flex;flex-direction:column;touch-action:none}
#sheet.half{transform:translateY(calc(88dvh - 56dvh))}#sheet.full{transform:translateY(0)}#sheet.drag{transition:none}
#sheet .grab{flex:none;padding:8px 0 4px;display:flex;justify-content:center}#sheet .grab i{width:38px;height:4px;border-radius:2px;background:var(--line)}
#sheetc{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch;padding:0 14px calc(70px + env(safe-area-inset-bottom));touch-action:pan-y}
#sheet:not(.full) #sheetc{overflow:hidden}
/* nav */
#nav{position:absolute;left:0;right:0;bottom:0;height:calc(56px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);border-top:1px solid var(--line);background:var(--bg);display:flex;z-index:7}
#nav button{flex:1;background:none;border:0;color:var(--muted);font:12px var(--mono);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;touch-action:manipulation}
#nav button.on{color:var(--fg)}#nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
/* cards */
.rc{border-radius:16px;overflow:hidden;background:var(--surface2);border:1px solid var(--line);margin-bottom:10px}
.rc .hd{padding:12px;display:flex;align-items:center;gap:10px;color:#fff}
.rc .hd .t1{font-weight:800;font-size:16px}.rc .hd .t2{font-size:12px;opacity:.85}
.rc .hd .big{margin-left:auto;text-align:right}.big{font:800 44px/1 var(--mono);letter-spacing:-.04em}.big small{display:block;font:11px var(--font);opacity:.85;letter-spacing:0}
.rc .bd{padding:10px 12px}
.badge{display:inline-flex;align-items:center;justify-content:center;min-width:44px;height:30px;padding:0 10px;border-radius:8px;font:800 15px var(--mono);color:#fff;letter-spacing:-.02em;vertical-align:middle;flex:none}
.badge.sm{min-width:32px;height:22px;font-size:12px;padding:0 7px;border-radius:6px}.badge.xl{min-width:58px;height:42px;font-size:22px;border-radius:10px}
.steps{display:flex;align-items:center;gap:6px;font:12px var(--mono);color:var(--muted);flex-wrap:wrap}.steps svg{width:16px;height:16px;stroke:var(--muted);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.tl{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:8px 0 2px}.tl i{display:block}
.row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}
.row .hs{flex:1;min-width:0}.row .hs b{display:block;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.row .hs span{font-size:12px;color:var(--muted)}
.row .mins{font:700 22px var(--mono);white-space:nowrap;text-align:right}.row .mins small{font:11px var(--mono);color:var(--muted);margin-left:2px}.row .mins .nx{font:13px var(--mono);color:var(--muted);margin-left:8px}
.row.sel{background:var(--surface2);margin:0 -14px;padding:10px 14px;border-radius:10px}
.eb{font:11px var(--mono);color:var(--muted);letter-spacing:.04em;text-transform:lowercase;margin:14px 0 6px}
.mu{color:var(--muted)}.g{color:var(--green)}.a{color:var(--amber)}.r{color:var(--red)}.mono{font-family:var(--mono)}
.chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--surface2);border-radius:999px;padding:6px 10px;font:12px var(--mono);margin:0 6px 6px 0;color:var(--fg);text-decoration:none;min-height:30px}
.chip.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}.chip.g{border-color:var(--green)}.chip.a{border-color:var(--amber);color:var(--amber)}.chip.r{border-color:var(--red);color:var(--red)}
.tcdot{width:8px;height:8px;border-radius:50%;background:var(--green);color:var(--green);display:inline-block}.tcdot.c-amber{background:var(--amber);color:var(--amber)}.tcdot.c-red{background:var(--red);color:var(--red)}
@keyframes dotbreathe{0%,100%{box-shadow:0 0 0 0 currentColor}70%{box-shadow:0 0 0 7px transparent}}.tcdot{animation:dotbreathe 2.6s ease-out infinite}.tcdot.c-amber{animation-duration:1.8s}.tcdot.c-red{animation-duration:1.2s}
/* spine */
.spine{position:relative;padding-left:26px;margin:4px 0}.spine .ln{position:absolute;left:6px;top:8px;bottom:8px;width:3px;border-radius:2px}
.sp{position:relative;padding:6px 0 10px}.sp .d{position:absolute;left:-26px;top:9px;width:13px;height:13px;border-radius:50%;border:2.5px solid var(--surface);box-shadow:0 0 0 1.5px var(--muted)}
.sp .t{font:700 13px var(--mono)}.sp .w{font-size:14px}.sp .s{font-size:12px;color:var(--muted)}
a.ml{color:inherit;text-decoration:underline dotted var(--muted);text-underline-offset:3px}
.close{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:6px;width:100%}.close i{display:block;height:100%;background:var(--green)}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:46px;padding:0 16px;border-radius:12px;border:1px solid var(--line);background:var(--surface2);color:var(--fg);font:600 15px var(--font);touch-action:manipulation;text-decoration:none;gap:8px}
.btn.p{background:var(--fg);color:var(--bg);border-color:var(--fg)}.btn.w{width:100%}
input,select{font-size:16px;color:var(--fg);background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;-webkit-user-select:text;user-select:text}
label.f{display:block;margin:10px 0 4px;font:11px var(--mono);color:var(--muted)}
.srow{display:flex;justify-content:space-between;align-items:center;min-height:46px;border-bottom:1px solid var(--line);gap:10px}.srow:last-child{border:0}
pre.log{font:11px/1.35 var(--mono);white-space:pre-wrap;word-break:break-all;max-height:40vh;overflow:auto;margin:8px 0 0;-webkit-user-select:text;user-select:text}
.empty{color:var(--muted);padding:14px 0;font-size:14px;animation:emptybreathe 3.2s ease-in-out infinite}@keyframes emptybreathe{0%,100%{opacity:.55}50%{opacity:1}}
.err{font:12px/1.4 var(--mono);color:var(--red);padding:8px;border:1px solid var(--red);border-radius:8px;margin:10px 0;white-space:pre-wrap}
/* overlays */
.ov{position:absolute;inset:0;z-index:8;background:var(--bg);overflow-y:auto;padding:calc(10px + env(safe-area-inset-top)) 14px calc(20px + env(safe-area-inset-bottom));animation:slidein .28s var(--ease)}
.ov[hidden]{display:none}@keyframes slidein{from{transform:translateX(30px);opacity:0}to{transform:none;opacity:1}}
.ov .back{display:inline-flex;align-items:center;min-height:40px;color:var(--muted);font:14px var(--font);background:none;border:0;padding:0 4px 0 0;margin-bottom:6px}
#go{position:absolute;left:0;right:0;bottom:0;z-index:9;background:var(--surface);border-top:1px solid var(--line);border-radius:18px 18px 0 0;padding:12px 14px calc(16px + env(safe-area-inset-bottom));animation:sheetup .35s var(--spring)}
#go[hidden]{display:none}@keyframes sheetup{from{transform:translateY(100%)}to{transform:none}}
.toast{position:fixed;left:16px;right:16px;bottom:calc(72px + env(safe-area-inset-bottom));background:var(--fg);color:var(--bg);padding:12px 14px;border-radius:10px;font-weight:600;z-index:20;text-align:center;animation:toastin .42s var(--spring) both,toastout .3s ease-in 2.2s forwards;box-shadow:0 8px 24px rgba(0,0,0,.45)}
@keyframes toastin{from{transform:translateY(40px) scale(.96);opacity:0}to{transform:none;opacity:1}}@keyframes toastout{to{transform:translateY(-6px);opacity:0}}
button,.btn,.chip,.pc,.row,.rc{transition:transform .15s var(--spring)}button:active,.btn:active,.chip:active,.pc:active{transform:scale(.96)}.row:active,.rc:active{transform:scale(.985)}
.rededge{position:fixed;left:0;right:0;top:0;height:36px;pointer-events:none;z-index:50;background:linear-gradient(rgba(255,69,58,.55),transparent);animation:edgepulse 1.7s ease 1 forwards}@keyframes edgepulse{0%,100%{opacity:0}20%,30%{opacity:1}50%{opacity:.1}65%,75%{opacity:1}}
html.looking,html.looking *{transition:background-color .3s ease,color .3s ease,border-color .3s ease!important}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="topbar"></div>
  <div id="flags"></div>
  <div id="sheet"><div class="grab"><i></i></div><div id="sheetc"></div></div>
  <div id="go" hidden></div>
  <div id="settings" class="ov" hidden></div>
  <div id="nav"></div>
</div>
<script>
'use strict';
/* =====================================================================
   SLOT 1 — APP
   ===================================================================== */
const BUILD = 'build 9';
const APP = { key:'busboi', name:'busboi', answer:'how many minutes until you walk out the door' };

/* =====================================================================
   ENGINE — log, fail, cfg, stages
   ===================================================================== */
const LOG = [];
function log(stg, data){ const line=`${new Date().toISOString().slice(11,23)} ${stg} ${data==null?'':typeof data==='string'?data:JSON.stringify(data)}`; LOG.push(line); if(LOG.length>500) LOG.shift(); console.log(line); }
class StageError extends Error { constructor(stg,expected,got){ super(`[${stg}] expected ${expected}, got ${got}`); this.stage=stg; this.expected=expected; this.got=got; } }
function fail(stg, expected, got){ const e=new StageError(stg,expected,got); log(stg,'FAIL '+e.message); try{localStorage.setItem(APP.key+'-lastfail', e.message);}catch(x){} redEdge(); throw e; }
const STAGES = {};
async function stageA(name, fn, summarize){
  const t0=performance.now();
  try { const out=await fn(); const ms=+(performance.now()-t0).toFixed(1); const summ=summarize?summarize(out):(out&&typeof out==='object'?Object.keys(out).length+' keys':out); STAGES[name]={ok:true,ms,out:summ}; log(name,`PASS ${ms} ms | ${JSON.stringify(summ)}`); return out; }
  catch(e){ const ms=+(performance.now()-t0).toFixed(1); const err=e instanceof StageError?e:new StageError(name,'clean run',`${e.name}: ${e.message}`); STAGES[name]={ok:false,ms,error:err.message}; log(name,'FAIL '+err.message); throw err; }
}
function dumpJSON(){ return JSON.stringify({app:APP.key,build:BUILD,at:new Date().toISOString(),stages:STAGES,flags:FLAGS,cfg:{...cfg,mapbox:cfg.mapbox?'<set>':null},model:{...MODEL,trips:Object.keys(MODEL.trips||{})},log:LOG},null,2); }
function download(name,text){ const a=document.createElement('a'); a.href=URL.createObjectURL(new Blob([text],{type:'application/json'})); a.download=name; a.click(); }
let cfg={}; try{ cfg=JSON.parse(localStorage.getItem(APP.key+'-cfg')||'{}'); }catch(e){ log('cfg','read failed: '+e.message); }
function saveCfg(){ try{ localStorage.setItem(APP.key+'-cfg',JSON.stringify(cfg)); }catch(e){ log('cfg','write failed: '+e.message); } }
let FLAGS=[]; function flag(level,text){ if(!FLAGS.some(f=>f.text===text)) FLAGS.push({level,text}); }
function envViewport(){ const nav=document.getElementById('nav').getBoundingClientRect(); log('env viewport',{standalone:!!(navigator.standalone||matchMedia('(display-mode: standalone)').matches),vh:innerHeight,app:document.getElementById('app').offsetHeight,navBottom:Math.round(nav.bottom),inner:`${innerWidth}x${innerHeight}`,screen:`${screen.width}x${screen.height}`,ua:navigator.userAgent}); }
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
function redEdge(){ if(reduced)return; const d=document.createElement('div'); d.className='rededge'; document.body.appendChild(d); setTimeout(()=>d.remove(),1800); }
function toast(t){ const d=document.createElement('div'); d.className='toast'; d.textContent=t; document.body.appendChild(d); setTimeout(()=>d.remove(),2600); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }

/* =====================================================================
   SLOT 2 — CONF
   ===================================================================== */
const CONF = {
  router: 'https://api.transitous.org/api/v1',
  geocoder: 'https://nominatim.openstreetmap.org/search',
  bbox: '-122.6,37.6,-121.9,38.1',
  feed: 'us-ca-SF-bayarea_',                   // a bare AC Transit stop code becomes feed+code
  walkMax: 1200, slack: 2, cheapWithin: 15,
  fares: { 'emery go-round':0, 'ac transit':2.5, 'bay area rapid transit':2.4 },
  fareTransfer: { 'ac transit':0.5 },
  near: 250, nItin: 8, maxTransfers: 1, maxRoutes: 3,
  returnStay: 120, workReturn: '17:30', staleMin: 2,
  walkMpm: 80,                                 // metres per minute, for "walk N left"
  stopRadius: 0.0045,                          // degrees: the box for "stops near you" (~500 m)
  depN: 10, closeN: 6,                         // departures per stop; how many get the closeness lookup
  places: [
    { id:'home', name:'home',        lat:37.8170452, lon:-122.2668369, kind:'home' },
    { id:'work', name:'work',        lat:37.8521029, lon:-122.2913494, kind:'work', via:'us-ca-SF-bayarea_mtc:macarthur-bart', viaName:'MacArthur' },
    { id:'glk',  name:'grand lake',  lat:37.8115985, lon:-122.2473411, exit:15 },
    { id:'bay',  name:'bay street',  lat:37.8396033, lon:-122.2935359, exit:30, via:'us-ca-SF-bayarea_mtc:macarthur-bart', viaName:'MacArthur' },
    { id:'pied', name:'piedmont',    lat:37.827341,  lon:-122.250797,  exit:15 },
  ],
};
function places(){ return (cfg.places && cfg.places.length) ? cfg.places : CONF.places; }
function place(id){ return places().find(p=>p.id===id); }

/* =====================================================================
   SLOT 3 — model: locate → guess → plan there → plan back
   ===================================================================== */
let MODEL = { trips:{}, at:null, origin:null, dest:null, fetched:null, error:null, loading:false, here:null, guessed:true, stops:null, stop:null };
let TICK=null, PICK={};
function hav(a,b){ const R=6371000,toR=x=>x*Math.PI/180; const dLat=toR(b.lat-a.lat),dLon=toR(b.lon-a.lon); const s=Math.sin(dLat/2)**2+Math.cos(toR(a.lat))*Math.cos(toR(b.lat))*Math.sin(dLon/2)**2; return 2*R*Math.asin(Math.sqrt(s)); }
function bearing(a,b){ const toR=x=>x*Math.PI/180,toD=x=>x*180/Math.PI; const y=Math.sin(toR(b.lon-a.lon))*Math.cos(toR(b.lat)); const x=Math.cos(toR(a.lat))*Math.sin(toR(b.lat))-Math.sin(toR(a.lat))*Math.cos(toR(b.lat))*Math.cos(toR(b.lon-a.lon)); return (toD(Math.atan2(y,x))+360)%360; }
function bound(deg){ return ['northbound','eastbound','southbound','westbound'][Math.round(deg/90)%4]; }
function locate(){ return new Promise(res=>{ if(!navigator.geolocation){ res(null); return; } const t=setTimeout(()=>res(null),6000); navigator.geolocation.getCurrentPosition(p=>{ clearTimeout(t); res({lat:p.coords.latitude,lon:p.coords.longitude,acc:Math.round(p.coords.accuracy)}); },e=>{ clearTimeout(t); log('locate','denied/failed: '+e.message); res(null); },{maximumAge:60000,timeout:6000,enableHighAccuracy:false}); }); }
function nearest(pt){ let best=null,bd=1e9; for(const p of places()){ const d=hav(pt,p); if(d<bd){bd=d;best=p;} } return {place:best,d:Math.round(bd)}; }
function guessDest(at){ if(!at) return place('work'); if(at.kind==='home') return place('work'); return place('home'); }
function clockToday(hhmm){ const [h,m]=hhmm.split(':').map(Number); const d=new Date(); d.setHours(h,m,0,0); return d; }
async function getJSON(u,stg){ const r=await fetch(u,{cache:'no-store'}); if(!r.ok) fail(stg,'2xx',`${r.status} ${(await r.text()).slice(0,120)}`); return r.json(); }

async function plan(from,to,when,arriveBy,n,via){
  const u=`${CONF.router}/plan?fromPlace=${from.lat},${from.lon}&toPlace=${to.lat},${to.lon}&time=${when.toISOString()}&arriveBy=${!!arriveBy}&numItineraries=${n||CONF.nItin}&maxTransfers=${CONF.maxTransfers}&maxPreTransitTime=${CONF.walkMax}&maxPostTransitTime=${CONF.walkMax}${via?'&via='+encodeURIComponent(via):''}`;
  const t0=performance.now(); const j=await getJSON(u,'plan');
  const its=(j.itineraries||[]).map(normItin).filter(it=>it.transfers<=CONF.maxTransfers).sort((a,b)=>a.start-b.start);
  log('plan',{from:from.name||'here',to:to.name,via:via?1:0,when:when.toISOString().slice(11,16),n:its.length,ms:Math.round(performance.now()-t0)});
  if(!its.length) flag('warn',`no route ${from.name||'from here'} → ${to.name} right now`);
  return its;
}
const clean=s=>(s||'').replace(/\s*\((Timepoint)\)\s*/i,'').replace(/\s+(NB|SB|EB|WB)$/,'');
function normItin(it){
  const legs=it.legs.map(l=>{
    const walk=l.mode==='WALK'; const rt=l.routeShortName||''; const isBart=/bart|rapid transit/i.test(l.agencyName||'')||l.mode==='SUBWAY';
    const line=isBart?rt.replace(/-(N|S)$/,''):rt; const hs=(l.headsign||'').trim(); const headsign=hs.toLowerCase()===line.toLowerCase()?'':hs;
    return { walk, mode:l.mode, line, headsign, color:l.routeColor?'#'+l.routeColor:null, bart:isBart, agency:l.agencyName||'',
      from:clean(l.from.name), fromId:l.from.stopId||null, fromLL:[l.from.lat,l.from.lon], to:clean(l.to.name), toId:l.to.stopId||null, toLL:[l.to.lat,l.to.lon],
      start:new Date(l.startTime), end:new Date(l.endTime), live:!!l.realTime, dist:Math.round(l.distance||0), dur:Math.round(((new Date(l.endTime))-(new Date(l.startTime)))/60000),
      geom:decodeGeom(l.legGeometry,[l.from.lat,l.from.lon],[l.to.lat,l.to.lon]),

  });
  const sig=legs.filter(l=>!l.walk).map(l=>l.bart?cap(l.line):l.line.replace(/^(\d+)[A-Z]{1,2}$/,'$1')).join('→')||'walk';

  return { start:new Date(it.startTime), end:new Date(it.endTime), min:Math.round(it.duration/60), transfers:legs.filter(l=>!l.walk).length-1, legs, live:legs.some(l=>l.live), sig, fare:fare.total, fareNote:fare.note };
}
function fareFor(legs){ let total=0,note='',seen={}; for(const l of legs){ if(l.walk) continue; const a=(l.agency||'').toLowerCase(); let f=CONF.fares[a]; if(f==null){ f=2.5; note='~'; } if(seen[a]&&CONF.fareTransfer[a]!=null) f=CONF.fareTransfer[a]; seen[a]=1; if(a.includes('rapid transit')) note='+'; total+=f; } return {total:+total.toFixed(2),note}; }
function decodeGeom(g,a,b){ try{ if(!g||!g.points) return [a,b]; const f=Math.pow(10,g.precision||7); const s=g.points; let i=0,lat=0,lon=0; const out=[]; while(i<s.length){ let r=0,sh=0,by; do{ by=s.charCodeAt(i++)-63; r|=(by&31)<<sh; sh+=5; }while(by>=32); lat+=(r&1)?~(r>>1):(r>>1); r=0;sh=0; do{ by=s.charCodeAt(i++)-63; r|=(by&31)<<sh; sh+=5; }while(by>=32); lon+=(r&1)?~(r>>1):(r>>1); out.push([lat/f,lon/f]); } if(out.length<2) return [a,b]; if(Math.abs(out[0][0]-a[0])>0.05||Math.abs(out[0][1]-a[1])>0.05){ log('geom',`precision mismatch (${g.precision})`); return [a,b]; } return out; }catch(e){ log('geom','decode failed: '+e.message); return [a,b]; } }
async function planWay(from,to,when,n){
  const via=to.via||from.via||null;

  const viaName=((to.via?to.viaName:from.viaName)||'').toLowerCase();
  const throughVia=it=>it.legs.some(l=>!l.walk&&viaName&&(l.from.toLowerCase().includes(viaName)||l.to.toLowerCase().includes(viaName)));
  for(const d of direct){ if(throughVia(d)) continue; d.direct=true; if(!mine.some(m=>m.sig===d.sig&&Math.abs(m.start-d.start)<60000)) mine.push(d); }
  return mine.sort((a,b)=>a.start-b.start);
}
async function planRound(from,to,when){

async function rebuild(opts={}){

    else { origin={...place('home')}; flag('warn','location off · assuming home'); at=place('home'); }

function reviveTrip(t){ const fix=it=>{ it.start=new Date(it.start); it.end=new Date(it.end); it.legs.forEach(l=>{ l.start=new Date(l.start); l.end=new Date(l.end); l.stops.forEach(s=>{ if(s.at) s.at=new Date(s.at); }); }); return it; }; t.there.forEach(fix); (t.back||[]).forEach(fix); return t; }

/* routes: distinct line signatures (A · B · C) */
function minsUntil(d){ return Math.round((d-new Date())/60000); }
function pickMakeable(its,destId){
  const list=(its||[]).map((it,i)=>({it,i,lead:minsUntil(it.start)})).filter(x=>x.lead>=-1);
  const routes=[]; for(const x of list){ let r=routes.find(r=>r.sig===x.it.sig); if(!r){ if(routes.length>=CONF.maxRoutes) continue; r={sig:x.it.sig,deps:[]}; routes.push(r); } r.deps.push(x); }
  routes.forEach((r,k)=>{ r.letter='ABC'[k]; r.first=r.deps.find(d=>d.lead>=CONF.slack)||r.deps[0]; });
  const chosenR=destId!=null&&PICK[destId]?routes.find(r=>r.sig===PICK[destId]):null;
  const fastest=routes.length?Math.min(...routes.map(r=>r.first.it.min)):0;
  const autoR=routes.slice().filter(r=>r.first.it.min-fastest<=CONF.cheapWithin).sort((a,b)=>(a.first.it.fare-b.first.it.fare)||(a.first.lead-b.first.lead))[0]||routes[0]||null;
  const route=chosenR||autoR; const main=route?route.first:null;
  const then=route?route.deps.filter(d=>d!==main&&d.lead>main.lead).slice(0,3):[];
  return {main,then,routes,route,chosen:!!chosenR,list};
}

async function openStop(id,meta){
  const h=MODEL.here||MODEL.origin;
  MODEL.stop={id,name:meta?meta.name:id,code:meta?meta.code:(id.split('_').pop()),lat:meta?meta.lat:null,lon:meta?meta.lon:null,dist:meta?meta.dist:null,loading:true,deps:[]}; renderSheet();
  try{
    const j=await getJSON(`${CONF.router}/stoptimes?stopId=${encodeURIComponent(id)}&n=${CONF.depN}`,'stoptimes');
    const sts=j.stopTimes||[]; if(sts[0]&&sts[0].place){ const p=sts[0].place; MODEL.stop.name=clean(p.name); MODEL.stop.code=p.stopCode||MODEL.stop.code; MODEL.stop.lat=p.lat; MODEL.stop.lon=p.lon; if(h) MODEL.stop.dist=Math.round(hav(h,p)); }
    MODEL.stop.deps=sts.map(t=>({tripId:t.tripId,line:t.routeShortName||t.displayName||'?',headsign:(t.headsign||'').trim(),color:'#'+(t.routeColor||'0a84ff'),dep:new Date(t.place.departure||t.place.scheduledDeparture),live:!!t.realTime,close:undefined}));
    MODEL.stop.loading=false; log('stop',{id,n:MODEL.stop.deps.length}); renderSheet(); drawStop();
    const dest=MODEL.dest; if(!dest) return;
    const here={lat:MODEL.stop.lat,lon:MODEL.stop.lon}; const d0=hav(here,dest);
    for(const dp of MODEL.stop.deps.slice(0,CONF.closeN)){
      try{ const tr=await getJSON(`${CONF.router}/trip?tripId=${encodeURIComponent(dp.tripId)}`,'trip'); const leg=(tr.legs||[]).find(l=>l.mode!=='WALK')||tr.legs[0]; const seq=[{name:leg.from.name,lat:leg.from.lat,lon:leg.from.lon,arrival:leg.from.arrival},...(leg.intermediateStops||[]),{name:leg.to.name,lat:leg.to.lat,lon:leg.to.lon,arrival:leg.to.arrival}];
        let k=seq.findIndex(s=>s.stopId===id||(Math.abs(s.lat-here.lat)<0.0004&&Math.abs(s.lon-here.lon)<0.0004)); if(k<0) k=0;
        let best=null,bd=d0; for(const s of seq.slice(k+1)){ const d=hav(s,dest); if(d<bd){ bd=d; best=s; } }
        dp.close=best?{name:clean(best.name),lat:best.lat,lon:best.lon,walk:Math.max(1,Math.round(bd/CONF.walkMpm)),frac:Math.max(0,Math.min(1,1-bd/d0)),arr:best.arrival?new Date(best.arrival):null}:null;
      }catch(e){ dp.close=null; log('close',dp.tripId+' '+e.message); }
      renderSheet(); drawStop();
    }
  }catch(e){ MODEL.stop.loading=false; MODEL.stop.deps=[]; log('stop',e.message); renderSheet(); }
}
async function findStop(q){
  q=(q||'').trim(); if(!q) return; MODEL.stopq=q;
  if(/^\d{3,6}$/.test(q)){ openStop(CONF.feed+q,null); return; }
  try{ const h=MODEL.here||MODEL.origin; const j=await getJSON(`${CONF.router}/geocode?text=${encodeURIComponent(q)}&type=STOP${h?`&place=${h.lat},${h.lon}`:''}`,'geocode stop'); const s=(j||[]).find(x=>x.id&&x.id.startsWith(CONF.feed))||j[0]; if(!s) fail('geocode stop','a stop matching '+q,'none'); openStop(s.id,{name:clean(s.name),lat:s.lat,lon:s.lon,code:s.id.split('_').pop(),dist:h?Math.round(hav(h,s)):null}); }
  catch(e){ toast(e.message); }
}

/* ---- settings overlay ---- */
function settingsHTML(){
  const look=cfg.look||'system';
  return `<button class="back" data-close-settings>‹ back</button>
  <div class="eb">app</div>
  <div class="srow"><span>Build</span><span class="mono mu">${BUILD}</span></div>
  <div class="srow"><span>Look</span><select style="width:auto" onchange="setLook(this.value)">${['system','dawn','native'].map(l=>`<option ${look===l?'selected':''}>${l}</option>`).join('')}</select></div>
  <div class="srow"><span>Reload app</span><button class="btn" onclick="reloadApp()">Reload</button></div>
  <div class="srow"><span>Work → home list starts</span><input type="time" style="width:auto" value="${cfg.workReturn||CONF.workReturn}" onchange="cfg.workReturn=this.value;saveCfg();toast('saved')"></div>
  <div class="eb">map</div>
  <label class="f">mapbox public token (pk.…) — leave empty for OpenStreetMap</label><input id="mbtok" placeholder="pk.eyJ…" value="${esc(cfg.mapbox||'')}" onchange="setMapbox(this.value)">
  <div class="eb">places</div>
  ${places().map(p=>`<div class="srow"><span>${esc(p.name)} <span class="mu mono" style="font-size:11px">${p.kind||('exit +'+(p.exit||0))}${p.viaName?' · via '+esc(p.viaName):''}</span></span><span>${p.kind?'':`<button class="btn" onclick="rmPlace('${p.id}')">×</button>`}</span></div>`).join('')}
  <div class="srow"><span>Add a place</span><button class="btn" onclick="addPlaceForm()">+</button></div>
  <div id="npf"></div>
  <div class="eb">log</div>
  <div><button class="btn" onclick="navigator.clipboard.writeText(LOG.join('\\n')).then(()=>toast('copied'))">Copy</button> <button class="btn" onclick="download('${APP.key}-dump.json',dumpJSON())">Dump</button></div>
  <pre class="log">${LOG.slice(-200).join('\n').replace(/</g,'&lt;')}</pre>`;
}
function openSettings(){ const el=document.getElementById('settings'); el.innerHTML=settingsHTML(); el.hidden=false; el.querySelector('[data-close-settings]').onclick=()=>{ el.hidden=true; }; }
function setMapbox(v){ v=(v||'').trim(); if(v&&!/^pk\./.test(v)){ toast('that is not a public token (pk.…)'); return; } cfg.mapbox=v; saveCfg(); retile(); toast(v?'mapbox on':'mapbox off · using OSM'); }
function addPlaceForm(){ document.getElementById('npf').innerHTML=`<label class="f">name</label><input id="np-name" placeholder="grand lake"><label class="f">address or place</label><input id="np-addr" placeholder="3200 Grand Ave, Oakland"><label class="f">minutes to get out after a movie ends (0 if not a theater)</label><input id="np-exit" type="number" value="0"><label class="f">always go through this stop (optional, e.g. MacArthur BART)</label><input id="np-via" placeholder="leave blank to let the router pick"><div style="margin-top:12px"><button class="btn p w" onclick="addPlace()">find it</button></div>`; }
async function addPlace(){
  const name=document.getElementById('np-name').value.trim().toLowerCase(), addr=document.getElementById('np-addr').value.trim(), exit=+document.getElementById('np-exit').value||0, viaQ=document.getElementById('np-via').value.trim();
  if(!name||!addr){ toast('need a name and an address'); return; }
  try{
    const r=await fetch(`${CONF.geocoder}?format=json&limit=1&countrycodes=us&viewbox=${CONF.bbox}&bounded=1&q=${encodeURIComponent(addr)}`,{headers:{Accept:'application/json'}}); if(!r.ok) fail('geocode','2xx',r.status);
    const j=await r.json(); if(!j[0]) fail('geocode','a match for '+addr,'none');
    const p={id:name.replace(/[^a-z0-9]+/g,'-').slice(0,16)+'-'+Date.now().toString(36).slice(-3),name,lat:+j[0].lat,lon:+j[0].lon,exit,addr:j[0].display_name};
    if(viaQ){ const vj=await getJSON(`${CONF.router}/geocode?text=${encodeURIComponent(viaQ)}&type=STOP&place=${p.lat},${p.lon}`,'geocode via'); if(!vj[0]) fail('geocode via','a stop matching '+viaQ,'none'); p.via=vj[0].id; p.viaName=clean(vj[0].name); }
    cfg.places=places().slice(); cfg.places.push(p); saveCfg(); log('place add',{name,lat:p.lat,lon:p.lon,via:p.via||null}); toast(`added ${name}`); openSettings(); renderTop();
  }catch(e){ toast(e.message); }
}
function rmPlace(id){ cfg.places=places().filter(p=>p.id!==id); saveCfg(); openSettings(); renderTop(); toast('removed'); }
function setLook(l){ cfg.look=l; saveCfg(); const r=document.documentElement; const want=l==='system'?(matchMedia('(prefers-color-scheme:dark)').matches?'native':'dawn'):l; if(r.dataset.look&&r.dataset.look!==want&&!reduced){ r.classList.add('looking'); setTimeout(()=>r.classList.remove('looking'),500); } r.dataset.look=want; document.querySelector('meta[name=theme-color]').content=getComputedStyle(r).getPropertyValue('--bg').trim(); retile(); render(); }
matchMedia('(prefers-color-scheme:dark)').addEventListener('change',()=>{ if((cfg.look||'system')==='system') setLook('system'); });
async function reloadApp(){ try{ if(window.caches) for(const k of await caches.keys()) await caches.delete(k); }catch(e){} location.href=location.pathname+'?r='+Date.now(); }

/* =====================================================================
   MAP — Leaflet; Mapbox styles when a token is set, OSM otherwise
   ===================================================================== */
let MAP=null, TILES=null, YOU=null, WATCH=null, LEAF=null, ROUTE=null, STOPL=null, FOLLOW=false;
function ensureLeaflet(){ if(window.L) return Promise.resolve(window.L); if(LEAF) return LEAF; LEAF=new Promise((res,rej)=>{ const s=document.createElement('script'); s.src='https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js'; s.onload=()=>{ log('map','leaflet loaded'); res(window.L); }; s.onerror=()=>{ LEAF=null; log('map','leaflet failed'); rej(new Error('leaflet')); }; document.head.appendChild(s); }); return LEAF; }
function tileSpec(){ const dark=document.documentElement.dataset.look!=='dawn'; if(cfg.mapbox) return {url:`https://api.mapbox.com/styles/v1/mapbox/${dark?'dark-v11':'light-v11'}/tiles/512/{z}/{x}/{y}@2x?access_token=${cfg.mapbox}`,opt:{tileSize:512,zoomOffset:-1,maxZoom:19,attribution:'© Mapbox © OpenStreetMap'},cls:'mapbox'}; return {url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',opt:{maxZoom:19,attribution:'© OpenStreetMap contributors'},cls:'osm'}; }
async function ensureMap(){
  const L=await ensureLeaflet(); if(MAP) return MAP;
  const el=document.getElementById('map'); MAP=L.map(el,{zoomControl:false,attributionControl:true,tap:false}); MAP.attributionControl.setPrefix(''); MAP.attributionControl.setPosition('topright');
  const home=place('home'); MAP.setView([home.lat,home.lon],14); retile(); MAP.on('dragstart',()=>{ FOLLOW=false; });
  return MAP;
}
function retile(){ if(!MAP||!window.L) return; const t=tileSpec(); if(TILES) TILES.remove(); TILES=L.tileLayer(t.url,t.opt).addTo(MAP); const el=document.getElementById('map'); el.classList.remove('osm','mapbox'); el.classList.add(t.cls); log('map','tiles '+t.cls); }
function fitPad(){ const sheetH=document.getElementById('sheet').getBoundingClientRect().top; return {paddingTopLeft:[24,70],paddingBottomRight:[24,Math.max(40,innerHeight-sheetH+16)]}; }
async function drawRoute(it){
  const L=await ensureLeaflet(); await ensureMap();
  if(ROUTE) ROUTE.remove(); if(STOPL){ STOPL.remove(); STOPL=null; } ROUTE=L.layerGroup(); const dark=document.documentElement.dataset.look!=='dawn'; const pts=[];
  for(const l of it.legs){ pts.push(...l.geom);
    if(l.walk) L.polyline(l.geom,{color:dark?'#ddd':'#444',weight:3,dashArray:'2 7',lineCap:'round'}).addTo(ROUTE);
    else { const c=l.color||'#0a84ff'; L.polyline(l.geom,{color:'#000',weight:9,opacity:.35,lineCap:'round',lineJoin:'round'}).addTo(ROUTE); L.polyline(l.geom,{color:c,weight:5,lineCap:'round',lineJoin:'round'}).addTo(ROUTE);
      l.stops.forEach(s=>L.circleMarker([s.lat,s.lon],{radius:2.5,color:c,weight:1,fillColor:dark?'#000':'#fff',fillOpacity:1}).addTo(ROUTE));
      const mk=(ll,txt,name)=>{ const m=L.circleMarker(ll,{radius:6,color:'#fff',weight:2,fillColor:c,fillOpacity:1}).addTo(ROUTE); m.bindTooltip(txt,{permanent:true,direction:'auto',offset:[8,0],className:'stoplbl'}); m.on('click',()=>open(`https://maps.apple.com/?q=${encodeURIComponent(name)}&ll=${ll[0]},${ll[1]}`,'_blank')); };
      mk(l.fromLL,`on · ${shortStop(l.from)}`,l.from); mk(l.toLL,`off · ${shortStop(l.to)}`,l.to); } }
  const last=it.legs[it.legs.length-1]; L.circleMarker(last.toLL,{radius:5,color:'#fff',weight:2,fillColor:'#30d158',fillOpacity:1}).addTo(ROUTE);
  ROUTE.addTo(MAP); if(!FOLLOW) MAP.fitBounds(L.latLngBounds(pts),fitPad()); youDot(L);
}
async function drawStops(list){ const L=await ensureLeaflet(); await ensureMap(); if(STOPL) STOPL.remove(); if(ROUTE) ROUTE.remove(); STOPL=L.layerGroup(); list.forEach(s=>{ const m=L.circleMarker([s.lat,s.lon],{radius:6,color:'#fff',weight:2,fillColor:'#8a8a8a',fillOpacity:1}).addTo(STOPL); m.on('click',()=>openStop(s.id,s)); }); STOPL.addTo(MAP); const h=MODEL.here||MODEL.origin; if(h) MAP.setView([h.lat,h.lon],16); youDot(L); }
async function drawStop(){ const L=await ensureLeaflet(); await ensureMap(); const s=MODEL.stop; if(!s||s.lat==null) return; if(STOPL) STOPL.remove(); if(ROUTE) ROUTE.remove(); STOPL=L.layerGroup(); const pts=[[s.lat,s.lon]];
  L.circleMarker([s.lat,s.lon],{radius:8,color:'#fff',weight:2.5,fillColor:'#f2f2f2',fillOpacity:1}).addTo(STOPL).bindTooltip(`stop · ${shortStop(s.name)}`,{permanent:true,direction:'auto',offset:[8,0],className:'stoplbl'});
  const d=MODEL.dest; if(d){ L.circleMarker([d.lat,d.lon],{radius:6,color:'#fff',weight:2,fillColor:'#30d158',fillOpacity:1}).addTo(STOPL).bindTooltip(d.name,{permanent:true,direction:'auto',offset:[8,0],className:'stoplbl'}); pts.push([d.lat,d.lon]); }
  for(const dp of s.deps.slice(0,CONF.closeN)){ if(!dp.close) continue; L.polyline([[s.lat,s.lon],[dp.close.lat,dp.close.lon]],{color:dp.color,weight:3,opacity:.8}).addTo(STOPL); L.circleMarker([dp.close.lat,dp.close.lon],{radius:5,color:'#fff',weight:2,fillColor:dp.color,fillOpacity:1}).addTo(STOPL).bindTooltip(`${dp.line} · walk ${dp.close.walk}`,{permanent:true,direction:'auto',offset:[8,0],className:'stoplbl'}); pts.push([dp.close.lat,dp.close.lon]); }
  STOPL.addTo(MAP); MAP.fitBounds(L.latLngBounds(pts),fitPad()); youDot(L); }
function shortStop(s){ return s.replace(/\bStation\b/,'').replace(/\bAvenue\b/g,'Av').replace(/\bStreet\b/g,'St').replace(/\bMartin Luther King Jr\b/,'MLK').replace(/\s+/g,' ').trim().slice(0,26); }
function youDot(L){ if(!MAP) return; const icon=L.divIcon({className:'',html:'<div class="youdot"></div>',iconSize:[14,14],iconAnchor:[7,7]});
  const put=p=>{ const ll=[p.coords.latitude,p.coords.longitude]; MODEL.here={lat:ll[0],lon:ll[1],acc:Math.round(p.coords.accuracy||0)}; if(!YOU){ YOU=L.marker(ll,{icon,interactive:false,zIndexOffset:1000}).addTo(MAP); } else YOU.setLatLng(ll); if(FOLLOW) MAP.panTo(ll,{animate:true}); if(GO.on) renderGo(); };
  if(MODEL.here&&!YOU) put({coords:{latitude:MODEL.here.lat,longitude:MODEL.here.lon}});
  if(WATCH==null&&navigator.geolocation){ WATCH=navigator.geolocation.watchPosition(put,e=>log('you',e.message),{enableHighAccuracy:true,maximumAge:5000}); log('you','watching'); } }
function stopWatch(){ if(WATCH!=null&&navigator.geolocation){ navigator.geolocation.clearWatch(WATCH); WATCH=null; log('you','stopped'); } }

/* =====================================================================
   GO MODE — follow the bus, count the stops down
   ===================================================================== */
const GO={on:false,it:null};
function startGo(it){ GO.on=true; GO.it=it; FOLLOW=true; document.getElementById('sheet').style.display='none'; document.getElementById('go').hidden=false; if(MAP&&MODEL.here) MAP.setView([MODEL.here.lat,MODEL.here.lon],16); renderGo(); log('go','start'); }
function stopGo(){ GO.on=false; FOLLOW=false; document.getElementById('go').hidden=true; document.getElementById('sheet').style.display=''; log('go','stop'); if(GO.it) drawRoute(GO.it); }
function renderGo(){
  const el=document.getElementById('go'); const it=GO.it; if(!it) return; const v=firstVehicle(it); const h=MODEL.here;
  let h1='',h2='',n='',nl='';
  if(!v){ h1='walk'; h2=`${it.min} min to ${esc(MODEL.dest.name)}`; }
  else {
    const seq=[{name:v.from,lat:v.fromLL[0],lon:v.fromLL[1]},...v.stops,{name:v.to,lat:v.toLL[0],lon:v.toLL[1]}];
    const dOn=h?hav(h,{lat:v.fromLL[0],lon:v.fromLL[1]}):1e9;
    let k=0,bd=1e9; if(h) seq.forEach((s,i)=>{ const d=hav(h,s); if(d<bd){ bd=d; k=i; } });
    const leadOn=minsUntil(v.start);
    if(dOn>120&&(k===0||leadOn>0)){ h1=`walk to ${esc(v.from)}`; h2=`${Math.max(1,Math.round(dOn/CONF.walkMpm))} min · ${badge(v,'sm')} ${hhmm(v.start)}${leadOn>0?` · in ${leadOn} min`:''}`; n=leadOn<=0?'now':leadOn; nl='min to bus'; }
    else { const left=seq.length-1-k; h1=`get off at ${esc(v.to)}`; h2=`${badge(v,'sm')} ${v.headsign?esc(v.headsign):''} · ${hhmm(v.end)} · then walk ${it.legs[it.legs.length-1].walk?it.legs[it.legs.length-1].dur:0}`; n=left; nl=left===1?'stop to go':'stops to go'; if(left<=1) h1=`<span class="g">next stop</span> · ${esc(v.to)}`; }
  }
  el.innerHTML=`<div style="display:flex;align-items:center;gap:12px">${v?badge(v,'xl'):''}<div style="flex:1;min-width:0"><div style="font-weight:800;font-size:17px">${h1}</div><div class="mu" style="font-size:12px">${h2}</div></div><div style="text-align:right"><div class="big">${n}</div><div class="mu" style="font-size:11px">${nl}</div></div></div><div style="display:flex;gap:8px;margin-top:12px"><button class="btn" data-go-stop style="flex:1">done</button><button class="btn" data-go-center>center</button></div>`;
  el.querySelector('[data-go-stop]').onclick=stopGo; el.querySelector('[data-go-center]').onclick=()=>{ FOLLOW=true; if(MAP&&MODEL.here) MAP.setView([MODEL.here.lat,MODEL.here.lon],16); };
}

/* =====================================================================
   RENDER + NAV + SHEET DRAG
   ===================================================================== */
let TAB='go', SHEETPOS='peek';
function renderSheet(){
  const c=document.getElementById('sheetc'); c.innerHTML=SHEETS[TAB]();
  c.querySelectorAll('[data-route]').forEach(el=>el.onclick=()=>{ const s=el.dataset.route; PICK[MODEL.dest.id]=PICK[MODEL.dest.id]===s?undefined:s; log('route pick',{dest:MODEL.dest.id,route:PICK[MODEL.dest.id]||'auto'}); render(); });
  c.querySelectorAll('[data-refresh]').forEach(el=>el.onclick=()=>rebuild(MODEL.guessed?{}:{dest:MODEL.dest.id}));
  c.querySelectorAll('[data-open=detail]').forEach(el=>el.onclick=()=>setSheet(SHEETPOS==='peek'?'full':'peek'));
  c.querySelectorAll('[data-go-mode]').forEach(el=>el.onclick=()=>{ const t=MODEL.trips[MODEL.dest.id]; const pk=pickMakeable(t.there,MODEL.dest.id); if(pk.main) startGo(pk.main.it); });
  c.querySelectorAll('[data-dest]').forEach(el=>el.onclick=()=>{ go('go'); rebuild({dest:el.dataset.dest}); });
  c.querySelectorAll('[data-stop]').forEach(el=>el.onclick=()=>{ const s=MODEL.stops.find(x=>x.id===el.dataset.stop); openStop(el.dataset.stop,s); });
  c.querySelectorAll('[data-stop-back]').forEach(el=>el.onclick=()=>{ MODEL.stop=null; renderSheet(); if(MODEL.stops) drawStops(MODEL.stops); else loadStops(); });
  const f=c.querySelector('#stopform'); if(f) f.onsubmit=e=>{ e.preventDefault(); findStop(c.querySelector('#stopq').value); c.querySelector('#stopq').blur(); };
}
function render(){
  renderTop(); renderSheet();
  document.getElementById('nav').innerHTML=['go','stops','places'].map(k=>`<button class="${k===TAB?'on':''}" data-tab="${k}">${I[k]}<span>${k}</span></button>`).join('')+`<button data-tab="settings">${I.gear}<span>⚙</span></button>`;
  document.querySelectorAll('#nav [data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));
  if(TAB==='go'){ const t=MODEL.dest?MODEL.trips[MODEL.dest.id]:null; if(t){ const pk=pickMakeable(t.there,MODEL.dest.id); if(pk.main) drawRoute(pk.main.it); } }
}
function go(t){
  if(t==='settings'){ openSettings(); return; }
  if(GO.on) stopGo();
  TAB=t; if(t==='stops'){ setSheet('half'); MODEL.stop=null; if(!MODEL.stops) loadStops(); else drawStops(MODEL.stops); } else if(t==='places'){ setSheet('half'); planOthers(); } else setSheet('peek');
  render();
}
function setSheet(pos){ SHEETPOS=pos; const s=document.getElementById('sheet'); s.classList.remove('peek','half','full','drag'); s.classList.add(pos); document.getElementById('sheetc').scrollTop=0; }
(function(){ const s=document.getElementById('sheet'), g=s.querySelector('.grab'), c=document.getElementById('sheetc'); let y0=null,start=0,cur=0;
  const H=()=>s.getBoundingClientRect().height; const offsetFor=p=>p==='full'?0:p==='half'?H()-innerHeight*0.56:H()-parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--sheet-peek'));
  const down=e=>{ if(e.target.closest('#sheetc')&&SHEETPOS==='full'&&c.scrollTop>0) return; y0=e.clientY; start=offsetFor(SHEETPOS); s.classList.add('drag'); };
  const move=e=>{ if(y0==null) return; cur=Math.max(0,Math.min(H()-80,start+(e.clientY-y0))); s.style.transform=`translateY(${cur}px)`; };
  const up=e=>{ if(y0==null) return; const dy=e.clientY-y0; y0=null; s.style.transform=''; s.classList.remove('drag'); const order=['peek','half','full']; let i=order.indexOf(SHEETPOS); if(dy<-40) i=Math.min(2,i+1); else if(dy>40) i=Math.max(0,i-1); setSheet(order[i]); };
  g.addEventListener('pointerdown',down); s.addEventListener('pointerdown',e=>{ if(e.target.closest('button,a,input,form')) return; if(SHEETPOS!=='full') down(e); }); window.addEventListener('pointermove',move,{passive:true}); window.addEventListener('pointerup',up); window.addEventListener('pointercancel',up);
})();
document.addEventListener('visibilitychange',()=>{ if(document.visibilityState==='visible'){ if(MODEL.fetched&&(new Date()-MODEL.fetched)>5*60000) rebuild(MODEL.guessed?{}:{dest:MODEL.dest.id}); } else stopWatch(); });

/* ---- boot ---- */
log('boot',`${APP.name} ${BUILD}`);
try{ const lf=localStorage.getItem(APP.key+'-lastfail'); if(lf) log('lastfail',lf); }catch(e){}
setSheet('peek'); ensureMap().catch(e=>log('map',e.message)); rebuild();
requestAnimationFrame(envViewport);
</script>
